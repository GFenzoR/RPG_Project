# Account emails (T2.1): email verification and password change. Sent by the server
# (server/internal/mail) as plain text and simple HTML. Same keys and {parameters} as
# i18n/es/email.yaml.
email.verify.subject: "Confirm your email on Neque's Realm"
email.verify.intro: "Hi. Someone (most likely you) created an Neque's Realm account with this email."
email.verify.action: "Confirm my email"
email.verify.expires: "The link works once and expires in 24 hours."
email.verify.ignore: "If it was not you, ignore this message: unconfirmed, nobody can use this email to recover the account."
email.reset.subject: "Change your Neque's Realm password"
email.reset.intro: "Hi. We got a request to change the password of Neque's Realm account with this email."
email.reset.action: "Choose a new password"
email.reset.expires: "The link works once and expires in 1 hour. Changing it signs out every open session."
email.reset.ignore: "If you did not ask for it, ignore this message: your password stays the same."
email.footer: "This message was sent automatically by Neque's Realm server. Do not reply to this address."
email.link_hint: "If the button does not work, copy this link into your browser:"
email.password_changed.subject: "Your Neque's Realm password changed"
email.password_changed.intro: "Hi. The password of the Neque's Realm account with this email was just changed (or set) from a signed-in session. The other sessions were signed out."
email.password_changed.action: "It wasn't me: recover my account"
email.password_changed.expires: "If it wasn't you, ask for a link to choose another password: using it signs out every session, including the one that changed it."
email.password_changed.ignore: "If it was you, there is nothing to do."
