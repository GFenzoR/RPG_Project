island.testisle.name: "Test island"
island.puerto.name: "Harbour Isle"
island.bosque.name: "Forest Isle"
island.volcan.name: "Ember Isle"
text.testisle.temple_sign: "Temple of the test island. Nobody can hurt you here."
text.puerto.temple_sign: "Temple of Farol. Nobody can hurt you within its walls."
text.puerto.harbour_sign: "Farol dock. Ships sail when the harbour master says so."
text.puerto.mine_sign: "Old mine. Beware of the bats, and of what hides further down."
text.bosque.temple_sign: "Temple of the Root, in Raigal. Under its branches no one can harm you."
text.bosque.dock_sign: "Raigal dock. Tavin Rema takes passengers to Harbour Isle."
text.bosque.cave_sign: "Someone crossed out the word \"danger\" and wrote above it: \"ours\"."
text.volcan.temple_sign: "Temple of the Still Flame, in Brasal. Not even the mountain can hurt you here."
text.volcan.dock_sign: "Dock of Brasal. Nerea Vado takes passengers to the Forest and the Harbour. Do not touch the black stones."
text.volcan.mine_sign: "Mountain Mine. Closed by order of the archive. Someone scratched over it: \"there is fire below\"."
text.volcan.gate_sign: "A stone door with no lock. In the middle, the forge's mark and a hollow shaped like a root."
