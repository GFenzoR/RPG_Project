text.testisle.temple_sign: "Temple of Pellwick, the test islet. Nobody can hurt you here."
text.puerto.temple_sign: "Temple of the Lantern. Nobody can hurt you within its walls."
text.puerto.harbour_sign: "Lanternby dock. Ships sail when the harbour master says so."
text.puerto.mine_sign: "Grakkun, the old mine. Beware of the bats, and of what hides further down."
text.bosque.temple_sign: "Temple of the Root, in Ivernel. Under its branches no one can harm you."
text.bosque.dock_sign: "Ivernel dock. Tavin Rema takes passengers to Velmara and, from level 25, to Karvask."
text.bosque.cave_sign: "Marrowdeep Cave. Someone crossed out the word \"danger\" and wrote above it: \"ours\"."
text.volcan.temple_sign: "Temple of the Still Flame, in Cinderstead. Not even the mountain can hurt you here."
text.volcan.dock_sign: "Dock of Cinderstead. Nerea Vado takes passengers to Selvaine and Velmara. Do not touch the black stones."
text.volcan.mine_sign: "Brakkhal Mine, under the mountain. Closed by order of the archive. Someone scratched over it: \"there is fire below\"."
text.volcan.gate_sign: "Ancient forge. Only those who carry its key may pass. Below, chiselled: \"the root is the key\"."
# Isla de Pruebas (sandbox island, docs/16-probar-el-juego.md).
text.pruebas.temple_sign: "Thimblewick, the sandbox isle: try the whole game here in a few minutes. In the temple, Irene Ensayo gives experience, training (skills, magic level and trades), money, healing and a short quest; on the square, Tobías Muestra sells a bit of everything. North: hunting pens. West: gathering and crafts. East: yard of portals and a locked gate. South: market, house, arena and dock."
text.pruebas.hunt_sign: "Hunting trail. Pens from west to east, from weak to strong: bilge rats, wolves, boars with a spider, thornlings and an ember wyrmling. If something chases you, go back to the square: nothing attacks in the protection zone."
text.pruebas.craft_sign: "Gathering and crafts. North of the road, iron veins (with a pickaxe) and birches (with a felling axe); at the end of the road, the fishing pier (with a rod, on the shoal water). To the south, the forge, the anvil and the cooking hearth: use them to see their recipes."
text.pruebas.market_sign: "Market board: use it to buy and sell with other players. To the south-west there is a house for rent: use its door to rent it (from level 12)."
text.pruebas.dock_sign: "Sandbox dock. Remo Vaivén sails to Velmara, Selvaine and Karvask. One way only: no boat comes back here."
text.pruebas.vault_sign: "Practice gate. It opens and locks with the brass key Tobías Muestra sells on the square. Locked, nobody gets in without the key; open, anyone walks through until someone with the key locks it, and from inside it always opens."
text.pruebas.portal_sign: "Yard of portals. The stairs take you down to floor 8 when you step on them. The trapdoor is used (double click, or right-click and «Climb») to climb down the ladder. Step on the hole and you fall. Below, a patch of light to climb with a rope and a teleport are waiting."
text.pruebas.dungeon_sign: "Floor 8. The ladder takes you up with a double click (or right-click and «Climb»). Light falls under the hole: use a rope there to climb. At the far end, the teleport takes you back to the square. Mind the bats to the east."
text.pruebas.arena_sign: "Arena. If both fighters are inside, they fight with no skulls and no punishment. Outside the arena and the square, open PvP with skulls applies. It takes level 20, and staff cannot fight."
