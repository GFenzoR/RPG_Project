item.boulder.name: "boulder"
item.stairs_down.name: "stairs down"
item.stairs_up.name: "stairs up"
item.short_bow.name: "short bow"
item.short_bow.desc: "Ash wood bent over a fire. It shoots arrows."
item.yew_longbow.name: "yew longbow"
item.yew_longbow.desc: "A tall, taut bow that reaches farther."
item.sapling_staff.name: "sapling staff"
item.sapling_staff.desc: "A sapling that keeps sprouting leaves in a druid's hand."
item.rimewood_staff.name: "rimewood staff"
item.rimewood_staff.desc: "White frost wood that sheds splinters of ice."
item.arrow.name: "arrow"
item.arrow.desc: "An iron tip and gull feathers."
item.hide_vest.name: "hide vest"
item.hide_vest.desc: "Light and supple, for those who do not fight up close."

# Trades (T3.4)
item.felling_axe.name: "felling axe"
item.felling_axe.desc: "Use it on a birch to cut some logs."
item.smithing_hammer.name: "smithing hammer"
item.smithing_hammer.desc: "You must carry it to work at the anvil."
item.birch_tree.name: "birch"
item.birch_tree.desc: "White bark and a straight trunk. A felling axe would get a few logs out of it."
item.smelting_forge.name: "forge"
item.smelting_forge.desc: "Embers that never quite die out. Ore is smelted here."
item.anvil.name: "anvil"
item.anvil.desc: "Iron worn by a thousand blows. With a smithing hammer, tools and weapons are forged here."
item.market_board.name: "market board"
item.market_board.desc: "Nailed planks covered in buy and sell notices. From here you trade with the whole region."
item.cooking_hearth.name: "cooking hearth"
item.cooking_hearth.desc: "Blackened stones and a grill. Food is cooked here."
item.birch_log.name: "birch log"
item.birch_log.desc: "Dry wood, good for the fire and for handles."
item.tree_resin.name: "resin"
item.tree_resin.desc: "Sticky and fragrant. Smiths use it to set hilts."
item.iron_ingot.name: "iron ingot"
item.iron_ingot.desc: "Clean smelted iron, ready for the anvil."
item.grilled_fish.name: "grilled fish"
item.grilled_fish.desc: "Crisp on the outside. More filling than raw fish."
item.roast_boar.name: "roast boar"
item.roast_boar.desc: "Slow-roasted meat. Keeps hunger away for a good while."
item.harbour_stew.name: "harbour stew"
item.harbour_stew.desc: "Fish, meat and seaweed in one pot. Comforting, and it heals a little."
item.forged_shortsword.name: "forged shortsword"
item.forged_shortsword.desc: "A hand-forged iron blade, balanced and reliable."
item.stag_antler.name: "stag antler"
item.stag_antler.desc: "A branching antler from a bramble stag, thorns still caught in it."
item.toad_gland.name: "toad gland"
item.toad_gland.desc: "A bitter little sac the forest healers use against venom."
item.glowcap.name: "glowcap"
item.glowcap.desc: "A mushroom that glows faintly in the dark of the forest."
item.thorn_heartwood.name: "thorn heartwood"
item.thorn_heartwood.desc: "Hard, dark wood from the core of a thornling."
item.crawler_chitin.name: "crawler chitin"
item.crawler_chitin.desc: "A pale, light plate from the shell of a hollow crawler."
item.elm_log.name: "elm log"
item.elm_log.desc: "Elm wood, firmer and heavier than birch."
item.glowcap_broth.name: "glowcap broth"
item.glowcap_broth.desc: "A thick broth that leaves a warm glow in your stomach. Heals some health."
item.smuggler_tally.name: "smuggler's tally"
item.smuggler_tally.desc: "A notched stick with an oar mark burnt into it. It counts cargoes."
item.sealed_coffer.name: "sealed coffer"
item.sealed_coffer.desc: "The coffer of the Late Dawn. The wax seal is still intact."
item.elm_tree.name: "elm"
item.elm_tree.desc: "A grey-barked elm. A felling axe can cut it."
item.elmwood_shield.name: "elmwood shield"
item.elmwood_shield.desc: "Elm planks held together with iron bands and resin."
item.stagleather_coat.name: "stag-leather coat"
item.stagleather_coat.desc: "Thick leather tanned in the forest. Warm, and it takes a claw."
item.stagleather_leggings.name: "stag-leather leggings"
item.thornwood_blade.name: "thornwood blade"
item.thornwood_blade.desc: "Steel tempered with thorn sap; the grip is living wood."
item.ash_pelt.name: "ash hound pelt"
item.ash_pelt.desc: "A rough grey pelt that smells of a dead campfire. It does not burn."
item.salamander_scale.name: "salamander scale"
item.salamander_scale.desc: "A red scale that stays warm long after it falls."
item.slag_core.name: "slag core"
item.slag_core.desc: "The still-hot heart of a slag golem. As heavy as a small anvil."
item.wyrm_scale.name: "wyrmling scale"
item.wyrm_scale.desc: "A hard, light scale veined with embers. Smiths pay well for it."
item.ember_ore.name: "ember ore"
item.ember_ore.desc: "Black stone threaded with reddish metal. Only an elm fire melts it."
item.embersteel_ingot.name: "embersteel ingot"
item.embersteel_ingot.desc: "Dark steel that keeps a red glow along its edges."
item.ember_root.name: "ember root"
item.ember_root.desc: "A stone root carved with the marks of the sunken empire. It is warm, like a coal that never goes out."
item.delver_chart.name: "tunnel chart"
item.delver_chart.desc: "A chart of tunnels drawn in soot. An arrow points down, to a door."
item.forge_seal.name: "forge seal"
item.forge_seal.desc: "A black bronze disc with the mark of the ancient forge. An engraved line points north."
item.ember_vein.name: "ember vein"
item.ember_vein.desc: "Black rock crossed by reddish veins. It can be mined with a pickaxe and some skill."
item.embersteel_sabre.name: "embersteel sabre"
item.embersteel_sabre.desc: "A curved blade that never quite cools down."
item.embersteel_axe.name: "embersteel axe"
item.embersteel_axe.desc: "A heavy axe with a dark edge, forged on the anvil of Brasal."
item.wyrmfang_blade.name: "wyrmfang blade"
item.wyrmfang_blade.desc: "Embersteel tempered with scales and slag. It cuts through hot air."
item.embersteel_helm.name: "embersteel helm"
item.embersteel_helm.desc: "A closed helm with narrow slits against the sparks."
item.embersteel_cuirass.name: "embersteel cuirass"
item.embersteel_cuirass.desc: "Embersteel plates over ash hound hide."
item.embersteel_shield.name: "embersteel shield"
item.embersteel_shield.desc: "Embersteel over an elm core, lined with salamander scales."
item.wyrmscale_mail.name: "wyrmscale mail"
item.wyrmscale_mail.desc: "Wyrmling scales sewn over embersteel. Light for what it takes."
