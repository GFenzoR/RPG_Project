# Isla del Puerto
item.rusty_cutlass.name: "rusty cutlass"
item.rusty_cutlass.desc: "The rust has not quite dulled its edge."
item.boarding_saber.name: "boarding saber"
item.boarding_saber.desc: "Short and heavy, made for fighting on narrow decks."
item.bearded_axe.name: "bearded axe"
item.bearded_axe.desc: "Its long blade hooks shields and ropes alike."
item.belaying_pin.name: "belaying pin"
item.belaying_pin.desc: "A hardwood mooring pin. It hits harder than it looks."
item.spiked_cudgel.name: "spiked cudgel"
item.coral_wand.name: "coral wand"
item.coral_wand.desc: "White coral that still holds the cold of the sea floor."
item.sailcloth_cap.name: "sailcloth cap"
item.leather_jerkin.name: "leather jerkin"
item.leather_jerkin.desc: "Boiled, hardened leather stitched by a harbor saddler."
item.canvas_trousers.name: "canvas trousers"
item.tarred_boots.name: "tarred boots"
item.barrel_lid_shield.name: "barrel lid"
item.barrel_lid_shield.desc: "Someone nailed a strap to it. Better than nothing."
item.riveted_round_shield.name: "riveted round shield"
item.pickaxe.name: "pickaxe"
item.pickaxe.desc: "Use it on an ore vein to dig out ore."
item.shovel.name: "shovel"
item.shovel.desc: "Good for digging in sand or soft earth."
item.wet_sand.name: "wet sand"
item.dock_planks.name: "dock planks"
item.wooden_floor.name: "wooden floor"
item.mooring_post.name: "mooring post"
item.cargo_crate.name: "cargo crate"
item.cargo_crate.desc: "It bears the faded seal of a shipping company."
item.ship_biscuit.name: "ship's biscuit"
item.ship_biscuit.desc: "Hard as a rock, but it keeps for months."
item.boar_meat.name: "boar meat"
item.seaweed_poultice.name: "seaweed poultice"
item.seaweed_poultice.desc: "Crushed seaweed and salt. It closes small wounds."
item.gull_feather.name: "gull feather"
item.crab_claw.name: "crab claw"
item.bat_wing.name: "bat wing"
item.boar_tusk.name: "boar tusk"
item.spider_silk.name: "spider silk"
item.spider_silk.desc: "Greenish fibers, tough and a little sticky."
item.beetle_carapace.name: "beetle carapace"
item.iron_ore.name: "iron ore"
item.iron_ore.desc: "Heavy, reddish stone. A smith would know what to do with it."
item.tarnished_locket.name: "tarnished locket"
item.tarnished_locket.desc: "Inside is a portrait the water wiped away long ago."
item.bosun_logbook.name: "bosun's logbook"
item.bosun_logbook.desc: "A notebook swollen with salt water. The last pages were written in a hurry."
item.creature_remains.name: "creature remains"

# Containers (T1.8)
item.backpack.name: "backpack"
item.backpack.desc: "A canvas backpack with leather straps."
item.arc_rune.name: "arc rune"
item.arc_rune.desc: "A carved stone holding a bolt of lightning. Each use spends a charge."
item.water_shoal.name: "shoal water"
item.water_shoal.desc: "Fish dart about under the surface."
item.iron_vein.name: "iron vein"
item.iron_vein.desc: "Rock streaked with reddish veins. A pickaxe would make it talk."
item.rough_stone.name: "rough stone"
item.rough_stone.desc: "A lump of rock, almost worthless."
item.quartz_crystal.name: "quartz crystal"
item.quartz_crystal.desc: "A clear crystal that glows against the light."

