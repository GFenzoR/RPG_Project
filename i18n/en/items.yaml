# Books, scrolls and chests (data/items/exploration.yaml, docs/02 "Libros y cofres"). Each
# book's text is in books.yaml; looking at it gives this description.
item.lectern_book.name: "lectern with a book"
item.book_closed.name: "book"
item.scroll.name: "scroll"
item.book_lantern_rowers.desc: "A book open on a lectern: \"The Rowers of the Lantern\". Use it to read it."
item.book_root_below.desc: "A book open on a lectern: \"What the Root Holds Up\". Use it to read it."
item.book_still_flame.desc: "A book open on a lectern: \"The Still Flame\". Use it to read it."
item.book_forge_register.desc: "A thick book, its pages burnt at the edge: \"Register of the Forge, Third Volume\". Use it to read it."
item.book_smith_notes.desc: "A book bound in red cloth, with a brass clasp: \"Notes of a Smith of Cinderstead\". Use it to read it."
item.book_trail_notebook.desc: "A notebook open on a lectern, dry leaves between its pages: \"Notebook of Trails\". Use it to read it."
item.scroll_dawn_manifest.desc: "A damp scroll tied with a ribbon: \"Manifest of the Late Dawn\". Use it to read it."
item.scroll_burnt_oar_log.desc: "A scroll marked with a burnt oar: \"Log of the Burnt Oar\". Use it to read it."
item.scroll_drowned_wall.desc: "A crumpled scroll, written in a hurry: \"What We Saw Behind the Wall\". Use it to read it."
item.reward_chest.name: "chest"
item.reward_chest.desc: "A plank chest with iron bands and a brass lock. Every adventurer can open it once."
