# Harbor master: Maren Holt, opens Chapter 1.
npc.harbor_master.name: "Maren Holt, harbor master"
npc.harbor_master.greet: "Another one coughing up seawater... Welcome to dry land, {name}. What do you need?"
npc.harbor_master.opt_shipwreck: "I came from the wreck. What happened to the ship?"
npc.harbor_master.ch1_offer: "The Late Dawn broke apart on the reef last night. The ones who reached the shore made camp in the north field, and the wolves have been circling them all night. And the bosun, Edric Sall, is missing: he was seen running toward the old mine with the logbook under his arm. I need hands. Will you help me?"
npc.harbor_master.ch1_accepted: "Good. Take this cutlass and some biscuit; it isn't much, but you arrived with less. The north field first: drive those wolves off so the survivors can come down to town."
npc.harbor_master.ch1_accepted_arcanist: "Good. I have no wands to give you, but take these coins and some biscuit; Corvo the diver carves coral wands once you've saved enough for one. The north field first: drive those wolves off so the survivors can come down to town."
npc.harbor_master.ch1_accepted_ranger: "Good. Take this short bow, coins for arrows (the armorer on the square sells them) and some biscuit. The north field first: drive those wolves off so the survivors can come down to town."
npc.harbor_master.ch1_accepted_druid: "Good. This sapling staff sprouted on its own by the pier; perhaps it was waiting for you. Take some biscuit too. The north field first: drive those wolves off so the survivors can come down to town."
npc.harbor_master.opt_ch1_wolves: "What should I do about the wolves?"
npc.harbor_master.ch1_wolves: "Take the north road out of town and you'll find the field. Put down six wolves and the pack will think twice. If they hurt you, go back to the temple: Sister Liora charges no one for healing."
npc.harbor_master.opt_ch1_mine: "Where do I look for the bosun?"
npc.harbor_master.ch1_mine: "The survivors made it down, thanks to you. Edric went into the old mine, to the east. The entrance is full of bats; clear the way, because Doran, the foreman, won't let anyone in with those things flapping around."
npc.harbor_master.ch1_foreman: "You've cleared the entrance. Talk to Doran, the foreman: if anyone knows what became of Edric, it's him."
npc.harbor_master.opt_ch1_logbook: "I have the bosun's logbook."
npc.harbor_master.ch1_logbook_read: "Let me see... 'Cargo: salt, rope, one sealed coffer, no sender. They paid triple for no questions.' And at the end, in a shaking hand: 'They led us onto the reef with a false lantern. It was no accident.' Edric never signed the last page. You did more than most of my own people: here, you've earned this."
npc.harbor_master.opt_ch1_coffer: "What was in that coffer?"
npc.harbor_master.ch1_coffer: "Nobody knows. The beach looters took it, and this morning a boat with no flag sailed for the Forest Island. You've earned a place on my ship, {name}: once you're strong enough, go after them."
npc.harbor_master.opt_ch1_after: "Any news of the coffer?"
npc.harbor_master.ch1_after: "The fishermen say the boat landed on the forest coast. The druids rule there, and they don't like people bringing them trouble. When you're ready, my ship sails every day."
npc.harbor_master.opt_island: "What is this place?"
npc.harbor_master.island: "A small island with a big harbor. Everything that travels between the islands crosses this pier sooner or later, shipwrecks included."
npc.harbor_master.opt_town: "Who else lives in town?"
npc.harbor_master.town: "Bastian forges and sells weapons by the pier; Tilde has tools and provisions; Sister Liora keeps the Temple of the Lantern. Doran watches over the old mine, and if you want strange stories, old Corvo has been diving the reef since before I was born."
npc.harbor_master.travel: "My ship runs the route to the Forest Island. I carry people who have already proven themselves here and can defend themselves: level 10 at least. It's 80 coins."
npc.harbor_master.to_forest: "Take me to the Forest Island (80 coins)."

# Armorer: Bastian Roe.
npc.puerto_armorer.name: "Bastian Roe, armorer"
npc.puerto_armorer.greet: "Mind the sparks. Looking for steel, {name}, or here to sell scrap?"
npc.puerto_armorer.opt_advice: "What would you recommend?"
npc.puerto_armorer.advice: "If you just arrived: a cutlass or a belaying pin, a tunic and a barrel lid to hide behind. From level 5 on, the iron sword never lets you down. The big pieces, the boarding saber and the bearded axe, are for those past level 10. And don't ask me for steel if you're an arcanist: go see old Corvo about a wand."
npc.puerto_armorer.opt_salvage: "Do you buy what I find?"
npc.puerto_armorer.salvage: "I buy weapons and armor, but at scrap prices: a third of what they're worth, and that's generous. If you want more for it, sell it to another adventurer."

# Provisioner: Tilde Varga.
npc.puerto_provisioner.name: "Tilde Varga, provisions"
npc.puerto_provisioner.greet: "Come in, come in! Rope, shovels, ship's biscuit... and if you bring pelts or shells, I'll buy those too."
npc.puerto_provisioner.opt_tools: "What is each tool for?"
npc.puerto_provisioner.tools: "Rope gets anyone out of a pit; a shovel opens holes where the sand sounds hollow; a pickaxe pulls ore out of rock; the rod, well, fish; a felling axe gets logs out of the birches, and the smithing hammer is for the anvil. Without tools you won't get far on this island."
npc.puerto_provisioner.opt_gossip: "What's the news around here?"
npc.puerto_provisioner.gossip: "That the lantern on the point was dark the night of the wreck, and yet the sailors swear they saw a light. That the beach looters have more coin than ever. I only sell rope, but rope sells well when people are scared."

# Priest: Sister Liora, Temple of the Lantern.
npc.puerto_priest.name: "Sister Liora"
npc.puerto_priest.greet: "May the Lantern find you, {name}. This temple shelters everyone who comes from the sea. How can I help you?"
npc.puerto_priest.opt_blessings: "I would like a blessing."
npc.puerto_priest.blessings: "There are five lights of the Lantern. Each one protects you when you fall: you lose less experience and the sea has a harder time keeping your belongings. With all five you lose nothing you carry. Each light asks an offering of 200 coins, and it goes out the next time you die."
npc.puerto_priest.bless_shore: "The light of the Shore (200 coins)."
npc.puerto_priest.bless_hearth: "The light of the Hearth (200 coins)."
npc.puerto_priest.bless_keel: "The light of the Keel (200 coins)."
npc.puerto_priest.bless_star: "The light of the Star (200 coins)."
npc.puerto_priest.bless_deep: "The light of the Deep (200 coins)."
npc.puerto_priest.blessed: "It burns in you now. Take care of it: the Lantern shines, but it rows for no one."
npc.puerto_priest.opt_more: "I would like another blessing."
npc.puerto_priest.opt_heal: "I'm hurt. Can you heal me?"
npc.puerto_priest.healed: "There. Wounds close; recklessness doesn't. Come back whenever you need to."
npc.puerto_priest.opt_faith: "What is the Lantern?"
npc.puerto_priest.faith: "When the old empire sank, those who survived rowed for days in the dark. They say a light guided them to these islands. We never learned who lit it; that is why we tend ours, so no one is ever lost at sea again."
npc.puerto_priest.opt_wreck: "And last night's wreck?"
npc.puerto_priest.wreck: "I prayed for those the sea took. But listen: someone lit a false light on the rocks to lead that ship to its death. Using the light to deceive is the worst thing an islander can do."

# Mine foreman: Doran Pike.
npc.puerto_foreman.name: "Doran Pike, foreman"
npc.puerto_foreman.greet: "Hold it. This mine has swallowed too many people already. What do you want?"
npc.puerto_foreman.opt_ch1_bosun: "I'm looking for the bosun of the Late Dawn."
npc.puerto_foreman.ch1_logbook: "Edric? He showed up last night soaked through, raving about lights on the rocks. I let him sleep in the shed and by dawn he was gone; he only left this. He went down into the galleries, and nobody comes back from down there. Take the logbook to Maren, she'll know what to do."
npc.puerto_foreman.opt_ch1_lost: "I lost the logbook..."
npc.puerto_foreman.ch1_logbook_again: "You lost...? Lucky for you I copied the last pages just in case. Here, and keep it safe this time."
npc.puerto_foreman.opt_mine: "What happened to this mine?"
npc.puerto_foreman.mine: "We dug the best iron in the archipelago. Now there are bats up top, beetles the size of dogs further down, and at the bottom, the water."
npc.puerto_foreman.opt_flood: "The water?"
npc.puerto_foreman.flood: "We dug too deep and broke through a wall that wasn't rock: it was carved stone, from before the sinking. The sea came in through there. Some of my lads still walk down there... and they shouldn't."
npc.puerto_foreman.opt_work: "Do you need help with anything?"
npc.puerto_foreman.ore_offer: "The town smithy is running out of iron. Bring me five chunks of iron ore from the deep galleries; the beetles eat it and the drowned still carry what they dug. I'll pay you with my old pickaxe, which still bites like the first day."
npc.puerto_foreman.ore_accepted: "Go down carefully, and don't get closer to the water than you have to."
npc.puerto_foreman.opt_ore_progress: "Where do I find the ore?"
npc.puerto_foreman.ore_hint: "In the lower galleries. Ore beetles carry it in their bellies and the drowned miners in their pockets. Five chunks, not one less."
npc.puerto_foreman.opt_ore_deliver: "I brought you the iron ore."
npc.puerto_foreman.ore_delivered: "Good iron, from the old veins. Bastian will be pleased. The pickaxe is yours: with it you can dig ore yourself."

# Old diver: Corvo.
npc.puerto_diver.name: "Corvo the diver"
npc.puerto_diver.greet: "Heh. You look like you swallowed half the sea, {name}. Sit down, the tide's in no hurry."
npc.puerto_diver.opt_reef: "What's out on the reef?"
npc.puerto_diver.reef: "Broken ships, lots of them. And under the ships, columns. At low tide you can see the capitals, covered in coral. Nobody builds columns at the bottom of the sea, do they?"
npc.puerto_diver.opt_empire: "Columns of what?"
npc.puerto_diver.empire: "Of the empire that sank. The priests talk about lights and oars; I talk about what I touched with my hands: streets, stairways, doors barred from the inside. Something made them bar the doors before the water came."
npc.puerto_diver.opt_locket: "You look worried."
npc.puerto_diver.locket_offer: "The beach looters tear the lockets off the drowned and sell them for a few coins. Those lockets are all that's left of a lot of people. If you take one from those vultures, bring it to me: Sister Liora will perform the rites and I'll pay you well."
npc.puerto_diver.locket_accepted: "They're on the beach, by the hull of the Late Dawn. Go armed: the looters throw bottles, and they miss less than you'd think."
npc.puerto_diver.opt_locket_return: "I recovered a locket."
npc.puerto_diver.locket_returned: "Look at that... the portrait's gone, but the engraved name can still be read. Someone will rest easier tonight. Here, you've earned it."
npc.puerto_diver.opt_wands: "What is that you're carving?"
npc.puerto_diver.wands: "Coral wands. Reef coral holds a little of the old light; arcanists feel it in their fingers. If you know how to use one, I'll sell it to you."
