# Harbor master: Maren Holt, opens Chapter 1.
npc.harbor_master.name: "Maren Holt"
npc.harbor_master.role: "Harbour master"
npc.harbor_master.greet: "Another one coughing up seawater... Welcome to dry land, {name}. What do you need?"
npc.harbor_master.opt_shipwreck: "I came from the wreck. What happened to the ship?"
npc.harbor_master.ch1_offer: "The Late Dawn broke apart on the reef last night. The ones who reached the shore made camp in Howlmead, the north field, and the wolves have been circling them all night. And the bosun, Edric Sall, is missing: he was seen running toward the old mine with the logbook under his arm. I need hands. Will you help me?"
npc.harbor_master.ch1_accepted: "Good. That cutlass will serve you for a while; take some biscuit, it isn't much, but you arrived with less. Once you've saved some coins, Bastian on the square forges iron swords. First Howlmead, the north field: drive those wolves off so the survivors can come down to town."
npc.harbor_master.ch1_accepted_arcanist: "Good. That spark wand will serve you for a while; take some biscuit. Once you've saved some coins, Corvo the diver carves stronger coral wands. First Howlmead, the north field: drive those wolves off so the survivors can come down to town."
npc.harbor_master.ch1_accepted_ranger: "Good. Look after that short bow: take coins for arrows (the armorer on the square sells them) and some biscuit. First Howlmead, the north field: drive those wolves off so the survivors can come down to town."
npc.harbor_master.ch1_accepted_druid: "Good. That sapling staff will serve you for a while; take some biscuit. First Howlmead, the north field: drive those wolves off so the survivors can come down to town."
npc.harbor_master.opt_ch1_wolves: "What should I do about the wolves?"
npc.harbor_master.ch1_wolves: "Take the north road out of town and you'll find Howlmead, the field. Put down six wolves and the pack will think twice. If they hurt you, go back to the temple: Sister Liora charges no one for healing."
npc.harbor_master.opt_ch1_mine: "Where do I look for the bosun?"
npc.harbor_master.ch1_mine: "The survivors made it down, thanks to you. Edric went into Grakkun, the old mine, to the east. The entrance is full of bats; clear the way, because Doran, the foreman, won't let anyone in with those things flapping around."
npc.harbor_master.ch1_foreman: "You've cleared the entrance. Talk to Doran, the foreman: if anyone knows what became of Edric, it's him."
npc.harbor_master.opt_ch1_logbook: "I have the bosun's logbook."
npc.harbor_master.ch1_logbook_read: "Let me see... 'Cargo: salt, rope, one sealed coffer, no sender. They paid triple for no questions.' And at the end, in a shaking hand: 'They led us onto the reef with a false lantern. It was no accident.' Edric never signed the last page. You did more than most of my own people: here, you've earned this."
npc.harbor_master.opt_ch1_coffer: "What was in that coffer?"
npc.harbor_master.ch1_coffer: "Nobody knows. The Saltwrack beach looters took it, and this morning a boat with no flag sailed for Selvaine. You've earned a place on my ship, {name}: once you're strong enough, go after them."
npc.harbor_master.opt_ch1_after: "Any news of the coffer?"
npc.harbor_master.ch1_after: "The fishermen say the boat landed on the forest coast. The druids rule there, and they don't like people bringing them trouble. When you're ready, my ship sails every day."
npc.harbor_master.opt_island: "What is this place?"
npc.harbor_master.island: "A small island with a big harbour. Everything that travels between the islands crosses this pier sooner or later, shipwrecks included."
npc.harbor_master.opt_town: "Who else lives in town?"
npc.harbor_master.town: "Bastian forges and sells weapons on the square; Tilde has tools and provisions; Sister Liora keeps the Temple of the Lantern. Doran watches over Grakkun, the old mine, and if you want strange stories, old Corvo has been diving the reef since before I was born."
npc.harbor_master.travel: "My ship runs the route to Selvaine. I carry people who have already proven themselves here and can defend themselves: level 10 at least. It's 80 coins."

# Armorer: Bastian Roe.
npc.puerto_armorer.name: "Bastian Roe"
npc.puerto_armorer.role: "Armorer"
npc.puerto_armorer.greet: "Mind the sparks. Looking for steel, {name}, or here to sell scrap?"
npc.puerto_armorer.opt_advice: "What would you recommend?"
npc.puerto_armorer.advice: "If you just arrived: a cutlass or a belaying pin, a tunic and a barrel lid to hide behind. From level 5 on, the iron sword never lets you down. The big pieces, the boarding saber and the bearded axe, are for those past level 10. And don't ask me for steel if you're an arcanist: go see old Corvo about a wand."
npc.puerto_armorer.opt_salvage: "Do you buy what I find?"
npc.puerto_armorer.salvage: "I buy weapons and armor, but at scrap prices: a third of what they're worth, and that's generous. If you want more for it, sell it to another adventurer."

# Provisioner: Tilde Varga.
npc.puerto_provisioner.name: "Tilde Varga"
npc.puerto_provisioner.role: "Provisions"
npc.puerto_provisioner.greet: "Come in, come in! Rope, tools, ship's biscuit... and if you bring pelts or shells, I'll buy those too."
npc.puerto_provisioner.opt_tools: "What is each tool for?"
npc.puerto_provisioner.tools: "Rope gets anyone out of a pit: on Saltwrack, the wreck beach, the sand caved in, and a sinkhole drops into the mine; a pickaxe pulls ore out of rock; the rod, well, fish; a felling axe gets logs out of the birches, and the smithing hammer is for the anvil. Without tools you won't get far on this island."
npc.puerto_provisioner.opt_gossip: "What's the news around here?"
npc.puerto_provisioner.gossip: "That the lantern on the point was dark the night of the wreck, and yet the sailors swear they saw a light. That the beach looters have more coin than ever. I only sell rope, but rope sells well when people are scared."

# Priest: Sister Liora, Temple of the Lantern.
npc.puerto_priest.name: "Sister Liora"
npc.puerto_priest.greet: "May the Lantern find you, {name}. This temple shelters everyone who comes from the sea. How can I help you?"
npc.puerto_priest.opt_blessings: "I would like a blessing."
npc.puerto_priest.blessings: "There are five lights of the Lantern. Each one protects you when you fall: you lose less experience and the sea has a harder time keeping your belongings. With all five you lose nothing you carry. Each light asks an offering that grows with your path, 50 coins plus 20 per level, and it goes out the next time you die. Up to level 8 the Lantern already watches over you as if you had all five, so I only light them from level 9."
npc.puerto_priest.bless_shore: "The light of the Shore ({price} coins)."
npc.puerto_priest.bless_hearth: "The light of the Hearth ({price} coins)."
npc.puerto_priest.bless_keel: "The light of the Keel ({price} coins)."
npc.puerto_priest.bless_star: "The light of the Star ({price} coins)."
npc.puerto_priest.bless_deep: "The light of the Deep ({price} coins)."
npc.puerto_priest.blessed: "It burns in you now. Take care of it: the Lantern shines, but it rows for no one."
npc.puerto_priest.opt_more: "I would like another blessing."
npc.puerto_priest.opt_heal: "I'm hurt. Can you heal me?"
npc.puerto_priest.healed: "There. Wounds close; recklessness doesn't. Come back whenever you need to."
npc.puerto_priest.opt_faith: "What is the Lantern?"
npc.puerto_priest.faith: "When the old empire sank, those who survived rowed for days in the dark. They say a light guided them to these islands. We never learned who lit it; that is why we tend ours, so no one is ever lost at sea again."
npc.puerto_priest.opt_wreck: "And last night's wreck?"
npc.puerto_priest.wreck: "I prayed for those the sea took. But listen: someone lit a false light on the rocks to lead that ship to its death. Using the light to deceive is the worst thing an islander can do."

# Mine foreman: Doran Pike.
npc.puerto_foreman.name: "Doran Pike"
npc.puerto_foreman.role: "Foreman"
npc.puerto_foreman.greet: "Hold it. This mine has swallowed too many people already. What do you want?"
npc.puerto_foreman.opt_ch1_bosun: "I'm looking for the bosun of the Late Dawn."
npc.puerto_foreman.ch1_logbook: "Edric? He showed up last night soaked through, raving about lights on the rocks. I let him sleep in the shed and by dawn he was gone; he only left this. He went down into the galleries, and nobody comes back from down there. Take the logbook to Maren, she'll know what to do."
npc.puerto_foreman.opt_ch1_lost: "I lost the logbook..."
npc.puerto_foreman.ch1_logbook_again: "You lost...? Lucky for you I copied the last pages just in case. Here, and keep it safe this time."
npc.puerto_foreman.opt_mine: "What happened to this mine?"
npc.puerto_foreman.mine: "We dug the best iron in the archipelago. Now there are bats up top, beetles the size of dogs further down, and at the bottom, the water."
npc.puerto_foreman.opt_flood: "The water?"
npc.puerto_foreman.flood: "We dug too deep and broke through a wall that wasn't rock: it was carved stone, from before the sinking. The sea came in through there. Some of my lads still walk down there... and they shouldn't."
npc.puerto_foreman.opt_work: "Do you need help with anything?"
npc.puerto_foreman.ore_offer: "The town smithy is running out of iron. Bring me five chunks of iron ore from the deep galleries; the beetles eat it and the drowned still carry what they dug. I'll pay you with my old pickaxe, which still bites like the first day."
npc.puerto_foreman.ore_accepted: "Go down carefully, and don't get closer to the water than you have to."
npc.puerto_foreman.opt_ore_progress: "Where do I find the ore?"
npc.puerto_foreman.ore_hint: "In the lower galleries. Ore beetles carry it in their bellies and the drowned miners in their pockets. Five chunks, not one less."
npc.puerto_foreman.opt_ore_deliver: "I brought you the iron ore."
npc.puerto_foreman.ore_delivered: "Good iron, from the old veins. Bastian will be pleased. The pickaxe is yours: with it you can dig ore yourself."

# Old diver: Corvo.
npc.puerto_diver.name: "Corvo"
npc.puerto_diver.role: "Diver"
npc.puerto_diver.greet: "Heh. You look like you swallowed half the sea, {name}. Sit down, the tide's in no hurry."
npc.puerto_diver.opt_reef: "What's out on the reef?"
npc.puerto_diver.reef: "Broken ships, lots of them. And under the ships, columns. At low tide you can see the capitals, covered in coral. Nobody builds columns at the bottom of the sea, do they?"
npc.puerto_diver.opt_empire: "Columns of what?"
npc.puerto_diver.empire: "Of the empire that sank. The priests talk about lights and oars; I talk about what I touched with my hands: streets, stairways, doors barred from the inside. Something made them bar the doors before the water came."
npc.puerto_diver.opt_locket: "You look worried."
npc.puerto_diver.locket_offer: "The beach looters tear the lockets off the drowned and sell them for a few coins. Those lockets are all that's left of a lot of people. If you take one from those vultures, bring it to me: Sister Liora will perform the rites and I'll pay you well."
npc.puerto_diver.locket_accepted: "They're on Saltwrack beach, by the hull of the Late Dawn. Go armed: the looters throw bottles, and they miss less than you'd think."
npc.puerto_diver.opt_locket_return: "I recovered a locket."
npc.puerto_diver.locket_returned: "Look at that... the portrait's gone, but the engraved name can still be read. Someone will rest easier tonight. Here, you've earned it."
npc.puerto_diver.opt_wands: "What is that you're carving?"
npc.puerto_diver.wands: "Coral wands. Reef coral holds a little of the old light; arcanists feel it in their fingers. If you know how to use one, I'll sell it to you."
npc.bosque_druid.name: "Velia Moss"
npc.bosque_druid.role: "Forest druid"
npc.bosque_druid.greet: "The roots told me you would come, {name}. Then again, the roots say many things. What brings you to Ivernel?"
npc.bosque_druid.opt_boat: "I'm following an unflagged boat."
npc.bosque_druid.ch2_offer: "The boat with the coffer? Then what I feel under the earth is not my imagination: something old has come to this island and it is unsettling it. I want to follow its trail, but the marsh to the south is full of toads and their venom wipes out every track. I send no one below level 15 into that marsh. Will you help me?"
npc.bosque_druid.ch2_accepted: "Good. Go down to Murlowe marsh, south of the town, and put down eight toads. If they poison you, purge it with your spell; Brother Olmar, at the temple, closes your wounds. Careful: the venom keeps biting after the fight."
npc.bosque_druid.opt_toads: "What do I do in Murlowe marsh?"
npc.bosque_druid.ch2_toads: "Eight mire toads, south of the town. While they are there, the mud keeps no tracks."
npc.bosque_druid.opt_glowcaps: "What do you need mushrooms for?"
npc.bosque_druid.ch2_glowcaps: "My tracking lantern burns glowcaps: it shows what passed through a place, not just what is there. Bring me six. The toads eat them, and the thornlings in the north grow them in their bark."
npc.bosque_druid.opt_give_glowcaps: "Here are six glowcaps."
npc.bosque_druid.ch2_lantern: "See how they burn... The trail comes from the water, from the east, and goes into the forest carrying something heavy. Ask Tavin, the ferryman: if anyone saw where that boat landed, it was him."
npc.bosque_druid.opt_ferryman: "What should I ask the ferryman?"
npc.bosque_druid.ch2_go_ferryman: "Where the unflagged boat landed. Tavin is at the dock, west of the town."
npc.bosque_druid.opt_camp: "The ferryman saw the boat on the east shore."
npc.bosque_druid.ch2_camp_offer: "Then they camped there. Smugglers don't work for free: someone paid them, and I want to know who. Break their camp and bring me four of their tallies, the sticks they count cargoes with. Those people fight for real: don't go before level 20."
npc.bosque_druid.ch2_camp_accepted: "The east shore, past Nyssaral, the deep forest. Eight smugglers and four tallies. Come back in one piece."
npc.bosque_druid.opt_progress: "About the smugglers..."
npc.bosque_druid.ch2_progress: "What did you find out?"
npc.bosque_druid.opt_give_tallies: "I have four of the smugglers' tallies."
npc.bosque_druid.ch2_tallies: "The burnt oar mark... the same one they left on the false lantern at the reef. These were no common thieves. And this notch says 'cave': they hid the coffer under the shore, in the crawlers' cave. If those beasts dragged it into their nest, look for it down there."
npc.bosque_druid.opt_give_coffer: "I found the sealed coffer."
npc.bosque_druid.ch2_coffer_opened: "Let me... The seal gives way to sap, not to force. Look: a root of stone, carved with the marks of the empire that sank. And it's warm, like a coal that won't go out. You did more for this forest than many of its own."
npc.bosque_druid.opt_root: "What is that root?"
npc.bosque_druid.ch2_root: "A key, I think. The roots of the forest reject it: whatever it opens is far from here, where the stone burns. Whoever paid to steal it knows that too. This is not over, {name}."
npc.bosque_druid.opt_grove: "What is this place?"
npc.bosque_druid.grove: "Ivernel: a small town in the shade of old trees. We fell elms with permission and plant two for each one. What lives deeper in does not always agree. If you need a staff, a wand or a mana draught, I keep them."
npc.bosque_ferryman.name: "Tavin Rema"
npc.bosque_ferryman.role: "Ferryman"
npc.bosque_ferryman.greet: "Ah, solid ground again. Coming or going, {name}?"
npc.bosque_ferryman.opt_ch2_boat: "Did you see where an unflagged boat landed?"
npc.bosque_ferryman.ch2_boat: "That boat? It went by at night, no lights, and never came into my dock. I saw it run aground on the east shore, across the forest, empty. Whoever got off it never came back this way. Tell Velia."
npc.bosque_ferryman.opt_island: "What is on this island?"
npc.bosque_ferryman.island: "Forest, and more forest. Stags in Avelline, north of the town, toads in Murlowe, the south marsh, and worse things among the old trees of Nyssaral. There's a cave under the east shore, Marrowdeep, that not even the druids set foot in."
npc.bosque_ferryman.travel: "I sail back to Velmara, and from level 25 I take people to Karvask. Where to?"
npc.bosque_priest.name: "Brother Olmar"
npc.bosque_priest.greet: "May the root hold you up, {name}. This is the temple of Ivernel."
npc.bosque_priest.opt_blessings: "I want a blessing."
npc.bosque_priest.blessings: "The same five lights Sister Liora grants in Lanternby, for the same offering: 50 coins plus 20 per level. They guard your path if you fall. Up to level 8 you do not need them: I only grant them from level 9."
npc.bosque_priest.blessed: "Done. May it go with you."
npc.bosque_priest.opt_more: "I want another."
npc.bosque_priest.opt_heal: "I'm hurt."
npc.bosque_priest.healed: "Sap closes what iron opened. Go in peace."
npc.bosque_priest.opt_root: "Who do you pray to here?"
npc.bosque_priest.root: "No one with a name. To the tree that was here before us and will be after. In the harbour they look to the sea; here we look down."
npc.bosque_merchant.name: "Gisla"
npc.bosque_merchant.role: "Tanner"
npc.bosque_merchant.greet: "Leather, elm and whatever it takes not to die in the forest. What are you after?"
npc.bosque_merchant.opt_elm: "What is elm good for?"
npc.bosque_merchant.elm: "Shields, mostly: three logs, an ingot and some resin on the anvil. And glowcap broth is cooked over an elm fire. The grove is east of the town; fell with permission."
npc.bosque_merchant.opt_gossip: "Any news?"
npc.bosque_merchant.gossip: "Some folk from the east came to buy rope and paid with harbour coins, still damp. I didn't like the way they looked around."
npc.harbor_master.to_forest: "To Selvaine (80 coins)."
npc.bosque_ferryman.to_harbour: "To Velmara (60 coins)."
npc.bosque_merchant.opt_amulet_again: "I lost the antler amulet you carved for me."
npc.bosque_merchant.amulet_again: "Lost it? Antler is not hard to find, but the carving takes a whole evening. Four hundred coins and I make you another; this one will come out different too."
npc.bosque_merchant.opt_amulet_pay: "Here are the four hundred coins."
npc.bosque_merchant.amulet_carved: "There. Keep this one closer: the oaks of the vigil only know who wears it."

npc.bosque_druid.opt_take_root: "I need the stone root."
npc.bosque_druid.ch3_root_given: "Take it. Only hands warm it here, never the soil. What it opens lies where the stone burns: Karvask. In Cinderstead they keep the records of the old forge; look for Casia Hollín. And don't go before level 30, {name}: the ground bites there too."
npc.volcan_keeper.name: "Casia Hollín"
npc.volcan_keeper.role: "Keeper of records"
npc.volcan_keeper.greet: "Watch where you step: even the dust is hot here. I'm Casia and I keep the forge records. What are you after, {name}?"
npc.volcan_keeper.opt_root: "I carry a carved stone root that is warm."
npc.volcan_keeper.ch3_offer: "Let me see... These marks belong to the ancient forge, the one the empire lit under the mountain. Three nights ago the mountain started breathing again, and now this. The forge is waking, and someone wants to get there before us. I need help, but I send no one below level 30 down the works road."
npc.volcan_keeper.ch3_accepted: "The road first: ash hounds have taken over Hraskel, the flats north of the town, the old way to the works. Kill ten. Fire is no use against them; ice is."
npc.volcan_keeper.opt_hounds: "What about the hounds?"
npc.volcan_keeper.ch3_hounds: "Ten ash hounds, on Hraskel, the ash flats north of the town. They hunt in packs: don't run, you won't outrun them."
npc.volcan_keeper.opt_scales: "What do you want scales for?"
npc.volcan_keeper.ch3_scales: "My records lantern cracks in the mountain's heat. With six salamander scales I can make one that holds. Cinder salamanders live in the lava pools on Vadrek, the slope."
npc.volcan_keeper.opt_give_scales: "Here are six salamander scales."
npc.volcan_keeper.ch3_lantern: "Perfect, still warm. While I build the lantern, take the root to Bram, the smith. The smiths of Cinderstead inherited the old forge's signs: if anyone can read those marks, it's him."
npc.volcan_keeper.opt_smith: "What should I ask the smith?"
npc.volcan_keeper.ch3_go_smith: "What the marks on the root say. Bram is at the smithy, by the great forge."
npc.volcan_keeper.opt_delvers: "Bram says the root is the key to the forge."
npc.volcan_keeper.ch3_gate_offer: "I feared so. And we are not the only ones who know: the obsidian delvers left town a month ago and dig night and day under the mountain, downward. Someone pays them. Stop them and bring me one of their charts: with it I'll find the gate. Down there no one survives below level 35."
npc.volcan_keeper.ch3_gate_accepted: "Brakkhal mine is east of the town, at the end of the stone road. Ten delvers, and a chart of their tunnels. Come back with the chart."
npc.volcan_keeper.opt_progress: "About the delvers..."
npc.volcan_keeper.ch3_progress: "Did you find anything?"
npc.volcan_keeper.opt_give_chart: "I have a tunnel chart."
npc.volcan_keeper.ch3_chart_read: "Here... the tunnels go down and end at a door they could not open. The sealed gate of the forge. Take the root there, to the bottom of Brakkhal. If the forge knows its key, it will open."
npc.volcan_keeper.opt_warden: "About the forge..."
npc.volcan_keeper.ch3_warden: "The warden lets no one touch the forge. Defeat it and bring me its seal: the seal tells where the last fire went."
npc.volcan_keeper.opt_give_seal: "I have the forge seal."
npc.volcan_keeper.ch3_seal_read: "The forge seal... Look at this line: the forge did not go out, it sent its last fire far away, north, on a ship. Toward the ice. You did what no one in Cinderstead dared, {name}."
npc.volcan_keeper.opt_north: "What lies to the north?"
npc.volcan_keeper.ch3_north: "The Frozen Isles. Years ago an expedition left this port following that same line, and never came back. If you want to know what became of the empire's fire, the road goes on that way. But that is another story."
npc.volcan_keeper.opt_forge: "What is the ancient forge?"
npc.volcan_keeper.forge: "A forge of the empire, bigger than this town, under the mountain. Cinderstead was born to feed it. When the empire sank, the forge went out, or so we thought."
npc.volcan_forge_echo.name: "forge echo"
npc.volcan_forge_echo.role: "Spirit of the forge"
npc.volcan_forge_echo.greet: "...heat... someone comes down again. No one came down in a long time."
npc.volcan_forge_echo.opt_open: "I bring the ember root. Open the gate."
npc.volcan_forge_echo.ch3_gate_opened: "The root... goes back to its shape. Take it: an ember key, the key to this gate. Carry it and the gate opens to your hand, and locks behind you if you want no company. But on the other side the warden still keeps watch: we forged it so no one would use the forge without us, and we are gone."
npc.volcan_forge_echo.opt_no_root: "How does the gate open?"
npc.volcan_forge_echo.no_root: "With its key. A stone root, warm. Without it, the gate is only stone. The last one went out to sea; if anyone keeps it, it is in the southern woods."
npc.volcan_forge_echo.opt_lost_key: "I lost the ember key."
npc.volcan_forge_echo.key_reshaped: "The ash remembers its shape. Here, another ember key; keep it better than the first."
npc.volcan_forge_echo.opt_warden: "What is the warden?"
npc.volcan_forge_echo.ch3_warden_offer: "Slag with orders. It does not think, does not sleep, does not cool. If you want the forge seal, you will have to break it. From level 40, in a group; alone, not before 44, and with something to heal yourself."
npc.volcan_forge_echo.ch3_warden_accepted: "Then open the gate with your ember key and go through. May the fire know you."
npc.volcan_forge_echo.opt_who: "Who are you?"
npc.volcan_forge_echo.who: "The last one who stoked the forge. Or what is left of him in the smoke."
npc.volcan_smith.name: "Bram Tizón"
npc.volcan_smith.role: "Smith"
npc.volcan_smith.greet: "If you want steel that doesn't soften in the heat, you came to the right place. I'm Bram. What do you need?"
npc.volcan_smith.opt_ch3_marks: "Casia wants you to look at the marks on this root."
npc.volcan_smith.ch3_marks: "Let me see... I learned this sign from my grandmother: it is the old forge's mark, the one they put on the keys to its doors. This isn't a root, it's a key. Tell Casia she was right."
npc.volcan_smith.opt_embersteel: "What is embersteel?"
npc.volcan_smith.embersteel: "Ember ore, from the mountain's veins. Three ore, an iron ingot and an elm log in the forge make an ingot; then you work it on the anvil. Elm comes from Selvaine: nothing grows here that burns that evenly."
npc.volcan_priest.name: "Mother Oriela"
npc.volcan_priest.greet: "Welcome to the temple of the Still Flame, {name}. Not even the mountain can hurt you here."
npc.volcan_priest.opt_blessings: "I want a blessing."
npc.volcan_priest.blessings: "The usual five lights, the same as in Lanternby and in Ivernel: 50 coins plus 20 per level, from level 9."
npc.volcan_priest.blessed: "Done. May no spark catch you off guard."
npc.volcan_priest.opt_more: "I want another."
npc.volcan_priest.opt_heal: "I'm hurt."
npc.volcan_priest.healed: "There. Burns heal; carelessness doesn't."
npc.volcan_priest.opt_mountain: "Why a still flame?"
npc.volcan_priest.mountain: "Because the mountain never stops burning. We pray that the fire stays where it is, and for those who go down to look for it."
npc.volcan_ferryman.name: "Nerea Vado"
npc.volcan_ferryman.role: "Captain"
npc.volcan_ferryman.greet: "Welcome to Cinderstead. Don't touch the black stones on the dock: they burn. Coming or going?"
npc.volcan_ferryman.opt_island: "What is on this island?"
npc.volcan_ferryman.island: "Ash, lava and a mountain that breathes. Hounds on Hraskel, salamanders in the pools of Vadrek, Brakkhal, a mine east of the town no decent soul sets foot in anymore. And wyrmlings nest in the crater: don't even think of climbing without experience."
npc.volcan_ferryman.travel: "I sail to the other islands. Tell me where."
npc.bosque_druid.opt_roots_help: "About the boat's trail..."
npc.bosque_druid.ch2_roots_help: "What do you need to know?"
npc.volcan_keeper.opt_embers_help: "About the root and the forge..."
npc.volcan_keeper.ch3_embers_help: "Tell me, where are you at?"
npc.volcan_keeper.opt_root_missing: "Velia Moss told me about a stone root."
npc.volcan_keeper.ch3_root_missing: "The root with the empire's marks? Without it there is nothing for me to read. If Velia, the druid of Ivernel on Selvaine, keeps it, ask her for it and come back with it."
npc.volcan_keeper.opt_gate_hint: "Where is the gate?"
npc.volcan_keeper.ch3_gate_hint: "At the very bottom of Brakkhal, at the end of the chart's tunnels. Take the root with you; if you lost it, Velia will give you another one in Ivernel."
npc.volcan_smith.ch3_no_root: "Marks on what? Without the root in my hand I can't read a thing. If you lost it, Velia, the druid of Ivernel, will give you another. Bring it and I'll look."
npc.bosque_ferryman.to_volcan: "To Karvask (150 coins)."
npc.volcan_ferryman.to_forest: "To Selvaine (100 coins)."
npc.volcan_ferryman.to_harbour: "To Velmara (140 coins)."

# Side quests and hunting tasks of Selvaine and Karvask (lote 12).
npc.bosque_ferryman.opt_jetty: "You keep looking east."
npc.bosque_ferryman.jetty_offer: "Since that unflagged boat, other boats land on the east shore at night, without lights and never at my dock. They say the smugglers built a jetty of their own. I want to know what they unload and where it goes. Not for anyone under level 22. Will you go?"
npc.bosque_ferryman.jetty_accepted: "The jetty is past the smugglers' camp, out over the water, north of Marrowdeep. Look at the crates: I want to know whose they are."
npc.bosque_ferryman.opt_jetty_help: "About the jetty..."
npc.bosque_ferryman.jetty_where: "East, past Nyssaral, the deep forest, and the camp. The planks run into the water north of the cave. Go armed."
npc.bosque_ferryman.jetty_crawlers: "The crates go down into the cave? Then the crawlers have nested among them already. Kill twelve and see what mark the crates carry."
npc.bosque_ferryman.opt_jetty_report: "The crates at the jetty carry a customs seal."
npc.bosque_ferryman.jetty_report: "A customs seal? That's Lanternby's. Rope, lamp oil, biscuit: someone buys at the harbour, with every permit, to keep those people supplied. I'll tell Maren Holt. Here, for your trouble."
npc.bosque_ferryman.opt_jetty_after: "Did you learn anything more about the crates?"
npc.bosque_ferryman.jetty_after: "Maren went through the customs books: every crate was signed by a different buyer, and none of them exists. Whoever pays the smugglers knows how to hide. And has money to spare."
npc.bosque_merchant.opt_chitin: "Do you need anything for the workshop?"
npc.bosque_merchant.chitin_offer: "I want to try something: stitching crawler chitin over stag leather, so it takes bites plain leather can't. To tan it I need thorn heartwood in the vat. Eight chitin and four heartwoods, and I'll carve you an amulet. From level 25: the cave doesn't forgive."
npc.bosque_merchant.chitin_accepted: "The chitin, from the crawlers in Marrowdeep, the cave on the east shore. The heartwood, from the thornlings of Nyssaral, the deep forest. Bring it all together."
npc.bosque_merchant.opt_chitin_help: "What did you need for the leather?"
npc.bosque_merchant.chitin_help: "Eight crawler chitin and four thorn heartwoods, all together. The crawlers live in Marrowdeep, the cave under the east shore; the thornlings, north and east in the forest."
npc.bosque_merchant.opt_chitin_give: "I have the chitin and the thorn heartwood."
npc.bosque_merchant.chitin_delivered: "Good material, not a crack in it. Here: an antler amulet, carved by me. No two antlers come out the same; this one has something, you'll notice."
npc.volcan_ferryman.opt_fenders: "Trouble at the dock?"
npc.volcan_ferryman.fenders_offer: "Two kinds. The porters bringing scales and ore down pass by the salamanders' pools, and they spit embers at them. And the dock's black stones scorch my hulls. Kill ten salamanders and bring me five hound pelts, which don't burn. From level 30."
npc.volcan_ferryman.fenders_accepted: "The salamanders are on Vadrek, the stone slope south-east of the town. The hounds, on Hraskel, the ash flats to the north. Come back with the pelts."
npc.volcan_ferryman.opt_fenders_help: "What did you need for the dock?"
npc.volcan_ferryman.fenders_help: "Ten fewer cinder salamanders on Vadrek, the south-east slope, and five ash hound pelts, from Hraskel, the northern flats."
npc.volcan_ferryman.opt_fenders_give: "I have five ash hound pelts."
npc.volcan_ferryman.fenders_delivered: "Perfect. With these the hull takes the stones, and the porters come down without running now. Here's your pay. If you ever need a boat, you know where I am."
npc.volcan_smith.opt_ring: "Do you work anything besides steel?"
npc.volcan_smith.ring_offer: "Sometimes. My grandmother set obsidian in rings like the forge-priests wore, over the heat of a slag core, which burns even. Bring me five cores and I'll make you one. The golems in the mine carry them inside. From level 42."
npc.volcan_smith.ring_accepted: "The golems are in the east gallery of Brakkhal and on the lava flow south-east of the town. Break them with ice: fire means nothing to them."
npc.volcan_smith.opt_ring_help: "About the ring..."
npc.volcan_smith.ring_help: "Five slag cores, which the golems of the mine's east gallery and of the lava flow carry inside. Then an ember of the Still Flame, which Mother Oriela gives at the temple. With that, come back for your ring."
npc.volcan_smith.opt_ring_cores: "I have five slag cores."
npc.volcan_smith.ring_cores: "Still warm... This will take a while. But a ring of the old forge is quenched with an ember of the Still Flame, and only Mother Oriela gives that ember. Go to the temple and ask her; when you're back, it will be ready."
npc.volcan_smith.opt_ring_collect: "Is the ring ready?"
npc.volcan_smith.ring_done: "Quenched in the Still Flame, as the rule says. Here. Obsidian keeps some of the heat that made it, and no two rings come out the same. Wear it well."
npc.volcan_priest.opt_quench: "Bram needs an ember of the Still Flame."
npc.volcan_priest.ring_quenched: "To quench a ring of the forge? Nobody has asked for that in years. The ember is not carried by hand: I'll send it to Bram myself. Go in peace, it will get there before you."
npc.volcan_priest.opt_crater: "The flame is trembling."
npc.volcan_priest.crater_offer: "You noticed. The Still Flame was lit at the lava lake in the heart of Skarrag crater, many generations ago. Since the mountain woke, the wyrmlings nest by the lake and the flame gutters. Climb up, look at the lake and thin the nest. Not before level 45."
npc.volcan_priest.crater_accepted: "Skarrag crater is to the north-east, at the end of the slag path. Reach the shore of the lava lake and kill six wyrmlings. The flame will tell me when it's done, and the temple will pay you wherever you are."
npc.volcan_priest.opt_crater_help: "About the crater..."
npc.volcan_priest.crater_help: "Climb into Skarrag crater by the north-east path, reach the shore of the lava lake at its heart and kill six ember wyrmlings. Take draughts."
npc.volcan_priest.opt_crater_done: "Is the flame still again?"
npc.volcan_priest.crater_thanks: "Still as it was years ago. I saw it straighten the day you came down from the crater. Thank you, {name}: the temple does not forget."
npc.bosque_hunter.name: "Fenn Zarzal"
npc.bosque_hunter.role: "Huntsman"
npc.bosque_hunter.greet: "If you're here for the board, you found it. If you're out for a stroll, the forest is the other way. What are you after, {name}?"
npc.bosque_hunter.opt_board: "What does the board pay for?"
npc.bosque_hunter.board: "Ivernel pays for what threatens the forest: smugglers from level 15, thornlings from 18 and crawlers from 22. One bounty of each at a time, and one you collect comes back to the board for you twenty hours later."
npc.bosque_hunter.opt_smugglers: "Smugglers of the burnt oar."
npc.bosque_hunter.opt_thornlings: "Thornlings of Nyssaral."
npc.bosque_hunter.opt_crawlers: "Hollow crawlers of Marrowdeep."
npc.bosque_hunter.smugglers_offer: "They keep coming back to the east shore, however many camps get broken. Twenty-five smugglers, and the board pays you. Will you take it?"
npc.bosque_hunter.thornlings_offer: "The thornlings choke the trails north and east; if nobody prunes them, in a month there's no getting through. Twenty-five. Will you take it?"
npc.bosque_hunter.crawlers_offer: "The crawlers of Marrowdeep, the east shore cave, come out to the beach at night. Thirty, not one less. It's the dearest bounty on the board, and the most dangerous. Will you take it?"
npc.bosque_hunter.accepted: "Noted. Come back when the count is done and you get paid. Your journal keeps the kills for you."
npc.bosque_hunter.wait: "You've been paid for that one already. It comes back for you twenty hours after you collected it: come back tomorrow."
npc.bosque_hunter.opt_report_smugglers: "I'm done with the smugglers."
npc.bosque_hunter.smugglers_paid: "Twenty-five. The jetty will stay empty a while. Here's yours."
npc.bosque_hunter.opt_report_thornlings: "I pruned the thornlings."
npc.bosque_hunter.thornlings_paid: "Twenty-five fewer thornlings: the woodcutters will bless you. Take what the board says."
npc.bosque_hunter.opt_report_crawlers: "I cleared the crawlers from Marrowdeep."
npc.bosque_hunter.crawlers_paid: "Thirty. And you came back in one piece, which is the hard part. Here's the pay."
npc.bosque_hunter.opt_woods: "Who pays for the board?"
npc.bosque_hunter.woods: "The town. Every family puts in something, and the temple too. We used to hunt only stags, with Velia's leave. Since the unflagged boat touched the shore, even the forest has turned wild."
npc.volcan_hunter.name: "Orso Pedernal"
npc.volcan_hunter.role: "Head hunter"
npc.volcan_hunter.greet: "Cinderstead pays whoever keeps the mountain at bay, and I keep the accounts. Here to collect or to sign up, {name}?"
npc.volcan_hunter.opt_board: "What bounties are in the ledger?"
npc.volcan_hunter.board: "Ash hounds from level 26, slag golems from 39 and ember wyrmlings from 48. One of each at a time; one you collect comes back to the ledger for you twenty hours later."
npc.volcan_hunter.opt_hounds: "Hounds of Hraskel."
npc.volcan_hunter.opt_golems: "Slag golems."
npc.volcan_hunter.opt_wyrmlings: "Wyrmlings of Skarrag."
npc.volcan_hunter.hounds_offer: "The hounds cut the road to the mine and the old works. Thirty, and the ledger pays. Don't run: they're faster than you. Will you take it?"
npc.volcan_hunter.golems_offer: "Since the old forge under the mountain woke, or so the temple says, the golems crawl out of the mine and down the lava flow. Twenty. Break them with ice, fire means nothing to them. Will you take it?"
npc.volcan_hunter.wyrmlings_offer: "The wyrmlings come down from Skarrag crater to hunt goats, and soon they'll come down for something else. Eight. Not many, but each is worth ten hounds. Will you take it?"
npc.volcan_hunter.accepted: "Written in the ledger. Come back with the count done and you get paid."
npc.volcan_hunter.wait: "That bounty is paid already. It comes back for you twenty hours after you collected it."
npc.volcan_hunter.opt_report_hounds: "I'm done with the hounds."
npc.volcan_hunter.hounds_paid: "Thirty hounds. Hraskel will be quiet until the next litter. Here."
npc.volcan_hunter.opt_report_golems: "I broke the golems."
npc.volcan_hunter.golems_paid: "Twenty golems turned to gravel. Bram will want the cores, if you kept any. Here's your pay."
npc.volcan_hunter.opt_report_wyrmlings: "I brought wyrmlings down from the crater."
npc.volcan_hunter.wyrmlings_paid: "Eight wyrmlings... and you still smell of smoke. You earned it."
npc.volcan_hunter.opt_mountain: "Why does Cinderstead pay?"
npc.volcan_hunter.mountain: "Because since the old forge woke down below, the mountain keeps spawning beasts, and the guard can't keep up. Better to pay those who can hunt than to bury those who can't."
# Thimblewick (sandbox island, docs/16-probar-el-juego.md).
npc.pruebas_trainer.name: "Irene Ensayo"
npc.pruebas_trainer.role: "Instructor"
npc.pruebas_trainer.greet: "Welcome to Thimblewick, the sandbox isle, {name}. Nothing here is for real: it is for trying things out. What do you need?"
npc.pruebas_trainer.opt_quest: "Do you have a task for me?"
npc.pruebas_trainer.quest_offer: "A short one, to see how a quest works: in the first pen of the hunting trail, north of the temple, there are bilge rats. Hunt three and come back to tell me."
npc.pruebas_trainer.quest_accepted: "Good. The rats' pen is the first one, the westmost. If something chases you, come back to the temple: nothing attacks there."
npc.pruebas_trainer.opt_quest_done: "I hunted the three rats."
npc.pruebas_trainer.quest_done: "Quick and clean. Take your reward: that is how a quest ends. It is a task: in three minutes the pen fills up again and I give it to you once more. Meanwhile, look at your Quests window: it tells you when."
npc.pruebas_trainer.opt_quest_cooling: "Are there more rats?"
npc.pruebas_trainer.quest_cooling: "Not yet: the pen takes a few minutes to fill up again. The quest log tells you how long it takes."
npc.pruebas_trainer.opt_xp: "I want experience."
npc.pruebas_trainer.xp: "To try things without waiting: houses ask for level 12 and PvP for level 20. This raises your level (health, mana, capacity); I train your skills and magic level apart (Train me). How much do you want?"
npc.pruebas_trainer.opt_xp_small: "A little (5000 experience)."
npc.pruebas_trainer.opt_xp_big: "A lot (50 000 experience)."
npc.pruebas_trainer.xp_given: "Done. Your level is in the character window. More?"
npc.pruebas_trainer.opt_train: "Train me."
npc.pruebas_trainer.train: "I leave you as someone who got to pens 4 and 5 by playing: the skills of your vocation's weapons, the shield and the magic level. Or the trades, so that the anvil, the forge and the hearth give you all their recipes. Nothing goes down: if you already have more, you keep yours. What shall we train?"
npc.pruebas_trainer.opt_train_combat: "Combat (my vocation's skills and magic level)."
npc.pruebas_trainer.opt_train_trades: "The trades (mining, woodcutting, smithing, cooking, alchemy and fishing)."
npc.pruebas_trainer.trained: "Done. Your skills are in the character window. Off this island nobody trains like this: there they grow with use."
npc.pruebas_trainer.opt_gold: "I need money (one gold coin)."
npc.pruebas_trainer.gold: "One gold coin is ten thousand copper: enough for the shop, the boat and the rent. Another one?"
npc.pruebas_trainer.opt_heal: "Heal me."
npc.pruebas_trainer.healed: "There: health and mana, as good as new."
npc.pruebas_merchant.name: "Tobías Muestra"
npc.pruebas_merchant.role: "Provisioner"
npc.pruebas_merchant.greet: "Hello, {name}. I have a bit of everything to try: tools, food, runes, the gear of each vocation and the key of the practice gate."
npc.pruebas_merchant.opt_gear: "Which gear suits me?"
npc.pruebas_merchant.gear: "Guardian: a hatchet, or an iron sword from level 5, and a shield. Arcanist: a spark wand, or a coral one from level 5. Ranger: a short bow and arrows, or a crossbow and bolts from level 10. Druid: a sapling staff. The clothes suit anyone; from level 15, the stag-leather coat only guardians and rangers, the mossweave robe everyone."
npc.pruebas_merchant.opt_key: "What does the brass key open?"
npc.pruebas_merchant.key: "The practice gate, east of the square, south of the road. Carry it in your backpack and use the gate; the same key locks it again."
npc.pruebas_ferryman.name: "Remo Vaivén"
npc.pruebas_ferryman.role: "Ferryman"
npc.pruebas_ferryman.greet: "Good day, {name}. Boats to the real islands leave from this dock."
npc.pruebas_ferryman.opt_back: "And to come back?"
npc.pruebas_ferryman.back: "No boat comes to this island: it is on no chart. If you leave, you only come back if a staff member brings you or if you wake up in this temple."
npc.pruebas_ferryman.travel: "Pick a destination. It is a one-way trip."
npc.pruebas_ferryman.to_harbour: "To Velmara (20 coins)."
npc.pruebas_ferryman.to_forest: "To Selvaine (20 coins)."
npc.pruebas_ferryman.to_volcan: "To Karvask (20 coins)."
# Milestone quests (docs/02 "Quests de hito").
npc.bosque_priest.opt_thalorn: "What are the stones in the north-east woods?"
npc.bosque_priest.thalorn_offer: "The stones of Thalorn. Beneath them lies a crypt where two kept the forest before it had a name: one held the shield, the other healed the wounds. They swore never to go down alone, and the plates of the crypt still remember: they answer only when two people stand on them at once. You need not know each other. Will you try?"
npc.bosque_priest.thalorn_accepted: "Find someone to go with you. Step on both plates at the same time and the crypt will open what it keeps. See your quest log: it shows what they ask."
npc.bosque_hunter.opt_orthavel: "What is under the oaks to the south?"
npc.bosque_hunter.orthavel_offer: "The vigil of Orthavel. The huntsmen of old went down there to spend the night before their first great hunt, an antler hung from the neck. The plate below lets no one through who is not wearing one. Gisla the tanner makes antler amulets for whoever brings her what she asks. Up for it?"
npc.bosque_hunter.orthavel_accepted: "Wear the antler amulet and go down alone, as the custom says. The plate will know whether you meet what it asks. Your quest log reminds you."
npc.volcan_forge_echo.opt_morvund: "What lies north of the delvers' gallery?"
npc.volcan_forge_echo.opt_morvund_key: "I lost the Morvund key."
npc.volcan_forge_echo.morvund_offer: "Morvund... the chamber of the four embers. The smiths of the old forge lit the great furnace only when all four were there: the one who holds, the one who weaves, the one who tracks and the one who heals. Four plates, each with its mark, and the forge key in every hand. Behind the chamber lies their gallery, and the chamber itself keeps its key. Will you gather the four?"
npc.volcan_forge_echo.morvund_accepted: "A guardian, an arcanist, a ranger and a druid, each with the ember key, on their plates at the same time. Your quest log says what is missing."
npc.volcan_forge_echo.morvund_key_reshaped: "Another key, of the same steel. Do not lose it in the ashes again."

