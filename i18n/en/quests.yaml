# Chapter 1: Castaway.
quest.ch1_shipwreck.name: "Chapter 1: Castaway"
quest.ch1_shipwreck.step_clear_wolves: "The survivors of the wreck are surrounded in the north field. Kill 6 wolves."
quest.ch1_shipwreck.step_mine_bats: "The bosun fled into the old mine. Clear its entrance by killing 5 gloom bats."
quest.ch1_shipwreck.step_talk_foreman: "Ask Doran, the mine foreman, what became of the bosun."
quest.ch1_shipwreck.step_return_logbook: "Take the bosun's logbook to Maren Holt at the harbor."

quest.foreman_ore.name: "Iron from the Old Veins"
quest.foreman_ore.step_gather_ore: "Get 5 chunks of iron ore in the mine's deep galleries."
quest.foreman_ore.step_deliver_ore: "Deliver the iron ore to Doran, the foreman."

quest.diver_locket.name: "What the Sea Took"
quest.diver_locket.step_find_locket: "Recover a tarnished locket from the beach looters."
quest.diver_locket.step_return_locket: "Take the locket to Corvo the diver."

# Chapter 2: Roots.
quest.ch2_roots.name: "Chapter 2: Roots"
quest.ch2_roots.step_cull_toads: "The toads' venom wipes out the tracks in the marsh south of Raigal. Kill 8 mire toads."
quest.ch2_roots.step_gather_glowcaps: "Velia's tracking lantern burns glowcaps. Get 6 glowcaps."
quest.ch2_roots.step_deliver_glowcaps: "Bring the 6 glowcaps to Velia Moss, in the grove of Raigal."
quest.ch2_roots.step_ask_ferryman: "Ask Tavin Rema, the ferryman at the dock, where the unflagged boat landed."
quest.ch2_coffer.name: "Chapter 2: The sealed coffer"
quest.ch2_coffer.step_break_camp: "The smugglers are camped on the east shore. Kill 8 coffer smugglers."
quest.ch2_coffer.step_gather_tallies: "Velia wants to know who paid them. Get 4 smuggler's tallies."
quest.ch2_coffer.step_deliver_tallies: "Bring the 4 tallies to Velia Moss."
quest.ch2_coffer.step_find_coffer: "The hollow crawlers dragged the coffer into their nest, in the cave under the east shore. Find the sealed coffer."
quest.ch2_coffer.step_return_coffer: "Bring the sealed coffer to Velia Moss."
