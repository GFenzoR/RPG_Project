# Chapter 1: Castaway.
quest.ch1_shipwreck.name: "Chapter 1: Castaway"
quest.ch1_shipwreck.step_clear_wolves: "The survivors of the wreck are surrounded in the north field. Kill 6 wolves."
quest.ch1_shipwreck.step_mine_bats: "The bosun fled into the old mine. Clear its entrance by killing 5 gloom bats."
quest.ch1_shipwreck.step_talk_foreman: "Ask Doran, the mine foreman, what became of the bosun."
quest.ch1_shipwreck.step_return_logbook: "Take the bosun's logbook to Maren Holt at the harbor."

quest.foreman_ore.name: "Iron from the Old Veins"
quest.foreman_ore.step_gather_ore: "Get 5 chunks of iron ore in the mine's deep galleries."
quest.foreman_ore.step_deliver_ore: "Deliver the iron ore to Doran, the foreman."

quest.diver_locket.name: "What the Sea Took"
quest.diver_locket.step_find_locket: "Recover a tarnished locket from the beach looters."
quest.diver_locket.step_return_locket: "Take the locket to Corvo the diver."

# Chapter 2: Roots.
quest.ch2_roots.name: "Chapter 2: Roots"
quest.ch2_roots.step_cull_toads: "The toads' venom wipes out the tracks in the marsh south of Raigal. Kill 8 mire toads."
quest.ch2_roots.step_gather_glowcaps: "Velia's tracking lantern burns glowcaps. Get 6 glowcaps."
quest.ch2_roots.step_deliver_glowcaps: "Bring the 6 glowcaps to Velia Moss, in the grove of Raigal."
quest.ch2_roots.step_ask_ferryman: "Ask Tavin Rema, the ferryman at the dock, where the unflagged boat landed."
quest.ch2_coffer.name: "Chapter 2: The sealed coffer"
quest.ch2_coffer.step_break_camp: "The smugglers are camped on the east shore. Kill 8 coffer smugglers."
quest.ch2_coffer.step_gather_tallies: "Velia wants to know who paid them. Get 4 smuggler's tallies."
quest.ch2_coffer.step_deliver_tallies: "Bring the 4 tallies to Velia Moss."
quest.ch2_coffer.step_find_coffer: "The hollow crawlers dragged the coffer into their nest, in the cave under the east shore. Find the sealed coffer."
quest.ch2_coffer.step_return_coffer: "Bring the sealed coffer to Velia Moss."

# Chapter 3: Fire under the stone.
quest.ch3_embers.name: "Chapter 3: Fire under the stone"
quest.ch3_embers.step_clear_hounds: "Ash hounds have taken over the flats north of Brasal. Kill 10 ash hounds."
quest.ch3_embers.step_gather_scales: "Casia needs a lantern that can stand the mountain's heat. Get 6 salamander scales."
quest.ch3_embers.step_deliver_scales: "Bring the 6 salamander scales to Casia Hollín, in the archive of Brasal."
quest.ch3_embers.step_ask_smith: "Show the ember root to Bram Tizón, the smith of Brasal: he may know its marks."
quest.ch3_gate.name: "Chapter 3: The sealed gate"
quest.ch3_gate.step_thin_delvers: "The obsidian delvers are digging toward the ancient forge. Kill 10 obsidian delvers."
quest.ch3_gate.step_find_chart: "Their tunnels have a chart. Get a tunnel chart."
quest.ch3_gate.step_deliver_chart: "Bring the tunnel chart to Casia Hollín."
quest.ch3_gate.step_reach_gate: "Go down to the antechamber of the sealed gate, at the bottom of the mine."
quest.ch3_gate.step_open_gate: "Show the ember root to the echo that guards the sealed gate."
quest.ch3_warden.name: "Chapter 3: The forge's warden"
quest.ch3_warden.step_defeat_warden: "The slagbound warden still guards the ancient forge, behind the sealed gate: open it with the ember key and defeat it."
quest.ch3_warden.step_take_seal: "Take the forge seal the warden was guarding."
quest.ch3_warden.step_return_seal: "Bring the forge seal to Casia Hollín, in Brasal."

# Side quests of the Forest and the Ember Isle (lote 12).
quest.ferryman_jetty.name: "Lights on the east shore"
quest.ferryman_jetty.step_see_jetty: "Boats without lights land at night at a jetty on the east shore of the Forest Isle. Go and see it: it's past the smugglers' camp, out over the water."
quest.ferryman_jetty.step_clear_crawlers: "The crates on the jetty carry a customs seal and go down into the cave next to it, where the crawlers nest. Kill 12 hollow crawlers."
quest.ferryman_jetty.step_report: "Tell Tavin Rema, at the Raigal dock, what you saw on the crates."
quest.tanner_chitin.name: "Chitin leather"
quest.tanner_chitin.step_gather_chitin: "Gisla wants to stitch chitin over stag leather. Get 8 crawler chitin in the cave on the east shore."
quest.tanner_chitin.step_gather_heartwood: "Tanning it takes thorn heartwood. Get 4 thorn heartwoods from the thornlings of the deep forest."
quest.tanner_chitin.step_deliver: "Take the 8 chitin and the 4 thorn heartwoods to Gisla, the tanner of Raigal."
quest.captain_fenders.name: "Fenders that don't burn"
quest.captain_fenders.step_thin_salamanders: "The slope's salamanders spit embers at the porters coming down to the Brasal dock. Kill 10 cinder salamanders."
quest.captain_fenders.step_gather_pelts: "The dock's black stones scorch the hulls, and hound pelt does not burn. Get 5 ash hound pelts."
quest.captain_fenders.step_deliver_pelts: "Take the 5 pelts to Nerea Vado, at the Brasal dock."
quest.smith_ring.name: "The obsidian ring"
quest.smith_ring.step_gather_cores: "Bram sets obsidian over the heat of slag cores. Get 5 slag cores from the golems."
quest.smith_ring.step_deliver_cores: "Take the 5 slag cores to Bram Tizón, at the Brasal smithy."
quest.smith_ring.step_quench_ring: "A ring of the old forge is quenched with an ember of the Still Flame. Ask Mother Oriela for one, at the temple of Brasal."
quest.smith_ring.step_collect_ring: "Go back to Bram Tizón for your ring."
quest.flame_crater.name: "The crater's flame"
quest.flame_crater.step_reach_heart: "The Still Flame was lit at the lava lake in the heart of the crater. Climb into the crater and reach the shore of the lake."
quest.flame_crater.step_thin_nest: "The wyrmlings nest by the lake and the temple's flame gutters. Kill 6 ember wyrmlings."

# Isla de Pruebas (sandbox island, docs/16-probar-el-juego.md).
quest.pruebas_rats.name: "Practice rats"
quest.pruebas_rats.step_hunt_rats: "Hunt three bilge rats in the first pen of the hunting trail, north of the temple of the Sandbox Isle."
quest.pruebas_rats.step_report: "Go back to Irene Ensayo, in the temple."
