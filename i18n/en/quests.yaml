# Chapter 1: Castaway.
quest.ch1_shipwreck.name: "Chapter 1: Castaway"
quest.ch1_shipwreck.step_clear_wolves: "The survivors of the wreck are surrounded in Howlmead, the north field. Kill 6 wolves."
quest.ch1_shipwreck.step_mine_bats: "The bosun fled into Grakkun, the old mine. Clear its entrance by killing 5 gloom bats."
quest.ch1_shipwreck.step_talk_foreman: "Ask Doran, the foreman of Grakkun, what became of the bosun."
quest.ch1_shipwreck.step_return_logbook: "Take the bosun's logbook to Maren Holt at the harbor."

quest.foreman_ore.name: "Iron from the Old Veins"
quest.foreman_ore.step_gather_ore: "Get 5 chunks of iron ore in the deep galleries of Grakkun."
quest.foreman_ore.step_deliver_ore: "Deliver the iron ore to Doran, the foreman."

quest.diver_locket.name: "What the Sea Took"
quest.diver_locket.step_find_locket: "Recover a tarnished locket from the Saltwrack beach looters."
quest.diver_locket.step_return_locket: "Take the locket to Corvo the diver."

# Chapter 2: Roots.
quest.ch2_roots.name: "Chapter 2: Roots"
quest.ch2_roots.step_cull_toads: "The toads' venom wipes out the tracks in Murlowe, the marsh south of Ivernel. Kill 8 mire toads."
quest.ch2_roots.step_gather_glowcaps: "Velia's tracking lantern burns glowcaps. Get 6 glowcaps."
quest.ch2_roots.step_deliver_glowcaps: "Bring the 6 glowcaps to Velia Moss, in the grove of Ivernel."
quest.ch2_roots.step_ask_ferryman: "Ask Tavin Rema, the ferryman at the dock, where the unflagged boat landed."
quest.ch2_coffer.name: "Chapter 2: The sealed coffer"
quest.ch2_coffer.step_break_camp: "The smugglers are camped on the east shore. Kill 8 coffer smugglers."
quest.ch2_coffer.step_gather_tallies: "Velia wants to know who paid them. Get 4 smuggler's tallies."
quest.ch2_coffer.step_deliver_tallies: "Bring the 4 tallies to Velia Moss."
quest.ch2_coffer.step_find_coffer: "The hollow crawlers dragged the coffer into their nest, in Marrowdeep, the cave under the east shore. Find the sealed coffer."
quest.ch2_coffer.step_return_coffer: "Bring the sealed coffer to Velia Moss."

# Chapter 3: Fire under the stone.
quest.ch3_embers.name: "Chapter 3: Fire under the stone"
quest.ch3_embers.step_clear_hounds: "Ash hounds have taken over Hraskel, the flats north of Cinderstead. Kill 10 ash hounds."
quest.ch3_embers.step_gather_scales: "Casia needs a lantern that can stand the mountain's heat. Get 6 salamander scales."
quest.ch3_embers.step_deliver_scales: "Bring the 6 salamander scales to Casia Hollín, in the archive of Cinderstead."
quest.ch3_embers.step_ask_smith: "Show the ember root to Bram Tizón, the smith of Cinderstead: he may know its marks."
quest.ch3_gate.name: "Chapter 3: The sealed gate"
quest.ch3_gate.step_thin_delvers: "The obsidian delvers are digging toward the ancient forge. Kill 10 obsidian delvers."
quest.ch3_gate.step_find_chart: "Their tunnels have a chart. Get a tunnel chart."
quest.ch3_gate.step_deliver_chart: "Bring the tunnel chart to Casia Hollín."
quest.ch3_gate.step_reach_gate: "Go down to the antechamber of the sealed gate, at the bottom of Brakkhal."
quest.ch3_gate.step_open_gate: "Show the ember root to the echo that guards the sealed gate."
quest.ch3_warden.name: "Chapter 3: The forge's warden"
quest.ch3_warden.step_defeat_warden: "The slagbound warden still guards the ancient forge, behind the sealed gate: open it with the ember key and defeat it."
quest.ch3_warden.step_take_seal: "Take the forge seal the warden was guarding."
quest.ch3_warden.step_return_seal: "Bring the forge seal to Casia Hollín, in Cinderstead."

# Side quests of Selvaine and Karvask (lote 12).
quest.ferryman_jetty.name: "Lights on the east shore"
quest.ferryman_jetty.step_see_jetty: "Boats without lights land at night at a jetty on the east shore of Selvaine. Go and see it: it's past the smugglers' camp, out over the water."
quest.ferryman_jetty.step_clear_crawlers: "The crates on the jetty carry a customs seal and go down into the cave next to it, where the crawlers nest. Kill 12 hollow crawlers."
quest.ferryman_jetty.step_report: "Tell Tavin Rema, at the Ivernel dock, what you saw on the crates."
quest.tanner_chitin.name: "Chitin leather"
quest.tanner_chitin.step_gather_chitin: "Gisla wants to stitch chitin over stag leather. Get 8 crawler chitin in Marrowdeep, the cave on the east shore."
quest.tanner_chitin.step_gather_heartwood: "Tanning it takes thorn heartwood. Get 4 thorn heartwoods from the thornlings of Nyssaral, the deep forest."
quest.tanner_chitin.step_deliver: "Take the 8 chitin and the 4 thorn heartwoods to Gisla, the tanner of Ivernel."
quest.captain_fenders.name: "Fenders that don't burn"
quest.captain_fenders.step_thin_salamanders: "The salamanders of Vadrek, the slope, spit embers at the porters coming down to the Cinderstead dock. Kill 10 cinder salamanders."
quest.captain_fenders.step_gather_pelts: "The dock's black stones scorch the hulls, and hound pelt does not burn. Get 5 ash hound pelts."
quest.captain_fenders.step_deliver_pelts: "Take the 5 pelts to Nerea Vado, at the Cinderstead dock."
quest.smith_ring.name: "The obsidian ring"
quest.smith_ring.step_gather_cores: "Bram sets obsidian over the heat of slag cores. Get 5 slag cores from the golems."
quest.smith_ring.step_deliver_cores: "Take the 5 slag cores to Bram Tizón, at the Cinderstead smithy."
quest.smith_ring.step_quench_ring: "A ring of the old forge is quenched with an ember of the Still Flame. Ask Mother Oriela for one, at the temple of Cinderstead."
quest.smith_ring.step_collect_ring: "Go back to Bram Tizón for your ring."
quest.flame_crater.name: "The crater's flame"
quest.flame_crater.step_reach_heart: "The Still Flame was lit at the lava lake in the heart of Skarrag crater. Climb into the crater and reach the shore of the lake."
quest.flame_crater.step_thin_nest: "The wyrmlings nest by the lake and the temple's flame gutters. Kill 6 ember wyrmlings."

# Hunting tasks (lote 12): repeatable every 20 hours.
quest.bounty_smugglers.name: "Hunting task: smugglers"
quest.bounty_smugglers.step_hunt: "The Ivernel board pays for the smugglers of the east shore. Kill 25 coffer smugglers."
quest.bounty_smugglers.step_report: "Collect the bounty from Fenn Zarzal, in the Ivernel plaza."
quest.bounty_thornlings.name: "Hunting task: thornlings"
quest.bounty_thornlings.step_hunt: "The Ivernel board pays for the thornlings that choke the trails. Kill 25 thornlings."
quest.bounty_thornlings.step_report: "Collect the bounty from Fenn Zarzal, in the Ivernel plaza."
quest.bounty_crawlers.name: "Hunting task: crawlers"
quest.bounty_crawlers.step_hunt: "The Ivernel board pays for the crawlers of Marrowdeep, the east shore cave. Kill 30 hollow crawlers."
quest.bounty_crawlers.step_report: "Collect the bounty from Fenn Zarzal, in the Ivernel plaza."
quest.bounty_hounds.name: "Hunting task: hounds"
quest.bounty_hounds.step_hunt: "The Cinderstead ledger pays for the hounds of Hraskel, the ash flats. Kill 30 ash hounds."
quest.bounty_hounds.step_report: "Collect the bounty from Orso Pedernal, in the Cinderstead plaza."
quest.bounty_golems.name: "Hunting task: golems"
quest.bounty_golems.step_hunt: "The Cinderstead ledger pays for the golems that crawl out of Brakkhal. Kill 20 slag golems."
quest.bounty_golems.step_report: "Collect the bounty from Orso Pedernal, in the Cinderstead plaza."
quest.bounty_wyrmlings.name: "Hunting task: wyrmlings"
quest.bounty_wyrmlings.step_hunt: "The Cinderstead ledger pays for the wyrmlings that come down from Skarrag crater. Kill 8 ember wyrmlings."
quest.bounty_wyrmlings.step_report: "Collect the bounty from Orso Pedernal, in the Cinderstead plaza."
# Thimblewick (sandbox island, docs/16-probar-el-juego.md).
quest.pruebas_rats.name: "Practice rats"
quest.pruebas_rats.step_hunt_rats: "Hunt three bilge rats in the first pen of the hunting trail, north of the temple of Thimblewick."
quest.pruebas_rats.step_report: "Go back to Irene Ensayo, in the temple."
