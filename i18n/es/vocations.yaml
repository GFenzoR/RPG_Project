vocation.guardian.name: "Guardián"
vocation.guardian.desc: "Combate cuerpo a cuerpo y protege a los demás con su escudo."
vocation.arcanist.name: "Arcanista"
vocation.arcanist.desc: "Domina la magia de ataque y golpea a varios enemigos a la vez."
vocation.ranger.name: "Montaraz"
vocation.ranger.desc: "Dispara con arco desde lejos, aguanta con escudo y conoce algo de magia."
vocation.druid.name: "Druida"
vocation.druid.desc: "Cura a sus compañeros a distancia y castiga con hielo y naturaleza."
