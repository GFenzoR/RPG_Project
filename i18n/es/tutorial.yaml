# Tutorial guiado de Puerto (T4.2, data/tutorial.yaml). Textos originales.
tutorial.step.first_steps: "Despiertas en el templo del Farol, en Lanternby. Camina {count} pasos con las flechas, WASD o haciendo clic en el suelo."
tutorial.step.meet_priestess: "La sacerdotisa del templo recibe a quienes llegan del mar. Haz clic derecho sobre ella para hablarle."
tutorial.step.open_backpack: "Quien acaba de llegar ya trae su arma de vocación en la mano y ropa sencilla puesta, y en la mochila galletas y una cataplasma para curarse. Abre tu mochila con doble clic sobre ella en tu equipo, o con clic derecho y «Abrir». Lo que no entra en ella va a tus bolsillos, la fila bajo tu figura. Hasta el nivel {novice} tienes protección de novato: si mueres no pierdes la mochila ni el equipo, solo un poco de experiencia y de habilidad."
tutorial.step.pick_target: "En el puerto, al sureste, merodean ratas y gaviotas. Elige una criatura con clic derecho o desde la lista de batalla."
tutorial.step.first_spell: "Tus hechizos ya están en la barra de abajo: el primero en F1. Con tu objetivo elegido, pulsa F1 o haz clic en esa casilla."
tutorial.step.first_victory: "Derrota a tu objetivo. Si te hieren, aléjate y espera a recuperarte."
tutorial.step.harbor_master_task: "La jefa del puerto, Maren Holt, necesita manos. Búscala en el muelle y acepta su encargo."
tutorial.completed: "Terminaste el tutorial. ¡Buen viaje!"
tutorial.skipped: "Saltaste el tutorial."
