# Chapter 1: Náufrago.
quest.ch1_shipwreck.name: "Capítulo 1: Náufrago"
quest.ch1_shipwreck.step_clear_wolves: "Los sobrevivientes del naufragio están rodeados en el campo del norte. Mata 6 lobos."
quest.ch1_shipwreck.step_mine_bats: "El contramaestre huyó a la mina vieja. Despeja su entrada matando 5 murciélagos lóbregos."
