# Chapter 1: Náufrago.
quest.ch1_shipwreck.name: "Capítulo 1: El naufragio"
quest.ch1_shipwreck.step_clear_wolves: "Los sobrevivientes del naufragio están rodeados en Howlmead, el campo del norte. Mata 6 lobos."
quest.ch1_shipwreck.step_mine_bats: "El contramaestre huyó a Grakkun, la mina vieja. Despeja su entrada matando 5 murciélagos lóbregos."
quest.ch1_shipwreck.step_talk_foreman: "Pregúntale a Doran, el capataz de Grakkun, qué fue del contramaestre."
quest.ch1_shipwreck.step_return_logbook: "Lleva la bitácora del contramaestre a Maren Holt, en el puerto."

quest.foreman_ore.name: "Hierro de las vetas viejas"
quest.foreman_ore.step_gather_ore: "Consigue 5 trozos de mineral de hierro en las galerías profundas de Grakkun."
quest.foreman_ore.step_deliver_ore: "Entrega el mineral de hierro a Doran, el capataz."

quest.diver_locket.name: "Lo que el mar se llevó"
quest.diver_locket.step_find_locket: "Recupera un relicario ennegrecido de los saqueadores de la playa de Saltwrack."
quest.diver_locket.step_return_locket: "Lleva el relicario a Corvo, el buzo."

# Chapter 2: Raíces.
quest.ch2_roots.name: "Capítulo 2: Raíces"
quest.ch2_roots.step_cull_toads: "El veneno de los sapos borra las huellas en Murlowe, la ciénaga al sur de Ivernel. Mata 8 sapos de ciénaga."
quest.ch2_roots.step_gather_glowcaps: "El farol de rastreo de Velia arde con hongo lumbre. Consigue 6 hongos lumbre."
quest.ch2_roots.step_deliver_glowcaps: "Lleva los 6 hongos lumbre a Velia Musgo, en el bosquecillo de Ivernel."
quest.ch2_roots.step_ask_ferryman: "Pregúntale a Tavin Rema, el barquero del muelle, dónde atracó el bote sin bandera."
quest.ch2_coffer.name: "Capítulo 2: El cofre sellado"
quest.ch2_coffer.step_break_camp: "Los contrabandistas acampan en la costa este. Mata 8 contrabandistas del cofre."
quest.ch2_coffer.step_gather_tallies: "Velia quiere saber quién les pagó. Consigue 4 tarjas de contrabandista."
quest.ch2_coffer.step_deliver_tallies: "Lleva las 4 tarjas a Velia Musgo."
quest.ch2_coffer.step_find_coffer: "Los reptantes huecos arrastraron el cofre a su nido, en Marrowdeep, la cueva bajo la costa este. Encuentra el cofre sellado."
quest.ch2_coffer.step_return_coffer: "Lleva el cofre sellado a Velia Musgo."

# Chapter 3: Fuego bajo la piedra.
quest.ch3_embers.name: "Capítulo 3: Fuego bajo la piedra"
quest.ch3_embers.step_clear_hounds: "Los sabuesos de ceniza se adueñaron de Hraskel, el llano al norte de Cinderstead. Mata 10 sabuesos de ceniza."
quest.ch3_embers.step_gather_scales: "Casia necesita un farol que aguante el calor de la montaña. Consigue 6 escamas de salamandra."
quest.ch3_embers.step_deliver_scales: "Lleva las 6 escamas de salamandra a Casia Hollín, en el archivo de Cinderstead."
quest.ch3_embers.step_ask_smith: "Muéstrale la raíz de ascua a Bram Tizón, el herrero de Cinderstead: quizá reconozca sus marcas."
quest.ch3_gate.name: "Capítulo 3: La puerta sellada"
quest.ch3_gate.step_thin_delvers: "Los mineros de obsidiana cavan hacia la forja antigua. Mata 10 mineros de obsidiana."
quest.ch3_gate.step_find_chart: "Sus túneles tienen un plano. Consigue un plano de galería."
quest.ch3_gate.step_deliver_chart: "Lleva el plano de galería a Casia Hollín."
quest.ch3_gate.step_reach_gate: "Baja hasta la antesala de la puerta sellada, en lo más hondo de Brakkhal."
quest.ch3_gate.step_open_gate: "Muéstrale la raíz de ascua al eco que guarda la puerta sellada."
quest.ch3_warden.name: "Capítulo 3: El custodio de la forja"
quest.ch3_warden.step_defeat_warden: "El custodio de escoria todavía guarda la forja antigua, tras la puerta sellada: ábrela con la llave de ascua y derrótalo."
quest.ch3_warden.step_take_seal: "Toma el sello de la forja que guardaba el custodio."
quest.ch3_warden.step_return_seal: "Lleva el sello de la forja a Casia Hollín, en Cinderstead."

# Quests secundarias del Bosque y del Volcán (lote 12).
quest.ferryman_jetty.name: "Luces en la costa este"
quest.ferryman_jetty.step_see_jetty: "Unos botes sin luces atracan de noche en un embarcadero de la costa este de Selvaine. Ve a verlo: está pasando el campamento de los contrabandistas, sobre el agua."
quest.ferryman_jetty.step_clear_crawlers: "Las cajas del embarcadero llevan un sello de aduana y bajan a la cueva de al lado, donde anidan los reptantes. Mata 12 reptantes huecos."
quest.ferryman_jetty.step_report: "Cuéntale a Tavin Rema, en el muelle de Ivernel, qué viste en las cajas."
quest.tanner_chitin.name: "Cuero de quitina"
quest.tanner_chitin.step_gather_chitin: "Gisla quiere coser quitina sobre cuero de ciervo. Consigue 8 quitinas de reptante en Marrowdeep, la cueva de la costa este."
quest.tanner_chitin.step_gather_heartwood: "Para curtirla hace falta corazón de espino. Consigue 4 corazones de espino de los espinosos de Nyssaral, el bosque profundo."
quest.tanner_chitin.step_deliver: "Lleva las 8 quitinas y los 4 corazones de espino a Gisla, la curtidora de Ivernel."
quest.captain_fenders.name: "Defensas que no arden"
quest.captain_fenders.step_thin_salamanders: "Las salamandras de Vadrek, la ladera, escupen brasa a los cargadores que bajan al muelle de Cinderstead. Mata 10 salamandras de brasa."
quest.captain_fenders.step_gather_pelts: "Las piedras negras del muelle queman los cascos, y la piel de sabueso no arde. Consigue 5 pieles de sabueso de ceniza."
quest.captain_fenders.step_deliver_pelts: "Lleva las 5 pieles a Nerea Vado, en el muelle de Cinderstead."
quest.smith_ring.name: "El anillo de obsidiana"
quest.smith_ring.step_gather_cores: "Bram engasta la obsidiana al calor de los núcleos de escoria. Consigue 5 núcleos de escoria de los gólems."
quest.smith_ring.step_deliver_cores: "Lleva los 5 núcleos de escoria a Bram Tizón, en la herrería de Cinderstead."
quest.smith_ring.step_quench_ring: "Un anillo de la forja vieja se templa con una brasa de la Llama Quieta. Pídesela a Madre Oriela, en el templo de Cinderstead."
quest.smith_ring.step_collect_ring: "Vuelve con Bram Tizón a buscar tu anillo."
quest.flame_crater.name: "La llama del cráter"
quest.flame_crater.step_reach_heart: "La Llama Quieta se encendió en el lago de lava del corazón del cráter de Skarrag. Sube al cráter y llega a la orilla del lago."
quest.flame_crater.step_thin_nest: "Los dragoncillos anidan junto al lago y la llama del templo vacila. Mata 6 dragoncillos de ascua."

# Tareas de caza (lote 12): repetibles cada 20 horas.
quest.bounty_smugglers.name: "Tarea de caza: contrabandistas"
quest.bounty_smugglers.step_hunt: "El tablón de Ivernel paga por los contrabandistas de la costa este. Mata 25 contrabandistas del cofre."
quest.bounty_smugglers.step_report: "Cobra la presa con Fenn Zarzal, en la plaza de Ivernel."
quest.bounty_thornlings.name: "Tarea de caza: espinosos"
quest.bounty_thornlings.step_hunt: "El tablón de Ivernel paga por los espinosos que ahogan los senderos. Mata 25 espinosos."
quest.bounty_thornlings.step_report: "Cobra la presa con Fenn Zarzal, en la plaza de Ivernel."
quest.bounty_crawlers.name: "Tarea de caza: reptantes"
quest.bounty_crawlers.step_hunt: "El tablón de Ivernel paga por los reptantes de Marrowdeep, la cueva de la costa este. Mata 30 reptantes huecos."
quest.bounty_crawlers.step_report: "Cobra la presa con Fenn Zarzal, en la plaza de Ivernel."
quest.bounty_hounds.name: "Tarea de caza: sabuesos"
quest.bounty_hounds.step_hunt: "El libro de Cinderstead paga por los sabuesos de Hraskel, el llano de ceniza. Mata 30 sabuesos de ceniza."
quest.bounty_hounds.step_report: "Cobra la presa con Orso Pedernal, en la plaza de Cinderstead."
quest.bounty_golems.name: "Tarea de caza: gólems"
quest.bounty_golems.step_hunt: "El libro de Cinderstead paga por los gólems que salen de Brakkhal. Mata 20 gólems de escoria."
quest.bounty_golems.step_report: "Cobra la presa con Orso Pedernal, en la plaza de Cinderstead."
quest.bounty_wyrmlings.name: "Tarea de caza: dragoncillos"
quest.bounty_wyrmlings.step_hunt: "El libro de Cinderstead paga por los dragoncillos que bajan del cráter de Skarrag. Mata 8 dragoncillos de ascua."
quest.bounty_wyrmlings.step_report: "Cobra la presa con Orso Pedernal, en la plaza de Cinderstead."
# Thimblewick (sandbox island, docs/16-probar-el-juego.md).
quest.pruebas_rats.name: "Ratas de práctica"
quest.pruebas_rats.step_hunt_rats: "Caza tres ratas de sentina en el primer corral del sendero de caza, al norte del templo de Thimblewick."
quest.pruebas_rats.step_report: "Vuelve con Irene Ensayo, en el templo."
quest.ms_thalorn_oath.name: "El juramento de Thalorn"
quest.ms_thalorn_oath.title: "Testigo del Juramento"
quest.ms_thalorn_oath.step_plates: "Baja a la cripta bajo las piedras de Thalorn, al noreste de Ivernel, y pisa sus dos placas a la vez con otra persona."
quest.ms_orthavel_vigil.name: "La vigilia de Orthavel"
quest.ms_orthavel_vigil.title: "Vigía del Asta"
quest.ms_orthavel_vigil.step_plate: "Con el amuleto de asta puesto, baja a la vigilia de Orthavel, bajo los robles al sur de Ivernel, y quédate sobre su placa."
quest.ms_morvund_embers.name: "Las cuatro ascuas de Morvund"
quest.ms_morvund_embers.title: "Mano de las Cuatro Ascuas"
quest.ms_morvund_embers.step_plates: "Reúne a una persona de cada vocación, cada cual con su llave de ascua, en la cámara al norte de la mina del Volcán: cada quien sobre la placa de su vocación, al mismo tiempo."
