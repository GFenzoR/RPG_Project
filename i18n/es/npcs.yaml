# Harbor master: Maren Holt, opens Chapter 1.
npc.harbor_master.name: "Maren Holt, jefa del puerto"
npc.harbor_master.greet: "Otro más que escupe agua salada... Bienvenido a tierra firme, {name}. ¿Qué necesitas?"
npc.harbor_master.opt_shipwreck: "Vengo del naufragio. ¿Qué pasó con el barco?"
npc.harbor_master.ch1_offer: "El Alba Tardía se partió contra el arrecife anoche. Los que llegaron a la orilla acamparon en el campo del norte, y los lobos llevan toda la noche rondándolos. Y falta el contramaestre, Edric Sall: lo vieron correr hacia la mina vieja con la bitácora bajo el brazo. Necesito manos. ¿Me ayudas?"
npc.harbor_master.ch1_accepted: "Bien. Toma este alfanje y algo de galleta; no es mucho, pero llegaste con menos. Primero el campo del norte: espanta a esos lobos para que los sobrevivientes puedan bajar al pueblo."
npc.harbor_master.ch1_accepted_arcanist: "Bien. No tengo varitas que darte, pero toma estas monedas y algo de galleta; Corvo, el buzo, talla varitas de coral cuando juntes para una. Primero el campo del norte: espanta a esos lobos para que los sobrevivientes puedan bajar al pueblo."
npc.harbor_master.opt_ch1_wolves: "¿Qué hago con los lobos?"
npc.harbor_master.ch1_wolves: "Saliendo por el camino del norte está el campo. Acaba con seis lobos y la manada se lo pensará dos veces. Si te hieren, vuelve al templo: la hermana Liora no le cobra a nadie por curar."
npc.harbor_master.opt_ch1_mine: "¿Dónde busco al contramaestre?"
npc.harbor_master.ch1_mine: "Los sobrevivientes ya bajaron, gracias a ti. Edric se metió en la mina vieja, al este. La entrada está llena de murciélagos; despeja el paso, que Doran, el capataz, no deja entrar a nadie con eso aleteando."
npc.harbor_master.ch1_foreman: "Ya limpiaste la entrada. Habla con Doran, el capataz: si alguien sabe qué fue de Edric, es él."
npc.harbor_master.opt_ch1_logbook: "Traigo la bitácora del contramaestre."
npc.harbor_master.ch1_logbook_read: "Déjame ver... 'Carga: sal, cuerda, un cofre sellado sin remitente. Pagaron el triple por no hacer preguntas.' Y al final, temblando: 'Nos guiaron al arrecife con un farol falso. No fue un accidente.' Edric no llegó a firmar la última página. Hiciste más que muchos de los míos: toma, te lo ganaste."
npc.harbor_master.opt_ch1_coffer: "¿Qué había en ese cofre?"
npc.harbor_master.ch1_coffer: "Nadie lo sabe. Los saqueadores de la playa se lo llevaron y esta mañana un bote sin bandera zarpó hacia la Isla del Bosque. Te ganaste un lugar en mi barco, {name}: cuando seas lo bastante fuerte, ve tras ellos."
npc.harbor_master.opt_ch1_after: "¿Se sabe algo del cofre?"
npc.harbor_master.ch1_after: "Los pescadores dicen que el bote atracó en la costa del bosque. Allí mandan los druidas, y no les gusta que les traigan problemas. Cuando estés listo, mi barco sale todos los días."
npc.harbor_master.opt_island: "¿Qué lugar es este?"
npc.harbor_master.island: "Una isla chica con un puerto grande. Todo lo que viaja entre las islas pasa por este muelle tarde o temprano, incluidos los naufragios."
npc.harbor_master.opt_town: "¿Quién más vive en el pueblo?"
npc.harbor_master.town: "Bastian forja y vende armas junto al muelle; Tilde tiene herramientas y provisiones; la hermana Liora cuida el templo del Farol. Doran vigila la mina vieja, y si buscas historias raras, el viejo Corvo bucea en el arrecife desde antes de que yo naciera."
npc.harbor_master.travel: "Mi barco hace la ruta a la Isla del Bosque. Llevo a gente que ya demostró lo que vale aquí y que sabe defenderse: nivel 10 como mínimo. Son 80 monedas."
npc.harbor_master.to_forest: "Llévame a la Isla del Bosque (80 monedas)."

# Armorer: Bastian Roe.
npc.puerto_armorer.name: "Bastian Roe, armero"
npc.puerto_armorer.greet: "Cuidado con las chispas. ¿Buscas acero, {name}, o vienes a vender chatarra?"
npc.puerto_armorer.opt_advice: "¿Qué me recomiendas?"
npc.puerto_armorer.advice: "Si recién llegas, un alfanje o una cabilla, una túnica y una tapa de barril para cubrirte. Desde nivel 5 la espada de hierro no falla. Las piezas grandes, el sable de abordaje y el hacha barbada, son para quien ya pasó nivel 10. Y no le pidas acero a un arcanista: que vaya a ver al viejo Corvo por una varita."
npc.puerto_armorer.opt_salvage: "¿Compras lo que encuentro?"
npc.puerto_armorer.salvage: "Compro armas y armaduras, pero a precio de chatarra: un tercio de lo que valen, y es generoso. Si quieres sacarle más, véndeselo a otro aventurero."

# Provisioner: Tilde Varga.
npc.puerto_provisioner.name: "Tilde Varga, provisiones"
npc.puerto_provisioner.greet: "¡Pasa, pasa! Cuerda, palas, galleta de barco... y si traes pieles o caparazones, también te los compro."
npc.puerto_provisioner.opt_tools: "¿Para qué sirve cada herramienta?"
npc.puerto_provisioner.tools: "La cuerda saca a cualquiera de un pozo; la pala abre agujeros donde la arena suena hueca; el pico arranca mineral de la roca; y la caña, bueno, pescado. Sin herramientas en esta isla no llegas lejos."
npc.puerto_provisioner.opt_gossip: "¿Qué se cuenta por aquí?"
npc.puerto_provisioner.gossip: "Que el farol de la punta estuvo apagado la noche del naufragio, y sin embargo los marineros juran que vieron una luz. Que los saqueadores de la playa tienen más monedas que nunca. Yo solo vendo cuerda, pero cuerda se vende mucho cuando hay miedo."

# Priest: Sister Liora, Temple of the Lantern.
npc.puerto_priest.name: "Hermana Liora"
npc.puerto_priest.greet: "Que el Farol te encuentre, {name}. Este templo da refugio a todo el que llega del mar. ¿En qué puedo ayudarte?"
npc.puerto_priest.opt_blessings: "Quiero recibir una bendición."
npc.puerto_priest.blessings: "Hay cinco luces del Farol. Cada una te protege cuando caes: pierdes menos experiencia y es más difícil que el mar se quede con tus cosas. Con las cinco no pierdes nada de lo que llevas. Cada luz pide una ofrenda de 200 monedas, y se apaga la próxima vez que mueras."
npc.puerto_priest.bless_shore: "La luz de la Orilla (200 monedas)."
npc.puerto_priest.bless_hearth: "La luz del Hogar (200 monedas)."
npc.puerto_priest.bless_keel: "La luz de la Quilla (200 monedas)."
npc.puerto_priest.bless_star: "La luz de la Estrella (200 monedas)."
npc.puerto_priest.bless_deep: "La luz de lo Hondo (200 monedas)."
npc.puerto_priest.blessed: "Ya arde en ti. Cuídala: el Farol alumbra, pero no rema por nadie."
npc.puerto_priest.opt_more: "Quiero otra bendición."
npc.puerto_priest.opt_heal: "Estoy herido. ¿Puedes curarme?"
npc.puerto_priest.healed: "Ya está. Las heridas cierran; la imprudencia no. Vuelve cuando lo necesites."
npc.puerto_priest.opt_faith: "¿Qué es el Farol?"
npc.puerto_priest.faith: "Cuando el viejo imperio se hundió, los que sobrevivieron remaron días en la oscuridad. Dicen que una luz los guió hasta estas islas. Nunca supimos quién la encendió; por eso cuidamos la nuestra, para que nadie vuelva a perderse en el mar."
npc.puerto_priest.opt_wreck: "¿Y el naufragio de anoche?"
npc.puerto_priest.wreck: "Recé por los que el mar se llevó. Pero escucha: alguien encendió una luz falsa en las rocas para guiar a ese barco a la muerte. Usar la luz para engañar es lo peor que puede hacer un isleño."

# Mine foreman: Doran Pike.
npc.puerto_foreman.name: "Doran Pike, capataz"
npc.puerto_foreman.greet: "Alto ahí. Esta mina ya se tragó a demasiada gente. ¿Qué quieres?"
npc.puerto_foreman.opt_ch1_bosun: "Busco al contramaestre del Alba Tardía."
npc.puerto_foreman.ch1_logbook: "¿Edric? Llegó anoche empapado, hablando de luces en las rocas. Lo dejé dormir en la caseta y al amanecer ya no estaba; solo dejó esto. Bajó a las galerías, y de ahí abajo no vuelve nadie. Lleva la bitácora a Maren, ella sabrá qué hacer."
npc.puerto_foreman.opt_ch1_lost: "Perdí la bitácora..."
npc.puerto_foreman.ch1_logbook_again: "¿Perdiste...? Por suerte copié las últimas páginas por si acaso. Toma, y esta vez guárdala bien."
npc.puerto_foreman.opt_mine: "¿Qué pasó con esta mina?"
npc.puerto_foreman.mine: "Sacábamos el mejor hierro del archipiélago. Ahora arriba hay murciélagos, más abajo escarabajos del tamaño de un perro, y en el fondo, el agua."
npc.puerto_foreman.opt_flood: "¿El agua?"
npc.puerto_foreman.flood: "Cavamos demasiado hondo y rompimos una pared que no era de roca: era de piedra tallada, de antes del hundimiento. El mar entró por ahí. Algunos de mis muchachos todavía caminan allá abajo... y no deberían."
npc.puerto_foreman.opt_work: "¿Necesitas ayuda con algo?"
npc.puerto_foreman.ore_offer: "La herrería del pueblo se queda sin hierro. Tráeme cinco trozos de mineral de hierro de las galerías profundas; los escarabajos se lo comen y los ahogados todavía cargan con lo que picaron. Te pagaré con mi pico viejo, que todavía corta como el primer día."
npc.puerto_foreman.ore_accepted: "Baja con cuidado y no te acerques al agua más de lo necesario."
npc.puerto_foreman.opt_ore_progress: "¿Dónde encuentro el mineral?"
npc.puerto_foreman.ore_hint: "En las galerías de abajo. Los escarabajos de mena lo llevan en la panza y los mineros ahogados en los bolsillos. Cinco trozos, ni uno menos."
npc.puerto_foreman.opt_ore_deliver: "Te traigo el mineral de hierro."
npc.puerto_foreman.ore_delivered: "Buen hierro, de las vetas viejas. Bastian se va a poner contento. El pico es tuyo: con él podrás sacar mineral tú mismo."

# Old diver: Corvo.
npc.puerto_diver.name: "Corvo, el buzo"
npc.puerto_diver.greet: "Je. Tienes cara de haber tragado medio mar, {name}. Siéntate, que la marea no tiene apuro."
npc.puerto_diver.opt_reef: "¿Qué hay en el arrecife?"
npc.puerto_diver.reef: "Barcos rotos, muchos. Y debajo de los barcos, columnas. Con la marea baja se ven los capiteles, cubiertos de coral. Nadie construye columnas en el fondo del mar, ¿verdad?"
npc.puerto_diver.opt_empire: "¿Columnas de qué?"
npc.puerto_diver.empire: "Del imperio que se hundió. Los sacerdotes hablan de luces y de remos, yo hablo de lo que toqué con las manos: calles, escaleras, puertas cerradas desde adentro. Algo los hizo cerrar las puertas antes de que llegara el agua."
npc.puerto_diver.opt_locket: "Pareces preocupado."
npc.puerto_diver.locket_offer: "Los saqueadores de la playa les arrancan los relicarios a los ahogados y los venden por unas monedas. Esos relicarios son lo único que queda de mucha gente. Si le quitas uno a esos buitres, tráemelo: la hermana Liora hará los ritos y yo te pagaré bien."
npc.puerto_diver.locket_accepted: "Están en la playa, junto al casco del Alba Tardía. Ve armado: los saqueadores tiran botellas y no fallan tanto como parece."
npc.puerto_diver.opt_locket_return: "Recuperé un relicario."
npc.puerto_diver.locket_returned: "Mira eso... el retrato se borró, pero el nombre grabado todavía se lee. Alguien va a descansar mejor esta noche. Toma, te lo ganaste."
npc.puerto_diver.opt_wands: "¿Qué es eso que tallas?"
npc.puerto_diver.wands: "Varitas de coral. El coral del arrecife guarda algo de la luz vieja; los arcanistas lo notan en los dedos. Si sabes usarla, te vendo una."
