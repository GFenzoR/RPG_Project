# Harbor master: Maren Holt, opens Chapter 1.
npc.harbor_master.name: "Maren Holt"
npc.harbor_master.role: "Jefa del puerto"
npc.harbor_master.greet: "Otra alma que escupe agua salada... Ya pisas tierra firme, {name}. ¿Qué necesitas?"
npc.harbor_master.opt_shipwreck: "Vengo del naufragio. ¿Qué pasó con el barco?"
npc.harbor_master.ch1_offer: "El Alba Tardía se partió contra el arrecife anoche. Los que llegaron a la orilla acamparon en Howlmead, el campo del norte, y los lobos llevan toda la noche rondándolos. Y falta el contramaestre, Edric Sall: lo vieron correr hacia la mina vieja con la bitácora bajo el brazo. Necesito manos. ¿Me ayudas?"
npc.harbor_master.ch1_accepted: "Bien. Ese alfanje te servirá un tiempo; toma algo de galleta, que no es mucho, pero llegaste con menos. Cuando juntes monedas, Bastian, en la plaza, forja espadas de hierro. Primero Howlmead, el campo del norte: espanta a esos lobos para que los sobrevivientes puedan bajar al pueblo."
npc.harbor_master.ch1_accepted_arcanist: "Bien. Esa varita de chispa te servirá un tiempo; toma algo de galleta. Cuando juntes monedas, Corvo, el buzo, talla varitas de coral más fuertes. Primero Howlmead, el campo del norte: espanta a esos lobos para que los sobrevivientes puedan bajar al pueblo."
npc.harbor_master.ch1_accepted_ranger: "Bien. Cuida ese arco corto: toma monedas para flechas (el armero de la plaza las vende) y algo de galleta. Primero Howlmead, el campo del norte: espanta a esos lobos para que los sobrevivientes puedan bajar al pueblo."
npc.harbor_master.ch1_accepted_druid: "Bien. Esa vara de retoño te servirá un tiempo; toma algo de galleta. Primero Howlmead, el campo del norte: espanta a esos lobos para que los sobrevivientes puedan bajar al pueblo."
npc.harbor_master.opt_ch1_wolves: "¿Qué hago con los lobos?"
npc.harbor_master.ch1_wolves: "Saliendo por el camino del norte está Howlmead, el campo. Acaba con seis lobos y la manada se lo pensará dos veces. Si te hieren, vuelve al templo: la hermana Liora no le cobra a nadie por curar."
npc.harbor_master.opt_ch1_mine: "¿Dónde busco al contramaestre?"
npc.harbor_master.ch1_mine: "Los sobrevivientes ya bajaron, gracias a ti. Edric se metió en Grakkun, la mina vieja, al este. La entrada está llena de murciélagos; despeja el paso, que Doran, el capataz, no deja entrar a nadie con eso aleteando."
npc.harbor_master.ch1_foreman: "Ya limpiaste la entrada. Habla con Doran, el capataz: si alguien sabe qué fue de Edric, es él."
npc.harbor_master.opt_ch1_logbook: "Traigo la bitácora del contramaestre."
npc.harbor_master.ch1_logbook_read: "Déjame ver... 'Carga: sal, cuerda, un cofre sellado sin remitente. Pagaron el triple por no hacer preguntas.' Y al final, temblando: 'Nos guiaron al arrecife con un farol falso. No fue un accidente.' Edric no llegó a firmar la última página. Hiciste más que muchos de los míos: toma, te lo ganaste."
npc.harbor_master.opt_ch1_coffer: "¿Qué había en ese cofre?"
npc.harbor_master.ch1_coffer: "Nadie lo sabe. Los saqueadores de la playa de Saltwrack se lo llevaron y esta mañana un bote sin bandera zarpó hacia Selvaine. Te ganaste un lugar en mi barco, {name}: cuando seas lo bastante fuerte, ve tras ellos."
npc.harbor_master.opt_ch1_after: "¿Se sabe algo del cofre?"
npc.harbor_master.ch1_after: "Los pescadores dicen que el bote atracó en la costa del bosque. Allí mandan los druidas, y no les gusta que les traigan problemas. Cuando quieras, mi barco sale todos los días."
npc.harbor_master.opt_island: "¿Qué lugar es este?"
npc.harbor_master.island: "Una isla chica con un puerto grande. Todo lo que viaja entre las islas pasa por este muelle tarde o temprano, incluidos los naufragios."
npc.harbor_master.opt_town: "¿Quién más vive en el pueblo?"
npc.harbor_master.town: "Bastian forja y vende armas en la plaza; Tilde tiene herramientas y provisiones; la hermana Liora cuida el templo del Farol. Doran vigila Grakkun, la mina vieja, y si buscas historias raras, el viejo Corvo bucea en el arrecife desde antes de que yo naciera."
npc.harbor_master.travel: "Mi barco hace la ruta a Selvaine. Llevo a gente que ya demostró lo que vale aquí y que sabe defenderse: nivel 10 como mínimo. Son 80 monedas."

# Armorer: Bastian Roe.
npc.puerto_armorer.name: "Bastian Roe"
npc.puerto_armorer.role: "Armero"
npc.puerto_armorer.greet: "Cuidado con las chispas. ¿Buscas acero, {name}, o vienes a vender chatarra?"
npc.puerto_armorer.opt_advice: "¿Qué me recomiendas?"
npc.puerto_armorer.advice: "Si recién llegas, un alfanje o una cabilla, una túnica y una tapa de barril para cubrirte. Desde nivel 5 la espada de hierro no falla. Las piezas grandes, el sable de abordaje y el hacha barbada, son para quien ya pasó nivel 10. Y no le pidas acero a un arcanista: que vaya a ver al viejo Corvo por una varita."
npc.puerto_armorer.opt_salvage: "¿Compras lo que encuentro?"
npc.puerto_armorer.salvage: "Compro armas y armaduras, pero a precio de chatarra: un tercio de lo que valen, y es generoso. Si quieres sacarle más, véndeselo a otro aventurero."

# Provisioner: Tilde Varga.
npc.puerto_provisioner.name: "Tilde Varga"
npc.puerto_provisioner.role: "Provisiones"
npc.puerto_provisioner.greet: "¡Pasa, pasa! Cuerda, herramientas, galleta de barco... y si traes pieles o caparazones, también te los compro."
npc.puerto_provisioner.opt_tools: "¿Para qué sirve cada herramienta?"
npc.puerto_provisioner.tools: "La cuerda saca a cualquiera de un pozo: en Saltwrack, la playa del naufragio, la arena se hundió y hay un socavón que cae a la mina; el pico arranca mineral de la roca; la caña, bueno, pescado; el hacha de leñador saca troncos de los abedules, y el martillo de herrero es para el yunque. Sin herramientas en esta isla no llegas lejos."
npc.puerto_provisioner.opt_gossip: "¿Qué se cuenta por aquí?"
npc.puerto_provisioner.gossip: "Que el farol de la punta estuvo apagado la noche del naufragio, y sin embargo los marineros juran que vieron una luz. Que los saqueadores de la playa tienen más monedas que nunca. Yo solo vendo cuerda, pero cuerda se vende mucho cuando hay miedo."

# Priest: Sister Liora, Temple of the Lantern.
npc.puerto_priest.name: "Hermana Liora"
npc.puerto_priest.greet: "Que el Farol te encuentre, {name}. Este templo da refugio a todo el que llega del mar. ¿En qué puedo ayudarte?"
npc.puerto_priest.opt_blessings: "Quiero recibir una bendición."
npc.puerto_priest.blessings: "Hay cinco luces del Farol. Cada una te protege cuando caes: pierdes menos experiencia y es más difícil que el mar se quede con tus cosas. Con las cinco no pierdes nada de lo que llevas. Cada luz pide una ofrenda que crece con tu camino, 50 monedas más 20 por cada nivel, y se apaga la próxima vez que mueras. Mientras dure tu protección de novato el Farol ya te cuida como si tuvieras las cinco, así que solo las enciendo cuando termine."
npc.puerto_priest.bless_shore: "La luz de la Orilla ({price} monedas)."
npc.puerto_priest.bless_hearth: "La luz del Hogar ({price} monedas)."
npc.puerto_priest.bless_keel: "La luz de la Quilla ({price} monedas)."
npc.puerto_priest.bless_star: "La luz de la Estrella ({price} monedas)."
npc.puerto_priest.bless_deep: "La luz de lo Hondo ({price} monedas)."
npc.puerto_priest.blessed: "Ya arde en ti. Cuídala: el Farol alumbra, pero no rema por nadie."
npc.puerto_priest.opt_more: "Quiero otra bendición."
npc.puerto_priest.opt_heal: "Tengo heridas. ¿Puedes curarme?"
npc.puerto_priest.healed: "Ya está. Las heridas cierran; la imprudencia no. Vuelve cuando lo necesites."
npc.puerto_priest.opt_faith: "¿Qué es el Farol?"
npc.puerto_priest.faith: "Cuando el viejo imperio se hundió, los que sobrevivieron remaron días en la oscuridad. Dicen que una luz los guió hasta estas islas. Nunca supimos quién la encendió; por eso cuidamos la nuestra, para que nadie vuelva a perderse en el mar."
npc.puerto_priest.opt_wreck: "¿Y el naufragio de anoche?"
npc.puerto_priest.wreck: "Recé por los que el mar se llevó. Pero escucha: alguien encendió una luz falsa en las rocas para guiar a ese barco a la muerte. Usar la luz para engañar es lo peor que puede hacer un isleño."

# Mine foreman: Doran Pike.
npc.puerto_foreman.name: "Doran Pike"
npc.puerto_foreman.role: "Capataz"
npc.puerto_foreman.greet: "Alto ahí. Esta mina ya se tragó a demasiada gente. ¿Qué quieres?"
npc.puerto_foreman.opt_ch1_bosun: "Busco al contramaestre del Alba Tardía."
npc.puerto_foreman.ch1_logbook: "¿Edric? Llegó anoche empapado, hablando de luces en las rocas. Lo dejé dormir en la caseta y al amanecer ya no estaba; solo dejó esto. Bajó a las galerías, y de ahí abajo no vuelve nadie. Lleva la bitácora a Maren, ella sabrá qué hacer."
npc.puerto_foreman.opt_ch1_lost: "Perdí la bitácora..."
npc.puerto_foreman.ch1_logbook_again: "¿Perdiste...? Por suerte copié las últimas páginas por si acaso. Toma, y esta vez guárdala bien."
npc.puerto_foreman.opt_mine: "¿Qué pasó con esta mina?"
npc.puerto_foreman.mine: "Sacábamos el mejor hierro del archipiélago. Ahora arriba hay murciélagos, más abajo escarabajos del tamaño de un perro, y en el fondo, el agua."
npc.puerto_foreman.opt_flood: "¿El agua?"
npc.puerto_foreman.flood: "Cavamos demasiado hondo y rompimos una pared que no era de roca: era de piedra tallada, de antes del hundimiento. El mar entró por ahí. Algunos de mis muchachos todavía caminan allá abajo... y no deberían."
npc.puerto_foreman.opt_work: "¿Necesitas ayuda con algo?"
npc.puerto_foreman.ore_offer: "La herrería del pueblo se queda sin hierro. Tráeme cinco trozos de mineral de hierro de las galerías profundas; los escarabajos se lo comen y los ahogados todavía cargan con lo que picaron. Te pagaré con mi pico viejo, que todavía corta como el primer día."
npc.puerto_foreman.ore_accepted: "Baja con cuidado y no te acerques al agua más de lo necesario."
npc.puerto_foreman.opt_ore_progress: "¿Dónde encuentro el mineral?"
npc.puerto_foreman.ore_hint: "En las galerías de abajo. Los escarabajos lo llevan en la panza y los mineros ahogados en los bolsillos. Cinco trozos, ni uno menos."
npc.puerto_foreman.opt_ore_deliver: "Te traigo el mineral de hierro."
npc.puerto_foreman.ore_delivered: "Buen hierro, de las vetas viejas. Bastian se va a poner contento. El pico es tuyo: con él podrás sacar mineral por tu cuenta."

# Old diver: Corvo.
npc.puerto_diver.name: "Corvo"
npc.puerto_diver.role: "Buzo"
npc.puerto_diver.greet: "Je. Tienes cara de haber tragado medio mar, {name}. Siéntate, que la marea no tiene apuro."
npc.puerto_diver.opt_reef: "¿Qué hay en el arrecife?"
npc.puerto_diver.reef: "Barcos rotos, muchos. Y debajo de los barcos, columnas. Con la marea baja se ven los capiteles, cubiertos de coral. Nadie construye columnas en el fondo del mar, ¿verdad?"
npc.puerto_diver.opt_empire: "¿Columnas de qué?"
npc.puerto_diver.empire: "Del imperio que se hundió. Los sacerdotes hablan de luces y de remos, yo hablo de lo que toqué con las manos: calles, escaleras, puertas cerradas desde adentro. Algo los hizo cerrar las puertas antes de que llegara el agua."
npc.puerto_diver.opt_locket: "Pareces preocupado."
npc.puerto_diver.locket_offer: "Los saqueadores de la playa les arrancan los relicarios a los ahogados y los venden por unas monedas. Esos relicarios son lo único que queda de mucha gente. Si le quitas uno a esos buitres, tráemelo: la hermana Liora hará los ritos y yo te pagaré bien."
npc.puerto_diver.locket_accepted: "Están en la playa de Saltwrack, junto al casco del Alba Tardía. Ve armado: los saqueadores tiran botellas y no fallan tanto como parece."
npc.puerto_diver.opt_locket_return: "Recuperé un relicario."
npc.puerto_diver.locket_returned: "Mira eso... el retrato se borró, pero el nombre grabado todavía se lee. Alguien va a descansar mejor esta noche. Toma, te lo ganaste."
npc.puerto_diver.opt_wands: "¿Qué es eso que tallas?"
npc.puerto_diver.wands: "Varitas de coral. El coral del arrecife guarda algo de la luz vieja; los arcanistas lo notan en los dedos. Si sabes usarla, te vendo una."
npc.bosque_druid.name: "Velia Musgo"
npc.bosque_druid.role: "Druida del bosque"
npc.bosque_druid.greet: "Las raíces me dijeron que vendrías, {name}. Aunque las raíces dicen muchas cosas. ¿Qué te trae a Ivernel?"
npc.bosque_druid.opt_boat: "Vengo siguiendo un bote sin bandera."
npc.bosque_druid.ch2_offer: "¿El bote del cofre? Entonces lo que siento bajo la tierra no es mi imaginación: algo viejo llegó a esta isla y la está inquietando. Quiero seguir su rastro, pero la ciénaga del sur está llena de sapos y su veneno borra cualquier huella. No mando a nadie de menos de nivel 15 a la ciénaga. ¿Me ayudas?"
npc.bosque_druid.ch2_accepted: "Bien. Baja a la ciénaga de Murlowe, al sur del pueblo, y acaba con ocho sapos. Si te envenenan, purga el veneno con tu hechizo; el hermano Olmar, en el templo, te cierra las heridas. Ten cuidado: el veneno sigue mordiendo después de la pelea."
npc.bosque_druid.opt_toads: "¿Qué hago en la ciénaga de Murlowe?"
npc.bosque_druid.ch2_toads: "Ocho sapos de ciénaga, en Murlowe, al sur del pueblo. Mientras sigan ahí, el barro no guarda huellas."
npc.bosque_druid.opt_glowcaps: "¿Para qué necesitas hongos?"
npc.bosque_druid.ch2_glowcaps: "Mi farol de rastreo arde con hongo lumbre: muestra lo que pasó por un lugar, no solo lo que está. Tráeme seis. Los sapos se los comen, y los espinosos del norte los crían en la corteza."
npc.bosque_druid.opt_give_glowcaps: "Aquí tienes seis hongos lumbre."
npc.bosque_druid.ch2_lantern: "Mira cómo arden... El rastro llega del agua, por el este, y entra al bosque cargando algo pesado. Pregúntale a Tavin, el barquero: si alguien vio dónde atracó ese bote, fue él."
npc.bosque_druid.opt_ferryman: "¿Qué debo preguntarle al barquero?"
npc.bosque_druid.ch2_go_ferryman: "Dónde atracó el bote sin bandera. Tavin está en el muelle, al oeste del pueblo."
npc.bosque_druid.opt_camp: "El barquero vio el bote en la costa este."
npc.bosque_druid.ch2_camp_offer: "Entonces acamparon allí. Los contrabandistas no trabajan gratis: alguien les pagó, y quiero saber quién. Rompe su campamento y tráeme cuatro de sus tarjas, las tablillas con que cuentan cargas. Esa gente pelea en serio: no vayas antes del nivel 20."
npc.bosque_druid.ch2_camp_accepted: "La costa este, pasando Nyssaral, el bosque profundo. Ocho contrabandistas y cuatro tarjas. Vuelve con vida."
npc.bosque_druid.opt_progress: "Sobre los contrabandistas..."
npc.bosque_druid.ch2_progress: "¿Qué averiguaste?"
npc.bosque_druid.opt_give_tallies: "Traigo cuatro tarjas de los contrabandistas."
npc.bosque_druid.ch2_tallies: "La marca del remo quemado... la misma que dejaron en el farol falso del arrecife. No eran simples ladrones. Y esta muesca dice 'cueva': escondieron el cofre bajo la costa, en la cueva de los reptantes. Si esas bestias lo arrastraron a su nido, búscalo allí abajo."
npc.bosque_druid.opt_give_coffer: "Encontré el cofre sellado."
npc.bosque_druid.ch2_coffer_opened: "Déjame... El sello cede con savia, no con fuerza. Mira: una raíz de piedra, tallada con las marcas del imperio que se hundió. Y está templada, como un carbón que no se apaga. Hiciste por este bosque más que muchos de los suyos."
npc.bosque_druid.opt_root: "¿Qué es esa raíz?"
npc.bosque_druid.ch2_root: "Una llave, creo. Las raíces del bosque la rechazan: lo que abre está lejos de aquí, donde la piedra arde. Quien pagó por robarla también lo sabe. Esto no terminó, {name}."
npc.bosque_druid.opt_grove: "¿Qué es este lugar?"
npc.bosque_druid.grove: "Ivernel: un pueblo chico a la sombra de árboles viejos. Talamos olmos con permiso y plantamos dos por cada uno. Lo que vive más adentro no siempre está de acuerdo. Si buscas una vara, una varita o un brebaje de maná, yo los tengo."
npc.bosque_ferryman.name: "Tavin Rema"
npc.bosque_ferryman.role: "Barquero"
npc.bosque_ferryman.greet: "Ah, tierra firme otra vez. ¿Vienes o te vas, {name}?"
npc.bosque_ferryman.opt_ch2_boat: "¿Viste dónde atracó un bote sin bandera?"
npc.bosque_ferryman.ch2_boat: "¿Ese bote? Pasó de noche, sin luces, y no entró a mi muelle. Lo vi encallado en la costa este, al otro lado del bosque, vacío. Los que bajaron de él no volvieron por acá. Díselo a Velia."
npc.bosque_ferryman.opt_island: "¿Qué hay en esta isla?"
npc.bosque_ferryman.island: "Bosque, y más bosque. Ciervos en Avelline, al norte del pueblo, sapos en Murlowe, la ciénaga del sur, y cosas peores entre los árboles viejos de Nyssaral. Hay una cueva bajo la costa este, Marrowdeep, que ni los druidas pisan."
npc.bosque_ferryman.travel: "Hago la vuelta a Velmara, y desde el nivel 25 llevo gente a Karvask. ¿Adónde?"
npc.bosque_priest.name: "Hermano Olmar"
npc.bosque_priest.greet: "Que la raíz te sostenga, {name}. Este es el templo de Ivernel."
npc.bosque_priest.opt_blessings: "Quiero una bendición."
npc.bosque_priest.blessings: "Las mismas cinco luces que reparte la hermana Liora en Lanternby, por la misma ofrenda: 50 monedas más 20 por cada nivel. Protegen tu camino si caes. Mientras dure tu protección de novato no te hacen falta: solo las doy cuando termine."
npc.bosque_priest.blessed: "Hecho. Que te acompañe."
npc.bosque_priest.opt_more: "Quiero otra."
npc.bosque_priest.opt_heal: "Tengo heridas."
npc.bosque_priest.healed: "La savia cierra lo que el hierro abrió. Ve en paz."
npc.bosque_priest.opt_root: "¿A quién rezan aquí?"
npc.bosque_priest.root: "A nadie con nombre. Al árbol que estaba antes que nosotros y que seguirá después. En Lanternby miran al mar; aquí miramos hacia abajo."
npc.bosque_merchant.name: "Gisla"
npc.bosque_merchant.role: "Curtidora"
npc.bosque_merchant.greet: "Cuero, olmo y lo que haga falta para no morirse en el bosque. ¿Qué buscas?"
npc.bosque_merchant.opt_elm: "¿Qué se hace con el olmo?"
npc.bosque_merchant.elm: "Escudos, sobre todo: tres troncos, un lingote y algo de resina en el yunque. Y el caldo de hongo lumbre se cocina a fuego de olmo. La arboleda está al este del pueblo; tala con permiso."
npc.bosque_merchant.opt_gossip: "¿Alguna novedad?"
npc.bosque_merchant.gossip: "Unos tipos del este vinieron a comprar cuerda y pagaron con monedas de Lanternby, todavía húmedas. No me gustó cómo miraban."
npc.harbor_master.to_forest: "A Selvaine (80 monedas)."
npc.bosque_ferryman.to_harbour: "A Velmara (60 monedas)."
npc.bosque_merchant.opt_amulet_again: "Perdí el amuleto de asta que me tallaste."
npc.bosque_merchant.amulet_again: "¿Lo perdiste? Asta no falta, pero tallarlo me lleva una tarde entera. Cuatrocientas monedas y te hago otro; este también va a salir distinto."
npc.bosque_merchant.opt_amulet_pay: "Aquí tienes las cuatrocientas monedas."
npc.bosque_merchant.amulet_carved: "Listo. A este cuídalo más: los robles de la vigilia solo reconocen a quien lo lleva puesto."

npc.bosque_druid.opt_take_root: "Necesito la raíz de piedra."
npc.bosque_druid.ch3_root_given: "Tómala. Aquí solo la templan las manos, nunca la tierra. Lo que abre está donde la piedra arde: Karvask. En Cinderstead guardan los registros de la forja vieja; busca a Casia Hollín. Y no vayas antes del nivel 30, {name}: allá el suelo también muerde."
npc.volcan_keeper.name: "Casia Hollín"
npc.volcan_keeper.role: "Guardiana de los registros"
npc.volcan_keeper.greet: "Cuidado con dónde pisas: aquí hasta el polvo está caliente. Soy Casia y cuido los registros de la forja. ¿Qué buscas, {name}?"
npc.volcan_keeper.opt_root: "Traigo una raíz de piedra tallada que está templada."
npc.volcan_keeper.ch3_offer: "Déjame verla... Estas marcas son de la forja antigua, la que el imperio encendió bajo la montaña. Hace tres noches la montaña empezó a respirar otra vez, y ahora esto. La forja despierta, y alguien quiere llegar antes que nosotros. Necesito ayuda, pero no mando a nadie de menos de nivel 30 al camino de las obras."
npc.volcan_keeper.ch3_accepted: "Primero el camino: los sabuesos cenizos se adueñaron de Hraskel, el llano al norte del pueblo, por donde se iba a las obras viejas. Mata diez. No sirve el fuego contra ellos; el hielo, sí."
npc.volcan_keeper.opt_hounds: "¿Qué hago con los sabuesos?"
npc.volcan_keeper.ch3_hounds: "Diez sabuesos cenizos, en Hraskel, el llano de ceniza al norte del pueblo. Cazan en grupo: no corras, son más rápidos que tú."
npc.volcan_keeper.opt_scales: "¿Para qué quieres escamas?"
npc.volcan_keeper.ch3_scales: "Mi farol de registros se rompe con el calor de la montaña. Con seis escamas de salamandra hago uno que aguante. Las salamandras ígneas viven en los pozos de lava de Vadrek, la ladera."
npc.volcan_keeper.opt_give_scales: "Aquí tienes seis escamas de salamandra."
npc.volcan_keeper.ch3_lantern: "Perfectas, todavía calientes. Mientras armo el farol, llévale la raíz a Bram, el herrero. Los herreros de Cinderstead heredaron las señales de la forja vieja: si alguien sabe leer esas marcas, es él."
npc.volcan_keeper.opt_smith: "¿Qué debo preguntarle al herrero?"
npc.volcan_keeper.ch3_go_smith: "Qué dicen las marcas de la raíz. Bram está en la herrería, junto a la fragua grande."
npc.volcan_keeper.opt_delvers: "Bram dice que la raíz es la llave de la forja."
npc.volcan_keeper.ch3_gate_offer: "Lo temía. Y no somos los únicos que lo saben: los mineros renegados dejaron el pueblo hace un mes y cavan día y noche bajo la montaña, hacia abajo. Alguien les paga. Frénalos y tráeme uno de sus planos: con él encuentro la puerta. Abajo no se sobrevive sin nivel 35."
npc.volcan_keeper.ch3_gate_accepted: "La mina de Brakkhal está al este del pueblo, al final del camino de piedra. Diez mineros, y un plano de sus túneles. Vuelve con el plano."
npc.volcan_keeper.opt_progress: "Sobre los mineros..."
npc.volcan_keeper.ch3_progress: "¿Encontraste algo?"
npc.volcan_keeper.opt_give_chart: "Traigo un plano de galería."
npc.volcan_keeper.ch3_chart_read: "Aquí... los túneles bajan y terminan en una puerta que ellos no pudieron abrir. La puerta sellada de la forja. Lleva la raíz hasta allí, a lo más hondo de Brakkhal. Si la forja reconoce su llave, se abrirá."
npc.volcan_keeper.opt_warden: "Sobre la forja..."
npc.volcan_keeper.ch3_warden: "El custodio no deja que nadie toque la forja. Derrótalo y tráeme su sello: el sello dice adónde fue el último fuego."
npc.volcan_keeper.opt_give_seal: "Traigo el sello de la forja."
npc.volcan_keeper.ch3_seal_read: "El sello de la forja... Mira esta línea: la forja no se apagó, mandó su último fuego lejos, al norte, en un barco. Hacia el hielo. Hiciste lo que nadie en Cinderstead se atrevió, {name}."
npc.volcan_keeper.opt_north: "¿Qué hay al norte?"
npc.volcan_keeper.ch3_north: "Las Islas Heladas. Hace años salió una expedición de este puerto siguiendo esa misma línea, y nunca volvió. Si quieres saber qué pasó con el fuego del imperio, el camino sigue por ahí. Pero eso es otra historia."
npc.volcan_keeper.opt_forge: "¿Qué es la forja antigua?"
npc.volcan_keeper.forge: "Una fragua del imperio, más grande que este pueblo, bajo la montaña. Cinderstead nació para alimentarla. Cuando el imperio se hundió, la forja se apagó, o eso creíamos."
npc.volcan_forge_echo.name: "eco de la forja"
npc.volcan_forge_echo.role: "Espíritu de la fragua"
npc.volcan_forge_echo.greet: "...calor... alguien baja otra vez. Nadie bajó en mucho tiempo."
npc.volcan_forge_echo.opt_open: "Traigo la raíz de ascua. Abre la puerta."
npc.volcan_forge_echo.ch3_gate_opened: "La raíz... vuelve a su forma. Tómala: es una llave de ascua, la llave de esta puerta. Llévala contigo y la puerta se abrirá a tu mano, y se cerrará tras de ti si no quieres compañía. Pero del otro lado el custodio sigue de guardia: lo forjamos para que nadie usara la forja sin nosotros, y nosotros ya no estamos."
npc.volcan_forge_echo.opt_no_root: "¿Cómo se abre la puerta?"
npc.volcan_forge_echo.no_root: "Con su llave. Una raíz de piedra, templada. Sin ella, la puerta es solo piedra. La última la vi irse al mar; si alguien la guarda, será en los bosques del sur."
npc.volcan_forge_echo.opt_lost_key: "Perdí la llave de ascua."
npc.volcan_forge_echo.key_reshaped: "La ceniza recuerda su forma. Toma, otra llave de ascua; cuídala mejor que la primera."
npc.volcan_forge_echo.opt_warden: "¿Qué es el custodio?"
npc.volcan_forge_echo.ch3_warden_offer: "Escoria con órdenes. No piensa, no duerme, no se apaga. Si quieres el sello de la forja, tendrás que romperlo. Desde el nivel 40, en grupo; sin grupo, no antes del 44, y con algo para curarte."
npc.volcan_forge_echo.ch3_warden_accepted: "Entonces abre la puerta con tu llave de ascua y pasa. Que el fuego te reconozca."
npc.volcan_forge_echo.opt_who: "¿Quién eres?"
npc.volcan_forge_echo.who: "El último que avivó la forja. O lo que queda de él en el humo."
npc.volcan_smith.name: "Bram Tizón"
npc.volcan_smith.role: "Herrero"
npc.volcan_smith.greet: "Si buscas acero que no se ablande con el calor, llegaste. Soy Bram. ¿Qué necesitas?"
npc.volcan_smith.opt_ch3_marks: "Casia quiere que veas las marcas de esta raíz."
npc.volcan_smith.ch3_marks: "Déjame... Esta señal la aprendí de mi abuela: es la marca de la forja vieja, la que se ponía en las llaves de sus puertas. Esto no es una raíz, es una llave. Dile a Casia que tenía razón."
npc.volcan_smith.opt_embersteel: "¿Qué es el acero de ascua?"
npc.volcan_smith.embersteel: "Mineral de ascua, de las vetas de la montaña. Tres de mineral, un lingote de hierro y un tronco de olmo en la fragua dan un lingote; con eso se forja en el yunque. El olmo viene de Selvaine: aquí no crece nada que arda tan parejo."
npc.volcan_priest.name: "Madre Oriela"
npc.volcan_priest.greet: "Te doy la bienvenida al templo de la Llama Quieta, {name}. Aquí ni la montaña te puede hacer daño."
npc.volcan_priest.opt_blessings: "Quiero una bendición."
npc.volcan_priest.blessings: "Las cinco luces de siempre, las mismas de Lanternby y de Ivernel: 50 monedas más 20 por cada nivel, para quien ya dejó atrás la protección de novato."
npc.volcan_priest.blessed: "Hecho. Que ninguna chispa te tome por sorpresa."
npc.volcan_priest.opt_more: "Quiero otra."
npc.volcan_priest.opt_heal: "Tengo heridas."
npc.volcan_priest.healed: "Ya está. Las quemaduras se curan; el descuido no."
npc.volcan_priest.opt_mountain: "¿Por qué una llama quieta?"
npc.volcan_priest.mountain: "Porque la montaña arde sin parar. Rezamos para que el fuego se quede donde está, y por los que bajan a buscarlo."
npc.volcan_ferryman.name: "Nerea Vado"
npc.volcan_ferryman.role: "Capitana"
npc.volcan_ferryman.greet: "Esto es Cinderstead. No toques las piedras negras del muelle: queman. ¿Vienes o te vas?"
npc.volcan_ferryman.opt_island: "¿Qué hay en esta isla?"
npc.volcan_ferryman.island: "Ceniza, lava y una montaña que respira. Sabuesos en Hraskel, salamandras en los pozos de Vadrek, Brakkhal, una mina al este del pueblo que ya nadie decente pisa. Y en el cráter anidan dragoncillos: ni se te ocurra subir sin experiencia."
npc.volcan_ferryman.travel: "Zarpo hacia las otras islas. Dime adónde."
npc.bosque_druid.opt_roots_help: "Sobre el rastro del bote..."
npc.bosque_druid.ch2_roots_help: "¿Qué necesitas saber?"
npc.volcan_keeper.opt_embers_help: "Sobre la raíz y la forja..."
npc.volcan_keeper.ch3_embers_help: "Dime, ¿en qué estás?"
npc.volcan_keeper.opt_root_missing: "Velia Musgo me habló de una raíz de piedra."
npc.volcan_keeper.ch3_root_missing: "¿La raíz de las marcas del imperio? Sin ella no hay nada que yo pueda leer. Si la guarda Velia, la druida de Ivernel, en Selvaine, pídesela y vuelve con ella."
npc.volcan_keeper.opt_gate_hint: "¿Dónde está la puerta?"
npc.volcan_keeper.ch3_gate_hint: "En lo más hondo de Brakkhal, al final de los túneles del plano. Lleva la raíz contigo; si la perdiste, Velia te dará otra en Ivernel."
npc.volcan_smith.ch3_no_root: "¿Marcas de qué? Sin la raíz en la mano no puedo leer nada. Si la perdiste, Velia, la druida de Ivernel, te dará otra. Tráela y la miro."
npc.bosque_ferryman.to_volcan: "A Karvask (150 monedas)."
npc.volcan_ferryman.to_forest: "A Selvaine (100 monedas)."
npc.volcan_ferryman.to_harbour: "A Velmara (140 monedas)."

# Quests secundarias y tareas de caza del Bosque y del Volcán (lote 12).
npc.bosque_ferryman.opt_jetty: "Miras mucho hacia el este."
npc.bosque_ferryman.jetty_offer: "Desde aquel bote sin bandera, otros botes atracan de noche en la costa este, sin luces y nunca en mi muelle. Dicen que los contrabandistas armaron un embarcadero propio. Quiero saber qué descargan y adónde lo llevan. No es para menos de nivel 22. ¿Vas?"
npc.bosque_ferryman.jetty_accepted: "El embarcadero está pasando el campamento de los contrabandistas, sobre el agua, al norte de Marrowdeep. Fíjate en las cajas: quiero saber de quién son."
npc.bosque_ferryman.opt_jetty_help: "Sobre el embarcadero..."
npc.bosque_ferryman.jetty_where: "Al este, pasando Nyssaral, el bosque profundo, y el campamento. Las tablas entran al agua al norte de la cueva. Ve armado."
npc.bosque_ferryman.jetty_crawlers: "¿Las cajas bajan a la cueva? Entonces los reptantes ya anidaron entre ellas. Mata doce y mira qué marca llevan."
npc.bosque_ferryman.opt_jetty_report: "Las cajas del embarcadero llevan un sello de aduana."
npc.bosque_ferryman.jetty_report: "¿Un sello de aduana? Es el de Lanternby. Sogas, aceite de farol, galleta: alguien compra en el puerto, con todos los permisos, para abastecer a esa gente. Se lo diré a Maren Holt. Toma, por el susto."
npc.bosque_ferryman.opt_jetty_after: "¿Supiste algo más de las cajas?"
npc.bosque_ferryman.jetty_after: "Maren revisó los libros de la aduana: cada caja la firmó un comprador distinto, y ninguno existe. Quien paga a los contrabandistas sabe esconderse. Y le sobra el dinero."
npc.bosque_merchant.opt_chitin: "¿Necesitas algo para el taller?"
npc.bosque_merchant.chitin_offer: "Quiero probar algo: coser quitina de reptante sobre cuero de ciervo, que aguante mordidas que el cuero solo no aguanta. Para curtirla hace falta corazón de espino en la tina. Ocho quitinas y cuatro corazones, y te tallo un amuleto. Desde el nivel 25: la cueva no perdona."
npc.bosque_merchant.chitin_accepted: "Las quitinas, de los reptantes de Marrowdeep, la cueva de la costa este. Los corazones de espino, de los espinosos de Nyssaral, el bosque profundo. Tráelo todo junto."
npc.bosque_merchant.opt_chitin_help: "¿Qué necesitabas para el cuero?"
npc.bosque_merchant.chitin_help: "Ocho quitinas de reptante y cuatro corazones de espino, todo junto. Los reptantes viven en Marrowdeep, la cueva bajo la costa este; los espinosos, al norte y al este del bosque."
npc.bosque_merchant.opt_chitin_give: "Traigo las quitinas y los corazones de espino."
npc.bosque_merchant.chitin_delivered: "Buen material, sin rajaduras. Toma: un amuleto de asta, tallado por mí. Cada asta sale distinta; esta tiene algo, ya lo vas a notar."
npc.volcan_ferryman.opt_fenders: "¿Problemas en el muelle?"
npc.volcan_ferryman.fenders_offer: "Dos. Los cargadores que bajan escamas y mineral pasan junto a los pozos de las salamandras, que les escupen brasa. Y las piedras negras del muelle me queman los cascos. Mata diez salamandras y tráeme cinco pieles de sabueso, que no arden. Desde el nivel 30."
npc.volcan_ferryman.fenders_accepted: "Las salamandras están en Vadrek, la ladera de piedra, al sureste del pueblo. Los sabuesos, en Hraskel, el llano de ceniza, al norte. Vuelve con las pieles."
npc.volcan_ferryman.opt_fenders_help: "¿Qué necesitabas para el muelle?"
npc.volcan_ferryman.fenders_help: "Diez salamandras ígneas menos en Vadrek, la ladera del sureste, y cinco pieles de sabueso cenizo, de Hraskel, el llano del norte."
npc.volcan_ferryman.opt_fenders_give: "Traigo cinco pieles de sabueso cenizo."
npc.volcan_ferryman.fenders_delivered: "Perfectas. Con esto el casco aguanta las piedras, y los cargadores ya bajan sin correr. Toma tu paga. Si alguna vez necesitas un barco, ya sabes dónde estoy."
npc.volcan_smith.opt_ring: "¿Trabajas algo más que acero?"
npc.volcan_smith.ring_offer: "A veces. Mi abuela engastaba obsidiana en anillos como los de los sacerdotes de la forja, al calor de un núcleo de escoria, que quema parejo. Tráeme cinco núcleos y te hago uno. Los gólems de la mina los llevan adentro. Desde el nivel 42."
npc.volcan_smith.ring_accepted: "Los gólems están en la galería este de Brakkhal y en la colada, al sureste del pueblo. Rómpelos con hielo: el fuego les da igual."
npc.volcan_smith.opt_ring_help: "Sobre el anillo..."
npc.volcan_smith.ring_help: "Cinco núcleos de escoria, que los gólems de la galería este de la mina y de la colada llevan adentro. Después, una brasa de la Llama Quieta que da Madre Oriela, en el templo. Con eso, vuelve por tu anillo."
npc.volcan_smith.opt_ring_cores: "Traigo cinco núcleos de escoria."
npc.volcan_smith.ring_cores: "Calientes todavía... Esto va a tardar. Pero un anillo de la forja vieja se templa con una brasa de la Llama Quieta, y esa brasa solo la da Madre Oriela. Ve al templo y pídesela; cuando vuelvas, estará listo."
npc.volcan_smith.opt_ring_collect: "¿Está listo el anillo?"
npc.volcan_smith.ring_done: "Templado en la Llama Quieta, como manda la regla. Toma. La obsidiana guarda algo del calor que la hizo, y cada anillo sale distinto. Úsalo bien."
npc.volcan_priest.opt_quench: "Bram necesita una brasa de la Llama Quieta."
npc.volcan_priest.ring_quenched: "¿Para templar un anillo de la forja? Hace años que nadie la pide. La brasa no se lleva en la mano: yo misma se la mando a Bram. Ve en paz, que llega antes que tú."
npc.volcan_priest.opt_crater: "La llama tiembla."
npc.volcan_priest.crater_offer: "Lo notaste. La Llama Quieta se encendió en el lago de lava del corazón del cráter de Skarrag, hace muchas generaciones. Desde que la montaña despertó, los dragoncillos anidan junto al lago y la llama vacila. Sube, mira el lago y ralea el nido. No antes del nivel 45."
npc.volcan_priest.crater_accepted: "El cráter de Skarrag está al noreste, al final del camino de escoria. Llega a la orilla del lago de lava y mata seis dragoncillos. La llama me dirá cuando lo hayas hecho, y el templo te pagará donde estés."
npc.volcan_priest.opt_crater_help: "Sobre el cráter..."
npc.volcan_priest.crater_help: "Sube al cráter de Skarrag por el camino del noreste, llega a la orilla del lago de lava, en el corazón, y mata seis dragoncillos. Lleva brebajes."
npc.volcan_priest.opt_crater_done: "¿La llama está quieta otra vez?"
npc.volcan_priest.crater_thanks: "Quieta como hace años. La vi enderezarse el día que bajaste del cráter. Gracias, {name}: el templo no olvida."
npc.bosque_hunter.name: "Fenn Zarzal"
npc.bosque_hunter.role: "Montero"
npc.bosque_hunter.greet: "Si vienes por el tablón, llegaste. Si vienes a pasear, el bosque está para el otro lado. ¿Qué buscas, {name}?"
npc.bosque_hunter.opt_board: "¿Qué paga el tablón?"
npc.bosque_hunter.board: "Ivernel paga por lo que amenaza el bosque: contrabandistas desde el nivel 15, espinosos desde el 18 y reptantes desde el 22. Una de cada presa por vez, y la que cobras vuelve a estar para ti en el tablón veinte horas después."
npc.bosque_hunter.opt_smugglers: "Contrabandistas del remo quemado."
npc.bosque_hunter.opt_thornlings: "Espinosos de Nyssaral."
npc.bosque_hunter.opt_crawlers: "Reptantes huecos de Marrowdeep."
npc.bosque_hunter.smugglers_offer: "Siguen volviendo a la costa este, por más campamentos que se rompan. Veinticinco contrabandistas, y el tablón te paga. ¿La tomas?"
npc.bosque_hunter.thornlings_offer: "Los espinosos ahogan los senderos del norte y del este; si no se los poda, en un mes no se pasa. Veinticinco. ¿La tomas?"
npc.bosque_hunter.crawlers_offer: "Los reptantes de Marrowdeep, la cueva de la costa este, salen de noche a la playa. Treinta, ni uno menos. Es la presa más cara del tablón, y la más peligrosa. ¿La tomas?"
npc.bosque_hunter.accepted: "Anotada. Vuelve cuando termines la cuenta y cobras. Tu diario lleva las muertes por ti."
npc.bosque_hunter.wait: "Esa presa ya la cobraste: estará otra vez para ti veinte horas después de cobrarla. Pasa mañana."
npc.bosque_hunter.opt_report_smugglers: "Terminé con los contrabandistas."
npc.bosque_hunter.smugglers_paid: "Veinticinco. El embarcadero va a quedar vacío un rato. Aquí está lo tuyo."
npc.bosque_hunter.opt_report_thornlings: "Podé a los espinosos."
npc.bosque_hunter.thornlings_paid: "Veinticinco espinosos menos: los leñadores te van a bendecir. Toma lo que dice el tablón."
npc.bosque_hunter.opt_report_crawlers: "Limpié Marrowdeep de reptantes."
npc.bosque_hunter.crawlers_paid: "Treinta. Y volviste de una pieza, que es lo que más cuesta. Aquí está la paga."
npc.bosque_hunter.opt_woods: "¿Quién paga el tablón?"
npc.bosque_hunter.woods: "El pueblo. Cada familia pone algo, y el templo también. Antes cazábamos solo ciervos, con permiso de Velia. Desde que el bote sin bandera tocó la costa, hasta el bosque está más bravo."
npc.volcan_hunter.name: "Orso Pedernal"
npc.volcan_hunter.role: "Jefe de cazadores"
npc.volcan_hunter.greet: "Cinderstead le paga a quien mantiene a raya a la montaña, y yo llevo las cuentas. ¿Vienes a cobrar o a anotarte, {name}?"
npc.volcan_hunter.opt_board: "¿Qué presas hay en el libro?"
npc.volcan_hunter.board: "Sabuesos cenizos desde el nivel 26, gólems de escoria desde el 39 y dragoncillos desde el 48. Una de cada presa por vez; la que cobras vuelve a estar para ti en el libro veinte horas después."
npc.volcan_hunter.opt_hounds: "Sabuesos de Hraskel."
npc.volcan_hunter.opt_golems: "Gólems de escoria."
npc.volcan_hunter.opt_wyrmlings: "Dragoncillos de Skarrag."
npc.volcan_hunter.hounds_offer: "Los sabuesos cortan el camino a la mina y a las obras viejas. Treinta, y el libro paga. No corras: son más rápidos que tú. ¿La tomas?"
npc.volcan_hunter.golems_offer: "Desde que despertó la forja vieja bajo la montaña, o eso dicen en el templo, los gólems salen de la mina y bajan por la colada. Veinte. Rómpelos con hielo, que el fuego les da igual. ¿La tomas?"
npc.volcan_hunter.wyrmlings_offer: "Los dragoncillos bajan del cráter de Skarrag a cazar cabras, y pronto bajarán por otra cosa. Ocho. Son pocos, pero cada uno vale por diez sabuesos. ¿La tomas?"
npc.volcan_hunter.accepted: "Anotado en el libro. Vuelve con la cuenta hecha y cobras."
npc.volcan_hunter.wait: "Esa presa ya está cobrada: estará otra vez para ti veinte horas después de cobrarla."
npc.volcan_hunter.opt_report_hounds: "Terminé con los sabuesos."
npc.volcan_hunter.hounds_paid: "Treinta sabuesos. Hraskel va a estar tranquilo hasta la próxima camada. Toma."
npc.volcan_hunter.opt_report_golems: "Rompí los gólems."
npc.volcan_hunter.golems_paid: "Veinte gólems hechos grava. Bram va a querer los núcleos, si te quedó alguno. Aquí tienes la paga."
npc.volcan_hunter.opt_report_wyrmlings: "Bajé dragoncillos del cráter."
npc.volcan_hunter.wyrmlings_paid: "Ocho dragoncillos... y todavía hueles a humo. Te lo ganaste."
npc.volcan_hunter.opt_mountain: "¿Por qué paga Cinderstead?"
npc.volcan_hunter.mountain: "Porque desde que despertó la forja vieja, allá abajo, la montaña no deja de parir bichos, y la guardia no alcanza. Mejor pagarle a quien sabe cazar que enterrar a quien no sabe."
# Thimblewick (sandbox island, docs/16-probar-el-juego.md).
npc.pruebas_trainer.name: "Irene Ensayo"
npc.pruebas_trainer.role: "Instructora"
npc.pruebas_trainer.greet: "Esta es Thimblewick, la isla de pruebas, {name}. Aquí no se juega en serio: se prueba. ¿Qué necesitas?"
npc.pruebas_trainer.opt_quest: "¿Tienes algún encargo para mí?"
npc.pruebas_trainer.quest_offer: "Uno corto, para ver cómo funciona una misión: en el primer corral del sendero de caza, al norte del templo, hay ratas de sentina. Caza tres y vuelve a contármelo."
npc.pruebas_trainer.quest_accepted: "Bien. El corral de las ratas es el primero, el del oeste. Si algo te persigue, vuelve al templo: ahí nadie ataca."
npc.pruebas_trainer.opt_quest_done: "Ya cacé las tres ratas."
npc.pruebas_trainer.quest_done: "Rápido y limpio. Toma tu recompensa: así se cierra una misión. Es una tarea: en tres minutos el corral vuelve a llenarse y te la doy otra vez. Mientras, mira tu ventana de Misiones: ahí dice cuándo."
npc.pruebas_trainer.opt_quest_cooling: "¿Hay más ratas?"
npc.pruebas_trainer.quest_cooling: "Todavía no: el corral tarda unos minutos en llenarse otra vez. El diario de misiones te dice cuánto falta."
npc.pruebas_trainer.opt_xp: "Quiero experiencia."
npc.pruebas_trainer.xp: "Para probar sin esperar: las casas piden nivel 12 y el PvP nivel 20. Esto sube tu nivel (vida, maná, capacidad); las skills y el nivel mágico te los entreno aparte (Entréname). ¿Cuánta quieres?"
npc.pruebas_trainer.opt_xp_small: "Un poco (5000 de experiencia)."
npc.pruebas_trainer.opt_xp_big: "Mucha (50 000 de experiencia)."
npc.pruebas_trainer.xp_given: "Hecho. Tu nivel está en la ventana del personaje. ¿Más?"
npc.pruebas_trainer.opt_train: "Entréname."
npc.pruebas_trainer.train: "Te dejo como quien llegó jugando a los corrales 4 y 5: las skills de las armas de tu vocación, el escudo y el nivel mágico. O los oficios, para que el yunque, la fragua y el fogón te den todas sus recetas. Nada baja: si ya tienes más, te quedas con lo tuyo. ¿Qué entrenamos?"
npc.pruebas_trainer.opt_train_combat: "El combate (skills de mi vocación y nivel mágico)."
npc.pruebas_trainer.opt_train_trades: "Los oficios (minería, tala, herrería, cocina, alquimia y pesca)."
npc.pruebas_trainer.trained: "Hecho. Tus skills están en la ventana del personaje. Fuera de esta isla nadie entrena así: allá suben con el uso."
npc.pruebas_trainer.opt_gold: "Necesito dinero (una moneda de oro)."
npc.pruebas_trainer.gold: "Una moneda de oro son diez mil de cobre: alcanza para la tienda, el barco y el alquiler. ¿Otra?"
npc.pruebas_trainer.opt_heal: "Cúrame."
npc.pruebas_trainer.healed: "Listo: la vida y el maná, como nuevos."
npc.pruebas_merchant.name: "Tobías Muestra"
npc.pruebas_merchant.role: "Proveedor"
npc.pruebas_merchant.greet: "Hola, {name}. Tengo un poco de todo para probar: herramientas, comida, runas, el equipo de cada vocación y la llave de la puerta de práctica."
npc.pruebas_merchant.opt_gear: "¿Qué equipo me sirve?"
npc.pruebas_merchant.gear: "Guardián: hacha de mano, o espada de hierro desde el nivel 5, y un escudo. Arcanista: varita de chispa, o de coral desde el nivel 5. Montaraz: arco corto y flechas, o ballesta y virotes desde el nivel 10. Druida: vara de retoño. La ropa le sirve a cualquiera; desde el nivel 15, el abrigo de cuero de ciervo solo a guardianes y montaraces, y la túnica de musgo a todos."
npc.pruebas_merchant.opt_key: "¿Qué abre la llave de latón?"
npc.pruebas_merchant.key: "La puerta de práctica, al este de la plaza, al sur del camino. Llévala en la mochila y usa la puerta; con la misma llave la vuelves a cerrar."
npc.pruebas_ferryman.name: "Remo Vaivén"
npc.pruebas_ferryman.role: "Barquero"
npc.pruebas_ferryman.greet: "Buenas, {name}. De este muelle salen barcos a las islas de verdad."
npc.pruebas_ferryman.opt_back: "¿Y para volver?"
npc.pruebas_ferryman.back: "Ningún barco viene a esta isla: no figura en las cartas. Si te vas, solo vuelves si alguien del personal te trae o si despiertas en este templo."
npc.pruebas_ferryman.travel: "Elige destino. El viaje es solo de ida."
npc.pruebas_ferryman.to_harbour: "A Velmara (20 monedas)."
npc.pruebas_ferryman.to_forest: "A Selvaine (20 monedas)."
npc.pruebas_ferryman.to_volcan: "A Karvask (20 monedas)."
# Milestone quests (docs/02 "Quests de hito").
npc.bosque_priest.opt_thalorn: "¿Qué son las piedras del bosque del noreste?"
npc.bosque_priest.thalorn_offer: "Las piedras de Thalorn. Debajo hay una cripta donde dos guardaron el bosque cuando todavía no tenía nombre: una que sostenía el escudo y otro que curaba sus heridas. Juraron no bajar nunca solos, y las placas de la cripta todavía lo recuerdan: responden solo si dos personas las pisan a la vez. No hace falta que se conozcan. ¿Quieres intentarlo?"
npc.bosque_priest.thalorn_accepted: "Busca a alguien que te acompañe. Pisen las dos placas al mismo tiempo y la cripta les abrirá lo que guarda. Mira tu diario: ahí está lo que piden."
npc.bosque_hunter.opt_orthavel: "¿Qué hay bajo los robles del sur?"
npc.bosque_hunter.orthavel_offer: "La vigilia de Orthavel. Los monteros de antes bajaban ahí a pasar la noche antes de su primera gran cacería, con un asta colgada del cuello. La placa de abajo no deja pasar a nadie que no la lleve puesta. Gisla, la curtidora, hace amuletos de asta para quien le trae lo que pide. ¿Te animas?"
npc.bosque_hunter.orthavel_accepted: "Ponte el amuleto de asta y baja sin compañía, como manda la costumbre. La placa sabrá si cumples con lo que pide. El diario te lo recuerda."
npc.volcan_forge_echo.opt_morvund: "¿Qué hay al norte de la galería de los excavadores?"
npc.volcan_forge_echo.opt_morvund_key: "Perdí la llave de Morvund."
npc.volcan_forge_echo.morvund_offer: "Morvund... la cámara de las cuatro ascuas. Los herreros de la forja vieja solo encendían el horno grande cuando estaban los cuatro: quien sostiene, quien teje, quien rastrea y quien cura. Cuatro placas, cada una con su marca, y cada mano con la llave de la forja. Detrás de la cámara quedó su galería, y su llave la guarda la cámara misma. ¿Reunirás a los cuatro?"
npc.volcan_forge_echo.morvund_accepted: "Una guardiana o un guardián, alguien arcanista, alguien montaraz y alguien druida, cada cual con la llave de ascua, sobre su placa al mismo tiempo. Tu diario dice lo que falta."
npc.volcan_forge_echo.morvund_key_reshaped: "Otra llave, del mismo acero. Que no se te vuelva a perder entre las cenizas."

