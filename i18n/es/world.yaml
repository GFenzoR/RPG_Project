island.testisle.name: "Isla de pruebas"
island.puerto.name: "Isla del Puerto"
island.bosque.name: "Isla del Bosque"
island.volcan.name: "Isla Volcánica"
island.pruebas.name: "Isla de Pruebas"
text.testisle.temple_sign: "Templo de la isla de pruebas. Aquí nadie puede hacerte daño."
text.puerto.temple_sign: "Templo del Farol. Dentro de sus muros nadie puede hacerte daño."
text.puerto.harbour_sign: "Muelle del Farol. Los barcos zarpan cuando el capitán de puerto lo dice."
text.puerto.mine_sign: "Mina vieja. Cuidado con los murciélagos y con lo que se esconde más abajo."
text.bosque.temple_sign: "Templo de la Raíz, en Raigal. Bajo sus ramas nadie puede hacerte daño."
text.bosque.dock_sign: "Muelle de Raigal. Tavin Rema lleva pasajeros a la Isla del Puerto y, desde el nivel 25, a la Isla Volcánica."
text.bosque.cave_sign: "Alguien tachó la palabra «peligro» y escribió encima: «nuestro»."
text.volcan.temple_sign: "Templo de la Llama Quieta, en Brasal. Aquí ni la montaña puede hacerte daño."
text.volcan.dock_sign: "Muelle de Brasal. Nerea Vado lleva pasajeros al Bosque y al Puerto. No toques las piedras negras."
text.volcan.mine_sign: "Mina de la Montaña. Cerrada por orden del archivo. Alguien rayó encima: «abajo hay fuego»."
text.volcan.gate_sign: "Forja antigua. Solo pasa quien trae su llave. Debajo, a cincel: «la raíz es la llave»."
# Isla de Pruebas (sandbox island, docs/16-probar-el-juego.md).
text.pruebas.temple_sign: "Isla de Pruebas: aquí se prueba todo el juego en pocos minutos. En el templo, Irene Ensayo da experiencia, dinero, curación y una misión corta; en la plaza, Tobías Muestra vende de todo. Norte: corrales de caza. Oeste: recolección y oficios. Este: patio de portales y puerta con llave. Sur: mercado, casa, arena y muelle."
text.pruebas.hunt_sign: "Sendero de caza. Corrales de oeste a este, de débil a fuerte: ratas de sentina, lobos, jabalíes con una araña, espinosos y un dragoncillo de ascua. Si algo te persigue, vuelve a la plaza: en la zona protegida nadie ataca."
text.pruebas.craft_sign: "Recolección y oficios. Al norte del camino, vetas de hierro (con un pico) y abedules (con un hacha de leñador); al final del camino, el muelle de pesca (con una caña, sobre el agua con peces). Al sur, la fragua, el yunque y el fogón: úsalos para ver sus recetas."
text.pruebas.market_sign: "Tablero del mercado: úsalo para comprar y vender con otros jugadores. Al suroeste hay una casa en alquiler: usa su puerta para alquilarla (desde el nivel 12)."
text.pruebas.dock_sign: "Muelle de pruebas. Remo Vaivén lleva a la Isla del Puerto, a la Isla del Bosque y a la Isla Volcánica. Es solo de ida: ningún barco vuelve aquí."
text.pruebas.vault_sign: "Puerta de práctica. Se abre y se cierra con la llave de latón que vende Tobías Muestra en la plaza. Sin la llave no pasa nadie."
text.pruebas.portal_sign: "Patio de portales. La escalera baja al piso 8 al pisarla. La trampilla se usa (click derecho) para bajar por la escalera de mano. Si pisas el agujero, caes. Abajo esperan un punto de luz para subir con cuerda y un teletransporte."
text.pruebas.dungeon_sign: "Piso 8. La escalera de mano sube con click derecho. Bajo el agujero entra luz: usa una cuerda ahí para subir. Al fondo, el teletransporte devuelve a la plaza. Cuidado con los murciélagos del este."
text.pruebas.arena_sign: "Arena. Si los dos están adentro se pelea sin marcas ni castigo. Fuera de la arena y de la plaza rige el PvP abierto, con marcas. Hace falta nivel 20, y el personal no puede pelear."
