# Map texts: island names, signs and books placed in world/.
island.testisle.name: "Isla de pruebas"
island.puerto.name: "Isla del Puerto"
island.bosque.name: "Isla del Bosque"
island.volcan.name: "Isla Volcánica"
text.testisle.temple_sign: "Templo de la isla de pruebas. Aquí nadie puede hacerte daño."
text.puerto.temple_sign: "Templo del Farol. Dentro de sus muros nadie puede hacerte daño."
text.puerto.harbour_sign: "Muelle del Farol. Los barcos zarpan cuando el capitán de puerto lo dice."
text.puerto.mine_sign: "Mina vieja. Cuidado con los murciélagos y con lo que se esconde más abajo."
text.bosque.temple_sign: "Templo de la Raíz, en Raigal. Bajo sus ramas nadie puede hacerte daño."
text.bosque.dock_sign: "Muelle de Raigal. Tavin Rema lleva pasajeros a la Isla del Puerto y, desde el nivel 25, a la Isla Volcánica."
text.bosque.cave_sign: "Alguien tachó la palabra «peligro» y escribió encima: «nuestro»."
text.volcan.temple_sign: "Templo de la Llama Quieta, en Brasal. Aquí ni la montaña puede hacerte daño."
text.volcan.dock_sign: "Muelle de Brasal. Nerea Vado lleva pasajeros al Bosque y al Puerto. No toques las piedras negras."
text.volcan.mine_sign: "Mina de la Montaña. Cerrada por orden del archivo. Alguien rayó encima: «abajo hay fuego»."
text.volcan.gate_sign: "Una puerta de piedra sin cerradura. En el centro, la marca de la forja y un hueco con forma de raíz."
