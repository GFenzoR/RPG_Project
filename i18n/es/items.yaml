item.ship_biscuit.name: "galleta de barco"
item.ship_biscuit.desc: "Dura como una piedra, pero aguanta meses sin echarse a perder."
item.boar_meat.name: "carne de jabalí"
item.boar_meat.desc: "Un trozo de carne de jabalí. Mejor asado."
item.seaweed_poultice.name: "cataplasma de algas"
item.seaweed_poultice.desc: "Algas machacadas con sal. Cierra heridas pequeñas."
item.gull_feather.name: "pluma de gaviota"
item.gull_feather.desc: "Una pluma blanca y gris. Sirve para emplumar flechas y virotes."
item.crab_claw.name: "pinza de cangrejo"
item.crab_claw.desc: "Una pinza dura y afilada de cangrejo de marea."
item.bat_wing.name: "ala de murciélago"
item.bat_wing.desc: "Un ala de murciélago, fina como el parche de un tambor."
item.boar_tusk.name: "colmillo de jabalí"
item.boar_tusk.desc: "Un colmillo curvo de jabalí, bueno para mangos y adornos."
item.spider_silk.name: "seda de araña"
item.spider_silk.desc: "Fibras verdosas, resistentes y algo pegajosas."
item.beetle_carapace.name: "caparazón de escarabajo"
item.beetle_carapace.desc: "Un caparazón duro con reflejos verdes. Los artesanos lo buscan."
item.iron_ore.name: "mineral de hierro"
item.iron_ore.desc: "Piedra rojiza y pesada. Un herrero sabría qué hacer con ella."
item.tarnished_locket.name: "relicario ennegrecido"
item.tarnished_locket.desc: "Dentro hay un retrato que el agua borró hace tiempo."
item.bosun_logbook.name: "bitácora del contramaestre"
item.bosun_logbook.desc: "Un cuaderno hinchado de agua salada. Las últimas páginas están escritas con prisa."
item.creature_remains.name: "restos de criatura"

