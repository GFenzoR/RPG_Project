# Libros, pergaminos y cofres (data/items/exploration.yaml, docs/02 "Libros y cofres"). El
# texto de cada libro está en books.yaml; mirarlo da esta descripción.
item.lectern_book.name: "atril con un libro"
item.book_closed.name: "libro"
item.scroll.name: "pergamino"
item.book_lantern_rowers.desc: "Un libro abierto sobre un atril: «Los remeros del Farol». Úsalo para leerlo."
item.book_root_below.desc: "Un libro abierto sobre un atril: «Lo que sostiene la raíz». Úsalo para leerlo."
item.book_still_flame.desc: "Un libro abierto sobre un atril: «La Llama Quieta». Úsalo para leerlo."
item.book_forge_register.desc: "Un libro grueso, de páginas quemadas en el borde: «Registro de la forja, tomo tercero». Úsalo para leerlo."
item.book_smith_notes.desc: "Un libro forrado en tela roja, con un broche de latón: «Apuntes de una herrera de Cinderstead». Úsalo para leerlo."
item.book_trail_notebook.desc: "Un cuaderno abierto sobre un atril, con hojas secas entre las páginas: «Cuaderno de rastros». Úsalo para leerlo."
item.scroll_dawn_manifest.desc: "Un pergamino húmedo atado con una cinta: «Manifiesto del Alba Tardía». Úsalo para leerlo."
item.scroll_burnt_oar_log.desc: "Un pergamino con la marca de un remo quemado: «Bitácora del remo quemado». Úsalo para leerlo."
item.scroll_drowned_wall.desc: "Un pergamino arrugado, escrito a toda prisa: «Lo que vimos detrás de la pared». Úsalo para leerlo."
item.reward_chest.name: "cofre"
item.reward_chest.desc: "Un cofre de tablones con bandas de hierro y una cerradura de latón. Cada aventurero puede abrirlo una sola vez."
