# Oficios (T3.4)
item.felling_axe.name: "hacha de leñador"
item.felling_axe.desc: "Úsala sobre un abedul para sacar leña."
item.smithing_hammer.name: "martillo de herrero"
item.smithing_hammer.desc: "Hace falta llevarlo para trabajar en el yunque."
item.birch_tree.name: "abedul"
item.birch_tree.desc: "Corteza blanca y tronco recto. Un hacha de leñador le sacaría unos troncos."
item.smelting_forge.name: "fragua"
item.smelting_forge.desc: "Brasas que nunca se apagan del todo. Aquí se funde el mineral."
item.anvil.name: "yunque"
item.anvil.desc: "Hierro gastado por mil golpes. Con un martillo de herrero se forjan herramientas y armas."
item.market_board.name: "tablero del mercado"
item.market_board.desc: "Tablones clavados llenos de avisos de compra y venta. Desde aquí se comercia con toda la región."
item.cooking_hearth.name: "fogón"
item.cooking_hearth.desc: "Piedras ennegrecidas y una parrilla. Aquí se cocina."
item.birch_log.name: "tronco de abedul"
item.birch_log.desc: "Leña seca, buena para el fuego y para mangos."
item.tree_resin.name: "resina"
item.tree_resin.desc: "Pegajosa y olorosa. Los herreros la usan para fijar empuñaduras."
item.iron_ingot.name: "lingote de hierro"
item.iron_ingot.desc: "Hierro fundido y limpio, listo para el yunque."
item.grilled_fish.name: "pescado a la brasa"
item.grilled_fish.desc: "Crujiente por fuera. Llena más que el pescado crudo."
item.roast_boar.name: "jabalí asado"
item.roast_boar.desc: "Carne asada a fuego lento. Quita el hambre por un buen rato."
item.harbour_stew.name: "guiso del puerto"
item.harbour_stew.desc: "Pescado, carne y algas en una olla. Reconforta y cura un poco."
item.forged_shortsword.name: "espada corta forjada"
item.forged_shortsword.desc: "Hoja de hierro forjada a mano, equilibrada y fiable."
item.stag_antler.name: "asta de ciervo"
item.stag_antler.desc: "Asta ramificada de un ciervo de zarza, todavía con espinas."
item.toad_gland.name: "glándula de sapo"
item.toad_gland.desc: "Una bolsita amarga que los curanderos del bosque usan contra el veneno."
item.glowcap.name: "hongo lumbre"
item.glowcap.desc: "Un hongo que brilla débilmente en la oscuridad del bosque."
item.thorn_heartwood.name: "corazón de espino"
item.thorn_heartwood.desc: "Madera dura y oscura del centro de un espinoso."
item.crawler_chitin.name: "quitina de reptante"
item.crawler_chitin.desc: "Placa pálida y liviana del caparazón de un reptante hueco."
item.elm_log.name: "tronco de olmo"
item.elm_log.desc: "Madera de olmo, más firme y pesada que la de abedul."
item.glowcap_broth.name: "caldo de hongo lumbre"
item.glowcap_broth.desc: "Caldo espeso que deja un resplandor tibio en el estómago. Cura algo de vida."
item.smuggler_tally.name: "tarja de contrabandista"
item.smuggler_tally.desc: "Una tablilla con muescas y una marca de remo quemada. Cuenta cargas."
item.sealed_coffer.name: "cofre sellado"
item.sealed_coffer.desc: "El cofre del Alba Tardía. El sello de cera sigue intacto."
item.elm_tree.name: "olmo"
item.elm_tree.desc: "Un olmo de corteza gris. Con un hacha de leñador se puede talar."
item.elmwood_shield.name: "escudo de olmo"
item.elmwood_shield.desc: "Tablas de olmo unidas con flejes de hierro y resina."
item.stagleather_coat.name: "abrigo de cuero de ciervo"
item.stagleather_coat.desc: "Cuero grueso curtido en el bosque. Abriga y aguanta zarpazos."
item.stagleather_leggings.name: "perneras de cuero de ciervo"
item.thornwood_blade.name: "hoja de espino"
item.thornwood_blade.desc: "Acero templado con savia de espino; la empuñadura es madera viva."
item.ash_pelt.name: "piel de sabueso de ceniza"
item.ash_pelt.desc: "Pelaje gris y áspero que huele a hoguera apagada. No arde."
item.salamander_scale.name: "escama de salamandra"
item.salamander_scale.desc: "Una escama roja que sigue caliente mucho después de caer."
item.slag_core.name: "núcleo de escoria"
item.slag_core.desc: "El corazón todavía caliente de un gólem de escoria. Pesa como un yunque chico."
item.wyrm_scale.name: "escama de dragoncillo"
item.wyrm_scale.desc: "Escama dura y liviana, con vetas de brasa. Los herreros pagan bien por ella."
item.ember_ore.name: "mineral de ascua"
item.ember_ore.desc: "Piedra negra con hilos de metal rojizo. Solo se funde con fuego de olmo."
item.embersteel_ingot.name: "lingote de acero de ascua"
item.embersteel_ingot.desc: "Acero oscuro que guarda un brillo rojo en los bordes."
item.ember_root.name: "raíz de ascua"
item.ember_root.desc: "Una raíz de piedra tallada con las marcas del imperio hundido. Está templada, como un carbón que no se apaga."
item.delver_chart.name: "plano de galería"
item.delver_chart.desc: "Un plano de túneles dibujado con hollín. Una flecha apunta hacia abajo, a una puerta."
item.forge_seal.name: "sello de la forja"
item.forge_seal.desc: "Un disco de bronce negro con la marca de la forja antigua. Una línea grabada señala al norte."
item.ember_vein.name: "veta de ascua"
item.ember_vein.desc: "Roca negra cruzada de vetas rojizas. Con un pico y algo de oficio se puede minar."
item.embersteel_sabre.name: "sable de acero de ascua"
item.embersteel_sabre.desc: "Una hoja curva que nunca termina de enfriarse."
item.embersteel_axe.name: "hacha de acero de ascua"
item.embersteel_axe.desc: "Hacha pesada de filo oscuro, forjada en el yunque de Brasal."
item.wyrmfang_blade.name: "hoja de colmillo de dragoncillo"
item.wyrmfang_blade.desc: "Acero de ascua templado con escamas y escoria. Corta el aire caliente."
item.embersteel_helm.name: "yelmo de acero de ascua"
item.embersteel_helm.desc: "Un yelmo cerrado, con rendijas estrechas contra las chispas."
item.embersteel_cuirass.name: "coraza de acero de ascua"
item.embersteel_cuirass.desc: "Placas de acero de ascua sobre piel de sabueso de ceniza."
item.embersteel_shield.name: "escudo de acero de ascua"
item.embersteel_shield.desc: "Acero de ascua sobre un alma de olmo, forrado con escamas de salamandra."
item.wyrmscale_mail.name: "cota de escamas de dragoncillo"
item.wyrmscale_mail.desc: "Escamas de dragoncillo cosidas sobre acero de ascua. Liviana para lo que aguanta."
