item.wolf_pelt.name: "piel de lobo"
item.wolf_pelt.desc: "Una piel gris y espesa. Los curtidores pagan por ella."
item.raw_fish.name: "pescado crudo"
item.raw_fish.desc: "Recién sacado del agua. Mejor a la brasa, pero quita el hambre."
# Isla del Puerto
item.rusty_cutlass.name: "alfanje oxidado"
item.rusty_cutlass.desc: "El óxido no le quitó el filo del todo."
item.boarding_saber.name: "sable de abordaje"
item.boarding_saber.desc: "Corto y pesado, hecho para pelear en cubiertas estrechas."
item.bearded_axe.name: "hacha barbada"
item.bearded_axe.desc: "Su hoja larga engancha escudos y cabos por igual."
item.belaying_pin.name: "cabilla"
item.belaying_pin.desc: "Una clavija de amarre de madera dura. Pega más fuerte de lo que parece."
item.spiked_cudgel.name: "porra claveteada"
item.spiked_cudgel.desc: "Una porra de madera dura erizada de clavos."
item.coral_wand.name: "varita de coral"
item.coral_wand.desc: "Coral blanco que todavía guarda el frío del fondo del mar."
item.sailcloth_cap.name: "gorro de lona"
item.sailcloth_cap.desc: "Un gorro cosido con lona de vela vieja."
item.leather_jerkin.name: "jubón de cuero"
item.leather_jerkin.desc: "Cuero hervido y endurecido, cosido por un talabartero del puerto."
item.canvas_trousers.name: "pantalones de lona"
item.canvas_trousers.desc: "Pantalones de lona gruesa, remendados en la rodilla."
item.tarred_boots.name: "botas alquitranadas"
item.tarred_boots.desc: "Botas de cuero untadas con brea contra el agua salada."
item.barrel_lid_shield.name: "tapa de barril"
item.barrel_lid_shield.desc: "Alguien le clavó una correa. Mejor que nada."
item.riveted_round_shield.name: "rodela remachada"
item.riveted_round_shield.desc: "Una rodela de madera con un borde de hierro remachado."
item.pickaxe.name: "pico"
item.pickaxe.desc: "Úsalo sobre una veta para extraer mineral."
item.shovel.name: "pala"
item.shovel.desc: "Sirve para cavar en arena o tierra blanda."
item.wet_sand.name: "arena mojada"
item.dock_planks.name: "tablones de muelle"
item.wooden_floor.name: "suelo de madera"
