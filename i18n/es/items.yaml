item.rough_stone.name: "piedra tosca"
item.rough_stone.desc: "Un trozo de roca sin valor... casi."
item.quartz_crystal.name: "cristal de cuarzo"
item.quartz_crystal.desc: "Un cristal claro que brilla al trasluz."

