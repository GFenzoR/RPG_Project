item.stagleather_hood.desc: "Cuero de ciervo forrado de lana. Protege la cabeza sin tapar la vista."
item.stagleather_boots.name: "botas de cuero de ciervo"
item.stagleather_boots.desc: "Botas altas curtidas en el bosque, con suela doble."
item.embersteel_greaves.name: "grebas de acero de ascua"
item.embersteel_greaves.desc: "Placas de acero de ascua sobre perneras de cuero de sabueso."
item.embersteel_sabatons.name: "escarpes de acero de ascua"
item.embersteel_sabatons.desc: "Botas de placas articuladas. Pesan, pero la lava no las atraviesa."
item.mana_draught.name: "brebaje de maná"
item.mana_draught.desc: "Un frasco de líquido azul que sabe a tormenta. Devuelve algo de maná."
item.concentrated_mana_draught.name: "brebaje de maná concentrado"
item.concentrated_mana_draught.desc: "El brebaje de maná reducido al fuego de Cinderstead. Devuelve mucho maná."
item.health_draught.name: "brebaje de vida"
item.health_draught.desc: "Un frasco de líquido rojo que huele a resina y a hierro. Cierra heridas que una cataplasma no cierra."
item.concentrated_health_draught.name: "brebaje de vida concentrado"
item.concentrated_health_draught.desc: "El brebaje de vida reducido al fuego de Cinderstead hasta quedar espeso y oscuro. Cierra heridas profundas."
# Lote 11: el catálogo compacto (docs/02 "Catálogo de equipo"). Bandas 2 a 4.
item.forged_axe.name: "hacha forjada"
item.forged_axe.desc: "Una hoja de hierro gruesa sobre un mango de abedul. Muerde más de lo que protege."
item.mossweave_robe.name: "túnica de musgo tejido"
item.mossweave_robe.desc: "Musgo del bosque hilado con lana. Liviana; la llevan los que pelean con la cabeza."
item.antler_amulet.name: "amuleto de asta"
item.antler_amulet.desc: "Una punta de asta de ciervo pulida, colgada de un cordón de cuero."
item.briar_ring.name: "anillo de zarza"
item.briar_ring.desc: "Una rama de zarza que se enroscó sola hasta cerrarse en un anillo."
item.ashweave_robe.name: "túnica de tejido de ceniza"
item.ashweave_robe.desc: "Tela que las sacerdotisas de Cinderstead tejen con una fibra que no arde."
item.cinder_amulet.name: "amuleto de brasa"
item.cinder_amulet.desc: "Una brasa encerrada en vidrio volcánico. Sigue tibia."
item.obsidian_ring.name: "anillo de obsidiana"
item.obsidian_ring.desc: "Un aro de obsidiana tallado de una sola pieza, negro y frío."
# Banda 5 (nivel 50): todavía sin isla.
item.wyrmbone_axe.name: "hacha de hueso de dragoncillo"
item.wyrmbone_axe.desc: "Una hoja de acero calzada en un hueso de dragoncillo. Pesa poco para lo que corta."
item.wyrmbone_maul.name: "mazo de hueso de dragoncillo"
item.wyrmbone_maul.desc: "La cabeza es un nudo de hueso de dragoncillo zunchado con acero de ascua."
item.wyrmsinew_bow.name: "arco de tendón de dragoncillo"
item.wyrmsinew_bow.desc: "Cuerda de tendón de dragoncillo: tensa como un alambre y nunca se moja."
item.wyrmsinew_crossbow.name: "ballesta de tendón de dragoncillo"
item.wyrmsinew_crossbow.desc: "Una ballesta de mano con cuerda de tendón. Se arma de un solo tirón."
item.wyrmhorn_wand.name: "varita de cuerno de dragoncillo"
item.wyrmhorn_wand.desc: "Un cuerno hueco que zumba. Dispara descargas de energía."
item.glacierheart_staff.name: "vara de corazón de glaciar"
item.glacierheart_staff.desc: "Madera blanca con un núcleo de hielo que no se derrite. Dispara escarcha."
item.wyrmscale_pavise.name: "pavés de escamas de dragoncillo"
item.wyrmscale_pavise.desc: "Un escudo alto de escamas superpuestas. Detrás de él cabe un hombre agachado."
item.duskweave_robe.name: "túnica de tejido crepuscular"
item.duskweave_robe.desc: "Tela del color del cielo cuando se va el sol. Nadie sabe bien quién la teje."
item.wyrmcrest_helm.name: "yelmo de cresta de dragoncillo"
item.wyrmcrest_helm.desc: "Un yelmo coronado por la cresta de un dragoncillo. Asusta antes del primer golpe."
item.wyrmhide_greaves.name: "grebas de cuero de dragoncillo"
item.wyrmhide_greaves.desc: "Cuero de dragoncillo endurecido al fuego. Las garras resbalan sobre él."
item.wyrmhide_boots.name: "botas de cuero de dragoncillo"
item.wyrmhide_boots.desc: "Botas altas de cuero de dragoncillo. Pisan brasas sin sentirlas."
item.wyrmtooth_amulet.name: "amuleto de diente de dragoncillo"
item.wyrmtooth_amulet.desc: "Un colmillo de dragoncillo engarzado en acero de ascua."
item.emberheart_ring.name: "anillo de corazón de ascua"
item.emberheart_ring.desc: "Un aro de acero de ascua con una piedra que late como un corazón."
# Banda 6 (nivel 75): todavía sin isla.
item.tidesteel_sword.name: "espada de acero de marea"
item.tidesteel_sword.desc: "Acero templado en agua de mar profunda. La hoja tiene vetas como olas."
item.tidesteel_axe.name: "hacha de acero de marea"
item.tidesteel_axe.desc: "Una hoja ancha de acero de marea. Cae como cae una ola."
item.tidesteel_mace.name: "maza de acero de marea"
item.tidesteel_mace.desc: "Una maza de cabeza estriada. El acero de marea no se oxida nunca."
item.drownwood_bow.name: "arco de madera ahogada"
item.drownwood_bow.desc: "Madera que pasó siglos bajo el agua y salió más dura que el hierro."
item.tidesteel_crossbow.name: "ballesta de acero de marea"
item.tidesteel_crossbow.desc: "Una ballesta de mano con arco de acero de marea. Precisa y pesada."
item.pearlstorm_wand.name: "varita de tormenta de perlas"
item.pearlstorm_wand.desc: "Una perla que encierra una tormenta pequeña. Dispara descargas de energía."
item.deepfrost_staff.name: "vara de escarcha honda"
item.deepfrost_staff.desc: "Hielo de las fosas del mar, donde no llega el sol. Dispara escarcha."
item.tidesteel_shield.name: "escudo de acero de marea"
item.tidesteel_shield.desc: "Un escudo redondo de acero de marea, liso como el agua quieta."
item.tidesteel_plate.name: "coraza de acero de marea"
item.tidesteel_plate.desc: "Placas de acero de marea sobre cota de malla. La armadura de los capitanes del imperio hundido."
item.pearlweave_robe.name: "túnica tejida de perlas"
item.pearlweave_robe.desc: "Hilo de seda con perlas diminutas cosidas. Brilla un poco en la oscuridad."
item.tidesteel_helm.name: "yelmo de acero de marea"
item.tidesteel_helm.desc: "Un yelmo cerrado con forma de caracola."
item.tidesteel_greaves.name: "grebas de acero de marea"
item.tidesteel_greaves.desc: "Grebas de acero de marea, frías al tacto incluso al sol."
item.tidesteel_sabatons.name: "escarpes de acero de marea"
item.tidesteel_sabatons.desc: "Escarpes articulados de acero de marea. Suenan como la resaca."
item.blackpearl_amulet.name: "amuleto de perla negra"
item.blackpearl_amulet.desc: "Una perla negra del tamaño de un ojo. Dicen que mira."
item.tidestone_ring.name: "anillo de piedra de marea"
item.tidestone_ring.desc: "Una piedra que se moja y se seca al ritmo de las mareas."

