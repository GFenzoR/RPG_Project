# Local development database. Used by `make db-up` / `make db-down`.
# Cloud sessions use the VM's PostgreSQL service instead (see Makefile).
name: rpg-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rpg
    ports:
      # Bound to localhost only: the dev credentials must not be reachable from the LAN.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rpg"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Email catcher for development (T2.1): every email the server sends lands here instead
  # of a real inbox. Web UI http://localhost:8025, SMTP on 127.0.0.1:1025 (no TLS, no
  # login). Optional: `make mail-up` (and `make dev`) start it. MIT license, pinned.
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: "500"

volumes:
  pgdata:
