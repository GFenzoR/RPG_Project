# Dashboards versioned in deploy/monitoring/grafana/dashboards (T4.4). Edit the JSON in the
# repo (or export it from the UI and commit it): UI changes are lost on restart.
apiVersion: 1
providers:
  - name: rpg
    folder: RPG Project
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
