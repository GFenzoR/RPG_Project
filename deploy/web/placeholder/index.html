<!doctype html>
<!--
  Temporary page served by deploy/Dockerfile.web until the client has a Vite build (T1.5).
  Not part of the game UI, so it is not wired to i18n/; it is replaced, not translated.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RPG Project</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #14161a;
        color: #e8e6e3;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      main {
        max-width: 32rem;
        padding: 1rem;
        text-align: center;
      }
      code {
        color: #9ecbff;
      }
      .status {
        color: #8a8f98;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RPG Project</h1>
      <p>El cliente del juego todavía no está publicado. / The game client is not published yet.</p>
      <p class="status">Servidor / Server: <code id="health">…</code></p>
    </main>
    <script>
      fetch("/healthz")
        .then(
          (r) => (document.getElementById("health").textContent = r.ok ? "ok" : "HTTP " + r.status),
        )
        .catch(() => (document.getElementById("health").textContent = "down"));
    </script>
  </body>
</html>
