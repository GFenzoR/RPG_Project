# RPG Project — production stack (docs/09-deployment-aws.md). Also the base for the home
# hosting override in T1.19 (docs/13-hosting-de-pruebas.md).
#
#   cp deploy/.env.example deploy/.env   # fill it in
#   docker compose -f deploy/docker-compose.yml up -d --wait
#
# Locally: `make docker-build` and `make docker-up` build the images from this checkout.
#
# Optional monitoring (T4.4, docs/09 "Monitoreo"): Prometheus, Alertmanager, Grafana and
# node-exporter behind the `monitoring` profile, published only on 127.0.0.1 (SSH tunnel):
#   docker compose -f deploy/docker-compose.yml --profile monitoring up -d --wait
# Locally: `make monitoring-up`.
name: rpg

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-build-args: &build-args
  VERSION: ${VERSION:-dev}
  COMMIT: ${COMMIT:-unknown}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-rpg}
    # No ports: only gameserver and backup reach it, through the internal network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [internal]
    shm_size: 128m
    logging: *logging

  gameserver:
    image: ${IMAGE_REGISTRY:-ghcr.io/gfenzor}/rpg-project-gameserver:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gameserver
      args: *build-args
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Browser origins allowed on /ws besides the site itself: the desktop app's webview
      # (tauri://localhost on macOS/Linux, http://tauri.localhost on Windows). Set it to an
      # empty value in deploy/.env to allow only the site. /ws authenticates with the
      # one-use token of Hello, never a cookie, so another origin cannot ride a session.
      RPG_WS_ORIGINS: ${RPG_WS_ORIGINS-tauri://localhost,http://tauri.localhost}
      # T4.5: "on" when the map PR worker has a token; otherwise the moderation page tells
      # moderators to open approved submissions by hand (mapcli patch apply).
      RPG_MAP_PR_WORKER: ${GITHUB_MAP_PR_TOKEN:+on}
      DATABASE_URL: postgres://${POSTGRES_USER:-rpg}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-rpg}?sslmode=disable
    # Pending migrations (embedded in the binary) are applied on start (-migrate, default
    # true); the healthcheck only passes once the HTTP API is up, after migrating.
    command:
      - -http=:8080
      - -data=/app/data
      - -world=/app/build/world.bin
      # Client IP for the per-IP rate limits = last X-Forwarded-For entry, which Caddy always
      # overwrites with its {client_ip} (deploy/caddy-routes.caddy). Safe only because 8080
      # is never published: every request arrives through Caddy.
      - -trust-proxy=true
      - -cookie-secure=${COOKIE_SECURE:-true}
      # How old an account must be to send maps on /maps/submit (T4.5). The home template
      # sets 0s so a test server can try the portal right away.
      - -map-submit-min-account-age=${MAP_SUBMIT_MIN_ACCOUNT_AGE:-24h}
      # /metrics on its own listener: never published on the host and Caddy has no route to
      # it. Containers of the stack's networks can reach it; Prometheus scrapes it over
      # `monitoring`. No player data in it (docs/01).
      - -metrics-addr=:9100
    # Only Caddy talks to it; 8080 is not published on the host.
    expose: ["8080", "9100"]
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # SIGTERM → the server stops the loop and drains HTTP; give it time to save players.
    # 90 s: the shutdown stages (10 s each at most) plus -metrics-linger (20 s), which keeps
    # /metrics up for one more scrape only when writes were abandoned (docs/01).
    stop_grace_period: 90s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, edge, monitoring]
    logging: *logging

  caddy:
    image: ${IMAGE_REGISTRY:-ghcr.io/gfenzor}/rpg-project-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: *build-args
    restart: unless-stopped
    depends_on:
      gameserver:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      # Required: Caddy exits on start when the `email` global option is empty.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      # Optional public /grafana/ route with basic auth (caddy-routes.caddy, docs/09). Off
      # by default: Grafana is reached through an SSH tunnel.
      GRAFANA_PUBLIC: ${GRAFANA_PUBLIC:-off}
      # Never empty, so a half-configured pair still parses (Caddy would refuse to start and
      # take the whole site down). The placeholder hash is of a random secret nobody has:
      # an unset user or hash means 401 for everyone.
      GRAFANA_BASIC_AUTH_USER: ${GRAFANA_BASIC_AUTH_USER:-disabled}
      GRAFANA_BASIC_AUTH_HASH: ${GRAFANA_BASIC_AUTH_HASH:-$$2a$$10$$h5iRjwthGVRQaUfhHaqSI.HfHTqlpCTohb2XJVOQpnwN8qsLbPWb2}
      # Who may even try the basic auth (each try costs a bcrypt compare): Caddy client_ip
      # values, e.g. "203.0.113.7/32". Default: a TEST-NET address no client ever has, so
      # with the route on and this unset everyone gets 403 (fails closed). Not
      # private_ranges: IPv6 visitors reach Caddy through docker-proxy from the edge
      # gateway (172.x), which private_ranges would let in (docs/09).
      GRAFANA_ALLOW_IPS: ${GRAFANA_ALLOW_IPS:-192.0.2.0/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data # certificates and the local CA: keep across restarts
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    logging: *logging

  backup:
    image: ${IMAGE_REGISTRY:-ghcr.io/gfenzor}/rpg-project-backup:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
      args: *build-args
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-rpg}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PGDATABASE: ${POSTGRES_DB:-rpg}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      HOME: /tmp # the AWS CLI writes its cache under $HOME; the root fs is read-only
    volumes:
      - backups:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # internal for Postgres, edge for the optional S3 upload.
    networks: [internal, edge]
    logging: *logging

  # ---- map PR worker (T4.5), profile map-pr ----------------------------------------------
  # Opens a pull request for each approved map submission (tools/map-pr-worker). Off unless
  # the profile is on (COMPOSE_PROFILES=map-pr) AND GITHUB_MAP_PR_TOKEN is set in
  # deploy/.env: without the token it logs once that it is disabled and idles (so
  # `up --wait` passes). It refuses to run with the owner's or a maintainer's token. No port: it only reaches Postgres (internal) and the
  # GitHub API (edge). How to create the token: docs/09, "Worker de PR de mapas".
  map-pr-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/gfenzor}/rpg-project-map-pr-worker:${IMAGE_TAG:-latest}
    profiles: [map-pr]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.map-pr-worker
      args: *build-args
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rpg}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-rpg}?sslmode=disable
      GITHUB_MAP_PR_TOKEN: ${GITHUB_MAP_PR_TOKEN:-}
      GITHUB_REPOSITORY: ${MAP_PR_REPOSITORY:-GFenzoR/RPG_Project}
      MAP_PR_BASE: ${MAP_PR_BASE:-main}
      MAP_PR_POLL_SECONDS: ${MAP_PR_POLL_SECONDS:-30}
    mem_limit: 192m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, edge]
    logging: *logging

  # ---- monitoring profile (T4.4) ------------------------------------------------------
  # Pinned images, run unmodified: Prometheus, Alertmanager, node-exporter (Apache-2.0),
  # Grafana OSS (AGPL-3.0). Memory limits sized for a 2 GB instance (docs/09).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever comes first: 15 days or 1 GB of disk.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
      - --web.listen-address=:9090
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # Localhost only: reach it through an SSH tunnel (docs/09).
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Docker publishes no port of a container that is only on internal networks: edge is
    # there for the 127.0.0.1 port above.
    networks: [monitoring, edge]
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    restart: unless-stopped
    # The config is generated from the ALERT_* variables at start (no credentials in git).
    entrypoint: ["/bin/sh", "/etc/alertmanager-rpg/entrypoint.sh"]
    environment:
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager-rpg:ro
      - alertmanager_data:/alertmanager
    tmpfs: [/tmp]
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # monitoring for Prometheus; edge to reach Discord, Telegram or the SMTP server.
    networks: [monitoring, edge]
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    # Refuses to start without a password (Grafana would fall back to admin/admin).
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "grafana: set GRAFANA_ADMIN_PASSWORD in deploy/.env (docs/09)" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      # Always under /grafana/, so the SSH tunnel and the optional Caddy route use the same
      # paths. GRAFANA_ROOT_URL = https://<domain>/grafana/ when the route is on.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Login form and session cookie only: an Authorization header (like the optional
      # Caddy basic auth) never counts as a Grafana login.
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rpg-overview.json
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # edge only for the optional Caddy route; the data sources are on monitoring.
    networks: [monitoring, edge]
    logging: *logging

  # Machine metrics (CPU, RAM, disk of /) and the backup textfile (deploy/backup.sh).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/backups/metrics
      # Only the real filesystems of the host.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    volumes:
      # Read-only host root for the filesystem stats. Without `rslave`: it fails where / is
      # not a shared mount (Docker Desktop, some VMs), and / itself is all we measure.
      - /:/host:ro
      - backups:/backups:ro
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    logging: *logging

  # Test receiver for alerts (only `make monitoring-test`): prints every webhook it gets.
  alert-receiver:
    image: python:3.12-alpine
    profiles: [monitoring-test]
    command: ["python", "-u", "/receiver.py"]
    volumes:
      - ./monitoring/test/receiver.py:/receiver.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    logging: *logging

networks:
  # No route outside the host: Postgres lives only here.
  internal:
    internal: true
  edge: {}
  # Scrapes and dashboards (monitoring profile); no route outside the host either.
  monitoring:
    internal: true

volumes:
  pgdata:
  backups: # list with: docker compose exec backup ls -lh /backups
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
