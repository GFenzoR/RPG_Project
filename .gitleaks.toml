# gitleaks configuration (lote 16, docs/18 "Secretos en git"). The default rules plus an
# allowlist for the fake credentials that tests, fixtures and local stacks use on purpose.
# A real secret never goes in the repository: deploy/.env (chmod 600) only.
# Run: make audit (if gitleaks is installed) and .github/workflows/security.yml.

[extend]
useDefault = true

[[allowlists]]
description = "Known test fixtures and fake credentials"
regexes = [
  '''bot-password''',
  '''fake-client-secret''',
  '''github_pat_test_token''',
  '''long-password-[0-9]''',
  '''home-admin-pass-[0-9]''',
  '''s3cret''',
]
paths = [
  '''(^|/)testdata/''',
  '''_test\.go$''',
  '''\.test\.tsx?$''',
  '''(^|/)client/e2e/''',
  '''(^|/)client/playwright\.config\.ts$''',
  '''(^|/)server/internal/oauth/oauthtest/''',
  '''(^|/)deploy/tests/''',
]
