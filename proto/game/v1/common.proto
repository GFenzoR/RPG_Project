syntax = "proto3";

package game.v1;

option go_package = "github.com/GFenzoR/RPG_Project/server/internal/net/pb/game/v1;gamev1";

// Shared types used by both directions of the protocol.
// Rules: never reuse a field number; incompatible changes go to game.v2.

// Position is a tile in the global world space: x, y in [0, 65535], z (floor) in
// [0, 15], floor 7 = sea level, lower numbers are higher up.
message Position {
  uint32 x = 1;
  uint32 y = 2;
  uint32 z = 3;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_NORTH = 1;
  DIRECTION_NORTH_EAST = 2;
  DIRECTION_EAST = 3;
  DIRECTION_SOUTH_EAST = 4;
  DIRECTION_SOUTH = 5;
  DIRECTION_SOUTH_WEST = 6;
  DIRECTION_WEST = 7;
  DIRECTION_NORTH_WEST = 8;
}

enum EquipmentSlot {
  EQUIPMENT_SLOT_UNSPECIFIED = 0;
  EQUIPMENT_SLOT_HEAD = 1;
  EQUIPMENT_SLOT_NECK = 2;
  EQUIPMENT_SLOT_BACKPACK = 3;
  EQUIPMENT_SLOT_ARMOR = 4;
  EQUIPMENT_SLOT_RIGHT_HAND = 5;
  EQUIPMENT_SLOT_LEFT_HAND = 6;
  EQUIPMENT_SLOT_LEGS = 7;
  EQUIPMENT_SLOT_FEET = 8;
  EQUIPMENT_SLOT_RING = 9;
  EQUIPMENT_SLOT_AMMO = 10;
}

// ContainerSlot addresses an item inside an open container. container_id is the
// session-local id the server assigned in ContainerOpen.
message ContainerSlot {
  uint32 container_id = 1;
  uint32 index = 2;
}

// ItemLocation says where an item is: on a map tile, in an equipment slot, inside an
// open container or in a cell of the character's pockets.
message ItemLocation {
  oneof location {
    Position pos = 1;
    EquipmentSlot slot = 2;
    ContainerSlot container = 3;
    // pocket is a cell of the character's built-in pockets (docs/02 "Bolsillos"), its
    // index in Inventory.pockets. As a MoveItem destination, a cell holding a container
    // means "into that container", like a container index.
    uint32 pocket = 4;
  }
}

// ActionTarget is what an action points at: a tile or a creature.
message ActionTarget {
  oneof target {
    Position pos = 1;
    uint32 creature_id = 2;
  }
}

// ItemStack is one item instance as the client sees it. item_id is the stable id from
// data/ids.lock.yaml; count is the stack size (or charges) and is 0 when not stackable.
// mods is the instance's own data (docs/02 "Atributos de items"); unset on a plain item.
message ItemStack {
  uint32 item_id = 1;
  uint32 count = 2;
  ItemMods mods = 3;
}

// ItemMods is what makes one item instance different from another of its item_id: the
// one attribute every equipable rolls when it is created (attribute = an id of
// data/attributes.yaml, value its amount; the client shows the attribute's text with
// {value}) and the refine level of the forge (0 = not refined). An item with mods never
// stacks. A client that does not know the attribute shows nothing for it.
//
// The remains a death leaves say whose they are: remains_of is the data/monsters id of the
// creature that fell (the client names them "remains of <monster>" and draws that
// creature's own corpse, docs/05 "Restos"), body_of the name of the player whose body it
// is ("body of <player>"). The server sets them when it makes the remains; a client never
// sends them as a choice, only back as part of the item it means.
message ItemMods {
  string attribute = 1;
  int32 value = 2;
  uint32 refine = 3;
  string remains_of = 4;
  string body_of = 5;
}

// LocalizedText is player-visible text sent as an i18n key plus parameters
// (never as final text). The client translates it with its own locale.
message LocalizedText {
  string key = 1;
  repeated TextParam params = 2;
}

// TextParam is one named parameter of a LocalizedText. A list (not a map) keeps the
// binary encoding deterministic across Go and TypeScript. The value is typed so the
// client can format numbers and plurals and translate names itself: the server never
// puts translated or assembled text in a parameter.
message TextParam {
  string name = 1;
  oneof value {
    // Text that is not translated: player names, typed text.
    string text = 2;
    int64 number = 3;
    // Monster, NPC, spell or skill id from data/; the client shows its translated name.
    string content_id = 4;
    // An item and amount; the client shows its translated name, pluralized.
    ItemStack item = 5;
  }
}

// MarketSide is the side of a market offer (T5.3): SELL offers items for gold, BUY
// offers gold for items. In history entries it is what the character did.
enum MarketSide {
  MARKET_SIDE_UNSPECIFIED = 0;
  MARKET_SIDE_SELL = 1;
  MARKET_SIDE_BUY = 2;
}

// BodyLook is the body of an engine humanoid (docs/02 "Apariencia", docs/06 "Looks"): ids
// of data/looks.yaml. A player chooses it when it creates the character and changes it
// for free with SetLook; an NPC or a humanoid monster has the one of its data (`look`).
// An unknown id is drawn untinted (a skin or a colour) or not at all (a hair or a beard).
message BodyLook {
  // A build of data/looks.yaml `builds` (sturdy, slender).
  string body = 1;
  // A skin tone of `skins`; a player never has a creatures_only one.
  string skin = 2;
  // A hair style of `hair_styles` (bald draws nothing).
  string hair = 3;
  // A hair colour of `hair_colors`: it tints the hair and the beard.
  string hair_color = 4;
  // A beard of `beards` (none draws nothing).
  string beard = 5;
  // A sex of `sexes` (male, female): the body is drawn per sex and build. Empty from an
  // old server: the client draws the male body.
  string sex = 6;
}
