syntax = "proto3";

package game.v1;

import "game/v1/client.proto";
import "game/v1/common.proto";
import "game/v1/livingworld.proto";

option go_package = "github.com/GFenzoR/RPG_Project/server/internal/net/pb/game/v1;gamev1";

// Server → client messages (events).

// ServerBatch is the only thing a server WebSocket frame carries: every event of one
// session in one tick, in order. At most one frame per tick per player; no events, no frame.
message ServerBatch {
  uint64 tick = 1;
  repeated ServerMessage events = 2;
}

message ServerMessage {
  oneof message {
    Welcome welcome = 1;
    FullMapView full_map_view = 2;
    MapSlice map_slice = 3;
    TileUpdate tile_update = 4;
    CreatureAppear creature_appear = 5;
    CreatureDisappear creature_disappear = 6;
    CreatureMove creature_move = 7;
    CreatureTurn creature_turn = 8;
    CreatureHealth creature_health = 9;
    CreatureOutfit creature_outfit = 10;
    CreatureSpeed creature_speed = 11;
    Effect effect = 12;
    Projectile projectile = 13;
    FloatingText floating_text = 14;
    PlayerStats player_stats = 15;
    PlayerSkills player_skills = 16;
    Inventory inventory = 17;
    ContainerOpen container_open = 18;
    ContainerUpdate container_update = 19;
    ContainerClose container_close = 20;
    Message chat_message = 21;
    DialogOpen dialog_open = 22;
    DialogClose dialog_close = 23;
    ShopOpen shop_open = 24;
    TradeUpdate trade_update = 25;
    WalkRejected walk_rejected = 26;
    Pong pong = 27;
    Disconnect disconnect = 28;
    SpellCooldown spell_cooldown = 29;
    PlayerConditions player_conditions = 30;
    PartyUpdate party_update = 31;
    PartyInvitation party_invitation = 32;
    StationOpen station_open = 33;
    PresenceCheck presence_check = 34;
    TutorialStep tutorial_step = 35;
    GuildUpdate guild_update = 36;
    CreatureGuild creature_guild = 37;
    CreatureSkull creature_skull = 38;
    MarketUpdate market_update = 39;
    HouseUpdate house_update = 40;
    CreatureCosmetics creature_cosmetics = 41;
    CosmeticsState cosmetics_state = 42;
    CreatureAttack creature_attack = 43;
    RefineResult refine_result = 44;
    QuestLog quest_log = 45;
    CreatureLook creature_look = 46;
    StashUpdate stash_update = 47;
    LivingObjectEvent living_object = 48;
    TrailWear trail_wear = 49;
    MinimapIndex minimap_index = 50;
    MinimapSectors minimap_sectors = 51;
    ObjectiveHint objective_hint = 52;
    WorldClock world_clock = 53;
  }
}

// TutorialState is where the character is in the tutorial (T4.2).
enum TutorialState {
  TUTORIAL_STATE_UNSPECIFIED = 0;
  // ACTIVE: step_id is the current step; the client shows the hint.
  TUTORIAL_STATE_ACTIVE = 1;
  // DONE: the last step completed (the reward, if any, came as system messages).
  TUTORIAL_STATE_DONE = 2;
  // SKIPPED: the player skipped it (TutorialSkip). It never comes back.
  TUTORIAL_STATE_SKIPPED = 3;
}

// TutorialStep is the tutorial's current step (T4.2, data/tutorial.yaml). It is sent on
// login while the tutorial is active, whenever the step or its progress changes, and once
// with DONE or SKIPPED when it ends. Only the server completes steps: they advance with
// the server's own events (walking, killing, talking...), never with a client message.
message TutorialStep {
  TutorialState state = 1;
  // Step id from data/tutorial.yaml; empty unless ACTIVE.
  string step_id = 2;
  // 0-based position of the step and number of steps, counting only the steps of the
  // character's vocation (for "2 / 7").
  uint32 index = 3;
  uint32 total = 4;
  // The hint, with parameter count (the step's target count).
  LocalizedText text = 5;
  // UI element to highlight (the client's data-tutorial attribute); empty for none.
  string highlight = 6;
  // Events counted toward the step so far, and how many it needs.
  uint32 progress = 7;
  uint32 count = 8;
}

// PresenceCheck asks the player a simple question with options (T4.1, bot detection):
// it is answered with PresenceAnswer{check_id, option_id} within timeout_ms. It is never
// asked in combat or on a no-logout tile and does not block the game. Whatever the answer,
// the server replies with the same system message (presence.thanks), so the check says
// nothing about whether the answer was right.
message PresenceCheck {
  uint32 check_id = 1;
  LocalizedText question = 2;
  repeated DialogOption options = 3;
  uint32 timeout_ms = 4;
}

// Welcome answers a valid Hello. It is followed in the same batch by FullMapView,
// PlayerStats, Inventory and PlayerSkills.
message Welcome {
  // Creature id of the player's own character in this session (the id used by
  // CreatureMove, SetTarget and the rest). It is not the database character id.
  uint32 creature_id = 1;
  // Server clock in Unix milliseconds.
  uint64 server_time = 2;
  uint32 tick_ms = 3;
  // How many keyboard steps (Walk) may wait in the player's queue (balance.yaml
  // movement.max_queued_steps): the client predicts no more ahead (docs/05 "Caminar").
  uint32 max_queued_steps = 4;
  // The window of tiles the server keeps the client up to date with, centred on the
  // player, without the margin of one tile on every side that FullMapView and MapSlice
  // also carry (docs/05 "Formato de mapa"): 31x21. The client draws at most this much.
  // 0 = a server from before the wide view: 15x11.
  uint32 view_width = 5;
  uint32 view_height = 6;
  // The server says who attacks whom (CreatureAttack) and why a creature leaves the view
  // (CreatureDisappear.reason), docs/05 "Quién ataca y por qué sale una criatura". false =
  // a server from before them: the client works both out from what it sees.
  bool attack_events = 7;
  // The character's saved game options, the ones in force from this moment (docs/05
  // "Opciones guardadas"): the client shows them and does not send them again. Unset = a
  // server from before they were saved (balanced, not chasing, safe mode on).
  GameOptions options = 8;
}

// GameOptions are the game options a character keeps between logins: the server saves
// what SetFightMode and SetSafeMode last set and gives it back in the Welcome.
message GameOptions {
  FightStance stance = 1;
  bool chase = 2;
  bool safe_mode = 3;
}

// ---- map --------------------------------------------------------------------

// Tile is the item stack of one map tile, bottom (ground) first.
message Tile {
  repeated ItemStack items = 1;
}

// MapFloor holds one floor of a MapArea as width*height indices into the area palette,
// row by row (y, then x). -1 means no tile.
message MapFloor {
  uint32 z = 1;
  repeated sint32 tiles = 2;
}

// MapArea is a rectangle of the map, palette-compressed: identical tiles are sent once.
message MapArea {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  repeated Tile palette = 5;
  repeated MapFloor floors = 6;
  // Creatures standing inside the area.
  repeated Creature creatures = 7;
  // Trail wear of the area's tiles on the player's own floor, if any (livingworld.proto
  // TrailWear): its deltas reach only the players on the tile's floor.
  repeated TrailWear wear = 8;
}

// FullMapView is the whole visible area, sent on login and after a teleport. walk_epoch
// is the walk epoch from now on (see Walk): a teleport drops the step queue too.
message FullMapView {
  MapArea area = 1;
  uint32 walk_epoch = 2;
}

// MapSlice is the new row or column (on every visible floor) after a step.
message MapSlice {
  MapArea area = 1;
}

message TileUpdate {
  Position pos = 1;
  Tile tile = 2;
}

// ---- creatures --------------------------------------------------------------

enum CreatureKind {
  CREATURE_KIND_UNSPECIFIED = 0;
  CREATURE_KIND_PLAYER = 1;
  CREATURE_KIND_MONSTER = 2;
  CREATURE_KIND_NPC = 3;
}

message Outfit {
  uint32 look_id = 1;
  uint32 head_color = 2;
  uint32 body_color = 3;
  uint32 legs_color = 4;
  uint32 feet_color = 5;
}

message Creature {
  uint32 id = 1;
  CreatureKind kind = 2;
  // Player name as typed by its owner. Empty for monsters and NPCs.
  string name = 3;
  // Monster or NPC id from data/ (the client resolves its translated name). Empty for players.
  string content_id = 4;
  Position pos = 5;
  Direction dir = 6;
  uint32 health_percent = 7;
  Outfit outfit = 8;
  uint32 speed = 9;
  // Players: the name of its guild, empty if none (T5.1). CreatureGuild changes it.
  string guild = 10;
  // Players: its PvP mark (T5.2). CreatureSkull changes it.
  Skull skull = 11;
  // Players: the equipped cosmetics (T5.7); unset or empty fields = default look.
  // CreatureCosmetics changes them.
  Cosmetics cosmetics = 12;
  // The body of an engine humanoid (docs/02 "Apariencia"): a player's own, an NPC's or a
  // humanoid monster's of its data. Unset: not a humanoid (a beast), or a server without
  // data/looks.yaml. CreatureLook changes a player's.
  BodyLook look = 13;
  // Players: what they show they wear (docs/05 "Apariencia y equipo visible"). Unset: the
  // player wears nothing that shows. CreatureLook changes it.
  VisibleEquipment equipment = 14;
  // NPCs and humanoid monsters: the pieces they wear, of their data (`look.worn`), which
  // are no items. Unset for players (their pieces are items: equipment).
  Worn worn = 15;
}

// VisibleEquipment is what a player shows it wears (docs/05 "Apariencia y equipo
// visible"): the numeric item id (data/ids.lock.yaml) of each equipment slot that shows
// on the figure, 0 = empty. The client draws each item's `worn` piece (data/items). Never
// the amulet, the ring, the backpack nor the ammo, nor anything inside a container.
message VisibleEquipment {
  uint32 head = 1;
  uint32 torso = 2;
  uint32 legs = 3;
  uint32 feet = 4;
  uint32 left_hand = 5;
  uint32 right_hand = 6;
}

// WornPiece is a piece an NPC or a humanoid monster wears that is no item: a shape and a
// tint of data/looks.yaml (`shapes`, `tints`), as in data/npcs and data/monsters
// `look.worn`.
message WornPiece {
  string shape = 1;
  string tint = 2;
}

// Worn is what an NPC or a humanoid monster wears, per slot of the figure; unset = nothing.
message Worn {
  WornPiece head = 1;
  WornPiece torso = 2;
  WornPiece legs = 3;
  WornPiece feet = 4;
  WornPiece shield = 5;
  WornPiece weapon = 6;
}

// CreatureLook tells the clients that know player id (the player included) that its body
// or what it shows it wears changed: after a SetLook, and whenever an item comes into or
// leaves one of its visible slots (equipping, taking off, an item that breaks at the forge,
// what falls at a death). Both fields are the whole new state, like Creature's.
message CreatureLook {
  uint32 id = 1;
  BodyLook look = 2;
  VisibleEquipment equipment = 3;
}

// Cosmetics are the equipped cosmetics of a player (T5.7): content ids of
// data/cosmetics.yaml, one per kind. Empty = the default look of that kind. Purely
// visual: no game rule ever reads them.
message Cosmetics {
  // kind outfit: replaces the default outfit sprite.
  string outfit = 1;
  // kind outfit_color: a tint drawn over the outfit.
  string color = 2;
  // kind name_effect: a style drawn around the name label.
  string name_effect = 3;
}

// CreatureCosmetics tells the clients that see player id (the player included) that its
// equipped cosmetics changed.
message CreatureCosmetics {
  uint32 id = 1;
  Cosmetics cosmetics = 2;
}

// CosmeticsState is the player's own shop state (T5.7): sent on login (after
// PlayerSkills), after every EquipCosmetic/UnequipCosmetic, and whenever the account's
// balance or cosmetics change outside the game (a purchase on the website, a payment, a
// refund or a staff grant) while one of its characters is online.
message CosmeticsState {
  // Cosmetic ids the account owns (sorted).
  repeated string owned = 1;
  // Premium currency balance of the account.
  int64 balance = 2;
  // What this character has equipped (same as its Creature.cosmetics).
  Cosmetics equipped = 3;
}

// Skull is a player's PvP mark (T5.2, docs/02 "PvP"). Attacking a marked player is
// justified.
enum Skull {
  // No mark.
  SKULL_UNSPECIFIED = 0;
  // Attacked a player without a mark: lasts balance pvp.aggressor_ms after the last
  // unjustified attack.
  SKULL_AGGRESSOR = 1;
  // Reached a murderer threshold of unjustified kills (balance pvp.murderer).
  SKULL_MURDERER = 2;
  // Reached an outlaw threshold (balance pvp.outlaw): the gravest mark.
  SKULL_OUTLAW = 3;
}

// CreatureSkull tells the clients that see player id (the player included) that its
// skull changed.
message CreatureSkull {
  uint32 id = 1;
  Skull skull = 2;
}

message CreatureAppear {
  Creature creature = 1;
}

// CreatureDisappear: the client stops knowing creature id. reason says why, as far as
// the viewer may know (docs/05 "Quién ataca y por qué sale una criatura").
message CreatureDisappear {
  uint32 id = 1;
  DisappearReason reason = 2;
}

// DisappearReason is why a creature left a client's view.
enum DisappearReason {
  // A server from before the reasons (Welcome.attack_events false).
  DISAPPEAR_REASON_UNSPECIFIED = 0;
  // It walked out of the window, or the viewer walked or was moved away from it.
  DISAPPEAR_REASON_OUT_OF_VIEW = 1;
  // It died where it stood (a player wakes up at its temple, CreatureAppear there).
  DISAPPEAR_REASON_DEATH = 2;
  // The server took it out of the world without a death (a monster or an NPC).
  DISAPPEAR_REASON_DESPAWN = 3;
  // It left its tile without walking or dying: a portal (stairs, a hole, a teleporter,
  // a ladder, a rope spot), a boat, a staff /tp, an NPC's teleport, a house expulsion. A
  // player that turns invisible gets this one too: to the viewer it is gone, and nothing
  // says it still stands there.
  DISAPPEAR_REASON_TELEPORT = 4;
  // The player left the game: logout, a kick or a ban, idle, a dropped connection, a
  // login elsewhere.
  DISAPPEAR_REASON_LOGOUT = 5;
}

// CreatureMove is one step. walk_seq, only in the mover's own copy, is the seq of the Walk
// this step executes (docs/05 "Caminar"); 0 for a step of a WalkPath or a chase, or of a
// Walk without one.
message CreatureMove {
  uint32 id = 1;
  Position from = 2;
  Position to = 3;
  uint32 duration_ms = 4;
  uint32 walk_seq = 5;
}

message CreatureTurn {
  uint32 id = 1;
  Direction dir = 2;
}

message CreatureHealth {
  uint32 id = 1;
  uint32 health_percent = 2;
}

message CreatureOutfit {
  uint32 id = 1;
  Outfit outfit = 2;
}

message CreatureSpeed {
  uint32 id = 1;
  uint32 speed = 2;
}

// ---- effects ----------------------------------------------------------------

message Effect {
  Position pos = 1;
  uint32 effect_id = 2;
}

message Projectile {
  Position from = 1;
  Position to = 2;
  uint32 projectile_id = 3;
}

// AttackKind is what an attack looks like (docs/17 ANI-2: the clip the attacker plays).
enum AttackKind {
  ATTACK_KIND_UNSPECIFIED = 0;
  // A blow at an adjacent creature: a weapon, fists, a monster's melee attack.
  ATTACK_KIND_MELEE = 1;
  // A shot: a distance weapon, a wand, a monster's distance attack.
  ATTACK_KIND_RANGED = 2;
  // A spell or a rune at a creature (a monster's spell too), or an area spell around the
  // caster (radius > 0).
  ATTACK_KIND_SPELL = 3;
}

// CreatureAttack tells a client that creature id attacked (docs/05 "Quién ataca y por qué
// sale una criatura"). It goes only to clients that know the attacker, in the batch of the
// attack, before its Projectile, Effect and FloatingText. Never about a target the client
// must not see: an attack on an invisible player reaches only who sees that player.
message CreatureAttack {
  uint32 id = 1;
  AttackKind kind = 2;
  // The creature attacked, if the client knows it; 0 for an area spell or a target out of
  // the client's window.
  uint32 target_id = 3;
  // Where the attack goes: the target's tile; for a target out of the window, the edge of
  // the window on its side, in line with the attacker (as in Projectile); for an area
  // spell, its centre.
  Position to = 4;
  // An area spell: the radius around `to` (docs/02 "Magia"); 0 for an attack on one target.
  uint32 radius = 5;
}

// PlayerConditions is the full list of the player's own active conditions (T3.2): sent
// after login and whenever one starts, changes or ends (an empty list = none). Other
// creatures' conditions are never sent; observers only see their effects (speed,
// periodic damage, an invisible player's CreatureDisappear). After the conditions come
// the statuses (docs/05 "Condiciones"), with ids that are not balance.yaml's: in_combat
// (the logout block), pvp_locked (an attacker's PvP lock) and protection_zone (standing
// in one; remaining_ms 0 = no end).
message PlayerConditions {
  repeated ActiveCondition conditions = 1;
}

message ActiveCondition {
  // Id of balance.yaml conditions (poison, hasted...) or of a status (in_combat,
  // pvp_locked, protection_zone).
  string condition_id = 1;
  // Time left: until it ends, or for a damage condition its hits left × its interval; 0
  // for a status with no end (protection_zone).
  uint32 remaining_ms = 2;
  // Hits left of a damage condition (0 for the others).
  uint32 ticks = 3;
}

// SpellCooldown tells the caster that it cast spell_id (or used a rune of it): that
// spell cannot be cast again for cooldown_ms, and no spell of group for
// group_cooldown_ms. Both are already rounded to ticks.
message SpellCooldown {
  string spell_id = 1;
  uint32 cooldown_ms = 2;
  // attack, healing or support (data/spells.yaml).
  string group = 3;
  uint32 group_cooldown_ms = 4;
}

enum FloatingTextKind {
  FLOATING_TEXT_KIND_UNSPECIFIED = 0;
  FLOATING_TEXT_KIND_DAMAGE = 1;
  FLOATING_TEXT_KIND_HEAL = 2;
  FLOATING_TEXT_KIND_MANA = 3;
  FLOATING_TEXT_KIND_EXPERIENCE = 4;
}

message FloatingText {
  Position pos = 1;
  FloatingTextKind kind = 2;
  uint64 amount = 3;
  // EXPERIENCE only: the part of amount that is a party's shared experience bonus
  // (docs/02 "Grupos"). Sent to the player that earned it and to its party's members;
  // 0 for anyone else and for experience without a bonus.
  uint64 bonus = 4;
}

// ---- player -----------------------------------------------------------------

message PlayerStats {
  uint32 health = 1;
  uint32 max_health = 2;
  uint32 mana = 3;
  uint32 max_mana = 4;
  uint32 level = 5;
  uint64 experience = 6;
  // Progress to the next level, 0-99.
  uint32 level_percent = 7;
  // Free and total carrying capacity, in the same unit as item weights in data/.
  uint32 capacity = 8;
  uint32 max_capacity = 9;
  uint32 speed = 10;
  uint32 soul = 11;
}

// SkillProgress is one skill or craft. skill_id is the id from data/ (e.g. "sword",
// "fishing", "mining"), so new skills need no protocol change.
message SkillProgress {
  string skill_id = 1;
  uint32 level = 2;
  // Progress to the next level, 0-99.
  uint32 percent = 3;
}

message PlayerSkills {
  repeated SkillProgress skills = 1;
}

message EquippedItem {
  EquipmentSlot slot = 1;
  ItemStack item = 2;
}

// Inventory lists the occupied equipment slots; slots not listed are empty. pockets is
// what the character's built-in pockets hold (docs/02 "Bolsillos"), cell 0 first and
// without gaps (like ContainerUpdate.items); pocket_slots is how many cells they have
// (balance.yaml inventory.pocket_slots). The pockets are part of the character, never an
// item: they are not a container window and cannot be moved.
message Inventory {
  repeated EquippedItem slots = 1;
  repeated ItemStack pockets = 2;
  uint32 pocket_slots = 3;
}

// ContainerOpen opens a container window. container_id is session-local and is what
// ContainerSlot and the other container messages refer to.
message ContainerOpen {
  uint32 container_id = 1;
  uint32 item_id = 2;
  uint32 capacity = 3;
  repeated ItemStack items = 4;
  bool has_parent = 5;
  // The container's own instance data (ItemMods): the remains of a monster or a player's
  // body name the window after whose they are. Absent for a plain container.
  ItemMods mods = 6;
}

// ContainerUpdate replaces the contents of an open container.
message ContainerUpdate {
  uint32 container_id = 1;
  repeated ItemStack items = 2;
}

message ContainerClose {
  uint32 container_id = 1;
}

// ---- chat and NPCs ----------------------------------------------------------

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_SAY = 1;
  MESSAGE_KIND_YELL = 2;
  MESSAGE_KIND_WHISPER = 3;
  MESSAGE_KIND_GLOBAL = 4;
  MESSAGE_KIND_NPC = 5;
  // System messages: status line, warnings, loot, look results.
  MESSAGE_KIND_SYSTEM = 6;
  // A staff announcement to everyone online (T2.6): the staff member's text travels as
  // is in Message.text and the client adds a translated label.
  MESSAGE_KIND_BROADCAST = 7;
  // Party chat (T3.3): sent to every member, without pos.
  MESSAGE_KIND_PARTY = 8;
  // Guild chat (T5.1): sent to every online member, without pos.
  MESSAGE_KIND_GUILD = 9;
}

// Message is chat or a system message. Player-typed chat travels as plain text;
// anything the server writes travels as a LocalizedText.
message Message {
  MessageKind kind = 1;
  // Speaking creature, 0 for system messages.
  uint32 speaker_id = 2;
  // Name of a speaking player. Empty for NPCs and monsters, which use speaker_content_id.
  string speaker_name = 3;
  // Monster or NPC id from data/ (the client shows its translated name).
  string speaker_content_id = 4;
  // Where it was said, for speech bubbles. Unset for global and system messages.
  Position pos = 5;
  oneof body {
    string text = 6;
    LocalizedText localized = 7;
  }
}

message DialogOption {
  uint32 option_id = 1;
  LocalizedText text = 2;
}

// DialogOpen shows (or advances) an NPC dialog. dialog_id is session-local.
message DialogOpen {
  uint32 dialog_id = 1;
  uint32 npc_creature_id = 2;
  LocalizedText text = 3;
  repeated DialogOption options = 4;
}

message DialogClose {
  uint32 dialog_id = 1;
}

// ShopOffer is one line of an NPC shop. A price of 0 means the NPC does not buy
// (sell_price) or sell (buy_price) that item.
message ShopOffer {
  uint32 item_id = 1;
  uint64 buy_price = 2;
  uint64 sell_price = 3;
  // How many units of the item the player carries (equipment and every container).
  uint32 owned = 4;
}

// ShopOpen opens (or refreshes, after each purchase or sale) the shop of the NPC of
// dialog dialog_id. The shop closes with that dialog's DialogClose.
message ShopOpen {
  uint32 npc_creature_id = 1;
  repeated ShopOffer offers = 2;
  uint32 dialog_id = 3;
  // Money the player carries, in the smallest coin.
  uint64 money = 4;
}

enum TradeState {
  TRADE_STATE_UNSPECIFIED = 0;
  // An invitation is pending: sent by this player, or received (invited = true).
  TRADE_STATE_REQUESTED = 1;
  TRADE_STATE_NEGOTIATING = 2;
  TRADE_STATE_COMPLETED = 3;
  TRADE_STATE_CANCELLED = 4;
}

// TradeUpdate is the state of the trade window (T5.3). It is sent to both players after
// every change; COMPLETED and CANCELLED close it (reason says why it was cancelled).
message TradeUpdate {
  TradeState state = 1;
  uint32 partner_creature_id = 2;
  string partner_name = 3;
  // Offered items, one per offered stack or container, in offer order.
  repeated ItemStack own_offer = 4;
  repeated ItemStack partner_offer = 5;
  bool own_accepted = 6;
  bool partner_accepted = 7;
  // REQUESTED: this player received the invitation (it may accept or decline).
  bool invited = 8;
  // CANCELLED: i18n key of the reason (trade.cancel.*), empty when a player closed it.
  string reason = 9;
  // How many items each side may offer.
  uint32 max_items = 10;
}

// MarketOffer is one offer of the global market (T5.3). price is per unit, in the
// smallest coin; expires_at is Unix milliseconds.
message MarketOffer {
  uint64 offer_id = 1;
  MarketSide side = 2;
  uint32 item_id = 3;
  uint32 amount = 4;
  uint64 price = 5;
  uint64 expires_at = 6;
  string owner_name = 7;
  bool own = 8;
  // A sell offer of an equipable is one instance: its attribute (each such offer is a row
  // of its own). Unset on a buy offer, which any instance fills.
  ItemMods mods = 9;
}

// MarketMailItem is an item waiting in the mailbox.
message MarketMailItem {
  uint64 id = 1;
  ItemStack item = 2;
}

// MarketHistoryEntry is one own operation: side SELL = sold, BUY = bought.
message MarketHistoryEntry {
  MarketSide side = 1;
  uint32 item_id = 2;
  uint32 amount = 3;
  uint64 price = 4;
  uint64 at = 5;
}

// MarketUpdate opens or refreshes the market window (T5.3); open = false closes it (the
// player walked away from the board). Lists are bounded by data/balance.yaml market.
message MarketUpdate {
  bool open = 1;
  // Money the player carries, in the smallest coin.
  uint64 money = 2;
  // The browsed item (0: none), its best offers per side and its reference price
  // (the median of the recent votes, one per seller account and day; 0 = none, too few
  // votes or sellers: balance market.reference_min_votes / reference_min_sellers). The
  // best offers: list_size per side, in price order; the sells of an equipable add the
  // cheapest of every other kind of piece (attribute and refine level, docs/02).
  uint32 item_id = 3;
  repeated MarketOffer sells = 4;
  repeated MarketOffer buys = 5;
  uint64 reference_price = 6;
  // The player's own active offers.
  repeated MarketOffer own = 7;
  uint64 mailbox_gold = 8;
  repeated MarketMailItem mailbox_items = 9;
  // Items in the mailbox beyond mailbox_items.
  uint32 mailbox_more = 10;
  repeated MarketHistoryEntry history = 11;
  // Rules for the create form: fee in thousandths clamped to fee_min..fee_max, limits.
  uint32 fee_permille = 12;
  uint64 fee_min = 13;
  uint64 fee_max = 14;
  uint32 max_offers = 15;
  uint32 max_amount = 16;
  uint64 max_price = 17;
  repeated uint32 durations_hours = 18;
  // Units of the browsed item the player could put on sale (in the backpack).
  uint32 owned = 19;
  // The market is read-only until the server restarts (a change could not be saved): it
  // can be browsed, but nothing is created, accepted, cancelled or withdrawn.
  bool read_only = 20;
  // Sent by the server on its own, not as the answer to a MarketCommand: something else
  // changed what the open window shows (another player's action on the browsed item's
  // offers, on the player's own offers or on its mailbox; a ban or unban that hides or
  // shows offers; a completed trade that changed the player's money and items; a house
  // rent, transfer or release that changed its mailbox; the market turning read-only).
  // At most one per window every market.push_every_ms of data/balance.yaml (500 ms; the
  // switch to read-only goes out at once). A client whose window is already closed
  // ignores it (it must not open the window again).
  bool refresh = 21;
  // For an equipable browsed item: the mods of each instance counted in owned (one entry
  // per instance, the lowest refine level and then the weakest roll first), so the player
  // picks which one to sell (MarketCreate.mods, MarketAccept.mods).
  repeated ItemMods owned_mods = 22;
}

// HouseUpdate opens or refreshes the house window (T5.4); open = false closes it (the
// player walked away from the door). Owner-only fields are empty for anyone else.
message HouseUpdate {
  bool open = 1;
  // House id (world/islands/<island>/houses.yaml), its name (i18n key) and island (town).
  string house_id = 2;
  string name = 3;
  string island = 4;
  // Rent of one period (smallest coin) and its length in days.
  uint64 rent = 5;
  uint32 period_days = 6;
  // Size in tiles.
  uint32 size = 7;
  // Owner's name; empty when the house is free.
  string owner = 8;
  bool is_owner = 9;
  // Unix milliseconds the rent is paid until (owner only).
  uint64 paid_until = 10;
  // Guests by name and whether the owner's guild may enter (owner only).
  repeated string guests = 11;
  bool guild_access = 12;
  uint32 max_guests = 13;
  // Items in the house and the limit.
  uint32 items = 14;
  uint32 max_items = 15;
  // Minimum level to rent and how many periods may be paid ahead.
  uint32 min_level = 16;
  uint32 max_periods = 17;
  // Pending transfer: to whom (owner sees it) and the price; for_me: offered to this
  // player, who may accept it.
  string transfer_to = 18;
  uint64 transfer_price = 19;
  bool transfer_for_me = 20;
  // Money the player carries, in the smallest coin.
  uint64 money = 21;
  // Houses are read-only until the server restarts (a change could not be saved).
  bool read_only = 22;
  // The player may enter (owner, guest or guild member).
  bool access = 23;
  // The player stands inside the house.
  bool inside = 24;
}

// ---- movement and connection ------------------------------------------------

// WalkRejected tells the client its predicted steps failed; it snaps back to pos. The
// server dropped its step queue and starts walk_epoch: Walks of an older epoch (sent
// before the client heard of this) are dropped.
message WalkRejected {
  Position pos = 1;
  Direction dir = 2;
  uint32 walk_epoch = 3;
}

message Pong {
  uint64 client_time = 1;
  // Server clock in Unix milliseconds.
  uint64 server_time = 2;
}

enum DisconnectReason {
  DISCONNECT_REASON_UNSPECIFIED = 0;
  DISCONNECT_REASON_OUTDATED_CLIENT = 1;
  DISCONNECT_REASON_INVALID_SESSION = 2;
  DISCONNECT_REASON_LOGGED_OUT = 3;
  DISCONNECT_REASON_LOGGED_IN_ELSEWHERE = 4;
  DISCONNECT_REASON_RATE_LIMITED = 5;
  // The client did not read fast enough and its outgoing queue filled up.
  DISCONNECT_REASON_SLOW_CLIENT = 6;
  DISCONNECT_REASON_SERVER_SHUTDOWN = 7;
  // Kicked by a staff member, or the client broke the protocol.
  DISCONNECT_REASON_KICKED = 8;
  // The account was banned by a staff member (T2.6).
  DISCONNECT_REASON_BANNED = 9;
  // No real action (walk, attack, use, talk) for balance idle.kick_after_ms (T4.1).
  DISCONNECT_REASON_IDLE = 10;
  // The account's password was reset: every session of the account ends (T2.1).
  DISCONNECT_REASON_PASSWORD_CHANGED = 11;
  // A trade or market change of the character could not be saved (T5.3): it leaves the
  // world so it does not keep playing on a state the database will not have.
  DISCONNECT_REASON_SAVE_FAILED = 12;
  // Login refused: the character's last trade or market change could not be saved; it
  // can play again after the server restarts (T5.3).
  DISCONNECT_REASON_CHARACTER_LOCKED = 13;
  // Login refused: the server has as many players as it allows (gateway MaxPlayers),
  // or too many logins are being checked at once. Try again in a few minutes.
  DISCONNECT_REASON_SERVER_FULL = 14;
  // Login refused: the account already has as many characters online as it may
  // (session MaxCharactersPerAccount). Logging in the same character again still works.
  DISCONNECT_REASON_TOO_MANY_CHARACTERS = 15;
  // The account used "sign out everywhere" (lote 17): every session of the account
  // ended, the game ones too. Sign in again.
  DISCONNECT_REASON_SIGNED_OUT_EVERYWHERE = 16;
}

message Disconnect {
  DisconnectReason reason = 1;
  // Optional extra explanation for the player.
  LocalizedText message = 2;
}

// ---- parties (T3.3) ------------------------------------------------------------

// SharedExperience is the state of a party's shared experience as its members see it.
enum SharedExperience {
  SHARED_EXPERIENCE_UNSPECIFIED = 0;
  // The leader has it turned off: every kill pays by damage, as without a party.
  SHARED_EXPERIENCE_OFF = 1;
  // On, and at least two members qualify right now (contributed recently and are within
  // the level range of the highest of them): kills near them are shared.
  SHARED_EXPERIENCE_ACTIVE = 2;
  // On, but fewer than two members qualify: kills pay by damage.
  SHARED_EXPERIENCE_INACTIVE = 3;
}

// PartyUpdate is the full state of the player's party: sent when it changes (members,
// leader, shared experience) and at most once per balance.yaml party.update_ms while
// what a member sees of the others changes. An update with no members means the player
// is not in a party any more.
message PartyUpdate {
  uint32 leader_id = 1;
  SharedExperience shared = 2;
  // Every member, the player included, in the order they joined.
  repeated PartyMember members = 3;
  // The shared experience bonus % the sharers get right now (balance.yaml
  // party.bonus_pct_by_sharers for the members with sharing set): 0 unless shared is
  // ACTIVE.
  uint32 bonus_percent = 4;
}

// PartyMember is what one member sees of another. Information audit (T3.3,
// docs/01-architecture.md "Trampas y anti-bot"): health and mana travel only while the
// viewer sees that member (in_view); a member out of view carries only its island (no
// position, floor, health or mana).
message PartyMember {
  uint32 creature_id = 1;
  string name = 2;
  // Vocation id of data/vocations.yaml.
  string vocation = 3;
  uint32 level = 4;
  bool in_view = 5;
  // 0 when not in_view.
  uint32 health_percent = 6;
  uint32 mana_percent = 7;
  // Island id of world/world.yaml where the member is (empty in the open sea).
  string island = 8;
  // The member qualifies for shared experience right now (see SharedExperience).
  bool sharing = 9;
}

// PartyInvitation tells a player that inviter_id invited it to a party. It can answer
// with PartyCommand ACCEPT or DECLINE until expires_ms have passed.
message PartyInvitation {
  uint32 inviter_id = 1;
  string inviter_name = 2;
  uint32 expires_ms = 3;
}

// GuildRank is a member's rank (T5.1).
enum GuildRank {
  GUILD_RANK_UNSPECIFIED = 0;
  GUILD_RANK_MEMBER = 1;
  GUILD_RANK_VICE = 2;
  GUILD_RANK_LEADER = 3;
}

// GuildUpdate is the full guild state of the player (T5.1): sent at login and whenever
// its guild changes (members, ranks, who is online, message of the day, invitations) or
// it is invited. guild_id 0 means it is in no guild. Information audit: of the other
// members only name, rank and online travel (never position or level).
message GuildUpdate {
  uint64 guild_id = 1;
  string name = 2;
  string motd = 3;
  GuildRank rank = 4;
  // Highest rank first, then by when they joined. The player is among them.
  repeated GuildMember members = 5;
  // Invitations the guild sent and nobody answered yet; only for vice leaders and the
  // leader (who can revoke them).
  repeated GuildPendingInvite pending = 6;
  // Invitations to the player, oldest first. Always empty for a guild member: a member
  // cannot be invited, and joining or founding a guild drops its invitations.
  repeated GuildInvitation invitations = 7;
  // The guild's wars (T5.2): declared and not answered yet, and active ones. Ended wars
  // are not listed (a system Message tells their result).
  repeated GuildWar wars = 8;
}

enum GuildWarState {
  GUILD_WAR_STATE_UNSPECIFIED = 0;
  // Declared, waiting for the other leader. declared_by_us tells who declared it.
  GUILD_WAR_STATE_PENDING = 1;
  GUILD_WAR_STATE_ACTIVE = 2;
}

message GuildWar {
  uint64 war_id = 1;
  string enemy_name = 2;
  GuildWarState state = 3;
  bool declared_by_us = 4;
  // Kills of each side since the war started (active only).
  uint32 our_kills = 5;
  uint32 their_kills = 6;
  // The kills that win the war (balance pvp.war.kill_limit).
  uint32 kill_limit = 7;
  // Pending: how long until the declaration expires. Active: until the war ends.
  uint32 ends_ms = 8;
}

message GuildMember {
  string name = 1;
  GuildRank rank = 2;
  bool online = 3;
}

message GuildPendingInvite {
  string name = 1;
  // How long until it expires.
  uint32 expires_ms = 2;
}

message GuildInvitation {
  uint64 guild_id = 1;
  string guild_name = 2;
  uint32 expires_ms = 3;
}

// CreatureGuild tells the clients that see player id that its guild changed (joined,
// left, renamed, disbanded). guild is the new name, empty for none.
message CreatureGuild {
  uint32 id = 1;
  string guild = 2;
}

// StationOpen answers a UseItem on a crafting station within reach (T3.4), and comes
// again after every Craft at it: the client shows the recipes of data/recipes.yaml whose
// station is item_id and sends Craft with pos. owned is how many units of each input of
// those recipes the player carries in its containers, and tools the tool.use of every
// tool it carries. Nothing is sent when the player walks away: Craft is checked again.
// At the forge's station (the anvil, docs/02 "Forja") owned also counts the temper stones
// and the protection material, and money is the money the player carries (smallest
// coin) for the cost of a Refine; it comes again after every Refine.
message StationOpen {
  Position pos = 1;
  uint32 item_id = 2;
  repeated ItemStack owned = 3;
  repeated string tools = 4;
  uint64 money = 5;
}

// RefineOutcome is how a forge attempt ended (docs/02 "Forja").
enum RefineOutcome {
  REFINE_OUTCOME_UNSPECIFIED = 0;
  // The item went up one level.
  REFINE_OUTCOME_SUCCESS = 1;
  // It failed and the item broke: it is gone.
  REFINE_OUTCOME_BROKEN = 2;
  // It failed, the protection material held: the item lost one level instead.
  REFINE_OUTCOME_PROTECTED = 3;
}

// RefineResult answers a Refine that happened: what was spent is gone whatever the
// outcome. item is the instance after it (item_id and mods, the new refine level; only
// item_id when it broke: text names the piece as it was) and level its refine level now (0
// when it broke). text is the message to
// show (refine.success, refine.broken, refine.protected), also in the log. Everyone who sees
// the anvil gets an Effect on it: 8 sparks on a success, 9 a shatter otherwise.
message RefineResult {
  RefineOutcome outcome = 1;
  ItemStack item = 2;
  uint32 level = 3;
  LocalizedText text = 4;
}

// QuestLogState is where the character is in one quest of its quest log.
enum QuestLogState {
  QUEST_LOG_STATE_UNSPECIFIED = 0;
  // ACTIVE: in progress; step_id is the current step.
  QUEST_LOG_STATE_ACTIVE = 1;
  // DONE: completed. A repeatable quest past its cooldown can be taken again.
  QUEST_LOG_STATE_DONE = 2;
  // COOLING: a repeatable quest done that cannot be taken again until available_at.
  QUEST_LOG_STATE_COOLING = 3;
  // OPEN: a milestone quest not started yet, listed with its requirements (docs/02
  // "Quests de hito").
  QUEST_LOG_STATE_OPEN = 4;
}

// QuestLog is the character's quest log (docs/05 "Diario de misiones"): one entry per
// quest it has started or completed, in quest id order, then every milestone quest it has
// not started (OPEN). It comes in full at login (empty
// too) and in the tick of every change of a quest (started, a step done, a kill counted,
// completed). Nothing comes when a cooldown ends: the client compares available_at with
// the server clock (Welcome.server_time).
message QuestLog {
  repeated QuestLogEntry entries = 1;
}

// QuestLogEntry is one quest of the QuestLog.
message QuestLogEntry {
  // data/quests id.
  string quest_id = 1;
  // i18n key of the quest's name.
  string name = 2;
  // The main line's chapter; 0 for a side quest or a task.
  uint32 chapter = 3;
  QuestLogState state = 4;
  // ACTIVE: the current step's id and the i18n key of its text.
  string step_id = 5;
  string step_text = 6;
  // ACTIVE on a kill step: the kills counted since the step began and the kills it needs
  // (kills_needed 0: not a kill step).
  uint32 kills = 7;
  uint32 kills_needed = 8;
  // The quest can be done again after a cooldown (a task, docs/06 "Quest").
  bool repeatable = 9;
  // A completed repeatable quest: when it can be taken again, Unix milliseconds (DONE
  // when that already passed at sending); 0 for any other.
  uint64 available_at = 10;
  // A milestone quest (docs/02 "Quests de hito"): its requirements, with whether this
  // character meets each one now; unset for any other quest.
  MilestoneInfo milestone = 11;
}

// MilestoneInfo is what a milestone quest asks of every participant, as the quest log
// shows it. The *_met marks are this character's own, computed when the log is sent (it
// comes again when its level or what it carries changes).
message MilestoneInfo {
  // i18n key of the title the quest gives once done (quest.<id>.title).
  string title = 1;
  uint32 level = 2;
  bool level_met = 3;
  // The gear: an item (numeric id, worn when gear_equipped) or a wielded weapon of
  // gear_weapon's type (sword, axe...); both 0/empty when it asks for none.
  uint32 gear_item = 4;
  bool gear_equipped = 5;
  string gear_weapon = 6;
  bool gear_met = 7;
  // How many players stand on the plates together, and the vocation of each plate
  // (data/vocations ids) when the milestone asks for one of each; empty: any.
  uint32 players = 8;
  repeated string vocations = 9;
  // This character's vocation is one of vocations (true when vocations is empty).
  bool vocation_met = 10;
}

// StashResult is what became of the last StashCommand (or of the UseItem that opened the
// window). OK for a move that happened and for every update that answers nobody's action
// (the other character of the account moved something, the window opened).
enum StashResult {
  STASH_RESULT_UNSPECIFIED = 0;
  STASH_RESULT_OK = 1;
  // FULL: no free cell in the stash (and no stack with room for the units).
  STASH_RESULT_FULL = 2;
  // NO_ROOM: the backpack and the pockets have no room for it.
  STASH_RESULT_NO_ROOM = 3;
  // TOO_HEAVY: it weighs more than the free capacity.
  STASH_RESULT_TOO_HEAVY = 4;
  // TOO_FAR: not next to the stash chest (the window closes).
  STASH_RESULT_TOO_FAR = 5;
  // CHANGED: the cell no longer holds the item the client saw.
  STASH_RESULT_CHANGED = 6;
  // NOT_ALLOWED: the item cannot be stashed (not tradeable, offered in the trade window,
  // the pockets themselves).
  STASH_RESULT_NOT_ALLOWED = 7;
  // TOO_FAST: the anti-flood limit (balance stash.action_*).
  STASH_RESULT_TOO_FAST = 8;
  // UNAVAILABLE: the stash is off or read-only (a transfer could not be stored), or the
  // account is staff.
  STASH_RESULT_UNAVAILABLE = 9;
  // NOT_POSSIBLE: a bad request (an item the player does not carry, a bad count).
  STASH_RESULT_NOT_POSSIBLE = 10;
  // IN_COMBAT: the player's PvP lock (docs/02 "PvP"): nothing goes in or out mid-fight.
  STASH_RESULT_IN_COMBAT = 11;
}

// StashUpdate is the account stash window (docs/02 "Baúl de la cuenta"). It is sent when
// the window opens (UseItem on a stash chest), after every action of the player, after
// every change made by another character of the account that has it open too, and with
// open = false when it closes (walked away, StashClose, read-only). items are the cells in
// order (index = StashWithdraw.index); there may be more than capacity after the limit was
// lowered (nothing is lost; nothing goes in until there is room). chest is the stash chest
// the window belongs to.
message StashUpdate {
  bool open = 1;
  uint32 capacity = 2;
  repeated ItemStack items = 3;
  StashResult result = 4;
  Position chest = 5;
}

// ---- minimap (docs/05 "Minimapa") ----------------------------------------------

// MinimapIndex is sent once after Welcome: the sectors (sx << 16 | sy, MinimapRequest)
// of every floor where the character has explored something. The client asks for the
// ones its minimap shows with MinimapRequest; any other sector is unexplored (black).
message MinimapIndex {
  repeated MinimapFloorIndex floors = 1;
}

// MinimapFloorIndex is the explored sectors of one floor.
message MinimapFloorIndex {
  uint32 z = 1;
  repeated uint32 sectors = 2;
}

// MinimapSectors carries explored sectors: the answer to a MinimapRequest (answer set;
// palette and tiles for what is explored) and, at most once a second while the player
// explores, the sectors that gained explored tiles (answer unset, only explored: the
// client colours those tiles from the map it was sent, since they are in its view).
message MinimapSectors {
  repeated MinimapSector sectors = 1;
  // answer: these sectors answer a MinimapRequest. The client stops asking for them; a
  // delta (false) leaves a sector it never asked for still to ask.
  bool answer = 2;
}

// MinimapSector is one sector (32x32 tiles) of floor z. explored is its bitset: 128 bytes,
// one bit per tile, row by row (bit x % 8 of byte (y * 32 + x) / 8, x and y inside the
// sector); empty when nothing of it is explored. tiles, when set, is 1024 bytes, one per
// tile in the same order: 0 for a tile that is unexplored or has nothing, else 1 + an
// index into palette, the numeric item id the minimap colours that tile by (the topmost
// item that blocks the tile, else its ground).
message MinimapSector {
  uint32 z = 1;
  uint32 sector = 2;
  bytes explored = 3;
  repeated uint32 palette = 4;
  bytes tiles = 5;
}

// ObjectiveHint is the estimated place of the tracked quest's current step (TrackQuest):
// a circle of radius tiles around center, which may be on another floor. It is never the
// exact target: the centre is moved from it (the same way for this character and step)
// and the target lies inside the circle. An empty quest_id means nothing is tracked (or
// the step has no place, as a step done anywhere): the minimap shows no estimate.
message ObjectiveHint {
  string quest_id = 1;
  string step_id = 2;
  Position center = 3;
  uint32 radius = 4;
}
