syntax = "proto3";

package game.v1;

import "game/v1/common.proto";

option go_package = "github.com/GFenzoR/RPG_Project/server/internal/net/pb/game/v1;gamev1";

// Client → server messages. They are intents: the server validates every one of them
// (range, line of sight, cooldowns, capacity, speed) and the client never decides results.

// ClientMessage is the only thing a client WebSocket frame carries (max 4 KB).
message ClientMessage {
  oneof message {
    Hello hello = 1;
    Walk walk = 2;
    WalkPath walk_path = 3;
    StopWalk stop_walk = 4;
    Turn turn = 5;
    SetTarget set_target = 6;
    SetFightMode set_fight_mode = 7;
    CastSpell cast_spell = 8;
    UseItem use_item = 9;
    UseItemOn use_item_on = 10;
    MoveItem move_item = 11;
    LookAt look_at = 12;
    Say say = 13;
    DialogChoose dialog_choose = 14;
    TradeRequest trade_request = 15;
    TradeOffer trade_offer = 16;
    TradeAccept trade_accept = 17;
    TradeCancel trade_cancel = 18;
    Ping ping = 19;
    Logout logout = 20;
    CloseContainer close_container = 21;
    NpcTalk npc_talk = 22;
    ShopBuy shop_buy = 23;
    ShopSell shop_sell = 24;
    PartyCommand party_command = 25;
    Craft craft = 26;
    ReportPlayer report_player = 27;
    PresenceAnswer presence_answer = 28;
    TutorialSkip tutorial_skip = 29;
    GuildCommand guild_command = 30;
    SetSafeMode set_safe_mode = 31;
    MarketCommand market_command = 32;
    HouseCommand house_command = 33;
  }
}

// Hello is the first message on a new WebSocket. session_token comes from
// POST /api/play and lives 60 s.
message Hello {
  string session_token = 1;
  string client_version = 2;
  // BCP 47 tag of the client language, e.g. "es" or "en".
  string locale = 3;
}

message Walk {
  Direction dir = 1;
}

// WalkPath queues up to 100 steps (auto-walk after a click).
message WalkPath {
  repeated Direction steps = 1;
}

message StopWalk {}

message Turn {
  Direction dir = 1;
}

// SetTarget selects the creature to attack. creature_id 0 clears the target.
message SetTarget {
  uint32 creature_id = 1;
}

enum FightStance {
  FIGHT_STANCE_UNSPECIFIED = 0;
  FIGHT_STANCE_OFFENSIVE = 1;
  FIGHT_STANCE_BALANCED = 2;
  FIGHT_STANCE_DEFENSIVE = 3;
}

// SetSafeMode turns the safe mode on or off (T5.2, docs/02 "PvP"). With it on (the
// default until the client says otherwise) the player cannot attack a player whom it
// would be unjustified to attack, and its area spells skip those players. The client sends
// it right after the Welcome and whenever the player flips the switch.
message SetSafeMode {
  bool enabled = 1;
}

message SetFightMode {
  FightStance stance = 1;
  // chase = true follows the target; false stands still.
  bool chase = 2;
}

// CastSpell casts by spell id (hotkey) or by the spoken words typed in chat.
message CastSpell {
  oneof spell {
    string spell_id = 1;
    string words = 2;
  }
  // Optional target; unset means the spell's default (self, current target or area).
  ActionTarget target = 3;
}

// UseItem uses an item where it lies. item_id and stack_index let the server reject
// actions based on a stale view of the tile or container.
message UseItem {
  ItemLocation from = 1;
  uint32 item_id = 2;
  uint32 stack_index = 3;
}

// UseItemOn uses an item on a tile or a creature (runes, tools, keys).
message UseItemOn {
  ItemLocation from = 1;
  uint32 item_id = 2;
  uint32 stack_index = 3;
  ActionTarget to = 4;
}

// MoveItem moves count units of a stackable item (count must be at least 1 and at most
// the stack size); count is ignored for items that do not stack.
message MoveItem {
  ItemLocation from = 1;
  uint32 item_id = 2;
  uint32 stack_index = 3;
  ItemLocation to = 4;
  uint32 count = 5;
}

// LookAt inspects an item or creature on a tile, or an item in the equipment or an
// open container.
message LookAt {
  ItemLocation from = 1;
  uint32 item_id = 2;
  uint32 stack_index = 3;
  // T5.1: look at this creature instead (one the client sees; the rest is ignored). For
  // a player the answer names its vocation, level and guild (look.player*).
  uint32 creature_id = 4;
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_SAY = 1;
  CHAT_CHANNEL_YELL = 2;
  CHAT_CHANNEL_WHISPER = 3;
  CHAT_CHANNEL_GLOBAL = 4;
  // The members of the speaker's party, wherever they are (T3.3).
  CHAT_CHANNEL_PARTY = 5;
  // The members of the speaker's guild who are online, wherever they are (T5.1).
  CHAT_CHANNEL_GUILD = 6;
}

// Say sends chat text (max 255 characters) to a channel.
message Say {
  ChatChannel channel = 1;
  string text = 2;
}

// DialogChoose picks an option of an open NPC dialog. dialog_id is the session-local
// id from DialogOpen; option_id is one of its DialogOption ids, or 0 to close the dialog.
message DialogChoose {
  uint32 dialog_id = 1;
  uint32 option_id = 2;
}

// Trade window (T5.3, docs/02 "Economía"). TradeRequest invites an adjacent player (by
// creature id) to trade, or accepts its invitation when it already invited this player.
// item is an optional first item to offer (item_id 0: none).
message TradeRequest {
  uint32 creature_id = 1;
  ItemLocation item = 2;
  uint32 item_id = 3;
  uint32 stack_index = 4;
}

// TradeOffer adds an item of the own inventory (the whole stack, or an empty container)
// to the own offer, or with remove takes the offered item at index out of it. Any
// change clears both acceptances.
message TradeOffer {
  ItemLocation item = 1;
  uint32 item_id = 2;
  uint32 stack_index = 3;
  bool remove = 4;
  uint32 index = 5;
}

// TradeAccept confirms the current offers. The trade completes when both accepted.
message TradeAccept {}

// TradeCancel closes the trade window (or declines an invitation).
message TradeCancel {}

// MarketCommand is one action of the global market window (T5.3). The player must be at
// a market board (it opened the window with UseItem on it). The server answers every
// action with a MarketUpdate (and a system message when it was refused).
message MarketCommand {
  oneof action {
    MarketBrowse browse = 1;
    MarketCreate create = 2;
    MarketCancel cancel = 3;
    MarketAccept accept = 4;
    MarketWithdraw withdraw = 5;
    MarketClose close = 6;
  }
}

// MarketBrowse lists the offers of one item (and its reference price).
message MarketBrowse {
  uint32 item_id = 1;
}

// MarketCreate posts an offer: SELL takes the units from the backpack, BUY takes amount
// × price in coins; both pay the posting fee. duration_index points into
// MarketUpdate.durations_hours.
message MarketCreate {
  MarketSide side = 1;
  uint32 item_id = 2;
  uint32 amount = 3;
  uint64 price = 4;
  uint32 duration_index = 5;
}

// MarketCancel takes an own offer down; its deposit goes to the mailbox.
message MarketCancel {
  uint64 offer_id = 1;
}

// MarketAccept buys from a sell offer or sells to a buy offer, amount units.
message MarketAccept {
  uint64 offer_id = 1;
  uint32 amount = 2;
}

// MarketWithdraw moves the mailbox into the inventory: the items in order while they fit,
// then as much of the gold as fits; the rest waits in the mailbox.
message MarketWithdraw {}

message MarketClose {}

// HouseCommand is one action of the house window (T5.4). The player opened the window
// with UseItem on a door of the house (any item of the door tile) and must still be next
// to a door or inside the house. The server answers every action with a HouseUpdate (and
// a system message when it was refused).
message HouseCommand {
  oneof action {
    HouseRent rent = 1;
    HouseExtend extend = 2;
    HouseLeave leave = 3;
    HouseGuestAdd guest_add = 4;
    HouseGuestRemove guest_remove = 5;
    HouseGuildAccess guild_access = 6;
    HouseTransferOffer transfer_offer = 7;
    HouseTransferCancel transfer_cancel = 8;
    HouseTransferAccept transfer_accept = 9;
    HouseClose close = 10;
  }
}

// HouseRent rents the free house of the window: one period, paid from the backpack.
message HouseRent {}

// HouseExtend (owner) pays one more period in advance, up to the balance's limit.
message HouseExtend {}

// HouseLeave (owner) gives the house up: its items go to the owner's market mailbox.
// Paid rent is not returned.
message HouseLeave {}

// HouseGuestAdd and HouseGuestRemove (owner) change the guest list, by character name.
message HouseGuestAdd {
  string name = 1;
}

message HouseGuestRemove {
  string name = 1;
}

// HouseGuildAccess (owner) lets the members of the owner's guild in, or not.
message HouseGuildAccess {
  bool enabled = 1;
}

// HouseTransferOffer (owner) offers the house to another character for price (smallest
// coin, may be 0). It waits a few minutes for that character to accept at the door.
message HouseTransferOffer {
  string name = 1;
  uint64 price = 2;
}

// HouseTransferCancel (owner) withdraws the transfer offer.
message HouseTransferCancel {}

// HouseTransferAccept takes the house offered to the player: it pays the price (to the
// owner's mailbox) and becomes the owner.
message HouseTransferAccept {}

message HouseClose {}

// Ping measures latency. client_time is the client clock in milliseconds and comes
// back unchanged in Pong.
message Ping {
  uint64 client_time = 1;
}

message Logout {}

// CloseContainer closes a container window (container_id from ContainerOpen). The
// server stops sending its updates and answers with ContainerClose.
message CloseContainer {
  uint32 container_id = 1;
}

// NpcTalk starts talking to an NPC the client knows (creature id). The server answers
// with DialogOpen if the NPC is close enough.
message NpcTalk {
  uint32 creature_id = 1;
}

// ShopBuy buys count units of an item from the shop opened in dialog dialog_id.
message ShopBuy {
  uint32 dialog_id = 1;
  uint32 item_id = 2;
  uint32 count = 3;
}

// ShopSell sells count units of an item to the shop opened in dialog dialog_id.
message ShopSell {
  uint32 dialog_id = 1;
  uint32 item_id = 2;
  uint32 count = 3;
}

// PartyAction is what a PartyCommand asks for (T3.3).
enum PartyAction {
  PARTY_ACTION_UNSPECIFIED = 0;
  // Invite creature_id (a player the client sees). Only a leader or a player without a
  // party may invite; the invitation expires after balance.yaml party.invite_ms.
  PARTY_ACTION_INVITE = 1;
  // Accept or decline the invitation of creature_id (the inviter).
  PARTY_ACTION_ACCEPT = 2;
  PARTY_ACTION_DECLINE = 3;
  // Leave the party (creature_id is ignored).
  PARTY_ACTION_LEAVE = 4;
  // Leader only: remove creature_id from the party, or make it the leader.
  PARTY_ACTION_KICK = 5;
  PARTY_ACTION_PASS_LEADER = 6;
  // Leader only: turn shared experience on or off (creature_id is ignored).
  PARTY_ACTION_SHARE_ON = 7;
  PARTY_ACTION_SHARE_OFF = 8;
}

// PartyCommand is every party intent (T3.3). The server answers with PartyUpdate or a
// system Message (party.*).
message PartyCommand {
  PartyAction action = 1;
  uint32 creature_id = 2;
}

// GuildAction is what a GuildCommand asks for (T5.1, docs/02 "Gremios"). Members are
// named by character name: they may be offline. The server checks every rank and rule.
enum GuildAction {
  GUILD_ACTION_UNSPECIFIED = 0;
  // Found a guild called name (costs gold, needs a level; the founder leads it).
  GUILD_ACTION_CREATE = 1;
  // Vice or leader: invite the online character name; REVOKE withdraws its invitation.
  GUILD_ACTION_INVITE = 2;
  GUILD_ACTION_REVOKE = 3;
  // Accept or decline the invitation of guild_id.
  GUILD_ACTION_ACCEPT = 4;
  GUILD_ACTION_DECLINE = 5;
  // Leave the guild (the leader must transfer or disband first).
  GUILD_ACTION_LEAVE = 6;
  // Remove member name (leader: anyone else; vice: members only).
  GUILD_ACTION_KICK = 7;
  // Leader: member name becomes vice leader, or a vice leader a member.
  GUILD_ACTION_PROMOTE = 8;
  GUILD_ACTION_DEMOTE = 9;
  // Vice or leader: set the message of the day to text (empty clears it).
  GUILD_ACTION_MOTD = 10;
  // Leader: disband the guild. name must repeat the guild's name (a confirmation).
  GUILD_ACTION_DISBAND = 11;
  // Leader: member name becomes the leader; the old leader becomes a vice leader if there
  // is room (balance guild.max_vice_leaders), a member otherwise.
  GUILD_ACTION_TRANSFER = 12;
  // Guild wars (T5.2). Leader: declare war on the guild called name; the other leader
  // accepts or declines it (by war_id). A leader of a guild at war surrenders it (war_id):
  // its enemy wins.
  GUILD_ACTION_WAR_DECLARE = 13;
  GUILD_ACTION_WAR_ACCEPT = 14;
  GUILD_ACTION_WAR_DECLINE = 15;
  GUILD_ACTION_WAR_SURRENDER = 16;
}

// GuildCommand is every guild intent (T5.1). The chat command "/guild ..." does the same.
// The server answers with GuildUpdate or a system Message (guild.*).
message GuildCommand {
  GuildAction action = 1;
  string name = 2;
  string text = 3;
  uint64 guild_id = 4;
  // The war of WAR_ACCEPT, WAR_DECLINE and WAR_SURRENDER (GuildWar.war_id).
  uint64 war_id = 5;
}

// Craft attempts a recipe of data/recipes.yaml (T3.4) at the station item on the tile
// station (from StationOpen). The server checks the skill level, the inputs in the
// containers, the tool, the distance to the station, capacity and room, and the time
// since the last crafting or gathering attempt, and answers with a system Message
// (craft.*).
message Craft {
  string recipe_id = 1;
  Position station = 2;
}

// ReportPlayer reports another player to the staff (T4.1): the report button of the
// battle list. creature_id must be a player the reporter sees; reason is free text (1 to
// balance reports.max_reason characters, at most 200). The server attaches the context
// (both positions and the reported player's recent events), rate limits it per account
// and answers with a system Message (report.*). The chat command "/report Name reason"
// does the same for any online player.
message ReportPlayer {
  uint32 creature_id = 1;
  string reason = 2;
}

// PresenceAnswer answers a PresenceCheck (T4.1) with one of its option ids.
message PresenceAnswer {
  uint32 check_id = 1;
  uint32 option_id = 2;
}

// TutorialSkip ends the tutorial for good (T4.2). There is no message to complete a step:
// the server advances the tutorial with its own events.
message TutorialSkip {}
