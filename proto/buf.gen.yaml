# Code generation for proto/. Plugins run locally (no buf.build remote plugins) and are
# pinned by server/go.mod (protoc-gen-go) and packages/protocol/package.json (protoc-gen-es).
# Paths are relative to the repo root, where `make gen` runs buf.
version: v2
clean: true
plugins:
  - local: server/bin/protoc-gen-go
    out: server/internal/net/pb
    opt: paths=source_relative
  - local: packages/protocol/node_modules/.bin/protoc-gen-es
    out: packages/protocol/src/gen
    opt:
      - target=ts
      - import_extension=ts
inputs:
  - directory: proto
