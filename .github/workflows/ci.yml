name: ci

# Each job runs only when the change touches what it checks (.github/scripts/ci-changes.sh
# decides; docs/08 "CI (GitHub Actions)"). A skipped job counts as passed for required
# checks. workflow_dispatch runs every job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go-server: ${{ steps.f.outputs.go-server }}
      go-bots: ${{ steps.f.outputs.go-bots }}
      ts: ${{ steps.f.outputs.ts }}
      validate: ${{ steps.f.outputs.validate }}
      actionlint: ${{ steps.f.outputs.actionlint }}
      build: ${{ steps.f.outputs.build }}
      desktop: ${{ steps.f.outputs.desktop }}
      e2e: ${{ steps.f.outputs.e2e }}
      integration: ${{ steps.f.outputs.integration }}
      bench: ${{ steps.f.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base of the diff
      - name: rules self-test
        run: .github/scripts/ci-changes.sh --test
      - id: f
        name: changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: .github/scripts/ci-changes.sh ci

  # One matrix job so the check names stay "go (server)" and "go (tools/bots)"; a module
  # with no changes passes at once (a job-level `if` cannot read the matrix).
  go:
    name: go (${{ matrix.module }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: server
            run: ${{ needs.changes.outputs.go-server }}
          - module: tools/bots
            run: ${{ needs.changes.outputs.go-bots }}
    steps:
      - name: nothing to check
        if: matrix.run != 'true'
        run: echo "no changes that affect ${{ matrix.module }}"
      - uses: actions/checkout@v4
        if: matrix.run == 'true'
      - uses: actions/setup-go@v5
        if: matrix.run == 'true'
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: gofmt
        if: matrix.run == 'true'
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        if: matrix.run == 'true'
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: golangci-lint
        if: matrix.run == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # keep in sync with scripts/local-setup.sh
          working-directory: ${{ matrix.module }}
      - name: go test
        if: matrix.run == 'true'
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint + prettier
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ids.lock.yaml append-only check compares with the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: content and maps
        run: make validate
        env:
          CONTENT_BASE_REF: origin/${{ github.base_ref || 'main' }}
      # mapcompile (Go) must agree with packages/map-format on walkability; this job has
      # the pnpm workspace installed, which the go jobs do not.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: mapcompile parity with map-format
        run: make test-parity

  actionlint:
    needs: changes
    if: needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: editor and client production builds
        run: make build

  # Desktop app (apps/desktop, Tauri 2) on Linux: Rust checks and tests, then a debug
  # build with the .deb bundle. Windows and macOS build in release-desktop.yml.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: system libraries (webkit2gtk and friends)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds build/client, so the web build comes first.
      - name: rustfmt, clippy and tests
        run: make desktop-test
      - name: build (debug, .deb)
        run: pnpm --filter @rpg/desktop tauri build --debug --bundles deb

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The client E2E runs the game server, which needs Postgres (it applies migrations).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Uses the workspace's pinned @playwright/test (1.63.0), so browser and runner match.
      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Calls the e2e scripts directly: `make e2e` would also run db-up, and here Postgres
      # is the job's service container.
      - name: playwright (editor)
        run: pnpm --filter @rpg/editor e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: playwright (client)
        if: ${{ !cancelled() }}
        run: pnpm --filter @rpg/client e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rpg
      - name: upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            editor/e2e/screenshots/actual/
            client/e2e/screenshots/actual/
          if-no-files-found: warn
      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            editor/playwright-report/
            client/playwright-report/
            test-results/
          if-no-files-found: warn

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      # The map PR worker's queue test (TS, T4.5) runs in the same target.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: integration tests (Postgres)
        run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rpg_test?sslmode=disable

  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      # Shared runners are noisy: this never fails on timings. Regressions over 10 % are
      # compared by hand with benchstat against main's artifact for now (docs/08).
      - name: tick and world benchmarks
        run: |
          mkdir -p reports
          make bench | tee reports/bench.txt
          {
            echo '### Benchmarks (server/internal/game, server/internal/world)'
            echo '```'
            grep -E '^(Benchmark|pkg:|cpu:)' reports/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: reports/bench.txt
