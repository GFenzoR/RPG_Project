name: ci

# Each job runs only when the change touches what it checks (.github/scripts/ci-changes.sh
# decides; docs/08 "CI (GitHub Actions)"). A skipped job counts as passed for required
# checks. workflow_dispatch runs every job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go-server: ${{ steps.f.outputs.go-server }}
      go-bots: ${{ steps.f.outputs.go-bots }}
      go-launcher: ${{ steps.f.outputs.go-launcher }}
      ts: ${{ steps.f.outputs.ts }}
      validate: ${{ steps.f.outputs.validate }}
      actionlint: ${{ steps.f.outputs.actionlint }}
      build: ${{ steps.f.outputs.build }}
      desktop: ${{ steps.f.outputs.desktop }}
      e2e: ${{ steps.f.outputs.e2e }}
      integration: ${{ steps.f.outputs.integration }}
      bench: ${{ steps.f.outputs.bench }}
      gemini: ${{ steps.f.outputs.gemini }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base of the diff
      - name: rules self-test
        run: .github/scripts/ci-changes.sh --test
      - id: f
        name: changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: .github/scripts/ci-changes.sh ci

  # One matrix job so the check names stay "go (server)", "go (tools/bots)" and "go (tools/launcher)"; a module
  # with no changes passes at once (a job-level `if` cannot read the matrix).
  go:
    name: go (${{ matrix.module }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: server
            run: ${{ needs.changes.outputs.go-server }}
          - module: tools/bots
            run: ${{ needs.changes.outputs.go-bots }}
          - module: tools/launcher
            run: ${{ needs.changes.outputs.go-launcher }}
    steps:
      - name: nothing to check
        if: matrix.run != 'true'
        run: echo "no changes that affect ${{ matrix.module }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.run == 'true'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.run == 'true'
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: gofmt
        if: matrix.run == 'true'
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        if: matrix.run == 'true'
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      # The launcher is a Windows program: also vet its Windows-only files (console_windows.go).
      - name: go vet (windows)
        if: matrix.run == 'true' && matrix.module == 'tools/launcher'
        working-directory: ${{ matrix.module }}
        run: GOOS=windows go vet ./...
      - name: golangci-lint
        if: matrix.run == 'true'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0 # keep in sync with scripts/local-setup.sh
          working-directory: ${{ matrix.module }}
      - name: go test
        if: matrix.run == 'true'
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint + prettier
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the ids.lock.yaml append-only check compares with the base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: content and maps
        run: make validate
        env:
          CONTENT_BASE_REF: origin/${{ github.base_ref || 'main' }}
      # mapcompile (Go) must agree with packages/map-format on walkability; this job has
      # the pnpm workspace installed, which the go jobs do not.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: mapcompile parity with map-format
        run: make test-parity

  actionlint:
    needs: changes
    if: needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      # Lote 16 (docs/18): every `uses:` is a full 40-hex commit SHA, never a movable tag.
      - name: actions pinned to commit SHAs
        run: |
          .github/scripts/check-action-pins.sh --test
          .github/scripts/check-action-pins.sh

  # tools/gemini: the dev-only Python tools around the owner's Gemini (pure parts only:
  # no browser, no network). The ffmpeg test is skipped when the runner has none.
  gemini:
    needs: changes
    if: needs.changes.outputs.gemini == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pillow
        run: python -m pip install "pillow==12.2.0"
      - name: tools/gemini unit tests
        run: make test-gemini PYTHON=python

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: editor and client production builds
        run: make build

  # Desktop app (apps/desktop, Tauri 2) on Linux: Rust checks and tests, then a debug
  # build with the .deb bundle. Windows and macOS build in release-desktop.yml.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: system libraries (webkit2gtk and friends)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds build/client, so the web build comes first.
      - name: rustfmt, clippy and tests
        run: make desktop-test
      - name: build (debug, .deb)
        run: pnpm --filter @rpg/desktop tauri build --debug --bundles deb

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # The client suite alone took 13.5 min on this runner before the WebKit touch tests
    # (Chromium only, no retries) and the whole job 17: room for WebKit and for the one
    # retry each failed test gets on CI (the playwright.config.ts files; docs/08).
    timeout-minutes: 40
    # The client E2E runs the game server, which needs Postgres (it applies migrations).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Uses the workspace's pinned @playwright/test (1.63.0), so browser and runner match.
      # WebKit: the (webkit) touch tests of client/e2e/mobile.spec.ts (iPhone and iPad).
      - name: install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      # Calls the e2e scripts directly: `make e2e` would also run db-up, and here Postgres
      # is the job's service container.
      - name: playwright (editor)
        run: pnpm --filter @rpg/editor e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: playwright (client)
        if: ${{ !cancelled() }}
        run: pnpm --filter @rpg/client e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rpg
      - name: upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: |
            editor/e2e/screenshots/actual/
            client/e2e/screenshots/actual/
          if-no-files-found: warn
      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            editor/playwright-report/
            client/playwright-report/
            test-results/
          if-no-files-found: warn

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      # The map PR worker's queue test (TS, T4.5) runs in the same target.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: integration tests (Postgres)
        run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rpg_test?sslmode=disable

  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      # Shared runners are noisy: this never fails on timings. Regressions over 10 % are
      # compared by hand with benchstat against main's artifact for now (docs/08).
      - name: tick and world benchmarks
        run: |
          mkdir -p reports
          make bench | tee reports/bench.txt
          {
            echo '### Benchmarks (server/internal/game, server/internal/world)'
            echo '```'
            grep -E '^(Benchmark|pkg:|cpu:)' reports/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: reports/bench.txt

  # The one check of this workflow that main's branch protection requires (docs/18
  # "Checklist del operador"): GitHub requires checks by job name, and the names above
  # change with the matrix. It fails if any job failed or was cancelled; skipped is fine.
  ci:
    name: ci
    if: always()
    needs: [changes, go, ts, validate, actionlint, gemini, build, desktop, e2e, integration, bench]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a job this check needs ended $r"; exit 1 ;;
            esac
          done
