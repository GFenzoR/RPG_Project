name: map-pr

# Map pull requests (T2.4, docs/04-map-editor-and-ai.md "PR de mapas en CI"): community
# plot check, `patch diff` summary, validation of the merged map and before/after renders.
#
# Security: pull requests come from community forks.
# - The check's code is the BASE branch's (checkout of base.ref, its pnpm install): the PR
#   is only fetched as git data and read with `git show`, never checked out or run.
# - Read-only token, no secrets; artifacts only. The comment is posted by
#   map-pr-comment.yml (workflow_run), which recomputes the key facts from the GitHub API.
# - In a pull_request run this YAML itself comes from the PR. A PR that edits, renames or
#   deletes it can fake this check (and a job named `check` in another workflow could
#   stand in for it). The comment says the verdict is not trustworthy for any PR that
#   touches .github/, and map-pr-pending.yml (pull_request_target, from the base) marks
#   the comment as pending on every push, so a push without a map-pr run never keeps an
#   old pass. The required check must be pinned to GitHub Actions as its source, and
#   .github/ needs CODEOWNERS review (docs/04).
# Do not add write permissions here and do not switch to pull_request_target.
#
# No `paths` filter on purpose: GitHub evaluates it on the first 300 files only, and a push
# that stops touching world/ must still replace the previous verdict.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the base branch may change

permissions:
  contents: read

concurrency:
  group: map-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The base branch as it is now (not the event's frozen base.sha): closing a plot or
      # removing a maintainer on main changes the verdict of open PRs on their next run.
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0 # merge-base of base and head
      - name: fetch the PR head as data
        id: refs
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "refs/pull/${PR}/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::the PR head moved while this run started; the newer run checks it"
            exit 1
          fi
          base="$(git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ ! -f tools/mapcli/src/prcheck.ts ]; then
            # Only until T2.4 is on the base branch (the base is trusted; a PR cannot remove it).
            echo "map=false" >> "$GITHUB_OUTPUT"
            echo "The base branch has no map PR check yet: skipped." >> "$GITHUB_STEP_SUMMARY"
          elif git diff --quiet "$(git merge-base "$base" "$HEAD_SHA")" "$HEAD_SHA" -- world/; then
            echo "map=false" >> "$GITHUB_OUTPUT"
            echo "No changes under world/: nothing to check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "map=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4.1.0
        if: steps.refs.outputs.map == 'true'
      - uses: actions/setup-node@v4.4.0
        if: steps.refs.outputs.map == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile # the base branch's lockfile and scripts
        if: steps.refs.outputs.map == 'true'
      - name: plots, diff, validation and renders
        if: steps.refs.outputs.map == 'true'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node --experimental-strip-types tools/mapcli/src/cli.ts pr-check \
            --base "$BASE_SHA" --head "$HEAD_SHA" --author "$AUTHOR" \
            --association "$ASSOCIATION" --head-repo "$HEAD_REPO" --repo "$REPO" \
            --pr "$PR" --out map-pr
      - name: step summary (preview; the PR comment recomputes the key facts)
        if: ${{ !cancelled() && hashFiles('map-pr/report.json') != '' }}
        run: node --experimental-strip-types tools/mapcli/src/prcomment.ts --dry-run map-pr/report.json >> "$GITHUB_STEP_SUMMARY"
      # Two artifacts so the comment workflow downloads only the small JSON report.
      - name: upload report
        if: ${{ !cancelled() && steps.refs.outputs.map == 'true' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: map-pr-report
          path: map-pr/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: upload renders
        if: ${{ !cancelled() && steps.refs.outputs.map == 'true' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: map-pr-renders
          path: map-pr/*.png
          if-no-files-found: ignore
          retention-days: 14
