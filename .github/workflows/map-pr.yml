name: map-pr

# Map pull requests (T2.4, docs/04-map-editor-and-ai.md "PR de mapas en CI"): community
# plot check, `patch diff` summary, validation of the merged map and before/after renders.
#
# Security: pull requests come from community forks.
# - The check's code is the BASE branch's (checkout of base.ref, its pnpm install): the PR
#   is only fetched as git data and read with `git show` / `git cat-file` (the map, and the
#   data/, i18n/ and assets/ the merge would land), never checked out or run.
# - Read-only token, no secrets; artifacts only. The comment and the commit status
#   `map-pr/verdict` are written by map-pr-comment.yml (workflow_run, from the default
#   branch), which recomputes the key facts from the GitHub API.
# - In a pull_request run this YAML itself comes from the PR. A PR that edits, renames or
#   deletes it can fake this job (and a job named `check` in another workflow could stand
#   in for it). main requires the status `map-pr/verdict` instead: map-pr-comment sets it
#   per commit, only for PRs into the default branch, and never to success for a PR that
#   changes world/ and .github/ unless its author is a maintainer; a push without a
#   map-pr run gets no status at all, so an old pass never covers it. That status is not
#   tamper-proof either: a job named `map-pr/verdict` in a workflow the PR adds (also from
#   a fork) satisfies a required check of that name, and anyone with write access can set
#   it. What closes .github/ is CODEOWNERS review with stale approvals dismissed (docs/04).
# Do not add write permissions here and do not switch to pull_request_target.
#
# No `paths` filter on purpose: GitHub evaluates it on the first 300 files only, and a push
# that stops touching world/ must still replace the previous verdict.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the base branch may change

permissions:
  contents: read

concurrency:
  group: map-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The base branch as it is now (not the event's frozen base.sha): closing a plot or
      # removing a maintainer on main changes the verdict of open PRs on their next run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0 # merge-base of base and head
          # The token is not left in .git/config for later steps (pnpm install, mapcli).
          persist-credentials: false
      - name: fetch the PR head as data
        id: refs
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Read-only, as a header of this one git command, so it is not in .git/config for
          # the steps after it (a public repo needs none; actions such as setup-node still get
          # github.token on their own).
          TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet origin "refs/pull/${PR}/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::the PR head moved while this run started; the newer run checks it"
            exit 1
          fi
          base="$(git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ ! -f tools/mapcli/src/prcheck.ts ]; then
            # Only until T2.4 is on the base branch (the base is trusted; a PR cannot remove it).
            echo "map=false" >> "$GITHUB_OUTPUT"
            echo "The base branch has no map PR check yet: skipped." >> "$GITHUB_STEP_SUMMARY"
          elif git diff --quiet "$(git merge-base "$base" "$HEAD_SHA")" "$HEAD_SHA" -- world/; then
            echo "map=false" >> "$GITHUB_OUTPUT"
            echo "No changes under world/: nothing to check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "map=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.refs.outputs.map == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.refs.outputs.map == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile # the base branch's lockfile and scripts
        if: steps.refs.outputs.map == 'true'
      - name: plots, diff, validation and renders
        if: steps.refs.outputs.map == 'true'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node --experimental-strip-types tools/mapcli/src/cli.ts pr-check \
            --base "$BASE_SHA" --head "$HEAD_SHA" --author "$AUTHOR" \
            --association "$ASSOCIATION" --head-repo "$HEAD_REPO" --repo "$REPO" \
            --pr "$PR" --out map-pr
      - name: step summary (preview; the PR comment recomputes the key facts)
        if: ${{ !cancelled() && hashFiles('map-pr/report.json') != '' }}
        run: node --experimental-strip-types tools/mapcli/src/prcomment.ts --dry-run map-pr/report.json >> "$GITHUB_STEP_SUMMARY"
      # Two artifacts so the comment workflow downloads only the small JSON report.
      - name: upload report
        if: ${{ !cancelled() && steps.refs.outputs.map == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: map-pr-report
          path: map-pr/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: upload renders
        if: ${{ !cancelled() && steps.refs.outputs.map == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: map-pr-renders
          path: map-pr/*.png
          if-no-files-found: ignore
          retention-days: 14
