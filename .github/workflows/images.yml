name: images

# Builds the deploy images (deploy/Dockerfile.*) for linux/amd64 and linux/arm64 and
# publishes them to ghcr.io on pushes to main and on vX.Y.Z tags. On pull requests each job
# runs only when the change touches what it checks (.github/scripts/ci-changes.sh images):
# `image` builds amd64 only and without pushing, when a Dockerfile changes (`stack` already
# builds the gameserver and web images for any app change); `home-stack` runs for deploy/
# changes. docs/09-deployment-aws.md describes the tags and how the server consumes them.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - deploy/**
      - server/**
      - world/**
      - data/**
      - i18n/**
      - client/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/images.yml
      - .github/scripts/**
      - Makefile
      - tools/bots/**
      - tools/spritepack/**
      # The map PR worker's image (T4.5) and its smoke test.
      - tools/map-pr-worker/**
      - pnpm-workspace.yaml
      - assets/**
      - proto/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.f.outputs.image }}
      deploy-lint: ${{ steps.f.outputs.deploy-lint }}
      monitoring: ${{ steps.f.outputs.monitoring }}
      stack: ${{ steps.f.outputs.stack }}
      home-stack: ${{ steps.f.outputs.home-stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base of the diff
      - name: rules self-test
        run: .github/scripts/ci-changes.sh --test
      - id: f
        name: changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: .github/scripts/ci-changes.sh images

  image:
    name: image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gameserver
            dockerfile: deploy/Dockerfile.gameserver
          - image: web
            dockerfile: deploy/Dockerfile.web
          - image: backup
            dockerfile: deploy/Dockerfile.backup
          - image: map-pr-worker
            dockerfile: deploy/Dockerfile.map-pr-worker
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      # Pull requests only check that the image builds: amd64, no QEMU emulation.
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - uses: actions/checkout@v4

      - name: image name
        id: name
        # GHCR repository names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rpg-project-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          # Pull requests build one platform: load it so the smoke step below can run it.
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # T4.5: the worker runs TypeScript through workspace symlinks; starting it (without a
      # token it only logs that it is disabled) proves every module resolves in the image.
      - name: smoke (map-pr-worker starts)
        if: matrix.image == 'map-pr-worker' && env.PUSH != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image=$(head -n1 <<<"$TAGS")
          # Without a token the service idles until stopped; --once just reports and exits.
          out=$(docker run --rm --read-only "$image" --once)
          echo "$out"
          grep -q 'the map PR worker does not run' <<<"$out"
          # Merges a built-in patch: the map schemas and the merge load inside the image.
          docker run --rm --read-only "$image" --self-check

  # Static checks of deploy/: Dockerfiles, shell scripts and the compose files.
  deploy-lint:
    needs: changes
    if: needs.changes.outputs.deploy-lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          for f in deploy/Dockerfile.*; do
            case "$f" in *.dockerignore) continue ;; esac
            echo "==> $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < "$f"
          done
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/monitoring/*.sh deploy/monitoring/alertmanager/*.sh
      - name: docker compose config
        run: |
          printf 'POSTGRES_PASSWORD=x\nSITE_ADDRESS=example.com\nACME_EMAIL=ops@example.com\n' > "$RUNNER_TEMP/ci.env"
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/ci.env" config -q
          sed 's/__RANDOM__/x/' deploy/env.home.template > "$RUNNER_TEMP/home.env"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.home.yml \
            --env-file "$RUNNER_TEMP/home.env" --profile quick-tunnel --profile tunnel --profile monitoring --profile mail config -q
          docker compose -f deploy/docker-compose.dev.yml --profile mail config -q
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/ci.env" \
            --profile monitoring --profile monitoring-test config -q
      # T4.4: promtool (config, rules, rule unit tests), amtool and the dashboard JSON, with
      # the pinned images of the compose file. Only when deploy/monitoring/ changes.
      - name: monitoring config
        if: needs.changes.outputs.monitoring == 'true'
        run: deploy/monitoring/check.sh

  # Builds the images for the runner's platform, runs the whole stack and plays through
  # Caddy: health, client page, login, /ws with real bots, and the client-IP chain.
  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file /tmp/rpg-ci.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/bots/go.mod
          cache-dependency-path: tools/bots/go.sum
      - name: env file
        # Plain HTTP on :80 (no certificate), published on 8080 like the home setup.
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SITE_ADDRESS=:80"
            echo "ACME_EMAIL=ci@example.com"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "COOKIE_SECURE=false"
          } > /tmp/rpg-ci.env
      - name: build images
        run: $COMPOSE build gameserver caddy
      - name: start the stack
        run: $COMPOSE up -d --wait postgres gameserver caddy
      - name: bots play through Caddy (login, /api/play, /ws)
        working-directory: tools/bots
        run: go run ./cmd/bots -n 3 -duration 5s -url http://localhost:8080 -prefix ci
      - name: smoke (health, client, auth, /ws, client IP)
        run: deploy/smoke.sh http://localhost:8080
      - name: logs
        if: ${{ !cancelled() }}
        run: $COMPOSE logs --no-color --tail=200
      - name: stop
        if: ${{ always() }}
        run: $COMPOSE down -v

  # Home hosting (docs/13): `make home-up`, the client-IP chain behind the tunnel network,
  # and a real Cloudflare Quick Tunnel with bots over wss:// and the smoke test through it.
  home-stack:
    needs: changes
    if: needs.changes.outputs.home-stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/bots/go.mod
          cache-dependency-path: tools/bots/go.sum
      - name: make home-up
        run: make home-up
      - name: smoke on http://localhost:8080
        run: deploy/smoke.sh http://localhost:8080
      - name: client IP behind the tunnel network (CF-Connecting-IP)
        run: deploy/check-tunnel-ip.sh rpg-home_tunnel
      - name: make home-tunnel (Cloudflare Quick Tunnel)
        run: HOME_TUNNEL_URL_FILE="$RUNNER_TEMP/tunnel-url" make home-tunnel
      # Bot character names are global per index, so the bots run once, through the tunnel.
      - name: bots play through the tunnel (wss://)
        working-directory: tools/bots
        run: go run ./cmd/bots -n 3 -duration 5s -url "$(cat "$RUNNER_TEMP/tunnel-url")" -prefix tunnel
      - name: smoke through the tunnel
        run: deploy/smoke.sh "$(cat "$RUNNER_TEMP/tunnel-url")"
      - name: make home-backup
        run: make home-backup && find deploy/backups -name 'home-*.dump' -size +0 | grep -q .
      # The operator commands of docs/13: a role for a registered account, then a restore
      # (the account registered after the backup must be gone) and the game back up.
      - name: make home-admin and make home-restore
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"home-admin@example.com","password":"home-admin-pass-1"}' http://localhost:8080/api/auth/register)
          test "$code" = 201
          make home-admin EMAIL=home-admin@example.com ROLE=gm
          CONFIRM=yes make home-restore FILE="$(find deploy/backups -name 'home-*.dump' | sort | head -n 1)"
          if make home-admin EMAIL=home-admin@example.com ROLE=gm; then
            echo "the account registered after the backup survived the restore"; exit 1
          fi
          curl -fsS http://localhost:8080/healthz
      - name: logs
        if: ${{ !cancelled() }}
        run: docker compose -p rpg-home logs --no-color --tail=300
      - name: stop
        if: ${{ always() }}
        run: CONFIRM=yes make home-reset
