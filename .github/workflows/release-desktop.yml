# Desktop installers (T2.5, docs/12-local-development.md "Cliente de escritorio"): a tag
# desktop-vX.Y.Z builds the Tauri app on Windows, macOS (universal) and Linux and uploads
# the installers to a draft GitHub Release. Unsigned for now: see docs/09 for the
# SmartScreen/Gatekeeper warnings and how to add signing.
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# The tag must match client/package.json "version" (the only source of the app version).
# The game server baked into the app comes from the repository variable
# DESKTOP_SERVER_URL (Settings → Secrets and variables → Actions → Variables).
name: release-desktop

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: tag matches client/package.json and the server URL is https
        env:
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ vars.DESKTOP_SERVER_URL }}
        run: |
          version=$(node -p 'require("./client/package.json").version')
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::tag $TAG does not match client/package.json version $version (expected desktop-v$version)"
            exit 1
          fi
          case "$SERVER_URL" in
            https://*) echo "server: $SERVER_URL" ;;
            *) echo "::error::set the repository variable DESKTOP_SERVER_URL to the production https:// origin"; exit 1 ;;
          esac
      # Validates DESKTOP_SERVER_URL with the app's own parser (config.rs): a path, query,
      # credentials or an IPv6 literal would build installers that exit on start.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: DESKTOP_SERVER_URL passes the app's validation
        env:
          RPG_DESKTOP_SERVER_URL: ${{ vars.DESKTOP_SERVER_URL }}
        run: |
          make build-client
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib compiled_default_is_valid

  build:
    needs: check
    name: build (${{ matrix.name }})
    permissions:
      contents: write # create the draft release and upload the installers
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: .deb/.rpm/.AppImage link against the host's glibc,
          # GTK and WebKitGTK, so building on 24.04 (glibc 2.39) breaks Ubuntu 22.04 and
          # Debian 12 ("GLIBC_2.38 not found").
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev
      - name: rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ runner.os }}" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compiled in as the default server (apps/desktop/src-tauri/src/config.rs).
          RPG_DESKTOP_SERVER_URL: ${{ vars.DESKTOP_SERVER_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Neque's Realm desktop ${{ github.ref_name }}
          releaseBody: |
            Unsigned builds: Windows SmartScreen and macOS Gatekeeper will warn on first run
            (docs/09-deployment-aws.md, "Cliente de escritorio"). Linux needs webkit2gtk 4.1.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
