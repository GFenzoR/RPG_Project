# The wind of the living world (livingworld/README.md "Viento"). Trees, bushes and every
# other plant of the map stand STILL; every so often a gust crosses the map and each plant
# bends as its front passes: it eases into a lean, holds it, swings a couple of times and
# stands still again. Cosmetic: the server never reads it.
#
# field: where the wind blows from and where it gets in.
#   direction   where the gusts travel to, degrees (0 east, 90 south); each gust strays
#               from it by up to gusts.spread
#   speed       how fast a gust front travels, tiles per second
#   exposure    strength by ground surface (data/items ground.surface) round a plant:
#               coasts and deserts blow harder, a floor indoors not at all
#   open        strength over a surface that is not listed
#   forest      how much a dense stand of trees calms the wind inside it (0..1)
#   night       strength at night, a factor
# Underground (caves) there is no wind at all.
field:
  direction: 20
  speed: 8
  exposure:
    sand: 1.3
    wet_sand: 1.45
    water_shallow: 1.45
    ash: 1.25
    snow: 1.2
    grass: 1.0
    tall_grass: 1.0
    dirt: 0.9
    mud: 0.9
    stone: 0.55
    wood: 0.0
    lava: 0.8
  open: 1.0
  forest: 0.25
  night: 0.8

# gusts: when a gust comes and what it does. All of it random, and the same for every
# client: gust number k of the shared clock gets its moment, strength and direction from k
# and the seed.
#   every_s       one gust per slot of this many seconds: the mean time between two gusts
#   jitter        where in its slot a gust starts, share of the slot: 0 is a metronome,
#                 0.3 puts two gusts between 0.7 and 1.3 slots apart
#   strength      [weakest, strongest] gust (1: a plant's full amplitude in the open)
#   spread        how far a gust's direction strays from field.direction, degrees either way
#   travel_tiles  how far a front travels before it dies (two or three screens)
#   rise_ms       a plant eases into its lean over this long
#   hold_ms       ... and holds it this long, while the gust blows over it
#   swings        how many swings it takes to stand still again, each smaller than the last
#   drift_ms      one slow drift of a plant in the calm (only kinds with a drift)
#   seed          another seed, another sequence of gusts
# make validate keeps the calm real: the slots must leave at least 10 s in which nothing
# moves between the last swing of a gust and the next front, anywhere on the map.
gusts:
  every_s: 45
  jitter: 0.3
  strength: [0.6, 1.0]
  spread: 25
  travel_tiles: 64
  rise_ms: 450
  hold_ms: 1100
  swings: 2
  drift_ms: 9000
  seed: 1

# kinds: the defaults of each plant type. A sprite says its type and where its trunk ends
# (tools/spritegen, data/livingworld/wind_sprites.yaml); plants.yaml may override a plant.
#   stiffness  0 limp .. 1 rigid: a stiff plant gives only to a strong gust
#   amplitude  how far its top leans in a full gust, sprite px
#   drift      how far its top drifts in the calm between gusts, sprite px (under 1).
#              0: it stands stock-still (the owner, 2026-11-26: a plant that always moves
#              "looks alive, or on fire"). Never for small ground plants: it reads as shimmer
#   period_ms  one swing after a gust
#   pivot      where it starts to move when the sprite does not say, share of its height
kinds:
  tree: { stiffness: 0.35, amplitude: 3.0, drift: 0, period_ms: 2200, pivot: 0.3 }
  palm: { stiffness: 0.3, amplitude: 4.0, drift: 0, period_ms: 2000, pivot: 0.1 }
  bush: { stiffness: 0.35, amplitude: 1.5, drift: 0, period_ms: 1400, pivot: 0.15 }
  tall_grass: { stiffness: 0.1, amplitude: 2.5, drift: 0, period_ms: 900, pivot: 0.05 }
  reed: { stiffness: 0.2, amplitude: 2.5, drift: 0, period_ms: 1100, pivot: 0.05 }
  flower: { stiffness: 0.15, amplitude: 2.0, drift: 0, period_ms: 1000, pivot: 0.05 }
  vine: { stiffness: 0.3, amplitude: 1.5, drift: 0, period_ms: 1400, pivot: 0.1 }
  cactus: { stiffness: 0.9, amplitude: 0.5, drift: 0, period_ms: 1600, pivot: 0.3 }
  dead_tree: { stiffness: 0.8, amplitude: 0.8, drift: 0, period_ms: 1600, pivot: 0.4 }
