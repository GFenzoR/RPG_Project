# Spells (docs/02-game-design.md "Combate", docs/06-content-data.md "Hechizo").
# Words are invented for this game and numbers are our own (CLAUDE.md legal rule):
# never use another game's magic words or constants.
# Damage/heal = base + level × per_level + magic level × per_magic_level
#   (+ skill level × per_skill, T3.1: the ranger's spells scale with distance), ± spread.

- id: arc_bolt
  name: spell.arc_bolt.name
  words: "fulgur iacio"
  vocations: [arcanist]
  level: 1
  mana: 10
  group: attack
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect:
    damage:
      { element: energy, range: 4, base: 9, per_level: 0.2, per_magic_level: 2.5, spread: 0.25,
        condition: { id: shocked, chance: 0.2, ticks: 3, damage: 3 } }
  notes: Single target at up to 4 tiles in line of sight (the current target by default); sometimes leaves it shocked (T3.2).

- id: ember_ring
  name: spell.ember_ring.name
  words: "ignis corona"
  vocations: [arcanist]
  level: 10
  magic_level: 3
  mana: 45
  group: attack
  cooldown_ms: 4000
  group_cooldown_ms: 2000
  effect:
    damage:
      { element: fire, radius: 2, base: 14, per_level: 0.25, per_magic_level: 3, spread: 0.2,
        condition: { id: burning, chance: 0.35, ticks: 4, damage: 4 } }
  notes: Burns every monster within 2 tiles of the caster that the caster can see; some keep burning (T3.2).

- id: light_heal
  name: spell.light_heal.name
  words: "vita lumen"
  vocations: [arcanist]
  level: 6
  mana: 25
  group: healing
  cooldown_ms: 1500
  group_cooldown_ms: 1000
  effect: { heal: { base: 18, per_level: 0.25, per_magic_level: 1.4 } }
  notes: The druid has its own, stronger heals (verdant_mend, mend_other).

- id: conjure_arc_rune
  name: spell.conjure_arc_rune.name
  words: "runa fulguris"
  vocations: [arcanist]
  level: 5
  magic_level: 1
  mana: 60
  group: support
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect: { conjure: { item: arc_rune } }
  notes: Puts an arc rune (with its charges) in the caster's backpack.

# ---- Ranger (T3.1): distance damage that grows with the distance skill, a small heal
# and arrows conjured with mana.
- id: sure_shot
  name: spell.sure_shot.name
  words: "sagitta certa"
  vocations: [ranger]
  level: 2
  mana: 15
  group: attack
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect: { damage: { element: physical, range: 5, base: 6, per_level: 0.2, skill: distance, per_skill: 1.1, spread: 0.2 } }
  notes: An aimed shot at up to 5 tiles; physical, so physical resistance applies but armor does not.

- id: briar_arrow
  name: spell.briar_arrow.name
  words: "spina volans"
  vocations: [ranger]
  level: 12
  magic_level: 1
  mana: 35
  group: attack
  cooldown_ms: 4000
  group_cooldown_ms: 2000
  effect: { damage: { element: earth, range: 5, base: 12, per_level: 0.3, skill: distance, per_skill: 1.6, spread: 0.2 } }

- id: ranger_mend
  name: spell.ranger_mend.name
  words: "cura silvae"
  vocations: [ranger]
  level: 4
  mana: 20
  group: healing
  cooldown_ms: 1500
  group_cooldown_ms: 1000
  effect: { heal: { base: 12, per_level: 0.25, per_magic_level: 1 } }

- id: conjure_arrows
  name: spell.conjure_arrows.name
  words: "fabrica sagittas"
  vocations: [ranger]
  level: 6
  mana: 40
  group: support
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect: { conjure: { item: arrow, count: 15 } }

# ---- Druid (T3.1): the best healer (also of other players) and ice and nature damage.
- id: frost_lance
  name: spell.frost_lance.name
  words: "glacies hasta"
  vocations: [druid]
  level: 1
  mana: 10
  group: attack
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect: { damage: { element: ice, range: 4, base: 8, per_level: 0.2, per_magic_level: 2.4, spread: 0.25 } }

- id: verdant_mend
  name: spell.verdant_mend.name
  words: "viridis cura"
  vocations: [druid]
  level: 1
  mana: 20
  group: healing
  cooldown_ms: 1000
  group_cooldown_ms: 1000
  effect: { heal: { base: 22, per_level: 0.3, per_magic_level: 1.9 } }

- id: mend_other
  name: spell.mend_other.name
  words: "sana amicum"
  vocations: [druid]
  level: 8
  magic_level: 2
  mana: 40
  group: healing
  cooldown_ms: 1500
  group_cooldown_ms: 1000
  effect: { heal: { range: 5, base: 22, per_level: 0.3, per_magic_level: 1.9 } }
  notes: Heals the targeted player (not the caster) at up to 5 tiles in line of sight.

- id: bramble_burst
  name: spell.bramble_burst.name
  words: "rubus orbis"
  vocations: [druid]
  level: 12
  magic_level: 4
  mana: 50
  group: attack
  cooldown_ms: 4000
  group_cooldown_ms: 2000
  effect: { damage: { element: earth, radius: 1, base: 12, per_level: 0.25, per_magic_level: 2.6, spread: 0.2 } }
  notes: Thorns on every monster next to the druid; a smaller area than the arcanist's.

# ---- Conditions (T3.2): haste and the poison cure for everyone, and one condition spell
# of each vocation's own. Durations and strengths are ours; the rules of each condition
# (speed_pct, stacking, tick interval...) live in balance.yaml conditions.
- id: swift_stride
  name: spell.swift_stride.name
  words: "pede celeri"
  vocations: [guardian, ranger, arcanist, druid]
  level: 8
  mana: 30
  group: support
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect: { condition: { id: hasted, duration_ms: 25000 } }
  notes: The caster walks faster for a while; ends a slow.

- id: purge_venom
  name: spell.purge_venom.name
  words: "venenum pelle"
  vocations: [guardian, ranger, arcanist, druid]
  level: 9
  mana: 25
  group: healing
  cooldown_ms: 3000
  group_cooldown_ms: 1000
  effect: { cure: [poison] }
  notes: Removes the caster's poison.

- id: keen_eye
  name: spell.keen_eye.name
  words: "oculus acer"
  vocations: [ranger]
  level: 10
  mana: 50
  group: support
  cooldown_ms: 2000
  group_cooldown_ms: 2000
  effect: { condition: { id: keen_eye, duration_ms: 30000 } }
  notes: The ranger's aim improves (distance skill in combat) for a while.

- id: entangle
  name: spell.entangle.name
  words: "radix vincit"
  vocations: [druid]
  level: 10
  magic_level: 3
  mana: 40
  group: attack
  cooldown_ms: 6000
  group_cooldown_ms: 2000
  effect: { condition: { id: slowed, range: 4, duration_ms: 7000 } }
  notes: Roots slow down a monster at up to 4 tiles in line of sight.

- id: shroud
  name: spell.shroud.name
  words: "umbra tegit"
  vocations: [arcanist]
  level: 14
  magic_level: 4
  mana: 110
  group: support
  cooldown_ms: 4000
  group_cooldown_ms: 2000
  effect: { condition: { id: invisible, duration_ms: 40000 } }
  notes: Hides the caster from players and from most monsters; attacking or casting ends it.
