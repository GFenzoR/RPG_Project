# Boat routes (T3.5, docs/06-content-data.md "Viajes en barco"). A captain offers its
# routes in its dialog nodes marked `boat_routes: true`. `make validate` checks that the
# captain stands at most 8 tiles from the dock and that the dock and the arrival are
# walkable tiles of an island in world/.

# Isla del Puerto <-> Isla del Bosque (T3.6). The way out asks for Chapter 1 and level 10
# (Chapter 2 starts at 15); the way back is cheaper and asks for nothing.
- id: puerto_to_bosque
  captain: harbor_master
  text: npc.harbor_master.to_forest
  from: { x: 3201, y: 6434, z: 7 }
  to: { x: 4120, y: 6100, z: 7 }
  price: 80
  requires: { level: 10, quest: ch1_shipwreck }

- id: bosque_to_puerto
  captain: bosque_ferryman
  text: npc.bosque_ferryman.to_harbour
  from: { x: 4117, y: 6100, z: 7 }
  to: { x: 3201, y: 6432, z: 7 }
  price: 60

# Isla del Bosque <-> Isla Volcánica (T5.5). The way out asks for level 25 (the island's
# lowest hunting band; Chapter 3 starts at 30 with the root of Chapter 2); the way back
# goes to either island and asks for nothing.
- id: bosque_to_volcan
  captain: bosque_ferryman
  text: npc.bosque_ferryman.to_volcan
  from: { x: 4117, y: 6100, z: 7 }
  to: { x: 3617, y: 5795, z: 7 }
  price: 150
  requires: { level: 25 }

- id: volcan_to_bosque
  captain: volcan_ferryman
  text: npc.volcan_ferryman.to_forest
  from: { x: 3612, y: 5795, z: 7 }
  to: { x: 4119, y: 6101, z: 7 }
  price: 100

- id: volcan_to_puerto
  captain: volcan_ferryman
  text: npc.volcan_ferryman.to_harbour
  from: { x: 3612, y: 5795, z: 7 }
  to: { x: 3201, y: 6431, z: 7 }
  price: 140
