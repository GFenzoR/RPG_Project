# Player outfits (T0.5). Each outfit is a sprite folder with one 32x32 file per facing and
# frame: <sprite>/<dir>_<frame> (assets/sprites/outfits/citizen/s_0.png), dir in n|e|s|w,
# frame 0 = standing, 1..frames-1 = the walking steps. Every player wears "citizen" until
# Outfit.look_id picks one (docs/06-content-data.md).
- id: citizen
  sprite: outfits/citizen
  frames: 3
  notes: Plain tunic and trousers; the default look of every new character.
