# Balance constants (docs/02-game-design.md). Initial values: tune here, never in code.
# Our own numbers: they aim for a familiar feel but must never be copied from Tibia
# (CLAUDE.md legal rule).
movement:
  base_step_ms: 1000        # step = base_step_ms * terrain% / speed (see 02-game-design)
  diagonal_cost: 1.5
  max_path_tiles: 100

experience:
  # Total XP for level n = a*n^3 + b*n^2 + c*n (+ d). Own curve, zero at level 1.
  # Pace target: level 8 in ~1 h, 20 in ~8 h, 50 in ~80 h.
  curve: { a: 12, b: -24, c: 12 }
  max_level: 1000

skills:
  base:
    fist: { start_level: 10, base_tries: 45 }
    sword: { start_level: 10, base_tries: 45 }
    axe: { start_level: 10, base_tries: 45 }
    club: { start_level: 10, base_tries: 45 }
    distance: { start_level: 10, base_tries: 32 }
    shield: { start_level: 10, base_tries: 85 }
    magic: { start_level: 0, base_tries: 1450 }   # tries = mana spent
    fishing: { start_level: 10, base_tries: 22 }
    mining: { start_level: 1, base_tries: 20 }
    woodcutting: { start_level: 1, base_tries: 20 }
    smithing: { start_level: 1, base_tries: 20 }
    cooking: { start_level: 1, base_tries: 20 }
    alchemy: { start_level: 1, base_tries: 20 }
  shield_max_tries_per_round: 2
  afk:
    after_ms: 600000          # 10 min against a target that does not fight back
    factor: 0.25

combat:
  attack_interval_ms: 2000
  # Melee (docs/02-game-design.md, "Combate"):
  #   max_hit = skill * attack / skill_attack_divisor + level / level_divisor, × mode attack
  #   hit = random(0, max_hit) × (1 - physical resistance)
  #   target armor removes random(armor/2, armor); a monster's defense random(0, defense/2);
  #   a player's shield random(0, shield_defense × mode defense / shield_block_divisor).
  fist_attack: 7              # attack value of bare hands (no weapon equipped)
  skill_attack_divisor: 10
  level_divisor: 4
  shield_block_divisor: 4
  monster_corpse_ms: 60000    # how long a monster's remains (and its loot) stay
  # Wands (T1.9): a distance attack of the weapon's element and range that hits
  # random(attack × wand_min_factor, attack) × (1 − resistance %). Armor does not stop it.
  wand_min_factor: 0.5
  modes:
    offensive: { attack: 1.25, defense: 0.55 }
    balanced: { attack: 1.0, defense: 1.0 }
    defensive: { attack: 0.65, defense: 1.5 }

inventory:
  start_container: backpack   # equipped in the backpack slot of a character that never played
  max_open_containers: 16     # container windows a player can have open at once
  use_cooldown_ms: 1000       # between two uses of a consumable
  reach: 1                    # tiles (Chebyshev, same floor) to take, drop, open or use on the ground

gathering:                  # fishing and mining (T1.12); spot numbers live in data/items
  use_interval_ms: 1500     # rate limit: one gathering attempt per player at most this often
  afk:
    after_ms: 900000        # gathering 15 min without leaving the tile...
    factor: 0.25            # ...earns skill tries at this rate (like skills.afk)

chat:                       # T1.13 (docs/02-game-design.md, "Chat")
  max_length: 255           # characters per message (the protocol maximum)
  # Who hears each local mode: players within this many tiles (x and y), same floor.
  ranges:
    whisper: { x: 1, y: 1 }
    say: { x: 7, y: 5 }     # the visible screen
    yell: { x: 18, y: 14 }
  # Anti-flood, all channels together: a bucket of `burst` messages that refills one
  # every `refill_ms`; sending with it empty mutes the player for `mute_ms`.
  flood:
    burst: 5
    refill_ms: 2000
    mute_ms: 10000
  global_interval_ms: 10000 # between two global-channel messages of the same player

death:
  xp_loss_pct: 10
  skill_loss_pct: 10
  equipment_drop_pct: 10
  backpack_drop_pct: 100
  max_blessings: 5
  xp_loss_pct_all_blessings: 3
  novice_max_level: 8
  corpse_ms: 600000
  corpse_owner_only_ms: 120000

economy:
  coin_ratio: 100

# Conditions (T3.2, docs/02-game-design.md "Condiciones"). Each source (spell, monster
# attack) says how strong and how long; these are the rules of each condition.
#   kind: damage = a hit of `element` every interval_ms (resistances apply), up to
#         max_ticks hits left; speed = speed × (100 + speed_pct) / 100; skill = +amount
#         levels of `skill` in combat; invisible = unseen by players and by monsters
#         without behavior.sees_invisible.
#   stacking: refresh keeps the longer time (or more hits) and the stronger damage;
#             add sums them, up to max_ticks / max_ms.
#   persists: kept across a logout with the time left (the others end on logout).
conditions:
  poison:    { kind: damage, element: earth, interval_ms: 2200, max_ticks: 25, stacking: add, persists: true }
  burning:   { kind: damage, element: fire, interval_ms: 3300, max_ticks: 7, stacking: refresh, persists: true }
  shocked:   { kind: damage, element: energy, interval_ms: 1700, max_ticks: 5, stacking: refresh, persists: true }
  slowed:    { kind: speed, speed_pct: -45, max_ms: 15000, stacking: refresh, cancels: [hasted], persists: true }
  hasted:    { kind: speed, speed_pct: 35, max_ms: 45000, stacking: refresh, cancels: [slowed] }
  invisible: { kind: invisible, max_ms: 90000, stacking: refresh }
  keen_eye:  { kind: skill, skill: distance, amount: 7, max_ms: 45000, stacking: refresh }
