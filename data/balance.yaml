# Balance constants (docs/02-game-design.md). Initial values: tune here, never in code.
# Our own numbers: they aim for a familiar feel but must never be copied from Tibia
# (CLAUDE.md legal rule).
movement:
  # step = base_step_ms * terrain% / speed, in ms (see 02-game-design). Every creature walks
  # by it: players, monsters and NPCs. 891 since 2026-11-26 (owner: +15 % in every
  # direction): a level 1 player (speed 205) took 500 ms a tile and takes 435.
  base_step_ms: 891
  # A player walks this much faster per level over the first, in % of its vocation's speed
  # at that level (owner, 2026-11-26). It adds to the vocations' per_level.speed points, it
  # does not replace them: level 50 is 352 points +9.8 % = 387. No cap but max_level.
  speed_per_level_pct: 0.2
  diagonal_cost: 1.414      # √2 in the step timer's thousandths: one speed in all 8 directions
  max_path_tiles: 100
  max_queued_steps: 4       # keyboard steps the client predicts and the server queues ahead

experience:
  # Total XP for level n = a*n^3 + b*n^2 + c*n (+ d). Own curve, zero at level 1.
  curve: { a: 12, b: -24, c: 12 }
  max_level: 1000
  # Pace target (hours of play to reach a level): a power law between anchors. It is what
  # the bot detection takes as the least a level band earns (antibot.signals.income).
  pace:
    - { level: 8, hours: 1 }
    - { level: 20, hours: 8 }
    - { level: 50, hours: 80 }

skills:
  base:
    fist: { start_level: 10, base_tries: 45 }
    sword: { start_level: 10, base_tries: 45 }
    axe: { start_level: 10, base_tries: 45 }
    club: { start_level: 10, base_tries: 45 }
    distance: { start_level: 10, base_tries: 32 }
    shield: { start_level: 10, base_tries: 85 }
    magic: { start_level: 0, base_tries: 1450 }   # tries = mana spent
    fishing: { start_level: 10, base_tries: 22 }
    mining: { start_level: 1, base_tries: 20 }
    woodcutting: { start_level: 1, base_tries: 20 }
    smithing: { start_level: 1, base_tries: 20 }
    cooking: { start_level: 1, base_tries: 20 }
    alchemy: { start_level: 1, base_tries: 20 }
  shield_max_tries_per_round: 2
  afk:
    after_ms: 600000          # 10 min against a target that does not fight back
    factor: 0.25

combat:
  attack_interval_ms: 2000
  # Melee (docs/02-game-design.md, "Combate"):
  #   max_hit = skill * attack / skill_attack_divisor + level / level_divisor, × mode attack
  #   hit = random(0, max_hit) × (1 - physical resistance)
  #   target armor removes random(armor/2, armor); a monster's defense random(0, defense/2);
  #   a player's hands random(0, (shield + weapon defense) × mode defense / shield_block_divisor)
  #   (content audit m3: the weapon's defense counts too).
  fist_attack: 7              # attack value of bare hands (no weapon equipped)
  skill_attack_divisor: 10
  level_divisor: 4
  shield_block_divisor: 4
  monster_corpse_ms: 300000   # how long a monster's remains (and its loot) stay
  # Leash (docs/02-game-design.md, "Monstruos"): a monster's comfort zone is its spawn's
  # radius + monster_leash_tiles (Chebyshev from the spawn's center): it picks targets and
  # always chases within it; beyond it, monster_pursuit decides. A target it does not
  # chase (out of its attacks' reach) is dropped for another player fighting it from
  # inside, or else it gives up (keeping its wounds) and walks home; without a target it
  # walks back into its spawn's radius. 0 = no leash.
  monster_leash_tiles: 6
  # A search for a way (A*) that found none waits this long before the next one; a chase
  # with a leash checks the way to a target out of its reach this often.
  monster_path_retry_ms: 1000
  # With a leash, a target out of reach that no way within the leash area reaches (around
  # creatures) for this long is dropped like one beyond the leash (only creatures in the
  # way: swapped for a player within reach)...
  monster_stuck_ms: 2000
  # ...and, on that tile and out of reach, counts as beyond the leash for that monster.
  monster_shun_ms: 30000
  # Pursuit (docs/02-game-design.md, "Monstruos", owner's request of 2026-11-23): the
  # leash area is a monster's comfort zone, where it always chases. A target beyond it and
  # out of reach it keeps chasing while a roll every roll_ms says so: chance =
  # persistence ^ (1 + distance_exponent x (d - leash area) / (max_chase_tiles - leash
  # area)), d being the target's distance from the spawn's center: with 2, about the
  # persistence just out of the leash area, its cube at max_chase_tiles (the hard cap,
  # Chebyshev from the center; never less than the leash area); 0 below
  # give_up_below_hp_pct of its own health; against a target below insist_target_hp_pct of
  # its health, insist_boost of the way to 1 (0.5: halfway). A spawn's monsters share one
  # roll per target (a pack; one below its give_up_below_hp_pct turns back alone). A target
  # out of its sight (the classic window) for lose_sight_ms, in a protection zone or on
  # another floor is given up. Giving up, it keeps its wounds (only the damage dealt from
  # out of its reach that it never answered with an attack round heals at once) and
  # remembers who hurt it, and their damage, memory_ms after their last hit: it turns on
  # them first when they come back into its leash area, and they share the experience and
  # the loot of whoever finishes it. data/monsters may override all but roll_ms,
  # distance_exponent, insist_boost and memory_ms (pursuit: {...}); roll_ms is needed as
  # soon as any monster has a persistence.
  monster_pursuit:
    persistence: 0.5
    max_chase_tiles: 16
    lose_sight_ms: 4000
    roll_ms: 3000
    give_up_below_hp_pct: 0
    insist_target_hp_pct: 25
    distance_exponent: 2
    insist_boost: 0.5
    memory_ms: 180000
  # Out-of-combat regeneration: without a target and delay_ms after its last fight (the
  # last tick it had a target, dealt or took damage), pct % of its maximum health every interval_ms (fractions of a point carry over). 1 % every 5 s: a
  # full heal takes about 8 minutes, so a player who walks off to heal and comes back
  # finds it still hurt. data/monsters may override each field (regen: {...}).
  monster_regen: { delay_ms: 10000, interval_ms: 5000, pct: 1 }
  # An idle monster out of its home area walks home (even where no player is); one that
  # has not got home after this long, and that nobody sees, goes back to its spawn
  # (despawn + respawn). 0 = never.
  monster_stray_ms: 300000
  # Wands (T1.9): a distance attack of the weapon's element and range that hits
  # random(attack × wand_min_factor, attack) × (1 − resistance %). Armor does not stop it.
  wand_min_factor: 0.5
  modes:
    offensive: { attack: 1.25, defense: 0.55 }
    balanced: { attack: 1.0, defense: 1.0 }
    defensive: { attack: 0.65, defense: 1.5 }

inventory:
  start_container: backpack   # equipped in the backpack slot of a character that never played
  max_open_containers: 16     # container windows a player can have open at once
  use_cooldown_ms: 1000       # between two uses of a consumable
  door_cooldown_ms: 500       # between two uses of a map door by one player, refused or not
  reach: 1                    # tiles (Chebyshev, same floor) to take, drop, open or use on the ground
  pocket_slots: 4             # built-in pocket cells of every character (docs/02 "Bolsillos"); never lower it

gathering:                  # fishing and mining (T1.12); spot numbers live in data/items
  use_interval_ms: 1500     # rate limit: one gathering attempt per player at most this often
  afk:
    after_ms: 900000        # gathering 15 min without leaving the tile...
    factor: 0.25            # ...earns skill tries at this rate (like skills.afk)

chat:                       # T1.13 (docs/02-game-design.md, "Chat")
  max_length: 255           # characters per message (the protocol maximum)
  # Who hears each local mode: players within this many tiles (x and y), same floor.
  ranges:
    whisper: { x: 1, y: 1 }
    say: { x: 7, y: 5 }     # the classic 15x11 screen (the 31x21 view sees farther than one hears)
    yell: { x: 18, y: 14 }
  # Anti-flood, all channels together: a bucket of `burst` messages that refills one
  # every `refill_ms`; sending with it empty mutes the player for `mute_ms`.
  flood:
    burst: 5
    refill_ms: 2000
    mute_ms: 10000
  global_interval_ms: 10000 # between two global-channel messages of the same player

party:                      # T3.3 (docs/02-game-design.md, "Grupos")
  max_members: 6            # leader included
  invite_ms: 45000          # an invitation expires after this
  invites_per_minute: 6     # anti-spam: invitation attempts of one account (any way, found or not)
  update_ms: 1000           # members' health/mana/level refresh at most this often
  # Shared experience: a kill is shared by the members that are on its floor within
  # `share_distance` tiles (Chebyshev) of it, contributed (damage to a monster, healing a
  # member, or a monster's attack taken) within `contribution_ms`, and whose level is at
  # least `level_range_pct` % of the highest of them (or at most `level_gap_always`
  # levels below it, so that low levels can share).
  share_distance: 24
  contribution_ms: 75000
  level_range_pct: 70
  level_gap_always: 3
  # A new party starts sharing experience (the leader can turn it off).
  shared_by_default: true
  # Bonus % of the shared pot by the number of sharers: 2, 3, 4, then 5 or more (the last
  # step is the cap). Only the count matters; two characters of one account count once.
  bonus_pct_by_sharers: [5, 10, 15, 20]

guild:                      # T5.1 (docs/02-game-design.md, "Gremios")
  found_cost: 2000          # copper coins paid (and destroyed: a sink) to found a guild
  found_min_level: 18       # founder's minimum level
  max_members: 50           # leader included
  max_vice_leaders: 4
  max_invites: 15           # pending invitations of one guild at a time
  invite_hours: 36          # an invitation expires after this (it survives logouts)
  name_min: 3               # characters
  name_max: 24
  name_max_words: 4
  motd_max: 160             # characters of the message of the day
  # A name is refused if, lowercased and without spaces, it contains one of
  # `reserved_parts` (posing as staff or the game, or offensive), or if one of its words
  # is in `reserved_words` (too short to match inside other words).
  reserved_parts: [admin, gamemaster, moderat, moderad, soporte, support, staff, tutor,
    sistema, system, official, oficial, rpgproject, mierda, puta, fuck, shit, nazi,
    hitler, nigger, faggot, maricon, retard]
  reserved_words: [gm, cm, god, mod, dev]

market:                     # T5.3 (docs/02-game-design.md, "Economía"). Own numbers.
  enabled: true             # false: the market boards answer "closed"
  fee_permille: 20          # posting fee: 2% of amount x unit price, destroyed (gold sink)
  fee_min: 5                # copper coins, at least
  fee_max: 50000            # and at most (content audit m13: 4000 was reached at a value of
                            # 200k, so faking a huge sale between two own accounts was cheap)
  max_offers: 15            # active offers (buy + sell) per character
  max_amount: 2000          # units per offer
  max_price: 5000000        # copper coins per unit
  durations_hours: [12, 48, 120]
  list_size: 15             # offers per side in a search, best prices first
  history_size: 25          # own operations shown, newest first
  reference_days: 5         # reference price: the median of these days' votes, one vote per
                            # seller account and day (its average unit price that day)
  reference_min_votes: 3    # content audit m13: no reference with fewer votes...
  reference_min_sellers: 2  # ...or from fewer different seller accounts...
  reference_min_accounts: 3 # ...or fewer accounts in all (sellers and buyers); sales between
                            # two accounts that sold to each other in the window never count
  mailbox_shown: 30         # mailbox items sent to the window at once
  action_burst: 6           # anti-flood: 6 actions at once, then one every 400 ms
  action_refill_ms: 400
  push_every_ms: 500        # an open window is refreshed (another player's action) at most this often

trade:                      # T5.3: the trade window between two adjacent players
  enabled: true
  max_items: 6              # items (stacks or containers) per side
  request_ms: 25000         # an unanswered invitation expires
  action_burst: 6           # anti-flood: 6 trade actions at once, then one every 300 ms
  action_refill_ms: 300     # (a completed trade writes both characters)

stash:                      # docs/02 "Baúl de la cuenta": one chest per account, shared by its characters
  enabled: true
  slots: 30                 # items (stacks, instances or containers with their content)
  action_burst: 8           # anti-flood: 8 moves at once, then one every 250 ms
  action_refill_ms: 250     # (each move writes the character and the stash in one transaction)

living:                     # the living world (livingworld/README.md); each object's numbers live in data/livingworld
  fist_damage: 5            # a bare-handed strike on a breakable object
  tool_damage: 10           # one use of an axe or a pickaxe on one
  push_cooldown_ms: 400     # between two pushes of one player

forge:                      # refine +1..+10 at an anvil (docs/02-game-design.md, "Forja"). Own numbers.
  enabled: true             # false: the anvil only crafts
  station: anvil            # the map item that refines (within 1 tile, like crafting)
  time_ms: 2000             # pace: no other attempt (nor crafting or gathering) for this long
  safe_level: 4             # up to +4 an attempt never fails
  protection: warding_amber # rare drop, never sold by NPCs: a failure loses one level, not the item
  smithing_bonus:           # + chance points of the attempts that can fail
    skill: smithing         # the craft whose level gives them
    per_levels: 6           # +1 every 6 smithing levels...
    max: 5                  # ...at most +5 (smithing 30, the top recipes)
  jewelry_pct: 10           # neck and ring: each level adds 10 % of the attribute's value
  levels:                   # the attempt to reach +1, +2...: success % and temper stones spent
    - { chance: 100, stones: 1 }  # +1
    - { chance: 100, stones: 1 }  # +2
    - { chance: 100, stones: 1 }  # +3
    - { chance: 100, stones: 1 }  # +4
    - { chance: 70, stones: 2 }   # +5: from here a failure breaks the item
    - { chance: 55, stones: 2 }   # +6
    - { chance: 40, stones: 2 }   # +7
    - { chance: 25, stones: 3 }   # +8
    - { chance: 15, stones: 3 }   # +9
    - { chance: 8, stones: 3 }    # +10
  bands:                    # by the item's requires.level (the catalog's bands): the stone, the
                            # copper per attempt per level aimed at (+n costs gold × n) and what
                            # each level adds (floor(level × value)) to a weapon's attack, an
                            # armor piece's armor and a shield's defense
    - { level: 1, stone: lesser_temper_stone, gold: 3, attack: 0.5, armor: 0.2, defense: 0.3 }
    - { level: 5, stone: lesser_temper_stone, gold: 12, attack: 0.7, armor: 0.2, defense: 0.4 }
    - { level: 10, stone: greater_temper_stone, gold: 40, attack: 1, armor: 0.3, defense: 0.6 }
    - { level: 30, stone: greater_temper_stone, gold: 120, attack: 1.4, armor: 0.3, defense: 0.8 }
    - { level: 50, stone: radiant_temper_stone, gold: 300, attack: 1.8, armor: 0.4, defense: 1 }
    - { level: 75, stone: radiant_temper_stone, gold: 700, attack: 2.2, armor: 0.5, defense: 1.2 }

houses:                     # T5.4 (docs/02-game-design.md, "Casas"). Own numbers.
  enabled: true             # false: doors answer "closed" and nobody rents
  min_level: 12             # to rent or receive a house
  period_days: 7            # rent is paid in advance for this long (rent per house: houses.yaml)
  max_periods: 4            # periods that may be paid ahead (renting pays the first)
  max_guests: 20            # names on the guest list (the owner's guild is a switch apart)
  items_per_tile: 3         # item instances per house tile (a stack counts once)
  transfer_minutes: 10      # a transfer offer waits this long at the door
  action_burst: 8           # anti-flood of house actions and item moves in houses:
  action_refill_ms: 300     # 8 at once, then one every 300 ms (each move writes the house)
  # Content audit M6: an owner whose account has not entered the game for this many days
  # loses the house when its rent runs out (no renewal from the mailbox; the items go to
  # the mailbox). Owners are told at every login. 0 turns it off.
  inactive_days: 28

pvp:                        # T5.2 (docs/02-game-design.md, "PvP"). Own numbers, see there why.
  enabled: true             # false: no player can hurt another one (PvE only, as before T5.2)
  min_level: 20             # below it: neither attacks players nor can be attacked by them
  damage_pct: 60            # every player-on-player hit is scaled to this (no one-shots)
  aggressor_ms: 420000      # aggressor skull: 7 min after the last unjustified attack
  lock_ms: 40000            # attacker: no logout or protection zone; victim: no logout
  kill_lock_ms: 540000      # 9 min after an unjustified kill
  kill_credit_ms: 40000     # a death is a kill of everyone that hurt the victim this recently (<= lock_ms)
  murderer:
    hours: 60               # lasts since the last unjustified kill
    windows: [{hours: 20, kills: 4}, {hours: 120, kills: 9}]
    equipment_drop_pct: 40  # minimum drop when dying with it (blessings do not lower it)
    backpack_drop_pct: 100
  outlaw:
    hours: 200
    windows: [{hours: 20, kills: 7}, {hours: 120, kills: 14}]
    equipment_drop_pct: 100
    backpack_drop_pct: 100
  war:
    kill_limit: 30          # the first guild to reach it wins
    hours: 96               # then the one with more kills wins (or a draw)
    answer_hours: 24        # a declaration nobody answers expires
    max_wars: 3             # pending + active wars of one guild

travel:                     # boat routes (T3.5, docs/02-game-design.md "Viajes en barco")
  # In combat: a monster attacked the player, the player took damage or hit a monster or
  # a player within the last combat_block_ms. No sailing and no logout then; a connection
  # closed in combat leaves the character in the world, link-dead, until the fight is over
  # (docs/02 "Bloqueo de logout en combate").
  combat_block_ms: 12000
  # A link-dead character leaves after this long even if monsters keep the fight going (a
  # weak spawn biting a strong character for nothing would hold it forever); a PvP lock
  # still holds it until the lock ends. 0: no cap. Link-dead, it trains no skill and earns
  # no party contribution.
  link_dead_max_ms: 120000
  # Arrival taken: nearest free walkable tile at most this far. Portals (stairs, ladders,
  # holes, rope spots, teleports) land with the same radius.
  arrival_radius: 2

death:
  xp_loss_pct: 10
  skill_loss_pct: 10
  equipment_drop_pct: 10
  backpack_drop_pct: 100
  max_blessings: 5
  xp_loss_pct_all_blessings: 3
  novice_max_level: 8
  corpse_ms: 600000
  corpse_owner_only_ms: 120000

economy:
  coin_ratio: 100
  # Economy log (T4.1, docs/01-architecture.md "Trampas y anti-bot"): every creation and
  # destruction of gold and items, by source. Written outside the tick, in batches.
  log:
    flush_ms: 2000          # a batch goes out at least this often...
    batch_size: 500         # ...or when it has this many rows
  # Reconciliation: each online character's gold and item count must equal what it had
  # at login plus what the log says it gained and lost. A mismatch (possible
  # duplication) is logged and counted (economy_alerts_total{kind="mismatch"}).
  check_every_ms: 60000
  # Outliers: creating more than this per hour of play (in copper, and item units) within
  # a window raises economy_alerts_total{kind="gold_outlier"|"items_outlier"}. Gold
  # counts loot, NPC sales and rewards; items count loot, gathering, crafting, conjuring,
  # rewards and GM items. Generous on purpose: an alert is for a GM to look, not a sanction.
  outlier:
    window_ms: 3600000
    gold_per_hour: { base: 20000, per_level: 2000 }
    items_per_hour: { base: 5000, per_level: 50 }

reports:                    # player reports (T4.1, docs/02-game-design.md "Moderación")
  burst: 3                  # per account: 3 reports in a row...
  refill_ms: 600000         # ...then one every 10 minutes
  same_target_ms: 3600000   # the same account reports the same character once per hour
  max_reason: 200           # characters
  events: 20                # recent events of the reported character in the report

idle:                       # idle disconnect (T4.1); pings and keepalives do not count
  kick_after_ms: 900000     # 15 min without walking, attacking, using or talking
  warn_before_ms: 60000     # a system message this long before

# Bot detection (T4.1, docs/01-architecture.md "Detección de bots"). Each signal is 0..1;
# every eval_every_ms the score gains sum(weight × signal) and halves every half_life_ms.
# A sustained signal of weight w settles near w × 87 points (60 evaluations per half-life
# ≈ 1 / (1 − 0.5^(1/60))). Idle characters have no signals. Responses are graded and
# conservative: log, notify the GMs, an in-game presence check, and a temporary suspension
# only after a failed check or a check an hour ago with the score still there. A ban is
# always a GM's decision (/ban).
antibot:
  eval_every_ms: 60000
  half_life_ms: 3600000
  pause_ms: 180000          # 3 min without a real action is a pause
  signals:
    regularity: { weight: 3, min_samples: 300, cv_low: 0.05, cv_high: 0.25, std_ms: 60 }   # time between actions
    reaction: { weight: 3, min_samples: 15, window_ms: 4000, fast_ms: 200, std_ms: 60 }  # heal after a hit (people: ~300 ms)
    route: { weight: 2, segment: 12, min_steps: 300, repeat_low: 0.5, repeat_high: 0.9 }  # same exact path
    session: { weight: 1, low_ms: 28800000, high_ms: 57600000 }   # 8..16 h without a pause
    income: { weight: 2, min_peers: 5, band_levels: 10, ratio_low: 4, ratio_high: 8 }  # vs median of the band
  # One signal alone settles under notify (3 × 87 = 261 < 300): it takes two to tell a GM.
  thresholds: { log: 100, notify: 300, presence: 400, suspend: 600 }
  presence:
    timeout_ms: 600000      # 10 min of active play to answer; never asked in combat, on a no-logout tile or idle
    delay_ms: 300000        # asked at a random moment of the next 5 min
    fail_points: 150        # a failed check adds this (never past suspend by itself)
    confirm_ms: 3600000     # or suspend if the score is still there an hour after a check
    defer_alert_ms: 1800000 # a due check dodged for 30 min (always fighting...) alerts the GMs
    random_per_hour: 0.02   # random checks for anyone (no effect if failed): a check reveals nothing
  suspend_ms: 86400000      # 24 h; longer bans are for a GM

# Conditions (T3.2, docs/02-game-design.md "Condiciones"). Each source (spell, monster
# attack) says how strong and how long; these are the rules of each condition.
#   kind: damage = a hit of `element` every interval_ms (resistances apply), up to
#         max_ticks hits left; speed = speed × (100 + speed_pct) / 100; skill = +amount
#         levels of `skill` in combat; invisible = unseen by players and by monsters
#         without behavior.sees_invisible; regen = the vocation regeneration is
#         regen_pct % stronger (food, content audit m2).
#   stacking: refresh keeps the longer time (or more hits) and the stronger damage;
#             add sums them, up to max_ticks / max_ms.
#   persists: kept across a logout with the time left (the others end on logout).
conditions:
  poison:    { kind: damage, element: earth, interval_ms: 2200, max_ticks: 25, stacking: add, persists: true }
  burning:   { kind: damage, element: fire, interval_ms: 3300, max_ticks: 7, stacking: refresh, persists: true }
  shocked:   { kind: damage, element: energy, interval_ms: 1700, max_ticks: 5, stacking: refresh, persists: true }
  slowed:    { kind: speed, speed_pct: -45, max_ms: 15000, stacking: refresh, cancels: [hasted], persists: true }
  hasted:    { kind: speed, speed_pct: 35, max_ms: 45000, stacking: refresh, cancels: [slowed] }
  invisible: { kind: invisible, max_ms: 90000, stacking: refresh }
  keen_eye:  { kind: skill, skill: distance, amount: 7, max_ms: 45000, stacking: refresh }
  # Content audit m2: food. Eating adds its consumable.food_ms (up to max_ms: then the
  # stomach is full and pure food is refused); while it lasts the vocation regeneration is
  # regen_pct % stronger. Without it the plain regeneration goes on: nobody starves.
  well_fed:  { kind: regen, regen_pct: 100, max_ms: 1200000, stacking: add, persists: true }
