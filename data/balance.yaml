# Balance constants (docs/02-game-design.md). Initial values: tune here, never in code.
# Our own numbers: they aim for a familiar feel but must never be copied from Tibia
# (CLAUDE.md legal rule).
movement:
  base_step_ms: 1000        # step = base_step_ms * terrain% / speed (see 02-game-design)
  diagonal_cost: 1.5
  max_path_tiles: 100

experience:
  # Total XP for level n = a*n^3 + b*n^2 + c*n (+ d). Own curve, zero at level 1.
  # Pace target: level 8 in ~1 h, 20 in ~8 h, 50 in ~80 h.
  curve: { a: 12, b: -24, c: 12 }
  max_level: 1000

skills:
  base:
    fist: { start_level: 10, base_tries: 45 }
    sword: { start_level: 10, base_tries: 45 }
    axe: { start_level: 10, base_tries: 45 }
    club: { start_level: 10, base_tries: 45 }
    distance: { start_level: 10, base_tries: 32 }
    shield: { start_level: 10, base_tries: 85 }
    magic: { start_level: 0, base_tries: 1450 }   # tries = mana spent
    fishing: { start_level: 10, base_tries: 22 }
    mining: { start_level: 1, base_tries: 20 }
    woodcutting: { start_level: 1, base_tries: 20 }
    smithing: { start_level: 1, base_tries: 20 }
    cooking: { start_level: 1, base_tries: 20 }
    alchemy: { start_level: 1, base_tries: 20 }
  shield_max_tries_per_round: 2
  afk:
    after_ms: 600000          # 10 min against a target that does not fight back
    factor: 0.25

combat:
  attack_interval_ms: 2000
  # Melee (docs/02-game-design.md, "Combate"):
  #   max_hit = skill * attack / skill_attack_divisor + level / level_divisor, × mode attack
  #   hit = random(0, max_hit) × (1 - physical resistance)
  #   target armor removes random(armor/2, armor); a monster's defense random(0, defense/2);
  #   a player's shield random(0, shield_defense × mode defense / shield_block_divisor).
  fist_attack: 7              # attack value of bare hands (no weapon equipped)
  skill_attack_divisor: 10
  level_divisor: 4
  shield_block_divisor: 4
  monster_corpse_ms: 60000    # how long a monster's remains (and its loot) stay
  # Wands (T1.9): a distance attack of the weapon's element and range that hits
  # random(attack × wand_min_factor, attack) × (1 − resistance %). Armor does not stop it.
  wand_min_factor: 0.5
  modes:
    offensive: { attack: 1.25, defense: 0.55 }
    balanced: { attack: 1.0, defense: 1.0 }
    defensive: { attack: 0.65, defense: 1.5 }

inventory:
  start_container: backpack   # equipped in the backpack slot of a character that never played
  max_open_containers: 16     # container windows a player can have open at once
  use_cooldown_ms: 1000       # between two uses of a consumable
  reach: 1                    # tiles (Chebyshev, same floor) to take, drop, open or use on the ground

gathering:                  # fishing and mining (T1.12); spot numbers live in data/items
  use_interval_ms: 1500     # rate limit: one gathering attempt per player at most this often
  afk:
    after_ms: 900000        # gathering 15 min without leaving the tile...
    factor: 0.25            # ...earns skill tries at this rate (like skills.afk)

chat:                       # T1.13 (docs/02-game-design.md, "Chat")
  max_length: 255           # characters per message (the protocol maximum)
  # Who hears each local mode: players within this many tiles (x and y), same floor.
  ranges:
    whisper: { x: 1, y: 1 }
    say: { x: 7, y: 5 }     # the visible screen
    yell: { x: 18, y: 14 }
  # Anti-flood, all channels together: a bucket of `burst` messages that refills one
  # every `refill_ms`; sending with it empty mutes the player for `mute_ms`.
  flood:
    burst: 5
    refill_ms: 2000
    mute_ms: 10000
  global_interval_ms: 10000 # between two global-channel messages of the same player

party:                      # T3.3 (docs/02-game-design.md, "Grupos")
  max_members: 6            # leader included
  invite_ms: 45000          # an invitation expires after this
  update_ms: 1000           # members' health/mana/level refresh at most this often
  # Shared experience: a kill is shared by the members that are on its floor within
  # `share_distance` tiles (Chebyshev) of it, contributed (damage to a monster, healing a
  # member, or a monster's attack taken) within `contribution_ms`, and whose level is at
  # least `level_range_pct` % of the highest of them (or at most `level_gap_always`
  # levels below it, so that low levels can share).
  share_distance: 24
  contribution_ms: 75000
  level_range_pct: 70
  level_gap_always: 3
  # The shared pot grows `bonus_pct_per_member` % per sharing member beyond the first,
  # up to `max_bonus_pct` %.
  bonus_pct_per_member: 6
  max_bonus_pct: 24

travel:                     # boat routes (T3.5, docs/02-game-design.md "Viajes en barco")
  # No sailing while in combat: a monster attacked the player, the player took damage or
  # hit a monster within the last combat_block_ms.
  combat_block_ms: 12000
  arrival_radius: 2         # arrival taken: nearest free walkable tile at most this far

death:
  xp_loss_pct: 10
  skill_loss_pct: 10
  equipment_drop_pct: 10
  backpack_drop_pct: 100
  max_blessings: 5
  xp_loss_pct_all_blessings: 3
  novice_max_level: 8
  corpse_ms: 600000
  corpse_owner_only_ms: 120000

economy:
  coin_ratio: 100
  # Economy log (T4.1, docs/01-architecture.md "Trampas y anti-bot"): every creation and
  # destruction of gold and items, by source. Written outside the tick, in batches.
  log:
    flush_ms: 2000          # a batch goes out at least this often...
    batch_size: 500         # ...or when it has this many rows
  # Reconciliation: each online character's gold and item count must equal what it had
  # at login plus what the log says it gained and lost. A mismatch (possible
  # duplication) is logged and counted (economy_alerts_total{kind="mismatch"}).
  check_every_ms: 60000
  # Outliers: creating more than this per hour of play (in copper, and item units) within
  # a window raises economy_alerts_total{kind="gold_outlier"|"items_outlier"}. Gold
  # counts loot, NPC sales and rewards; items count loot, gathering, crafting, conjuring,
  # rewards and GM items. Generous on purpose: an alert is for a GM to look, not a sanction.
  outlier:
    window_ms: 3600000
    gold_per_hour: { base: 20000, per_level: 2000 }
    items_per_hour: { base: 5000, per_level: 50 }

reports:                    # player reports (T4.1, docs/02-game-design.md "Moderación")
  burst: 3                  # per account: 3 reports in a row...
  refill_ms: 600000         # ...then one every 10 minutes
  same_target_ms: 3600000   # the same account reports the same character once per hour
  max_reason: 200           # characters
  events: 20                # recent events of the reported character in the report

idle:                       # idle disconnect (T4.1); pings and keepalives do not count
  kick_after_ms: 900000     # 15 min without walking, attacking, using or talking
  warn_before_ms: 60000     # a system message this long before

# Bot detection (T4.1, docs/01-architecture.md "Detección de bots"). Each signal is 0..1;
# every eval_every_ms the score gains sum(weight × signal) and halves every half_life_ms.
# A sustained signal of weight w settles near w × 87 points (60 evaluations per half-life
# ≈ 1 / (1 − 0.5^(1/60))). Idle characters have no signals. Responses are graded and
# conservative: log, notify the GMs, an in-game presence check, and a temporary suspension
# only after a failed check or a check an hour ago with the score still there. A ban is
# always a GM's decision (/ban).
antibot:
  eval_every_ms: 60000
  half_life_ms: 3600000
  pause_ms: 180000          # 3 min without a real action is a pause
  signals:
    regularity: { weight: 3, min_samples: 300, cv_low: 0.05, cv_high: 0.25 }   # time between actions
    reaction: { weight: 3, min_samples: 15, window_ms: 4000, fast_ms: 300, std_ms: 60 }  # heal after a hit
    route: { weight: 2, segment: 12, min_steps: 300, repeat_low: 0.5, repeat_high: 0.9 }  # same exact path
    session: { weight: 1, low_ms: 28800000, high_ms: 57600000 }   # 8..16 h without a pause
    income: { weight: 2, min_peers: 5, band_levels: 10, ratio_low: 4, ratio_high: 8 }  # vs median of the band
  thresholds: { log: 100, notify: 250, presence: 400, suspend: 600 }
  presence:
    timeout_ms: 600000      # 10 min of active play to answer; never asked in combat, on a no-logout tile or idle
    delay_ms: 300000        # asked at a random moment of the next 5 min
    fail_points: 150        # a failed check adds this (never past suspend by itself)
    confirm_ms: 3600000     # or suspend if the score is still there an hour after a check
    defer_alert_ms: 1800000 # a due check dodged for 30 min (always fighting...) alerts the GMs
    random_per_hour: 0.02   # random checks for anyone (no effect if failed): a check reveals nothing
  suspend_ms: 86400000      # 24 h; longer bans are for a GM

# Conditions (T3.2, docs/02-game-design.md "Condiciones"). Each source (spell, monster
# attack) says how strong and how long; these are the rules of each condition.
#   kind: damage = a hit of `element` every interval_ms (resistances apply), up to
#         max_ticks hits left; speed = speed × (100 + speed_pct) / 100; skill = +amount
#         levels of `skill` in combat; invisible = unseen by players and by monsters
#         without behavior.sees_invisible.
#   stacking: refresh keeps the longer time (or more hits) and the stronger damage;
#             add sums them, up to max_ticks / max_ms.
#   persists: kept across a logout with the time left (the others end on logout).
conditions:
  poison:    { kind: damage, element: earth, interval_ms: 2200, max_ticks: 25, stacking: add, persists: true }
  burning:   { kind: damage, element: fire, interval_ms: 3300, max_ticks: 7, stacking: refresh, persists: true }
  shocked:   { kind: damage, element: energy, interval_ms: 1700, max_ticks: 5, stacking: refresh, persists: true }
  slowed:    { kind: speed, speed_pct: -45, max_ms: 15000, stacking: refresh, cancels: [hasted], persists: true }
  hasted:    { kind: speed, speed_pct: 35, max_ms: 45000, stacking: refresh, cancels: [slowed] }
  invisible: { kind: invisible, max_ms: 90000, stacking: refresh }
  keen_eye:  { kind: skill, skill: distance, amount: 7, max_ms: 45000, stacking: refresh }
