id: puerto_armorer
name: npc.puerto_armorer.name
sprite: npcs/puerto_armorer
look:
  sex: male
  body: sturdy
  skin: fair
  hair: crop
  hair_color: brown
  beard: full
  worn:
    torso: { shape: plate, tint: iron }
    legs: { shape: trousers, tint: brown }
    feet: { shape: boots, tint: tar }
notes: >-
  Weapons, armor and shields for levels 1-10. Sells at the item value; buys back at about a
  third of it, so trading between players stays worth it (docs/02-game-design.md).
dialog:
  start: greet
  nodes:
    greet:
      text: npc.puerto_armorer.greet
      options:
        - text: dialog.trade
          action: { open_shop: armorer_shop }
        - text: npc.puerto_armorer.opt_advice
          goto: advice
        - text: npc.puerto_armorer.opt_salvage
          goto: salvage
        - text: dialog.bye
          action: close
    advice:
      text: npc.puerto_armorer.advice
      options:
        - text: dialog.trade
          action: { open_shop: armorer_shop }
        - { text: dialog.back, goto: greet }
    salvage:
      text: npc.puerto_armorer.salvage
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
# Lote 11 (docs/02 "Catálogo de equipo"): bands 1 and 2 and the band 3 weapons (from level
# 10, for the island's last hunts) at their value; it buys them at a third, and the retired
# pieces of the island too (the old copies).
shop:
  id: armorer_shop
