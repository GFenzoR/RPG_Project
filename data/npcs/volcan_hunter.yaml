id: volcan_hunter
name: npc.volcan_hunter.name
sprite: npcs/hunter_volcanic
notes: >-
  Head of the hunters of Brasal (lote 12): keeps the bounty ledger of the town, three
  repeatable tasks (data/quests/bounty_*.yaml): 30 ash hounds from level 26, 20 slag golems
  from 39 and 8 ember wyrmlings from 48, each every 20 hours (docs/02 "Tareas"). He
  stands at the north edge of the plaza (3655,5783), by the path to the ash flats.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.volcan_hunter.greet
      options:
        - text: npc.volcan_hunter.opt_report_hounds
          if: { quest_state: { quest: bounty_hounds, state: in_progress, step: report } }
          goto: hounds_paid
        - text: npc.volcan_hunter.opt_report_golems
          if: { quest_state: { quest: bounty_golems, state: in_progress, step: report } }
          goto: golems_paid
        - text: npc.volcan_hunter.opt_report_wyrmlings
          if: { quest_state: { quest: bounty_wyrmlings, state: in_progress, step: report } }
          goto: wyrmlings_paid
        - text: npc.volcan_hunter.opt_board
          goto: board
        - text: npc.volcan_hunter.opt_mountain
          goto: mountain
        - text: dialog.bye
          action: close
    # The board: a task shows its offer while available (and at its level) or its wait while
    # cooling down (docs/06 "Quests repetibles"); one in progress shows in the quest log.
    board:
      text: npc.volcan_hunter.board
      options:
        - text: npc.volcan_hunter.opt_hounds
          if: [{ quest_state: { quest: bounty_hounds, state: available } }, { level_at_least: 26 }]
          goto: hounds_offer
        - text: npc.volcan_hunter.opt_hounds
          if: { quest_state: { quest: bounty_hounds, state: cooling_down } }
          goto: wait
        - text: npc.volcan_hunter.opt_golems
          if: [{ quest_state: { quest: bounty_golems, state: available } }, { level_at_least: 39 }]
          goto: golems_offer
        - text: npc.volcan_hunter.opt_golems
          if: { quest_state: { quest: bounty_golems, state: cooling_down } }
          goto: wait
        - text: npc.volcan_hunter.opt_wyrmlings
          if: [{ quest_state: { quest: bounty_wyrmlings, state: available } }, { level_at_least: 48 }]
          goto: wyrmlings_offer
        - text: npc.volcan_hunter.opt_wyrmlings
          if: { quest_state: { quest: bounty_wyrmlings, state: cooling_down } }
          goto: wait
        - { text: dialog.back, goto: greet }
    hounds_offer:
      text: npc.volcan_hunter.hounds_offer
      options:
        - text: dialog.accept
          action: { start_quest: bounty_hounds }
          goto: accepted
        - text: dialog.decline
          goto: board
    golems_offer:
      text: npc.volcan_hunter.golems_offer
      options:
        - text: dialog.accept
          action: { start_quest: bounty_golems }
          goto: accepted
        - text: dialog.decline
          goto: board
    wyrmlings_offer:
      text: npc.volcan_hunter.wyrmlings_offer
      options:
        - text: dialog.accept
          action: { start_quest: bounty_wyrmlings }
          goto: accepted
        - text: dialog.decline
          goto: board
    accepted:
      text: npc.volcan_hunter.accepted
      options:
        - { text: dialog.back, goto: board }
        - { text: dialog.bye, action: close }
    wait:
      text: npc.volcan_hunter.wait
      options:
        - { text: dialog.back, goto: board }
        - { text: dialog.bye, action: close }
    hounds_paid:
      text: npc.volcan_hunter.hounds_paid
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    golems_paid:
      text: npc.volcan_hunter.golems_paid
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    wyrmlings_paid:
      text: npc.volcan_hunter.wyrmlings_paid
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    mountain:
      text: npc.volcan_hunter.mountain
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
