id: puerto_provisioner
name: npc.puerto_provisioner.name
sprite: npcs/puerto_provisioner
look:
  body: sturdy
  skin: brown
  hair: short
  hair_color: black
  beard: none
  worn:
    torso: { shape: tunic, tint: ochre }
    legs: { shape: trousers, tint: black }
    feet: { shape: shoes, tint: tan_leather }
notes: >-
  Tools, food, poultices and a spare backpack (a death above level 8 takes the worn one);
  buys hunting materials from the island's monsters at about a third of their value. No
  shovel since the content audit (m1): nothing in the world is dug yet. The rope climbs out
  of the sinkhole of the wreck beach (portals.yaml).
dialog:
  start: greet
  nodes:
    greet:
      text: npc.puerto_provisioner.greet
      options:
        - text: dialog.trade
          action: { open_shop: provisions_shop }
        - text: npc.puerto_provisioner.opt_tools
          goto: tools
        - text: npc.puerto_provisioner.opt_gossip
          goto: gossip
        - text: dialog.bye
          action: close
    tools:
      text: npc.puerto_provisioner.tools
      options:
        - text: dialog.trade
          action: { open_shop: provisions_shop }
        - { text: dialog.back, goto: greet }
    gossip:
      text: npc.puerto_provisioner.gossip
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
shop:
  id: provisions_shop
  sells:
    - { item: rope, price: 45 }
    - { item: pickaxe, price: 120 }
    - { item: fishing_rod, price: 140 }
    - { item: felling_axe, price: 110 }
    - { item: smithing_hammer, price: 95 }
    - { item: ship_biscuit, price: 3 }
    - { item: seaweed_poultice, price: 25 }
    - { item: backpack, price: 20 }
  buys:
    - { item: rope, price: 14 }
    - { item: pickaxe, price: 40 }
    - { item: fishing_rod, price: 50 }
    - { item: felling_axe, price: 38 }
    - { item: smithing_hammer, price: 32 }
    - { item: birch_log, price: 1 }
    - { item: iron_ingot, price: 11 }
    - { item: grilled_fish, price: 2 }
    - { item: raw_fish, price: 1 }
    - { item: boar_meat, price: 1 }
    - { item: gull_feather, price: 1 }
    - { item: bat_wing, price: 1 }
    - { item: crab_claw, price: 2 }
    - { item: iron_ore, price: 3 }
    - { item: wolf_pelt, price: 5 }
    - { item: boar_tusk, price: 4 }
    - { item: spider_silk, price: 6 }
    - { item: beetle_carapace, price: 10 }
    - { item: tarnished_locket, price: 40 }
