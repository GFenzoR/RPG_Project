id: bosque_druid
name: npc.bosque_druid.name
sprite: npcs/druid_elder
notes: >-
  Keeper of the grove of Raigal and the quest giver of Chapter 2 (ch2_roots, then
  ch2_coffer). Chapter 1 must be done to hear her out; each part has its own level.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.bosque_druid.greet
      options:
        - text: npc.bosque_druid.opt_boat
          if:
            - { quest_state: { quest: ch1_shipwreck, state: completed } }
            - { quest_not_started: ch2_roots }
          goto: ch2_offer
        - text: npc.bosque_druid.opt_toads
          if: { quest_state: { quest: ch2_roots, state: in_progress, step: cull_toads } }
          goto: ch2_toads
        - text: npc.bosque_druid.opt_glowcaps
          if: { quest_state: { quest: ch2_roots, state: in_progress, step: gather_glowcaps } }
          goto: ch2_glowcaps
        - text: npc.bosque_druid.opt_give_glowcaps
          if:
            - { quest_state: { quest: ch2_roots, state: in_progress, step: deliver_glowcaps } }
            - { has_item: { item: glowcap, count: 6 } }
          action: { take_item: { item: glowcap, count: 6 } }
          goto: ch2_lantern
        - text: npc.bosque_druid.opt_ferryman
          if: { quest_state: { quest: ch2_roots, state: in_progress, step: ask_ferryman } }
          goto: ch2_go_ferryman
        - text: npc.bosque_druid.opt_camp
          if:
            - { quest_state: { quest: ch2_roots, state: completed } }
            - { quest_not_started: ch2_coffer }
          goto: ch2_camp_offer
        - text: npc.bosque_druid.opt_progress
          if: { quest_state: { quest: ch2_coffer, state: in_progress } }
          goto: ch2_progress
        - text: npc.bosque_druid.opt_grove
          goto: grove
        - text: dialog.bye
          action: close
    ch2_offer:
      text: npc.bosque_druid.ch2_offer
      options:
        - text: dialog.accept
          if: { level_at_least: 15 }
          action: { start_quest: ch2_roots }
          goto: ch2_accepted
        - text: dialog.decline
          goto: greet
    ch2_accepted:
      text: npc.bosque_druid.ch2_accepted
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_toads:
      text: npc.bosque_druid.ch2_toads
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_glowcaps:
      text: npc.bosque_druid.ch2_glowcaps
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_lantern:
      text: npc.bosque_druid.ch2_lantern
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_go_ferryman:
      text: npc.bosque_druid.ch2_go_ferryman
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_camp_offer:
      text: npc.bosque_druid.ch2_camp_offer
      options:
        - text: dialog.accept
          if: { level_at_least: 20 }
          action: { start_quest: ch2_coffer }
          goto: ch2_camp_accepted
        - text: dialog.decline
          goto: greet
    ch2_camp_accepted:
      text: npc.bosque_druid.ch2_camp_accepted
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_progress:
      text: npc.bosque_druid.ch2_progress
      options:
        - text: npc.bosque_druid.opt_give_tallies
          if:
            - { quest_state: { quest: ch2_coffer, state: in_progress, step: deliver_tallies } }
            - { has_item: { item: smuggler_tally, count: 4 } }
          action: { take_item: { item: smuggler_tally, count: 4 } }
          goto: ch2_tallies
        - text: npc.bosque_druid.opt_give_coffer
          if:
            - { quest_state: { quest: ch2_coffer, state: in_progress, step: return_coffer } }
            - { has_item: { item: sealed_coffer } }
          action: { take_item: { item: sealed_coffer } }
          goto: ch2_coffer_opened
        - { text: dialog.back, goto: greet }
    ch2_tallies:
      text: npc.bosque_druid.ch2_tallies
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch2_coffer_opened:
      text: npc.bosque_druid.ch2_coffer_opened
      options:
        - { text: npc.bosque_druid.opt_root, goto: ch2_root }
        - { text: dialog.bye, action: close }
    ch2_root:
      text: npc.bosque_druid.ch2_root
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    grove:
      text: npc.bosque_druid.grove
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
