id: bosque_ferryman
name: npc.bosque_ferryman.name
sprite: npcs/bosque_ferryman
look:
  sex: male
  body: sturdy
  skin: fair
  hair: short
  hair_color: brown
  beard: short
  worn:
    head: { shape: cap, tint: green }
    torso: { shape: tunic, tint: linen }
    legs: { shape: trousers, tint: green }
    feet: { shape: boots, tint: dark_leather }
notes: >-
  Captain of the Raigal dock (data/boat_routes.yaml: bosque_to_puerto and, from level 25,
  bosque_to_volcan). Chapter 2 part 1
  ends with him: he saw where the unflagged boat landed. Since lote 12 he gives the side
  quest ferryman_jetty (level 22, once ch2_roots is completed: it follows that boat): the
  smugglers' jetty on the east shore.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.bosque_ferryman.greet
      options:
        - text: npc.bosque_ferryman.opt_ch2_boat
          if: { quest_state: { quest: ch2_roots, state: in_progress, step: ask_ferryman } }
          goto: ch2_boat
        - text: npc.bosque_ferryman.opt_jetty
          # It follows "that unflagged boat" of Chapter 2: only for who saw it (ch2_roots).
          if:
            - { quest_not_started: ferryman_jetty }
            - { level_at_least: 22 }
            - { quest_state: { quest: ch2_roots, state: completed } }
          goto: jetty_offer
        - text: npc.bosque_ferryman.opt_jetty_help
          if: { quest_state: { quest: ferryman_jetty, state: in_progress, step: see_jetty } }
          goto: jetty_where
        - text: npc.bosque_ferryman.opt_jetty_help
          if: { quest_state: { quest: ferryman_jetty, state: in_progress, step: clear_crawlers } }
          goto: jetty_crawlers
        - text: npc.bosque_ferryman.opt_jetty_report
          if: { quest_state: { quest: ferryman_jetty, state: in_progress, step: report } }
          goto: jetty_report
        - text: npc.bosque_ferryman.opt_jetty_after
          if: { quest_state: { quest: ferryman_jetty, state: completed } }
          goto: jetty_after
        - text: dialog.ask_travel
          goto: travel
        - text: npc.bosque_ferryman.opt_island
          goto: island
        - text: dialog.bye
          action: close
    ch2_boat:
      text: npc.bosque_ferryman.ch2_boat
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    jetty_offer:
      text: npc.bosque_ferryman.jetty_offer
      options:
        - text: dialog.accept
          action: { start_quest: ferryman_jetty }
          goto: jetty_accepted
        - text: dialog.decline
          goto: greet
    jetty_accepted:
      text: npc.bosque_ferryman.jetty_accepted
      options:
        - { text: dialog.bye, action: close }
    jetty_where:
      text: npc.bosque_ferryman.jetty_where
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    jetty_crawlers:
      text: npc.bosque_ferryman.jetty_crawlers
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    jetty_report:
      text: npc.bosque_ferryman.jetty_report
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    jetty_after:
      text: npc.bosque_ferryman.jetty_after
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    island:
      text: npc.bosque_ferryman.island
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    travel:
      text: npc.bosque_ferryman.travel
      boat_routes: true             # data/boat_routes.yaml: routes with captain bosque_ferryman
      options:
        - { text: dialog.back, goto: greet }
