id: volcan_smith
name: npc.volcan_smith.name
sprite: npcs/smith_volcanic
notes: >-
  Smith of Brasal: sells the first embersteel pieces (levels 30-34), smithing tools and elm
  logs, and buys the island's materials at about a third of their value. Chapter 3 part 1
  ends with him: he reads the forge-sign on the ember root.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.volcan_smith.greet
      options:
        - text: npc.volcan_smith.opt_ch3_marks
          if:
            - { quest_state: { quest: ch3_embers, state: in_progress, step: ask_smith } }
            - { has_item: { item: ember_root } }
          goto: ch3_marks
        - text: npc.volcan_smith.opt_ch3_marks
          if:
            - { quest_state: { quest: ch3_embers, state: in_progress, step: ask_smith } }
            - { lacks_item: { item: ember_root } }
          goto: ch3_no_root
        - text: dialog.trade
          action: { open_shop: brasal_smithy }
        - text: npc.volcan_smith.opt_embersteel
          goto: embersteel
        - text: dialog.bye
          action: close
    ch3_marks:
      text: npc.volcan_smith.ch3_marks
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch3_no_root:
      text: npc.volcan_smith.ch3_no_root
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    embersteel:
      text: npc.volcan_smith.embersteel
      options:
        - text: dialog.trade
          action: { open_shop: brasal_smithy }
        - { text: dialog.back, goto: greet }
# Lote 11 (docs/02 "Catálogo de equipo"): band 4 (embersteel) at 1.25 times its value, the
# shield included; it buys it at a third and the obsidian ring. The wyrm pieces are band 5:
# not obtainable until its island, so their recipes and buyers left with them.
shop:
  id: brasal_smithy
  sells:
    - { item: embersteel_sabre, price: 2500 }
    - { item: embersteel_axe, price: 2500 }
    - { item: embersteel_mace, price: 2500 }
    - { item: embersteel_longbow, price: 2500 }
    - { item: embersteel_crossbow, price: 2250 }
    - { item: embersteel_shield, price: 1900 }
    - { item: embersteel_cuirass, price: 2250 }
    - { item: embersteel_helm, price: 1000 }
    - { item: embersteel_greaves, price: 1000 }
    - { item: embersteel_sabatons, price: 1000 }
    - { item: arrow, price: 2 }
    - { item: bolt, price: 2 }
    - { item: smithing_hammer, price: 105 }
    - { item: pickaxe, price: 60 }
    - { item: elm_log, price: 12 }
  buys:
    - { item: embersteel_sabre, price: 660 }
    - { item: embersteel_axe, price: 660 }
    - { item: embersteel_mace, price: 660 }
    - { item: embersteel_longbow, price: 660 }
    - { item: embersteel_crossbow, price: 600 }
    - { item: embersteel_shield, price: 500 }
    - { item: embersteel_cuirass, price: 600 }
    - { item: embersteel_helm, price: 260 }
    - { item: embersteel_greaves, price: 260 }
    - { item: embersteel_sabatons, price: 260 }
    - { item: obsidian_ring, price: 400 }
    - { item: embersteel_ingot, price: 26 }
    - { item: ember_ore, price: 7 }
    - { item: ash_pelt, price: 20 }
    - { item: salamander_scale, price: 16 }
    - { item: slag_core, price: 36 }
    - { item: wyrm_scale, price: 45 }
    - { item: rough_stone, price: 1 } # content audit m4: the ember veins give it too
