id: volcan_priest
name: npc.volcan_priest.name
sprite: npcs/priest_volcanic
notes: >-
  Temple of the Still Flame in Brasal (respawn point of the island). Heals for free and sells
  the same five blessings as the other temples at the same flat price (docs/02 "Muerte").
dialog:
  start: greet
  nodes:
    greet:
      text: npc.volcan_priest.greet
      options:
        - text: npc.volcan_priest.opt_blessings
          goto: blessings
        - text: npc.volcan_priest.opt_heal
          action: { heal: true }
          goto: healed
        - text: npc.volcan_priest.opt_mountain
          goto: mountain
        - text: dialog.bye
          action: close
    blessings:
      text: npc.volcan_priest.blessings
      options:
        - text: npc.puerto_priest.bless_shore
          action: { bless: { blessing: shore_light, price: 200 } }
          goto: blessed
        - text: npc.puerto_priest.bless_hearth
          action: { bless: { blessing: hearth_light, price: 200 } }
          goto: blessed
        - text: npc.puerto_priest.bless_keel
          action: { bless: { blessing: keel_light, price: 200 } }
          goto: blessed
        - text: npc.puerto_priest.bless_star
          action: { bless: { blessing: star_light, price: 200 } }
          goto: blessed
        - text: npc.puerto_priest.bless_deep
          action: { bless: { blessing: deep_light, price: 200 } }
          goto: blessed
        - { text: dialog.back, goto: greet }
    blessed:
      text: npc.volcan_priest.blessed
      options:
        - { text: npc.volcan_priest.opt_more, goto: blessings }
        - { text: dialog.bye, action: close }
    healed:
      text: npc.volcan_priest.healed
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    mountain:
      text: npc.volcan_priest.mountain
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
