id: volcan_priest
name: npc.volcan_priest.name
sprite: npcs/volcan_priest
look:
  sex: female
  body: slender
  skin: tan
  hair: long
  hair_color: auburn
  beard: none
  worn:
    head: { shape: hood, tint: ember }
    torso: { shape: robe, tint: black }
    feet: { shape: shoes, tint: tar }
notes: >-
  Temple of the Still Flame in Brasal (respawn point of the island). Heals for free and sells
  the same five blessings as the other temples at the same level-based price (docs/02 "Muerte").
  Since lote 12 she gives the side quest flame_crater (level 45): reach the lava lake in the
  crater's heart and thin the wyrmlings' nest (it ends on the last kill), and she quenches
  Bram's obsidian ring in the Still Flame (smith_ring: set_flag smith_ring_quenched, the
  quest's flag_equals step).
dialog:
  start: greet
  nodes:
    greet:
      text: npc.volcan_priest.greet
      options:
        - text: npc.volcan_priest.opt_blessings
          goto: blessings
        - text: npc.volcan_priest.opt_heal
          action: { heal: true }
          goto: healed
        - text: npc.volcan_priest.opt_quench
          if: { quest_state: { quest: smith_ring, state: in_progress, step: quench_ring } }
          action: { set_flag: { key: smith_ring_quenched, value: 1 } }
          goto: ring_quenched
        - text: npc.volcan_priest.opt_crater
          if: [{ quest_not_started: flame_crater }, { level_at_least: 45 }]
          goto: crater_offer
        - text: npc.volcan_priest.opt_crater_help
          if: { quest_state: { quest: flame_crater, state: in_progress } }
          goto: crater_help
        - text: npc.volcan_priest.opt_crater_done
          if: { quest_state: { quest: flame_crater, state: completed } }
          goto: crater_thanks
        - text: npc.volcan_priest.opt_mountain
          goto: mountain
        - text: dialog.trade
          action: { open_shop: still_flame_shop }
        - text: dialog.bye
          action: close
    blessings:
      text: npc.volcan_priest.blessings
      options:
        - text: npc.puerto_priest.bless_shore
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: shore_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_hearth
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: hearth_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_keel
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: keel_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_star
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: star_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_deep
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: deep_light, price: 50, per_level: 20 } }
          goto: blessed
        - { text: dialog.back, goto: greet }
    blessed:
      text: npc.volcan_priest.blessed
      options:
        - { text: npc.volcan_priest.opt_more, goto: blessings }
        - { text: dialog.bye, action: close }
    healed:
      text: npc.volcan_priest.healed
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ring_quenched:
      text: npc.volcan_priest.ring_quenched
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    crater_offer:
      text: npc.volcan_priest.crater_offer
      options:
        - text: dialog.accept
          action: { start_quest: flame_crater }
          goto: crater_accepted
        - text: dialog.decline
          goto: greet
    crater_accepted:
      text: npc.volcan_priest.crater_accepted
      options:
        - { text: dialog.bye, action: close }
    crater_help:
      text: npc.volcan_priest.crater_help
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    crater_thanks:
      text: npc.volcan_priest.crater_thanks
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    mountain:
      text: npc.volcan_priest.mountain
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
# Content audit (2026-11): the temple keeps what a caster needs on the island: draughts,
# poultices and the obsidian wand and blackfrost staff of the old forge-priests; since
# lote 11 also the band 4 robe and amulet (docs/02 "Catálogo de equipo").
shop:
  id: still_flame_shop
  sells:
    - { item: mana_draught, price: 24 }
    - { item: concentrated_mana_draught, price: 50 }
    - { item: seaweed_poultice, price: 25 }
    - { item: health_draught, price: 60 }
    - { item: concentrated_health_draught, price: 125 }
    - { item: obsidian_wand, price: 2500 }
    - { item: blackfrost_staff, price: 2500 }
    - { item: ashweave_robe, price: 1500 }
    - { item: cinder_amulet, price: 2000 }
  buys:
    - { item: obsidian_wand, price: 660 }
    - { item: blackfrost_staff, price: 660 }
    - { item: ashweave_robe, price: 400 }
    - { item: cinder_amulet, price: 530 }
