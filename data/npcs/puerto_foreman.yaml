id: puerto_foreman
name: npc.puerto_foreman.name
role: npc.puerto_foreman.role
sprite: npcs/puerto_foreman
look:
  sex: male
  body: sturdy
  skin: fair
  hair: crop
  hair_color: grey
  beard: full
  worn:
    torso: { shape: leather, tint: hide }
    legs: { shape: trousers, tint: brown }
    feet: { shape: boots, tint: dark_leather }
notes: >-
  Stands at the old mine entrance (surface). Hands over the bosun's logbook in Chapter 1
  gives the foreman_ore side quest, and gives ch1_bosun_trail, the fourth quest of
  Chapter 1's island chain.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.puerto_foreman.greet
      options:
        - text: npc.puerto_foreman.opt_ch1_bosun
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: talk_foreman } }
          action: { give_item: bosun_logbook }
          goto: ch1_logbook
        - text: npc.puerto_foreman.opt_ch1_lost
          if:
            - { quest_state: { quest: ch1_shipwreck, state: in_progress, step: return_logbook } }
            - { lacks_item: { item: bosun_logbook } }
          action: { give_item: bosun_logbook }
          goto: ch1_logbook_again
        - text: npc.puerto_foreman.opt_work
          if:
            - { quest_not_started: foreman_ore }
            - { level_at_least: 10 }
          goto: ore_offer
        - text: npc.puerto_foreman.opt_ore_progress
          if: { quest_state: { quest: foreman_ore, state: in_progress, step: gather_ore } }
          goto: ore_hint
        - text: npc.puerto_foreman.opt_ore_deliver
          if:
            - { quest_state: { quest: foreman_ore, state: in_progress, step: deliver_ore } }
            - { has_item: { item: iron_ore, count: 5 } }
          action: { take_item: { item: iron_ore, count: 5 } }
          goto: ore_delivered
        - text: npc.puerto_foreman.opt_mine
          goto: mine
        - text: npc.puerto_foreman.opt_bosun_trail
          if:
            - { quest_state: { quest: ch1_false_light, state: completed } }
            - { quest_not_started: ch1_bosun_trail }
            - { level_at_least: 5 }
          goto: bosun_trail_offer
        - text: npc.puerto_foreman.opt_bosun_trail_return
          if: { quest_state: { quest: ch1_bosun_trail, state: in_progress, step: tell_foreman } }
          goto: bosun_trail_done
        - text: dialog.bye
          action: close
    bosun_trail_offer:
      text: npc.puerto_foreman.bosun_trail_offer
      options:
        - text: dialog.accept
          action: { start_quest: ch1_bosun_trail }
          goto: bosun_trail_accepted
        - text: dialog.decline
          goto: greet
    bosun_trail_accepted:
      text: npc.puerto_foreman.bosun_trail_accepted
      options:
        - { text: dialog.bye, action: close }
    bosun_trail_done:
      text: npc.puerto_foreman.bosun_trail_done
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_logbook:
      text: npc.puerto_foreman.ch1_logbook
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_logbook_again:
      text: npc.puerto_foreman.ch1_logbook_again
      options:
        - { text: dialog.bye, action: close }
    mine:
      text: npc.puerto_foreman.mine
      options:
        - { text: npc.puerto_foreman.opt_flood, goto: flood }
        - { text: dialog.back, goto: greet }
    flood:
      text: npc.puerto_foreman.flood
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ore_offer:
      text: npc.puerto_foreman.ore_offer
      options:
        - text: dialog.accept
          action: { start_quest: foreman_ore }
          goto: ore_accepted
        - text: dialog.decline
          goto: greet
    ore_accepted:
      text: npc.puerto_foreman.ore_accepted
      options:
        - { text: dialog.bye, action: close }
    ore_hint:
      text: npc.puerto_foreman.ore_hint
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ore_delivered:
      text: npc.puerto_foreman.ore_delivered
      options:
        - { text: dialog.bye, action: close }
