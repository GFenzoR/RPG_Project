id: puerto_priest
name: npc.puerto_priest.name
sprite: npcs/puerto_priest
look:
  sex: female
  body: slender
  skin: pale
  hair: long
  hair_color: blond
  beard: none
  worn:
    torso: { shape: robe, tint: white }
    feet: { shape: shoes, tint: ochre }
notes: >-
  Temple of the Lantern (respawn point of the island). Sells the five blessings
  (balance.yaml death.max_blessings) for 50 coins plus 20 per level of the buyer each
  (content audit M6) and heals for free.
  Refusing a blessing the player already holds is the death/blessing engine's job (T1.11):
  there is no "has blessing" condition yet.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.puerto_priest.greet
      options:
        - text: npc.puerto_priest.opt_blessings
          goto: blessings
        - text: npc.puerto_priest.opt_heal
          action: { heal: true }
          goto: healed
        - text: npc.puerto_priest.opt_faith
          goto: faith
        - text: dialog.bye
          action: close
    blessings:
      text: npc.puerto_priest.blessings
      options:
        - text: npc.puerto_priest.bless_shore
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: shore_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_hearth
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: hearth_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_keel
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: keel_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_star
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: star_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_deep
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: deep_light, price: 50, per_level: 20 } }
          goto: blessed
        - { text: dialog.back, goto: greet }
    blessed:
      text: npc.puerto_priest.blessed
      options:
        - { text: npc.puerto_priest.opt_more, goto: blessings }
        - { text: dialog.bye, action: close }
    healed:
      text: npc.puerto_priest.healed
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    faith:
      text: npc.puerto_priest.faith
      options:
        - { text: npc.puerto_priest.opt_wreck, goto: wreck }
        - { text: dialog.back, goto: greet }
    wreck:
      text: npc.puerto_priest.wreck
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
