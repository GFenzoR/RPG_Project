id: puerto_priest
name: npc.puerto_priest.name
sprite: npcs/puerto_priest
look:
  sex: female
  body: slender
  skin: pale
  hair: long
  hair_color: blond
  beard: none
  worn:
    torso: { shape: robe, tint: white }
    feet: { shape: shoes, tint: ochre }
notes: >-
  Temple of the Lantern (respawn point of the island). Sells the five blessings
  (balance.yaml death.max_blessings) for 50 coins plus 20 per level of the buyer each
  (content audit M6) and heals for free.
  Refusing a blessing the player already holds is the death/blessing engine's job (T1.11):
  there is no "has blessing" condition yet.
  Chapter 1's island chain (docs/02 "Capítulo 1"): gives ch1_castaways and
  ch1_false_light after ch1_shipwreck, and closes ch1_wreckers, the last one.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.puerto_priest.greet
      options:
        # Chapter 1's island chain (docs/02 "Capítulo 1"): each quest opens with the one before.
        - text: npc.puerto_priest.opt_castaways
          if:
            - { quest_state: { quest: ch1_shipwreck, state: completed } }
            - { quest_not_started: ch1_castaways }
            - { level_at_least: 3 }
          goto: castaways_offer
        - text: npc.puerto_priest.opt_castaways_return
          if: { quest_state: { quest: ch1_castaways, state: in_progress, step: return_priest } }
          goto: castaways_done
        - text: npc.puerto_priest.opt_false_light
          if:
            - { quest_state: { quest: ch1_castaways, state: completed } }
            - { quest_not_started: ch1_false_light }
            - { level_at_least: 4 }
          goto: false_light_offer
        - text: npc.puerto_priest.opt_false_light_return
          if: { quest_state: { quest: ch1_false_light, state: in_progress, step: tell_priest } }
          goto: false_light_done
        - text: npc.puerto_priest.opt_wreckers_return
          if: { quest_state: { quest: ch1_wreckers, state: in_progress, step: hear_bosun } }
          goto: wreckers_done
        - text: npc.puerto_priest.opt_blessings
          goto: blessings
        - text: npc.puerto_priest.opt_heal
          action: { heal: true }
          goto: healed
        - text: npc.puerto_priest.opt_faith
          goto: faith
        - text: dialog.bye
          action: close
    castaways_offer:
      text: npc.puerto_priest.castaways_offer
      options:
        - text: dialog.accept
          action: { start_quest: ch1_castaways }
          goto: castaways_accepted
        - text: dialog.decline
          goto: greet
    castaways_accepted:
      text: npc.puerto_priest.castaways_accepted
      options:
        - { text: dialog.bye, action: close }
    castaways_done:
      text: npc.puerto_priest.castaways_done
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    false_light_offer:
      text: npc.puerto_priest.false_light_offer
      options:
        - text: dialog.accept
          action: { start_quest: ch1_false_light }
          goto: false_light_accepted
        - text: dialog.decline
          goto: greet
    false_light_accepted:
      text: npc.puerto_priest.false_light_accepted
      options:
        - { text: dialog.bye, action: close }
    false_light_done:
      text: npc.puerto_priest.false_light_done
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    wreckers_done:
      text: npc.puerto_priest.wreckers_done
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    blessings:
      text: npc.puerto_priest.blessings
      options:
        - text: npc.puerto_priest.bless_shore
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: shore_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_hearth
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: hearth_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_keel
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: keel_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_star
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: star_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_deep
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: deep_light, price: 50, per_level: 20 } }
          goto: blessed
        - { text: dialog.back, goto: greet }
    blessed:
      text: npc.puerto_priest.blessed
      options:
        - { text: npc.puerto_priest.opt_more, goto: blessings }
        - { text: dialog.bye, action: close }
    healed:
      text: npc.puerto_priest.healed
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    faith:
      text: npc.puerto_priest.faith
      options:
        - { text: npc.puerto_priest.opt_wreck, goto: wreck }
        - { text: dialog.back, goto: greet }
    wreck:
      text: npc.puerto_priest.wreck
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
