id: volcan_ferryman
name: npc.volcan_ferryman.name
sprite: npcs/ferryman_volcanic
notes: >-
  Captain of the Brasal dock (data/boat_routes.yaml: volcan_to_bosque and
  volcan_to_puerto).
dialog:
  start: greet
  nodes:
    greet:
      text: npc.volcan_ferryman.greet
      options:
        - text: dialog.ask_travel
          goto: travel
        - text: npc.volcan_ferryman.opt_island
          goto: island
        - text: dialog.bye
          action: close
    island:
      text: npc.volcan_ferryman.island
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    travel:
      text: npc.volcan_ferryman.travel
      boat_routes: true             # data/boat_routes.yaml: routes with captain volcan_ferryman
      options:
        - { text: dialog.back, goto: greet }
