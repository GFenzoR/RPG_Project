id: pruebas_trainer
name: npc.pruebas_trainer.name
sprite: npcs/sandbox_trainer
notes: >-
  Instructor of the Isla de Pruebas, the sandbox island (docs/16-probar-el-juego.md), in its
  temple: free experience (houses ask for level 12, PvP for level 20), money and healing,
  so every system can be tried by hand in a few minutes, and the short quest pruebas_rats.
  Only on the sandbox island, which normal play never reaches (no boat goes there).
dialog:
  start: greet
  nodes:
    greet:
      text: npc.pruebas_trainer.greet
      options:
        - text: npc.pruebas_trainer.opt_quest
          if: { quest_not_started: pruebas_rats }
          goto: quest_offer
        - text: npc.pruebas_trainer.opt_quest_done
          if: { quest_state: { quest: pruebas_rats, state: in_progress, step: report } }
          goto: quest_done
        - text: npc.pruebas_trainer.opt_xp
          goto: xp
        - text: npc.pruebas_trainer.opt_gold
          action: { give_gold: 10000 }
          goto: gold
        - text: npc.pruebas_trainer.opt_heal
          action: { heal: true }
          goto: healed
        - text: dialog.bye
          action: close
    quest_offer:
      text: npc.pruebas_trainer.quest_offer
      options:
        - text: dialog.accept
          action: { start_quest: pruebas_rats }
          goto: quest_accepted
        - text: dialog.decline
          goto: greet
    quest_accepted:
      text: npc.pruebas_trainer.quest_accepted
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    quest_done:
      text: npc.pruebas_trainer.quest_done
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    xp:
      text: npc.pruebas_trainer.xp
      options:
        - text: npc.pruebas_trainer.opt_xp_small
          action: { give_xp: 5000 }
          goto: xp_given
        - text: npc.pruebas_trainer.opt_xp_big
          action: { give_xp: 50000 }
          goto: xp_given
        - { text: dialog.back, goto: greet }
    xp_given:
      text: npc.pruebas_trainer.xp_given
      options:
        - text: npc.pruebas_trainer.opt_xp_small
          action: { give_xp: 5000 }
          goto: xp_given
        - text: npc.pruebas_trainer.opt_xp_big
          action: { give_xp: 50000 }
          goto: xp_given
        - { text: dialog.back, goto: greet }
    gold:
      text: npc.pruebas_trainer.gold
      options:
        - text: npc.pruebas_trainer.opt_gold
          action: { give_gold: 10000 }
          goto: gold
        - { text: dialog.back, goto: greet }
    healed:
      text: npc.pruebas_trainer.healed
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
