id: pruebas_ferryman
name: npc.pruebas_ferryman.name
sprite: npcs/sandbox_ferryman
notes: >-
  Ferryman of the Isla de Pruebas, the sandbox island (docs/16-probar-el-juego.md): one-way
  trips to the Isla del Puerto, the Isla del Bosque and the Isla Volcánica, landing where
  the real boat routes land. Dialog teleports with a fare, not data/boat_routes.yaml: the
  island is dev-only (world.yaml), and the production server checks every route against a
  map without it, captain included. Nothing comes back: the island stays out of normal play.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.pruebas_ferryman.greet
      options:
        - text: dialog.ask_travel
          goto: travel
        - text: npc.pruebas_ferryman.opt_back
          goto: back
        - text: dialog.bye
          action: close
    back:
      text: npc.pruebas_ferryman.back
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    travel:
      text: npc.pruebas_ferryman.travel
      options:
        - text: npc.pruebas_ferryman.to_harbour
          action:
            - { take_gold: 20 }
            - { teleport: { x: 3201, y: 6432, z: 7 } }
        - text: npc.pruebas_ferryman.to_forest
          action:
            - { take_gold: 20 }
            - { teleport: { x: 4120, y: 6100, z: 7 } }
        - text: npc.pruebas_ferryman.to_volcan
          action:
            - { take_gold: 20 }
            - { teleport: { x: 3617, y: 5795, z: 7 } }
        - { text: dialog.back, goto: greet }
