id: bosque_priest
name: npc.bosque_priest.name
sprite: npcs/bosque_priest
look:
  sex: male
  body: slender
  skin: brown
  hair: short
  hair_color: black
  beard: none
  worn:
    head: { shape: hood, tint: green }
    torso: { shape: robe, tint: white }
    feet: { shape: shoes, tint: tan_leather }
notes: >-
  Temple of the Root in Ivernel (respawn point of the island). Heals for free and sells the
  same five blessings as the Lanternby temple (they are the same blessings, so the same
  price, growing with the level: docs/02 "Muerte").
dialog:
  start: greet
  nodes:
    greet:
      text: npc.bosque_priest.greet
      options:
        - text: npc.bosque_priest.opt_blessings
          goto: blessings
        - text: npc.bosque_priest.opt_heal
          action: { heal: true }
          goto: healed
        - text: npc.bosque_priest.opt_root
          goto: root
        - text: npc.bosque_priest.opt_thalorn
          if: { level_at_least: 20 }
          goto: thalorn_offer
        - text: dialog.bye
          action: close
    blessings:
      text: npc.bosque_priest.blessings
      options:
        - text: npc.puerto_priest.bless_shore
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: shore_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_hearth
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: hearth_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_keel
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: keel_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_star
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: star_light, price: 50, per_level: 20 } }
          goto: blessed
        - text: npc.puerto_priest.bless_deep
          if: { level_at_least: 9 } # novices (death.novice_max_level) are covered already
          action: { bless: { blessing: deep_light, price: 50, per_level: 20 } }
          goto: blessed
        - { text: dialog.back, goto: greet }
    blessed:
      text: npc.bosque_priest.blessed
      options:
        - { text: npc.bosque_priest.opt_more, goto: blessings }
        - { text: dialog.bye, action: close }
    healed:
      text: npc.bosque_priest.healed
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    root:
      text: npc.bosque_priest.root
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    # The milestone ms_thalorn_oath (docs/02 "Quests de hito"): offered from its level (the
    # quest log shows what it asks before it is taken); taken, the offer only goes back.
    thalorn_offer:
      text: npc.bosque_priest.thalorn_offer
      options:
        - text: dialog.accept
          if: { quest_not_started: ms_thalorn_oath }
          action: { start_quest: ms_thalorn_oath }
          goto: thalorn_accepted
        - { text: dialog.back, goto: greet }
    thalorn_accepted:
      text: npc.bosque_priest.thalorn_accepted
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
