id: puerto_diver
name: npc.puerto_diver.name
role: npc.puerto_diver.role
sprite: npcs/puerto_diver
look:
  sex: male
  body: slender
  skin: tan
  hair: curly
  hair_color: grey
  beard: none
  worn:
    torso: { shape: tunic, tint: teal }
    legs: { shape: trousers, tint: teal }
    feet: { shape: shoes, tint: tar }
notes: >-
  Retired reef diver on the beach near the wreck. Lore about the sunken empire, the
  diver_locket side quest and a small shop: the casters' wands and staffs of bands 1-3
  (T3.1, lote 11). Gives the last two quests of Chapter 1's island chain, ch1_west_wood
  and ch1_wreckers (docs/02 "Capítulo 1").
dialog:
  start: greet
  nodes:
    greet:
      text: npc.puerto_diver.greet
      options:
        - text: npc.puerto_diver.opt_west_wood
          if:
            - { quest_state: { quest: ch1_bosun_trail, state: completed } }
            - { quest_not_started: ch1_west_wood }
            - { level_at_least: 5 }
          goto: west_wood_offer
        - text: npc.puerto_diver.opt_west_wood_return
          if: { quest_state: { quest: ch1_west_wood, state: in_progress, step: tell_diver } }
          goto: west_wood_done
        - text: npc.puerto_diver.opt_wreckers
          if:
            - { quest_state: { quest: ch1_west_wood, state: completed } }
            - { quest_not_started: ch1_wreckers }
            - { level_at_least: 6 }
          goto: wreckers_offer
        - text: npc.puerto_diver.opt_reef
          goto: reef
        - text: npc.puerto_diver.opt_locket
          if:
            - { quest_not_started: diver_locket }
            - { level_at_least: 8 }
          goto: locket_offer
        - text: npc.puerto_diver.opt_locket_return
          if:
            - { quest_state: { quest: diver_locket, state: in_progress, step: return_locket } }
            - { has_item: { item: tarnished_locket } }
          action: { take_item: { item: tarnished_locket } }
          goto: locket_returned
        - text: npc.puerto_diver.opt_wands
          goto: wands
        - text: dialog.bye
          action: close
    west_wood_offer:
      text: npc.puerto_diver.west_wood_offer
      options:
        - text: dialog.accept
          action: { start_quest: ch1_west_wood }
          goto: west_wood_accepted
        - text: dialog.decline
          goto: greet
    west_wood_accepted:
      text: npc.puerto_diver.west_wood_accepted
      options:
        - { text: dialog.bye, action: close }
    west_wood_done:
      text: npc.puerto_diver.west_wood_done
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    wreckers_offer:
      text: npc.puerto_diver.wreckers_offer
      options:
        - text: dialog.accept
          action: { start_quest: ch1_wreckers }
          goto: wreckers_accepted
        - text: dialog.decline
          goto: greet
    wreckers_accepted:
      text: npc.puerto_diver.wreckers_accepted
      options:
        - { text: dialog.bye, action: close }
    reef:
      text: npc.puerto_diver.reef
      options:
        - { text: npc.puerto_diver.opt_empire, goto: empire }
        - { text: dialog.back, goto: greet }
    empire:
      text: npc.puerto_diver.empire
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    locket_offer:
      text: npc.puerto_diver.locket_offer
      options:
        - text: dialog.accept
          action: { start_quest: diver_locket }
          goto: locket_accepted
        - text: dialog.decline
          goto: greet
    locket_accepted:
      text: npc.puerto_diver.locket_accepted
      options:
        - { text: dialog.bye, action: close }
    locket_returned:
      text: npc.puerto_diver.locket_returned
      options:
        - { text: dialog.bye, action: close }
    wands:
      text: npc.puerto_diver.wands
      options:
        - text: dialog.trade
          action: { open_shop: diver_shop }
        - { text: dialog.back, goto: greet }
shop:
  id: diver_shop
  sells:
    - { item: spark_wand, price: 30 }
    - { item: sapling_staff, price: 30 }
    - { item: coral_wand, price: 150 }
    - { item: rimewood_staff, price: 150 }
    - { item: stormglass_wand, price: 600 }
    - { item: hoarfrost_staff, price: 600 }
    - { item: mana_draught, price: 22 }
  buys:
    - { item: spark_wand, price: 10 }
    - { item: sapling_staff, price: 10 }
    - { item: coral_wand, price: 50 }
    - { item: rimewood_staff, price: 50 }
    - { item: stormglass_wand, price: 200 }
    - { item: hoarfrost_staff, price: 200 }
