id: harbor_master
name: npc.harbor_master.name
sprite: npcs/sailor_old
notes: >-
  Opens and closes Chapter 1 (ch1_shipwreck) and runs the boat to the forest island
  (Chapter 2). Not a merchant: tools and provisions live in puerto_provisioner.
  Gifts depend on the vocation: guardians get a cutlass and an iron sword, arcanists (wand
  only) get the same value in coins (25 and 120). Rangers get a short bow and coins for
  arrows, druids a sapling staff, and both the arcanist's coins for the logbook (T3.1;
  the greeting has no room for a tenth option).
  A new vocation needs its own branch here.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.harbor_master.greet
      options:
        - text: npc.harbor_master.opt_shipwreck
          if: { quest_not_started: ch1_shipwreck }
          goto: ch1_offer
        - text: npc.harbor_master.opt_ch1_wolves
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: clear_wolves } }
          goto: ch1_wolves
        - text: npc.harbor_master.opt_ch1_mine
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: mine_bats } }
          goto: ch1_mine
        - text: npc.harbor_master.opt_ch1_mine
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: talk_foreman } }
          goto: ch1_foreman
        - text: npc.harbor_master.opt_ch1_logbook
          if:
            - { quest_state: { quest: ch1_shipwreck, state: in_progress, step: return_logbook } }
            - { has_item: { item: bosun_logbook } }
            - { vocation_in: [guardian] }
          action:
            - { take_item: { item: bosun_logbook } }
            - { give_item: iron_sword }
          goto: ch1_logbook_read
        - text: npc.harbor_master.opt_ch1_logbook
          if:
            - { quest_state: { quest: ch1_shipwreck, state: in_progress, step: return_logbook } }
            - { has_item: { item: bosun_logbook } }
            - { vocation_in: [arcanist, ranger, druid] }
          action:
            - { take_item: { item: bosun_logbook } }
            - { give_gold: 120 }
          goto: ch1_logbook_read
        - text: npc.harbor_master.opt_island
          goto: island
        - text: dialog.ask_travel
          goto: travel
        - text: dialog.bye
          action: close
    ch1_offer:
      text: npc.harbor_master.ch1_offer
      options:
        - text: dialog.accept
          if: { vocation_in: [guardian] }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: rusty_cutlass }
            - { give_item: ship_biscuit }
          goto: ch1_accepted
        - text: dialog.accept
          if: { vocation_in: [arcanist] }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_gold: 25 }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_arcanist
        - text: dialog.accept
          if: { vocation_in: [ranger] }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: short_bow }
            - { give_gold: 20 }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_ranger
        - text: dialog.accept
          if: { vocation_in: [druid] }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: sapling_staff }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_druid
        - text: dialog.decline
          goto: greet
    ch1_accepted:
      text: npc.harbor_master.ch1_accepted
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_accepted_arcanist:
      text: npc.harbor_master.ch1_accepted_arcanist
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_accepted_ranger:
      text: npc.harbor_master.ch1_accepted_ranger
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_accepted_druid:
      text: npc.harbor_master.ch1_accepted_druid
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_wolves:
      text: npc.harbor_master.ch1_wolves
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_mine:
      text: npc.harbor_master.ch1_mine
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_foreman:
      text: npc.harbor_master.ch1_foreman
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_logbook_read:
      text: npc.harbor_master.ch1_logbook_read
      options:
        - text: npc.harbor_master.opt_ch1_coffer
          goto: ch1_coffer
        - { text: dialog.bye, action: close }
    ch1_coffer:
      text: npc.harbor_master.ch1_coffer
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_after:
      text: npc.harbor_master.ch1_after
      options:
        - { text: dialog.ask_travel, goto: travel }
        - { text: dialog.back, goto: greet }
    island:
      text: npc.harbor_master.island
      options:
        - { text: npc.harbor_master.opt_town, goto: town }
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    town:
      text: npc.harbor_master.town
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    travel:
      text: npc.harbor_master.travel
      options:
        - text: npc.harbor_master.to_forest
          if:
            - { flag_equals: { key: forest_route_unlocked, value: 1 } }
            - { level_at_least: 10 }
          action: { travel: { island: bosque, price: 80 } }
        - text: npc.harbor_master.opt_ch1_after
          if: { quest_state: { quest: ch1_shipwreck, state: completed } }
          goto: ch1_after
        - { text: dialog.back, goto: greet }
