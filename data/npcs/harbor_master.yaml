id: harbor_master
name: npc.harbor_master.name
role: npc.harbor_master.role
sprite: npcs/harbor_master
look:
  sex: female
  body: sturdy
  skin: tan
  hair: crop
  hair_color: grey
  beard: none
  worn:
    torso: { shape: tunic, tint: navy }
    legs: { shape: trousers, tint: grey }
    feet: { shape: boots, tint: tar }
notes: >-
  Opens and closes Chapter 1 (ch1_shipwreck) and runs the boat to the forest island
  (Chapter 2). Not a merchant: tools and provisions live in puerto_provisioner.
  Gifts depend on the vocation. Accepting gives a biscuit: the class weapon comes in the
  start_kit (data/vocations.yaml). A character that does not carry that weapon (one made
  before the kit existed, or one that lost it) gets it here too, so nobody starts the
  chapter unarmed: at most one more starting weapon per character. Rangers get 20 coins
  for arrows on top, as before the kit. No other coins: a new character is worth, sold
  whole, what it was before the kit (docs/02 "Equipo inicial", the start budget; a test
  keeps it). For the logbook, guardians get an iron sword and the others its value in
  coins (the greeting has no room for a tenth option, and neither has ch1_offer: two per
  vocation plus the refusal).
  A new vocation needs its own branch here.
  The chapter goes on with the other islanders (ch1_castaways and the four after it,
  docs/02 "Capítulo 1"): her ch1_coffer text sends the player to puerto_priest.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.harbor_master.greet
      options:
        - text: npc.harbor_master.opt_shipwreck
          if: { quest_not_started: ch1_shipwreck }
          goto: ch1_offer
        - text: npc.harbor_master.opt_ch1_wolves
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: clear_wolves } }
          goto: ch1_wolves
        - text: npc.harbor_master.opt_ch1_mine
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: mine_bats } }
          goto: ch1_mine
        - text: npc.harbor_master.opt_ch1_mine
          if: { quest_state: { quest: ch1_shipwreck, state: in_progress, step: talk_foreman } }
          goto: ch1_foreman
        - text: npc.harbor_master.opt_ch1_logbook
          if:
            - { quest_state: { quest: ch1_shipwreck, state: in_progress, step: return_logbook } }
            - { has_item: { item: bosun_logbook } }
            - { vocation_in: [guardian] }
          action:
            - { take_item: { item: bosun_logbook } }
            - { give_item: iron_sword }
          goto: ch1_logbook_read
        - text: npc.harbor_master.opt_ch1_logbook
          if:
            - { quest_state: { quest: ch1_shipwreck, state: in_progress, step: return_logbook } }
            - { has_item: { item: bosun_logbook } }
            - { vocation_in: [arcanist, ranger, druid] }
          action:
            - { take_item: { item: bosun_logbook } }
            - { give_gold: 150 } # the iron sword's value (lote 11)
          goto: ch1_logbook_read
        - text: npc.harbor_master.opt_island
          goto: island
        - text: dialog.ask_travel
          goto: travel
        - text: dialog.bye
          action: close
    ch1_offer:
      text: npc.harbor_master.ch1_offer
      options:
        - text: dialog.accept
          if:
            - { vocation_in: [guardian] }
            - { has_item: { item: rusty_cutlass } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: ship_biscuit }
          goto: ch1_accepted
        - text: dialog.accept
          if:
            - { vocation_in: [guardian] }
            - { lacks_item: { item: rusty_cutlass } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: rusty_cutlass }
            - { give_item: ship_biscuit }
          goto: ch1_accepted
        - text: dialog.accept
          if:
            - { vocation_in: [arcanist] }
            - { has_item: { item: spark_wand } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_arcanist
        - text: dialog.accept
          if:
            - { vocation_in: [arcanist] }
            - { lacks_item: { item: spark_wand } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: spark_wand }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_arcanist
        - text: dialog.accept
          if:
            - { vocation_in: [ranger] }
            - { has_item: { item: short_bow } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_gold: 20 } # for arrows, as before the start_kit
            - { give_item: ship_biscuit }
          goto: ch1_accepted_ranger
        - text: dialog.accept
          if:
            - { vocation_in: [ranger] }
            - { lacks_item: { item: short_bow } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: short_bow }
            - { give_gold: 20 }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_ranger
        - text: dialog.accept
          if:
            - { vocation_in: [druid] }
            - { has_item: { item: sapling_staff } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_druid
        - text: dialog.accept
          if:
            - { vocation_in: [druid] }
            - { lacks_item: { item: sapling_staff } }
          action:
            - { start_quest: ch1_shipwreck }
            - { give_item: sapling_staff }
            - { give_item: ship_biscuit }
          goto: ch1_accepted_druid
        - text: dialog.decline
          goto: greet
    ch1_accepted:
      text: npc.harbor_master.ch1_accepted
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_accepted_arcanist:
      text: npc.harbor_master.ch1_accepted_arcanist
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_accepted_ranger:
      text: npc.harbor_master.ch1_accepted_ranger
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_accepted_druid:
      text: npc.harbor_master.ch1_accepted_druid
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_wolves:
      text: npc.harbor_master.ch1_wolves
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_mine:
      text: npc.harbor_master.ch1_mine
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_foreman:
      text: npc.harbor_master.ch1_foreman
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_logbook_read:
      text: npc.harbor_master.ch1_logbook_read
      options:
        - text: npc.harbor_master.opt_ch1_coffer
          goto: ch1_coffer
        - { text: dialog.bye, action: close }
    ch1_coffer:
      text: npc.harbor_master.ch1_coffer
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    ch1_after:
      text: npc.harbor_master.ch1_after
      options:
        - { text: dialog.ask_travel, goto: travel }
        - { text: dialog.back, goto: greet }
    island:
      text: npc.harbor_master.island
      options:
        - { text: npc.harbor_master.opt_town, goto: town }
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    town:
      text: npc.harbor_master.town
      options:
        - { text: dialog.back, goto: greet }
        - { text: dialog.bye, action: close }
    travel:
      text: npc.harbor_master.travel
      boat_routes: true             # data/boat_routes.yaml: routes with captain harbor_master
      options:
        # Chapter 1's reward (data/quests/ch1_shipwreck.yaml set_flag): the forest route.
        - text: npc.harbor_master.opt_ch1_after
          if: { flag_equals: { key: forest_route_unlocked, value: 1 } }
          goto: ch1_after
        - { text: dialog.back, goto: greet }
