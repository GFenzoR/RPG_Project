id: pruebas_merchant
name: npc.pruebas_merchant.name
sprite: npcs/pruebas_merchant
look:
  sex: male
  body: sturdy
  skin: brown
  hair: short
  hair_color: black
  beard: none
  worn:
    head: { shape: cap, tint: wine }
    torso: { shape: tunic, tint: ochre }
    legs: { shape: trousers, tint: brown }
    feet: { shape: shoes, tint: tar }
notes: >-
  Provisioner of Thimblewick, the sandbox island (docs/16-probar-el-juego.md): the
  tools of every trade (no shovel: nothing digs yet), food, poultices, runes, the basic
  gear of each vocation, the key of the practice gate and a spare backpack, at the
  prices of the real islands; and the forge's temper stones and its warding amber (no real
  NPC sells the amber: here it is to try the forge, docs/16). Buys a few hunting and trade goods back at the
  provisioner's prices, to try selling.
dialog:
  start: greet
  nodes:
    greet:
      text: npc.pruebas_merchant.greet
      options:
        - text: dialog.trade
          action: { open_shop: pruebas_shop }
        - text: npc.pruebas_merchant.opt_gear
          goto: gear
        - text: npc.pruebas_merchant.opt_key
          goto: key
        - text: dialog.bye
          action: close
    gear:
      text: npc.pruebas_merchant.gear
      options:
        - text: dialog.trade
          action: { open_shop: pruebas_shop }
        - { text: dialog.back, goto: greet }
    key:
      text: npc.pruebas_merchant.key
      options:
        - text: dialog.trade
          action: { open_shop: pruebas_shop }
        - { text: dialog.back, goto: greet }
shop:
  id: pruebas_shop
  sells:
    - { item: pickaxe, price: 120 }
    - { item: felling_axe, price: 110 }
    - { item: fishing_rod, price: 140 }
    - { item: smithing_hammer, price: 95 }
    - { item: rope, price: 45 }
    - { item: ship_biscuit, price: 3 }
    - { item: seaweed_poultice, price: 25 }
    - { item: mana_draught, price: 22 }
    - { item: concentrated_mana_draught, price: 50 }
    - { item: health_draught, price: 60 }
    - { item: concentrated_health_draught, price: 125 }
    - { item: arc_rune, price: 30 }
    - { item: hatchet, price: 30 }
    - { item: iron_sword, price: 150 }
    - { item: spark_wand, price: 30 }
    - { item: coral_wand, price: 150 }
    - { item: short_bow, price: 30 }
    - { item: arrow, price: 1 }
    - { item: smuggler_crossbow, price: 540 }
    - { item: bolt, price: 1 }
    - { item: sapling_staff, price: 30 }
    - { item: barrel_lid_shield, price: 25 }
    - { item: plank_shield, price: 110 }
    - { item: patched_tunic, price: 20 }
    - { item: mossweave_robe, price: 360 }
    - { item: stagleather_coat, price: 540 }
    - { item: sailcloth_cap, price: 10 }
    - { item: canvas_trousers, price: 10 }
    - { item: tarred_boots, price: 10 }
