id: slagbound_warden
name: monster.slagbound_warden.name
sprite: creatures/slagbound_warden
health: 1800
experience: 3200
speed: 140
armor: 25
defense: 20
behavior:
  aggressive: true
  target_distance: 1
pursuit: { persistence: 0, max_chase_tiles: 0 }  # a boss stays in its forge
regen: { pct: 0.5 }  # a full heal takes about 16 minutes
attacks:
  - { type: melee, min: 0, max: 60, interval_ms: 2000 }
  # Slag slam: it pounds the floor and burns every tile around it.
  - { type: melee, element: fire, min: 25, max: 55, interval_ms: 2000, chance: 0.3, area: { shape: circle, radius: 1 },
      condition: { id: burning, chance: 0.5, ticks: 5, damage: 8 } }
  # Below 60 % it calls two ember salamanders out of the forge's lava (two at most).
  - { type: summon, interval_ms: 60000, below_hp_pct: 60, summon: { monster: cinder_salamander, count: 2, max_alive: 2 } }
phases:
  # Enraged below 30 %: faster on its feet and with its blows.
  - { below_hp_pct: 30, speed_mult: 1.3, attack_interval_mult: 0.75 }
resistances: { physical: 10, fire: 100, earth: 30, ice: -20 }
loot:
  - { item: forge_seal, chance: 1, each_player: true }
  - { item: copper_coin, chance: 1, count: [200, 500] }
  - { item: slag_core, chance: 0.5, count: [1, 2] }
  - { item: wyrm_scale, chance: 0.2 }
  - { item: radiant_temper_stone, chance: 0.3 } # the forge
  - { item: warding_amber, chance: 0.25 } # the forge's protection
tags: [construct, boss, cave, volcan]
notes: Chapter 3 boss (ch3_warden), alone in the ancient forge at the bottom of the mine, level 40 in a small group, 44 alone with healing. Always drops the forge seal; long respawn on the map. Its slam burns whoever stands next to it, below 60 % it calls two ember salamanders (no experience, no loot; they go when it dies) and below 30 % it is enraged.
corpse: remains_slag
