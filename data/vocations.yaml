# Ranger (T3.1): distance damage and a hybrid. Trains distance fastest of all, shield
# almost like a guardian and some magic; health and mana per level sit between both.
- id: ranger
  name: vocation.ranger.name
  description: vocation.ranger.desc
  start: { health: 145, mana: 40, capacity: 400000, speed: 205 }
  per_level: { health: 9, mana: 13, capacity: 19000, speed: 3 }
  regen: { health: 2, mana: 2, interval_ms: 5500 }
  skill_factors:
    fist: 1.25
    sword: 1.24
    axe: 1.24
    club: 1.24
    distance: 1.1
    shield: 1.12
    magic: 1.45
    fishing: 1.11
  weapons: [distance, sword, axe, club]

# Druid (T3.1): support and healing. Magic trains as fast as the arcanist's, the body
