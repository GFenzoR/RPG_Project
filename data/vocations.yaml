# Vocations (docs/02-game-design.md): guardian and arcanist (MVP), ranger and druid (T3.1).
# Our own numbers (CLAUDE.md legal rule): never copy another game's constants.
# start_kit (2026-11-23): what a new character gets once, at its first login (docs/02
# "Equipo inicial"): each piece in the slot it fits, the rest in the backpack.
# Capacity is in grams, a realistic human load (owner, 2026-11-23; docs/02 "Unidades"):
# 36-45 kg at level 1 (the guardian strongest, the arcanist weakest), about 80-120 kg at
# level 75. TestHuntLootFits (server/internal/sim) checks a hunt's loot still fits.
- id: guardian
  name: vocation.guardian.name
  description: vocation.guardian.desc
  start: { health: 145, mana: 20, capacity: 45000, speed: 205 }
  per_level: { health: 14, mana: 4, capacity: 1000, speed: 3 }
  regen: { health: 3, mana: 1, interval_ms: 7000 }
  skill_factors:
    fist: 1.13
    sword: 1.11
    axe: 1.11
    club: 1.11
    distance: 1.45
    shield: 1.11
    magic: 2.7
    fishing: 1.11
  weapons: [sword, axe, club]
  start_kit:
    - { item: rusty_cutlass }
    - { item: barrel_lid_shield }
    # Everyone: plain clothes, a few biscuits and a poultice.
    - { item: patched_tunic }
    - { item: canvas_trousers }
    - { item: tarred_boots }
    - { item: ship_biscuit, count: 5 }
    - { item: seaweed_poultice, count: 1 }

- id: arcanist
  name: vocation.arcanist.name
  description: vocation.arcanist.desc
  start: { health: 140, mana: 75, capacity: 36000, speed: 205 }
  per_level: { health: 6, mana: 28, capacity: 600, speed: 3 }
  regen: { health: 1, mana: 3, interval_ms: 4000 }
  skill_factors:
    fist: 1.45
    sword: 1.85
    axe: 1.85
    club: 1.85
    distance: 1.9
    shield: 1.55
    magic: 1.11
    fishing: 1.11
  weapons: [wand]
  start_kit:
    - { item: spark_wand }
    # Everyone: plain clothes, a few biscuits and a poultice.
    - { item: patched_tunic }
    - { item: canvas_trousers }
    - { item: tarred_boots }
    - { item: ship_biscuit, count: 5 }
    - { item: seaweed_poultice, count: 1 }

# Ranger (T3.1): distance damage and a hybrid. Trains distance fastest of all, shield
# almost like a guardian and some magic; health and mana per level sit between both.
- id: ranger
  name: vocation.ranger.name
  description: vocation.ranger.desc
  start: { health: 145, mana: 40, capacity: 42000, speed: 205 }
  per_level: { health: 9, mana: 13, capacity: 800, speed: 3 }
  regen: { health: 2, mana: 2, interval_ms: 5500 }
  skill_factors:
    fist: 1.25
    sword: 1.24
    axe: 1.24
    club: 1.24
    distance: 1.115
    shield: 1.12
    magic: 1.45
    fishing: 1.11
  weapons: [distance, sword, axe, club]
  start_kit:
    - { item: short_bow }
    - { item: arrow, count: 60 }
    # Everyone: plain clothes, a few biscuits and a poultice.
    - { item: patched_tunic }
    - { item: canvas_trousers }
    - { item: tarred_boots }
    - { item: ship_biscuit, count: 5 }
    - { item: seaweed_poultice, count: 1 }

# Druid (T3.1): support and healing. Magic trains as fast as the arcanist's, the body
# is as fragile, and its staffs shoot like wands.
- id: druid
  name: vocation.druid.name
  description: vocation.druid.desc
  start: { health: 140, mana: 75, capacity: 37000, speed: 205 }
  per_level: { health: 6, mana: 27, capacity: 650, speed: 3 }
