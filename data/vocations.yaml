  skill_factors:
    fist: 1.45
    sword: 1.85
    axe: 1.85
    club: 1.85
    distance: 1.85
    shield: 1.55
    magic: 1.11
    fishing: 1.11
  weapons: [wand]
  start_kit:
    - { item: sapling_staff }
    # Everyone: plain clothes, a few biscuits and a poultice.
    - { item: patched_tunic }
