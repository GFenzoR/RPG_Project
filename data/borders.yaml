# Autoborder rules (docs/06-content-data.md "Bordes"). When ground `from` touches ground `to`,
# the pieces are stacked at the bottom of the `to` tile (the `autoborder` op, mapcli, MCP).
# Piece names say where the `from` ground is: n/s/e/w = that side; ne/nw/se/sw = only that
# diagonal; inner_* = both adjacent sides (concave corner).

- id: grass_sand
  from: grass
  to: sand
  priority: 10
  pieces:
    n: border_grass_sand_n
    s: border_grass_sand_s
    e: border_grass_sand_e
    w: border_grass_sand_w
    ne: border_grass_sand_ne
    nw: border_grass_sand_nw
    se: border_grass_sand_se
    sw: border_grass_sand_sw
    inner_ne: border_grass_sand_inner_ne
    inner_nw: border_grass_sand_inner_nw
    inner_se: border_grass_sand_inner_se
    inner_sw: border_grass_sand_inner_sw

- id: sand_water
  from: sand
  to: water_shallow
  priority: 5
  pieces:
    n: border_sand_water_n
    s: border_sand_water_s
    e: border_sand_water_e
    w: border_sand_water_w
    ne: border_sand_water_ne
    nw: border_sand_water_nw
    se: border_sand_water_se
    sw: border_sand_water_sw
    inner_ne: border_sand_water_inner_ne
    inner_nw: border_sand_water_inner_nw
    inner_se: border_sand_water_inner_se
    inner_sw: border_sand_water_inner_sw
