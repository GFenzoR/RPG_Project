# Ground transitions (autoborder; docs/06-content-data.md "Bordes", docs/17 ART-4).
# The ladder lists the natural grounds bottom to top. A ground with `pieces` has a fringe:
# its own texture cut with an irregular edge (tools/spritepack gen-borders), stacked at the
# bottom of every lower ground of the ladder it touches (or only of those in `over`), lower
# fringes first. Its twelve piece items are <pieces>_<piece> (n, e, s, w, the outer corners
# nw, ne, se, sw and the inner ones inner_nw...), in data/items/borders.yaml. `edge` says how
# gen-borders draws the edge (plain, tufts, pebbles, clods, joint, wet, crust, drift).
# Grounds off the ladder (wooden_floor, dock_planks: man-made floors) keep a straight edge.
# A new ground (snow, ice) is one line here, its twelve items and `make borders`.
ladder:
  - ground: lava            # molten: only ever covered (by the crust of cooled lava)
  - ground: water_shoal     # the same water as water_shallow, with fish: no edge between them
  - ground: water_shallow
  - ground: wet_sand
    pieces: border_wet_sand
    edge: wet
  - ground: sand
    pieces: border_sand
    edge: pebbles
  - ground: cooled_lava
    pieces: border_cooled_lava
    edge: crust
  - ground: cinder_path
    pieces: border_cinder_path
    edge: clods
  - ground: dirt
    pieces: border_dirt
    edge: clods
  - ground: basalt
    pieces: border_basalt
    edge: joint
  - ground: stone_floor
    pieces: border_stone_floor
    edge: joint
  - ground: grass
    pieces: border_grass
    edge: tufts
  - ground: ash
    pieces: border_ash
    edge: drift

# Where fringes reach water, the surf goes under them, shaped like all of them together: the
# wet, darker edge of the land, a bright line of foam and a broken line that rolls in over 4
# frames. Water grounds never border each other.
shore:
  water: [water_shallow, water_shoal]
  pieces: border_surf
