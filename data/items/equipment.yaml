# Shields, armor and jewelry: the compact catalog (lote 11, docs/02 "Catálogo de equipo").
# One piece per line, slot and band, numbers from the band formula of docs/02. The torso
# has two weight classes: armor (heavy, the guardian's and the ranger's) and robes (light,
# for anyone: the casters' line). Head, legs, feet, shields and jewelry are for everyone.
# Amulets and rings (neck and ring slots) carry a small armor and, with the item
# attributes, their random attribute.

