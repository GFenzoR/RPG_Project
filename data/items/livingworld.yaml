# Living world objects (livingworld/README.md): map items that break, move or open. What
# they do lives in data/livingworld/objects.yaml; here they are ordinary items. None is ever
# picked up. The broken states (debris) never block, so the way stays open while they lie.

# ---- breakables -------------------------------------------------------------------------
- id: weathered_crate
  kind: decoration
  sprite: livingworld/weathered_crate
  name: item.weathered_crate.name
  description: item.weathered_crate.desc
  pickupable: false
  blocks_movement: true

