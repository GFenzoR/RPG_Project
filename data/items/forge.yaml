# Weights are realistic grams per unit (docs/02 "Unidades", "Cargas realistas"); the UI
# shows them in g or kg.
# The forge's materials (docs/02-game-design.md "Forja", balance.yaml forge). Each refine
# attempt at an anvil spends temper stones of the item's band: the lesser stone for items
# of level 1-9, the greater for 10-49, the radiant for 50 and up. Smiths sell them and some
# monsters drop them; nobody buys them back. The warding amber is rare: only the boss and the
# strongest monsters drop it, no NPC sells it. Spent in an attempt, a failure from +5 on
# costs the item one level instead of breaking it. Our own names and numbers.
- id: lesser_temper_stone
  kind: material
  sprite: materials/lesser_temper_stone
  name: item.lesser_temper_stone.name
  description: item.lesser_temper_stone.desc
  weight: 300
  stackable: true
  max_stack: 100
  tradeable: true
  value: 10

