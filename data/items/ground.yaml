  name: item.wooden_floor.name
  ground: { walkable: true, speed: 100, surface: wood }

# Volcanic grounds (Karvask, T5.5). Each walks like the ground it replaced on the
# island, so the hunting pace T5.5 was balanced with holds: ash like the dirt of the ash
# plain, cooled lava and basalt like the stone of the slope, the crater and the plaza. The
# cinder paths are quicker than the ash they cross. Molten lava cannot be walked, like water.
- id: ash
  kind: ground
  sprite: ground/ash
  name: item.ash.name
  ground: { walkable: true, speed: 140, surface: ash }

- id: basalt
  kind: ground
  sprite: ground/basalt
  name: item.basalt.name
  ground: { walkable: true, speed: 100, surface: stone }

- id: cinder_path
  kind: ground
  sprite: ground/cinder_path
  name: item.cinder_path.name
  ground: { walkable: true, speed: 110, surface: stone }

- id: cooled_lava
  kind: ground
  sprite: ground/cooled_lava
  name: item.cooled_lava.name
  description: item.cooled_lava.desc
  ground: { walkable: true, speed: 100, surface: stone }

- id: lava
  kind: ground
  sprite: ground/lava
  name: item.lava.name
  description: item.lava.desc
  ground: { walkable: false, surface: lava }
