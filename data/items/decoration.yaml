# Town prop kit (docs/17 "Kit de props de pueblo", lote 12): one-tile props drawn with the
# sprite engine (tools/spritegen/src/engine/specs/town.ts) that furnish temples, depots,
# plazas and houses. A table or a barrel lifts what is stacked on it (elevation, ART-8). The
# bench, the bed and the flower box never block, so a rented house keeps every tile for its
