# Harbour decoration (Isla del Puerto). Fixed in place: not pickupable.
- id: mooring_post
  kind: decoration
  sprite: decor/mooring_post
  name: item.mooring_post.name
  pickupable: false
  blocks_movement: true

- id: cargo_crate
  kind: decoration
  sprite: decor/cargo_crate
  name: item.cargo_crate.name
  description: item.cargo_crate.desc
  pickupable: false
  blocks_movement: true
  blocks_sight: true

# Ore vein (T1.12): use a pickaxe on it. Our own numbers.
- id: iron_vein
  kind: decoration
  sprite: decor/iron_vein
  name: item.iron_vein.name
  description: item.iron_vein.desc
  pickupable: false
  blocks_movement: true
  resource:
    tool: mining
    skill: mining
    charges: 4              # successful swings before the vein is spent
    regen_ms: 300000        # grows back 5 min after its last swing
    chance: { base: 0.3, per_level: 0.02, max: 0.85 }
    drops:
      - { item: rough_stone, weight: 6, count: [1, 3] }
      - { item: iron_ore, weight: 4 }
      - { item: quartz_crystal, weight: 1, min_level: 5 }

# Choppable tree (T3.4): use a felling axe on it. Our own numbers.
- id: birch_tree
  kind: decoration
  sprite: decor/birch_tree
  name: item.birch_tree.name
  description: item.birch_tree.desc
  pickupable: false
  blocks_movement: true
  resource:
    tool: woodcutting
    skill: woodcutting
    charges: 3              # logs before the tree is bare
    regen_ms: 360000        # grows back 6 min after its last log
    chance: { base: 0.35, per_level: 0.025, max: 0.85 }
    drops:
      - { item: birch_log, weight: 9 }
      - { item: tree_resin, weight: 2, min_level: 6 }

