      - { item: lesser_temper_stone, count: 2 }
      - { item: seaweed_poultice, count: 3 }
      - { item: sailcloth_cap, count: 1 } # band 1
  notes: "Under the oaks of the north-west corner of the Puerto forest, off every road (3107,6353,7)."

