# What pays for exploring (docs/02 "Libros y cofres"): readable books and scrolls, and the
# reward chests. All of them are map items nobody picks up; where each one stands is in its
# notes. Sprites drawn with the sprite engine (tools/spritegen/src/engine/specs/lore.ts).

# ---- Books and scrolls: using one opens the client's reading window (its title and pages,
# i18n/<lang>/books.yaml); looking at it gives its description. A lectern blocks its tile; a
# book or a scroll on the floor does not.
- id: book_lantern_rowers
  kind: decoration
  sprite: decor/lectern_book
  name: item.lectern_book.name
  description: item.book_lantern_rowers.desc
  pickupable: false
  blocks_movement: true
  book:
    title: book.book_lantern_rowers.title
    pages: [book.book_lantern_rowers.page_1, book.book_lantern_rowers.page_2, book.book_lantern_rowers.page_3]
  notes: "Temple of the Lantern, Puerto (3152,6381,7), north-west corner; and the temple of Thimblewick (2099,2084,7)."

