# ---- Reward chests: using one gives its rewards once per character (storage chest.<id>),
# or nothing while they do not all fit. Rewards sized to the area's band (docs/02 "Catálogo
# de equipo"): money, the band's temper stones and potions, and one catalog piece for anyone.
- id: chest_puerto_mine
  kind: decoration
  sprite: decor/reward_chest
  name: item.reward_chest.name
  description: item.reward_chest.desc
  pickupable: false
  blocks_movement: true
  chest:
    id: puerto_mine
    rewards:
      - { item: silver_coin, count: 3 }
      - { item: lesser_temper_stone, count: 3 }
      - { item: seaweed_poultice, count: 5 }
      - { item: plank_shield, count: 1 } # band 2
  notes: "Far end of the Puerto mine, in the alcove of the flooded gallery past the drowned miners (3193,6286,8)."

- id: chest_puerto_grove
  kind: decoration
