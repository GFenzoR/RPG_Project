# Border pieces (data/borders.yaml, docs/06 "Bordes"): the fringes of the grounds of the
# ladder and the surf where they meet water. Stacked at the bottom of the tile they cover;
# they never block and cannot be picked up. Each sprite has 4 looks (var_<n>), picked per tile
# by the renderer; the surf rolls in over 4 frames (frame_<n>). Art: tools/spritepack
# gen-borders (`make borders`), cut from each ground's own art.

