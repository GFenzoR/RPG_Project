# Weapons: the compact catalog (lote 11, docs/02 "Catálogo de equipo"). One weapon per
# line and band; the numbers follow the band formula of docs/02 (our own numbers, CLAUDE.md
# legal rule). Every weapon says its level (requires.level). A bow shoots one arrow of its
# weapon.ammo per round from the ammo slot (attack = bow + arrow, T3.1); a crossbow is
# one-handed and shoots bolts (content audit M4); a staff is the druid's wand.

