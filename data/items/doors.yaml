# Doors (docs/02-game-design.md "Puertas con llave"): a pair of map items that swap when a
# player next to them uses them. The closed one blocks walking and sight; door.key locks it,
# so it opens and locks again only for a player carrying an item with that key id.
# Fixed in place: not pickupable.

# The sealed gate of the forge, at the bottom of the volcanic mine (Chapter 3). The ember key
# the forge echo shapes from the ember root opens it (ch3_gate).
- id: forge_gate
  kind: decoration
  sprite: doors/forge_gate
  name: item.forge_gate.name
  description: item.forge_gate.desc
  pickupable: false
  blocks_movement: true
  blocks_sight: true
  door: { key: forge_gate, open: forge_gate_open }

- id: forge_gate_open
  kind: decoration
  sprite: doors/forge_gate_open
  name: item.forge_gate_open.name
  description: item.forge_gate_open.desc
  pickupable: false
  door: { closed: forge_gate }

# The practice gate of the Isla de Pruebas (sandbox island, docs/16-probar-el-juego.md): a
# locked door to try keys on. Its key, pruebas_key, is sold by the island's provisioner.
- id: pruebas_gate
  kind: decoration
  sprite: doors/pruebas_gate
  name: item.pruebas_gate.name
  description: item.pruebas_gate.desc
  pickupable: false
  blocks_movement: true
  blocks_sight: true
  door: { key: pruebas_gate, open: pruebas_gate_open }

- id: pruebas_gate_open
  kind: decoration
  sprite: doors/pruebas_gate_open
  name: item.pruebas_gate_open.name
  description: item.pruebas_gate_open.desc
  pickupable: false
  door: { closed: pruebas_gate }

# The timber frame of a house door (docs/17 A11): never in the maps. A house door
# (houses.yaml doors) is a gap in the wall that the server knows by its tile; the client, the
# editor and mapcli render draw this frame on it, so the gap reads as a doorway.
- id: house_door_frame
  kind: decoration
  sprite: doors/house_door_frame
  name: item.house_door_frame.name
  pickupable: false
