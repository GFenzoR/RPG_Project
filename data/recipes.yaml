# Trade recipes (T3.4, docs/06-content-data.md "Receta de oficio"). Use the station on
# the map, then pick a recipe. Every attempt spends the inputs and earns `xp` tries of
# the craft skill; it succeeds with min(max_success, base_success + success_per_level ×
# (skill − level)). Our own numbers (CLAUDE.md legal rule).

# ---- Smithing: smelting forge ---------------------------------------------------------
- id: smelt_iron_ingot
  craft: smithing
  station: smelting_forge
  level: 1
  time_ms: 3000
  inputs: [{ item: iron_ore, count: 2 }, { item: birch_log, count: 1 }]
  output: { item: iron_ingot, count: 1 }
  base_success: 0.65
  success_per_level: 0.03
  max_success: 0.95
  xp: 1

