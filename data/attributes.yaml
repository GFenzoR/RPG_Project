# Item attributes (docs/02-game-design.md "Atributos de items", docs/06 "Atributo"). Every
# equipable (a weapon, a shield or an armor piece; never ammo, containers, consumables,
# tools or materials) rolls exactly ONE attribute when it is created: one of those whose
# `on` names its kind (the weapon's weapon.type, `shield`, or the armor's armor.slot),
# picked by `weight`, with a value uniform in [min, max] of the band of the item's
# requires.level (the last band whose `level` is <= it; no requirement = level 1).
# Effects (server/internal/session/attributes.go): what all the worn items add up to,
# never more than `cap` when it has one. No experience nor gold bonus: they would feed
# the economy. Our own names and numbers.

# ---- life and mana ---------------------------------------------------------------------
- id: max_health
  effect: max_health
  text: attribute.max_health
  on: [shield, head, body, legs, feet, neck, ring]
  weight: 12
  bands:
    - { level: 1, min: 4, max: 10 }
    - { level: 10, min: 8, max: 18 }
    - { level: 25, min: 14, max: 30 }
    - { level: 50, min: 25, max: 50 }
    - { level: 80, min: 40, max: 80 }

- id: max_mana
  effect: max_mana
  text: attribute.max_mana
  on: [wand, head, body, legs, feet, neck, ring]
  weight: 12
  bands:
    - { level: 1, min: 4, max: 10 }
    - { level: 10, min: 8, max: 18 }
    - { level: 25, min: 14, max: 30 }
    - { level: 50, min: 25, max: 50 }
    - { level: 80, min: 40, max: 80 }

- id: health_regen
  effect: health_regen
  text: attribute.health_regen
  on: [shield, head, body, neck, ring]
  weight: 6
  bands:
    - { level: 1, min: 1, max: 1 }
    - { level: 10, min: 1, max: 2 }
    - { level: 25, min: 1, max: 3 }
    - { level: 50, min: 2, max: 4 }
    - { level: 80, min: 3, max: 5 }

- id: mana_regen
  effect: mana_regen
  text: attribute.mana_regen
  on: [wand, head, body, neck, ring]
  weight: 6
  bands:
    - { level: 1, min: 1, max: 1 }
    - { level: 10, min: 1, max: 2 }
    - { level: 25, min: 1, max: 3 }
    - { level: 50, min: 2, max: 4 }
    - { level: 80, min: 3, max: 5 }

