id: bounty_wyrmlings
name: quest.bounty_wyrmlings.name
min_level: 48
notes: >-
  Bounty task of Brasal (volcan_hunter, lote 12): 8 ember wyrmlings (levels 48-58, the
  crater), every 20 hours. The reward is about a fifth of what an hour of that hunt gives
  (xp and loot, sim/balance_tasks_test.go; docs/02 "Tareas"); no items.
repeatable: { cooldown_hours: 20 }
steps:
  - id: hunt
    description: quest.bounty_wyrmlings.step_hunt
    complete_when: { kill: { monster: ember_wyrmling, count: 8 } }
  - id: report
    description: quest.bounty_wyrmlings.step_report
    complete_when: { dialog_action: { npc: volcan_hunter, node: wyrmlings_paid } }
rewards:
  - { xp: 10400 }
  - { gold: 3600 }
