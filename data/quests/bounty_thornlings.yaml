id: bounty_thornlings
name: quest.bounty_thornlings.name
min_level: 18
notes: >-
  Bounty task of Ivernel (bosque_hunter, lote 12): 25 thornlings (levels 18-22), every 20
  hours. The reward is about a fifth of what an hour of that hunt gives (xp and loot,
  sim/balance_tasks_test.go; docs/02 "Tareas"); no items.
repeatable: { cooldown_hours: 20 }
steps:
  - id: hunt
    description: quest.bounty_thornlings.step_hunt
    complete_when: { kill: { monster: thornling, count: 25 } }
  - id: report
    description: quest.bounty_thornlings.step_report
    complete_when: { dialog_action: { npc: bosque_hunter, node: thornlings_paid } }
rewards:
  - { xp: 5000 }
  - { gold: 1000 }
