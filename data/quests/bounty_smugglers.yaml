id: bounty_smugglers
name: quest.bounty_smugglers.name
min_level: 15
notes: >-
  Bounty task of Raigal (bosque_hunter, lote 12): 25 coffer smugglers (levels 15-18),
  every 20 hours. The reward is about a fifth of what an hour of that hunt gives (xp and
  loot, sim/balance_tasks_test.go; docs/02 "Tareas"); no items.
repeatable: { cooldown_hours: 20 }
steps:
  - id: hunt
    description: quest.bounty_smugglers.step_hunt
    complete_when: { kill: { monster: coffer_smuggler, count: 25 } }
  - id: report
    description: quest.bounty_smugglers.step_report
    complete_when: { dialog_action: { npc: bosque_hunter, node: smugglers_paid } }
rewards:
  - { xp: 4500 }
  - { gold: 1200 }
