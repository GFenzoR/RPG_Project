id: bounty_crawlers
name: quest.bounty_crawlers.name
min_level: 22
notes: >-
  Bounty task of Ivernel (bosque_hunter, lote 12): 30 hollow crawlers (levels 22-26, the
  cave under the east shore), every 20 hours. The reward is about a fifth of what an hour
  of that hunt gives (xp and loot, sim/balance_tasks_test.go; docs/02 "Tareas"); no items.
repeatable: { cooldown_hours: 20 }
steps:
  - id: hunt
    description: quest.bounty_crawlers.step_hunt
    complete_when: { kill: { monster: hollow_crawler, count: 30 } }
  - id: report
    description: quest.bounty_crawlers.step_report
    complete_when: { dialog_action: { npc: bosque_hunter, node: crawlers_paid } }
rewards:
  - { xp: 6200 }
  - { gold: 1450 }
