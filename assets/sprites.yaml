# Sprite manifest: where the pixels of each sprite path used in data/ come from.
# How to integrate a vendor pack: assets/README.md. Built by `make sprites` (tools/spritepack).
#
# Keys are the `sprite:` values of data/ (paths without extension). Each entry has exactly one of:
#   placeholder: { label: IS, color: "#rrggbb", size: [32, 32] }   all fields optional
#   source: vendor/<pack>/<file>.png   + optional  tile: [col, row]  (32 px grid)
#                                      or          rect: [x, y, w, h] (pixels, multiples of 32)
# A file at assets/sprites/<path>.png (original art) wins over nothing: it must NOT also be
# listed here. Sprites used in data/ with no entry get an automatic placeholder (warning).
#
# Everything below is a placeholder until the user's packs land in assets/vendor/ (T0.5).
sprites:
  # Ground: plain colour, no label, so map renders stay readable.
  ground/grass: { placeholder: { label: "", color: "#4f8a3c" } }
  ground/sand: { placeholder: { label: "", color: "#d8c27a" } }
  ground/dirt: { placeholder: { label: "", color: "#7a5a3a" } }
  ground/stone_floor: { placeholder: { label: "", color: "#8a8a86" } }
