  # facing: the side the drawing looks at (mirrored to walk the other way); flying: hovers.
  creatures/thieving_gull: { facing: left, flying: true }

  # ---- sprite engine (tools/spritegen/src/engine, docs/17 "Motor de sprites") ---------------
