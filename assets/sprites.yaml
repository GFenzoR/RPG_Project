# Animated creature sprites (docs/17 ANI, assets/README.md "Sprites animados"). With layers:
# frames composed from vendor sheets, drawn bottom to top, "<sheet>" replaced by each action's
# sheet; spritepack names them <sprite>/<action>_<dir>_<n>. Without layers: drawing hints for a
# single-frame sprite (facing, flying, shadow), which the client animates procedurally.
#
# People: Universal LPC Spritesheet Character Generator layers (vendor/ulpc, licence per file
# in its CREDITS.csv). A composed sprite is OGA-BY 3.0 when every layer lists it, else
# CC-BY-SA 3.0, and assets/CREDITS.md must name it in that row (make test checks it). Layer
# order: body, legs, feet, torso, head, beard, hair, hat.
animations:
  # ---- player outfits (data/outfits.yaml): every action (the bow and the spell too) ---------
  outfits/citizen:
    preset: lpc
    layers:
      - vendor/ulpc/spritesheets/body/bodies/male/<sheet>.png
      - { file: vendor/ulpc/spritesheets/legs/pants/male/<sheet>.png, recolor: { ulpc_cloth: cloth_brown } }
      - { file: vendor/ulpc/spritesheets/feet/shoes/basic/male/<sheet>.png, recolor: { ulpc_cloth: cloth_black } }
      - { file: vendor/ulpc/spritesheets/torso/clothes/longsleeve/longsleeve/male/<sheet>.png, recolor: { ulpc_cloth: cloth_linen } }
      - vendor/ulpc/spritesheets/head/heads/human/male/<sheet>.png
      - { file: vendor/ulpc/spritesheets/hair/plain/adult/<sheet>.png, recolor: { ulpc_hair: hair_brown } }
  outfits/sailor:
    preset: lpc
    layers:
      - { file: vendor/ulpc/spritesheets/body/bodies/male/<sheet>.png, recolor: { ulpc_skin: skin_tan } }
