  # ---- single-frame monsters: hints for the procedural motion (ANI-5) -----------------------
  # facing: the side the drawing looks at (mirrored to walk the other way); flying: hovers.
  creatures/thieving_gull: { facing: left, flying: true }

  # ---- sprite engine (tools/spritegen/src/engine, docs/17 "Motor de sprites") ---------------
  # Frames rendered from a model in all four facings (no mirror, no facing), 64x64 with the
  # feet on the tile (bc) over the contact shadow. ms: the rig's ms per frame of each action
  # (spritegen check fails if they differ from its spec).
  creatures/bristleback_boar: { anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 90, death: 120 } }
  creatures/bramble_stag: { anchor: bc, shadow: ellipse, ms: { idle: 550, attack: 90, death: 130 } }
  # The forge echo, an ember spirit in a smith's shape (it was a Dungeon Crawl fire elemental).
  npcs/forge_echo: { anchor: bc, shadow: ellipse, flying: true, ms: { idle: 420 } }

  # ---- monsters drawn with the owner's Gemini (assets/CREDITS.md "Generado con IA") ---------
  # Frames from files, assets/sprites/<sprite>/<action>_<dir>_<n>.png: south, north and west
  # drawn, east the west ones mirrored (ANI-1); death only facing south. bc: feet on the
  # tile; ellipse: the renderer's contact shadow (the frames paint none). ms: per frame.
  creatures/gloom_bat: { mirror: true, anchor: bc, shadow: ellipse, flying: true, ms: { idle: 300, attack: 100, death: 200 } }
  creatures/mire_toad: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 600, attack: 120, death: 200 } }
  creatures/moss_spider: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 110, death: 200 } }
  creatures/thornling: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 600, attack: 130, death: 220 } }
  creatures/tide_crab: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 110, death: 200 } }
  creatures/bilge_rat: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 100, death: 180 } }
  creatures/wolf: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 110, death: 200 } }
  creatures/hollow_crawler: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 110, death: 200 } }
  creatures/ore_beetle: { mirror: true, anchor: bc, shadow: ellipse, ms: { idle: 500, death: 200 } }
  # Isla Volcánica. The warden, the Chapter 3 boss, is 96x96: a head and a half above a person.
