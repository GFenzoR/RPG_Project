# Map tile art (docs/17 ART-3, ART-4, ART-7; tools/spritepack tiles.ts). Ground looks
# (<sprite>/var_<n>), animation frames (<sprite>/frame_<n>), wall pieces (<sprite>/wall_<mask>)
# and cast shadows (<sprite>/shadow) are found by name; this section adds what names cannot
# say: ms and sync of an animation (world: in step; tile: a phase per tile; random: a rare
# glint), a centred anchor (bc), joins_walls for a door set in a wall, light (the radius in
# tiles of the light it gives in caves), the share of the main look (weight, default 0.7)
# and particles: the ambient motes the client spawns there (docs/17 ART-7, A13: embers,
# pollen, spray, which a ground gives off only where it meets another ground, or dust).
# steps: what each step on a ground kicks up (docs/17 MOV-7): dust, a small puff at the
# feet, or ripple, a ring of drops spreading on wet ground.
tiles:
  # weight: the share of the main look. Grounds whose looks are other hearts of the same
  # texture (docs/17 ART-4, recipes/variety.ts) keep it low, so no one tile repeats.
  ground/grass: { weight: 0.3 }
  ground/sand: { steps: dust, weight: 0.2 }
  ground/dirt: { steps: dust, weight: 0.35 }
  ground/ash: { steps: dust, weight: 0.3 }
  ground/cinder_path: { steps: dust, weight: 0.3 }
  ground/wet_sand: { steps: ripple, weight: 0.3 }
  ground/water_shallow: { ms: 240, sync: world, particles: spray }
  ground/water_shoal: { ms: 240, sync: world }
  ground/lava: { ms: 280, sync: world, particles: embers }
  decor/oak_tree: { anchor: bc, particles: pollen }
  decor/elm_tree: { anchor: bc, particles: pollen }
  decor/birch_tree: { anchor: bc, particles: pollen }
  decor/pine_tree: { anchor: bc, particles: pollen }
  decor/smelting_forge: { ms: 120, sync: tile, light: 3.5, particles: embers }
  decor/cooking_hearth: { ms: 110, sync: tile, light: 3, particles: embers }
  decor/wall_torch: { ms: 110, sync: tile, light: 3 }
  decor/brazier: { ms: 120, sync: tile, light: 3.5, particles: embers }
  decor/fountain: { ms: 150, sync: world }
  decor/wall_banner: { ms: 170, sync: tile }
  decor/market_board: { ms: 180, sync: tile }   # engine loop: a note lifts in the wind
  decor/lamp_post: { ms: 130, sync: tile, light: 3 }   # engine loop: the flame sways (town kit)
  decor/market_stall: { ms: 160, sync: tile }   # engine loop: gusts lift the awning's fringe
  decor/flag_pole: { ms: 170, sync: tile }      # engine loop: a wave runs along the flag
  decor/teleport: { ms: 100, sync: world }      # the swirl turns, sparks rise (6 frames)
  doors/pruebas_gate: { joins_walls: true }
  doors/pruebas_gate_open: { joins_walls: true }
  doors/forge_gate: { joins_walls: true }
  doors/forge_gate_open: { joins_walls: true }
