  # feet on the tile (bc) over the contact shadow. ms: the rig's ms per frame of each action
  # (spritegen check fails if they differ from its spec).
  creatures/bristleback_boar: { anchor: bc, shadow: ellipse, ms: { idle: 500, attack: 90, death: 120 } }
  creatures/bramble_stag: { anchor: bc, shadow: ellipse, ms: { idle: 550, attack: 90, death: 130 } }
