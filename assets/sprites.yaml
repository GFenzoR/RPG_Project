# Sprite manifest: where the pixels of each sprite path used in data/ come from.
# How to integrate a vendor pack: assets/README.md. Built by `make sprites` (tools/spritepack).
#
# Keys are the `sprite:` values of data/ (paths without extension). Each entry has exactly one of:
#   placeholder: { label: IS, color: "#rrggbb", size: [32, 32] }   all fields optional
#   source: vendor/<pack>/<file>.png   + optional  tile: [col, row]  (32 px grid)
#                                      or          rect: [x, y, w, h] (pixels, multiples of 32)
# A file at assets/sprites/<path>.png (original art) wins over nothing: it must NOT also be
# listed here. Sprites used in data/ with no entry get an automatic placeholder (warning).
#
# Pack art: Dungeon Crawl Stone Soup tiles (CC0, vendor/dungeon-crawl). What the pack does not
# cover is original art drawn by tools/spritegen into assets/sprites/ (make spritegen), so it is
# not listed here. That includes the frames no data/ file names: outfit frames
# (outfits/<id>/<dir>_<n>) and the combat and spell effect strips (effects/<name>/<n>). Every
# weapon, shield, armour piece, jewel and ammunition (weapons/, shields/, armor/, jewelry/,
# ammo/) is drawn by the sprite engine since lote 11 (docs/17 "Íconos de items"): none of them
# is listed here.
sprites:

  # Items
  currency/gold_coin: { source: vendor/dungeon-crawl/item/gold/03.png }
  materials/wolf_pelt: { source: vendor/dungeon-crawl/item/armour/animal_skin1.png }

  # Items: Isla del Puerto
  runes/arc_rune: { source: vendor/dungeon-crawl/item/misc/runes/generic.png }
  # Items: food and materials of T3.1
  food/ship_biscuit: { source: vendor/dungeon-crawl/item/food/bread_ration.png }
  food/boar_meat: { source: vendor/dungeon-crawl/item/food/chunk.png }
  materials/spider_silk: { source: vendor/dungeon-crawl/item/weapon/ranged/throwing_net.png }
  materials/iron_ore: { source: vendor/dungeon-crawl/item/weapon/ranged/rock.png }
  materials/rough_stone: { source: vendor/dungeon-crawl/item/misc/misc_stone_inert.png }
  materials/tarnished_locket: { source: vendor/dungeon-crawl/item/amulet/bone_gray.png }
  quest/bosun_logbook: { source: vendor/dungeon-crawl/item/book/dark_brown.png }

  # Items: trades (T3.4)
  tools/felling_axe: { source: vendor/dungeon-crawl/item/weapon/hand_axe2.png }
  tools/smithing_hammer: { source: vendor/dungeon-crawl/UNUSED/weapons/hammer1.png }
  materials/tree_resin: { source: vendor/dungeon-crawl/item/food/lump_of_royal_jelly.png }
  food/roast_boar: { source: vendor/dungeon-crawl/item/food/meat_ration.png }

  # Items: Isla del Bosque (T3.6)
  quest/sealed_coffer: { source: vendor/dungeon-crawl/item/misc/misc_box.png }

  # Creatures
  decor/stairs_down: { source: vendor/dungeon-crawl/UNUSED/features/rock_stairs_down.png }
  decor/stairs_up: { source: vendor/dungeon-crawl/UNUSED/features/rock_stairs_up.png }

  # NPCs: Liberated Pixel Cup characters, in `animations` below.

  # Isla Volcánica (T5.5)
  materials/ash_pelt: { source: vendor/dungeon-crawl/item/armour/silver_dragon_scales.png }
  materials/salamander_scale: { source: vendor/dungeon-crawl/item/armour/gold_dragon_hide.png }
  materials/wyrm_scale: { source: vendor/dungeon-crawl/item/armour/shadow_dragon_scales.png }
  quest/ember_root: { source: vendor/dungeon-crawl/item/misc/runes/rune_gehenna.png }
  quest/delver_chart: { source: vendor/dungeon-crawl/item/scroll/scroll-brown.png }
  quest/forge_seal: { source: vendor/dungeon-crawl/item/misc/misc_disc.png }

  # Doors (docs/02 "Puertas con llave"): the forge gate of the volcanic mine and the practice
  # gate of the sandbox island, shut and open.

  # Content audit (2026-11): the mana and health draughts.
  potions/mana_draught: { source: vendor/dungeon-crawl/item/potion/sky_blue.png }
  potions/concentrated_mana_draught: { source: vendor/dungeon-crawl/item/potion/brilliant_blue.png }
  potions/health_draught: { source: vendor/dungeon-crawl/item/potion/ruby.png }
  potions/concentrated_health_draught: { source: vendor/dungeon-crawl/item/potion/puce.png }

