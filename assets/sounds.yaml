# Game event → sound id, or a list of ids (one is picked at random). The client names the
# events (client/src/audio/cues.ts, docs/02 "Sonido"); an event with no entry is silent.
# Events at a tile (effects, projectiles, other creatures) are positional.
events:
  ui.click: click
  ui.dialog_open: dialog_open
  step.self: step
  effect.hit: hit
  effect.block: miss
  effect.heal: heal
  effect.conjure: conjure
  effect.buff: buff
  effect.gather: gather
  effect.gather.mining: mining
  effect.gather.woodcutting: woodcutting
  effect.gather.fishing: fishing
  effect.gather_miss: miss
  effect.refine: smithing
  effect.shatter: craft_fail
  effect.element.physical: hit
  effect.element.fire: spell_fire
  effect.element.ice: spell_ice
  effect.element.energy: spell_energy
  effect.element.earth: spell_earth
  effect.element.holy: spell_holy
  effect.element.death: spell_death
  projectile.physical: arrow
  projectile.fire: spell_fire
  projectile.ice: spell_ice
  projectile.energy: spell_energy
  projectile.earth: spell_earth
  projectile.holy: spell_holy
  projectile.death: spell_death
  message.progress.level_up: level_up
  message.death.died: death
  message.travel.sailed: voyage
  message.craft.done: smithing
  message.craft.done.smithing: smithing
  message.craft.done.cooking: cooking
  message.craft.failed: craft_fail
  message.shop.bought: coins
  message.shop.sold: coins
  message.shop.no_money: refused
  message.craft.missing: refused
  message.travel.need_level: refused
  message.travel.need_item: refused
  message.travel.need_quest: refused

# The music (client/src/audio/director.ts, docs/02 "Sonido"): each place plays a pool of
# tracks (music.pools, sound ids). The director shuffles a pool with no immediate repeat and
# starts each track at one of its entries (the seconds make music-gemini measured), never at
# its beginning; a track with no `seconds` is a loop file and loops. Places: the island the
# player stands on (world/world.yaml) and under it (floors > 7), the title screen (login and
# characters), a boss while one is in view (monster id -> pool) and an important quest's
# area (`music` in data/quests). A boss beats a quest area and a quest area the zone; an
# ordinary fight never changes the music (the owner, 2026-11-18).
music:
  # Equal-power crossfades, ms, by what changed: another zone or quest area, a boss coming
  # into view or gone, the title screen and the world, the next track of a boss or the title.
  fades: { zone: 5000, boss_in: 1500, boss_out: 6000, title: 3000, next: 4000 }
  dwell_ms: 3000 # a new zone or quest area takes over after this long in it (no flapping)
  boss_hold_ms: 5000 # the boss's music outlasts the last one in view by this
  resume_ms: 180000 # back in a zone within this, its track goes on near where it was
  gap_ms: [6000, 15000] # a zone's track plays out its ending, then this much ambience
  islands: { puerto: town_puerto, testisle: town_puerto, bosque: bosque, volcan: volcan, pruebas: town_puerto }
  underground: cave
  pools:
    # gemini-music:pools:begin (make music-gemini rewrites these lines from the owner's picks)
    title: [music_title]
    town_puerto: [music_puerto, music_puerto_2, music_puerto_3]
    bosque: [music_bosque]
    volcan: [music_volcan]
    cave: [music_cueva, music_cueva_mine, music_cueva_crystal, music_cueva_flooded, music_cueva_abyss, music_cueva_ossuary, music_cueva_ember]
    boss_forge: [music_boss_forge]
    # gemini-music:pools:end
  # gemini-music:rules:begin (make music-gemini rewrites these lines from the owner's picks)
  title: title
  bosses: { slagbound_warden: boss_forge }
  # gemini-music:rules:end
ambient:
  fade_ms: 2000
  islands: { puerto: amb_olas, testisle: amb_olas, bosque: amb_bosque, volcan: amb_volcan, pruebas: amb_olas }
