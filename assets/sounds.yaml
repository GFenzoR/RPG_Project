# Sound manifest (T3.7): which file each sound is, on which channel it plays, which game
# event plays it, and the music and ambient bed of each island. Read by the client (Vite
# plugin, `content.sounds`) and checked by `make validate` (sounds.schema.json) and by the
# size budget test (tools/soundgen, docs/07-performance-budget.md "Audio").
#
# Everything under sounds/ is our own work, generated by `make sounds` (tools/soundgen).
# To use a third-party pack instead, see assets/README.md "Sonido": copy it to
# assets/vendor/<pack>/, register it in CREDITS.md and point `file:` at it.
format: 1

# id: { file (relative to assets/), channel: sfx | ui | music | ambient,
#       volume: 0..1 (default 1), max_voices: copies at once (default 3) }
sounds:
  click: { file: sounds/ui/click.ogg, channel: ui, volume: 0.5, max_voices: 2 }
  dialog_open: { file: sounds/ui/dialog_open.ogg, channel: ui, volume: 0.6 }
  refused: { file: sounds/ui/error.ogg, channel: ui, volume: 0.5, max_voices: 1 }

  hit: { file: sounds/sfx/hit.ogg, channel: sfx, volume: 0.8, max_voices: 4 }
  miss: { file: sounds/sfx/miss.ogg, channel: sfx, volume: 0.6, max_voices: 4 }
  arrow: { file: sounds/sfx/arrow.ogg, channel: sfx, volume: 0.6 }
  spell_fire: { file: sounds/sfx/spell_fire.ogg, channel: sfx, volume: 0.7 }
  spell_ice: { file: sounds/sfx/spell_ice.ogg, channel: sfx, volume: 0.6 }
  spell_energy: { file: sounds/sfx/spell_energy.ogg, channel: sfx, volume: 0.6 }
  spell_earth: { file: sounds/sfx/spell_earth.ogg, channel: sfx, volume: 0.8 }
  spell_holy: { file: sounds/sfx/spell_holy.ogg, channel: sfx, volume: 0.6 }
  spell_death: { file: sounds/sfx/spell_death.ogg, channel: sfx, volume: 0.6 }
  heal: { file: sounds/sfx/heal.ogg, channel: sfx, volume: 0.6 }
  buff: { file: sounds/sfx/buff.ogg, channel: sfx, volume: 0.5 }
  conjure: { file: sounds/sfx/conjure.ogg, channel: sfx, volume: 0.6 }
  gather: { file: sounds/sfx/gather.ogg, channel: sfx, volume: 0.6 }
  mining: { file: sounds/sfx/mining.ogg, channel: sfx, volume: 0.6 }
  woodcutting: { file: sounds/sfx/woodcutting.ogg, channel: sfx, volume: 0.7 }
  fishing: { file: sounds/sfx/fishing.ogg, channel: sfx, volume: 0.6 }
  smithing: { file: sounds/sfx/smithing.ogg, channel: sfx, volume: 0.6 }
  cooking: { file: sounds/sfx/cooking.ogg, channel: sfx, volume: 0.6 }
  craft_fail: { file: sounds/sfx/craft_fail.ogg, channel: sfx, volume: 0.6 }
  coins: { file: sounds/sfx/coins.ogg, channel: sfx, volume: 0.5 }
  level_up: { file: sounds/sfx/level_up.ogg, channel: sfx, volume: 0.8, max_voices: 1 }
  death: { file: sounds/sfx/death.ogg, channel: sfx, volume: 0.8, max_voices: 1 }
  step: { file: sounds/sfx/step.ogg, channel: sfx, volume: 0.25, max_voices: 2 }
  voyage: { file: sounds/sfx/voyage.ogg, channel: sfx, volume: 0.7, max_voices: 1 }

  music_puerto: { file: sounds/music/puerto.ogg, channel: music, volume: 0.7 }
  music_bosque: { file: sounds/music/bosque.ogg, channel: music, volume: 0.7 }
  music_cueva: { file: sounds/music/cueva.ogg, channel: music, volume: 0.8 }
  amb_olas: { file: sounds/ambient/olas.ogg, channel: ambient, volume: 0.5 }
  amb_bosque: { file: sounds/ambient/bosque.ogg, channel: ambient, volume: 0.5 }

# Game event → sound id, or a list of ids (one is picked at random). The client names the
# events (client/src/audio/cues.ts, docs/02 "Sonido"); an event with no entry is silent.
# Events at a tile (effects, projectiles, other creatures) are positional.
events:
  ui.click: click
  ui.dialog_open: dialog_open
  step.self: step
  effect.hit: hit
  effect.block: miss
  effect.heal: heal
  effect.conjure: conjure
  effect.buff: buff
  effect.gather: gather
  effect.gather.mining: mining
  effect.gather.woodcutting: woodcutting
  effect.gather.fishing: fishing
  effect.gather_miss: miss
  effect.element.physical: hit
  effect.element.fire: spell_fire
  effect.element.ice: spell_ice
  effect.element.energy: spell_energy
  effect.element.earth: spell_earth
  effect.element.holy: spell_holy
  effect.element.death: spell_death
  projectile.physical: arrow
  projectile.fire: spell_fire
  projectile.ice: spell_ice
  projectile.energy: spell_energy
  projectile.earth: spell_earth
  projectile.holy: spell_holy
  projectile.death: spell_death
  message.progress.level_up: level_up
  message.death.died: death
  message.travel.sailed: voyage
  message.craft.done: smithing
  message.craft.done.smithing: smithing
  message.craft.done.cooking: cooking
  message.craft.failed: craft_fail
  message.shop.bought: coins
  message.shop.sold: coins
  message.shop.no_money: refused
  message.craft.missing: refused
  message.travel.need_level: refused
  message.travel.need_item: refused
  message.travel.need_quest: refused

# Background loops: by the island the player stands on (world/world.yaml), and under it
# (floors > 7). Changing zone crossfades over fade_ms.
music:
  fade_ms: 2500
  # volcan (T5.5): placeholder, it reuses the cave music until it has its own track.
  islands: { puerto: music_puerto, testisle: music_puerto, bosque: music_bosque, volcan: music_cueva }
  underground: music_cueva
ambient:
  fade_ms: 2000
  # volcan (T5.5): placeholder, the shore waves until it has its own ambience.
  islands: { puerto: amb_olas, testisle: amb_olas, bosque: amb_bosque, volcan: amb_olas }
