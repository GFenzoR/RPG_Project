[package]
name = "rpg-desktop"
# The app version comes from client/package.json (tauri.conf.json "version"); this one is
# not shipped anywhere.
version = "0.0.0"
description = "RPG Project desktop client: the web client in a Tauri 2 webview"
edition = "2021"
rust-version = "1.85"
publish = false
license = "UNLICENSED"

[lib]
name = "rpg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
